# NGHỊ ĐỊNH 207/2026/NĐ-CP<br>Quản lý chất lượng, thi công & bảo trì công trình

## 1. TỔNG QUAN & BỐI CẢNH PHÁP LÝ
### Cơ sở pháp lý & Hiệu lực
#### Căn cứ ban hành
- Cụ thể hóa 12 nhóm nội dung của Luật Xây dựng số 135/2025/QH15
- Kế thừa các quy định còn phù hợp của Nghị định số 06/2021/NĐ-CP
- Đồng bộ pháp luật: Năng lượng nguyên tử, Đường bộ, Đường sắt, Giáo dục, Hàng không dân dụng
#### Hiệu lực & Điều khoản chuyển tiếp
- **Ngày có hiệu lực:** 01/07/2026 (Cùng thời điểm Luật Xây dựng 2025)
- **Hết hiệu lực:** NĐ 06 (được sửa đổi tại NĐ 35, 175, 14, 67)
- **Xử lý chuyển tiếp (Dự án trước 01/07/2026):**
  - Giữ nguyên loại & cấp công trình nếu đã có quyết định đầu tư
  - Không tiếp tục kiểm tra công tác nghiệm thu nếu đã khởi công nhưng không thuộc đối tượng của Nghị định mới
#### Kết cấu văn bản
- Quy mô: 05 Chương, 54 Điều và 11 Phụ lục
- Chương I: Những quy định chung
- Chương II: Quản lý thi công, bàn giao hạng mục/công trình (bao gồm dự án khu đô thị)
- Chương III: Bảo hành, bảo trì, phá dỡ công trình
- Chương IV: Sự cố thi công và khai thác, sử dụng
- Chương V: Điều khoản thi hành

## 2. NGUYÊN TẮC QUẢN LÝ & TRÁCH NHIỆM CHỦ THỂ
### Nguyên tắc cốt lõi (Điều 4)
#### Vòng đời dự án
- Quản lý toàn diện: Từ khởi công, thi công -> nghiệm thu, bàn giao -> khai thác, bảo hành, bảo trì
#### Trách nhiệm phân định (Điều 5)
- **Chủ đầu tư (CĐT):** 
  - Tổ chức quản lý chất lượng phù hợp quy mô/nguồn vốn
  - Chỉ đạo, kiểm tra và chịu trách nhiệm phần việc giao cho Ban QLDA
  - Giám sát việc thực hiện hợp đồng (nếu thuê Tư vấn QLDA, giám sát)
- **Nhà thầu:** Chịu trách nhiệm trực tiếp, toàn diện về chất lượng & an toàn việc mình làm
- **Doanh nghiệp dự án PPP:** Thực hiện trách nhiệm như CĐT
- **Hợp đồng EPC / Chìa khóa trao tay:** CĐT và nhà thầu thỏa thuận rõ trách nhiệm giám sát
- **Liên danh nhà thầu:** Bắt buộc có văn bản thỏa thuận xác định rõ trách nhiệm từng thành viên
- **Cơ quan chuyên môn:** Hướng dẫn, kiểm tra, nghiệm thu và xử lý vi phạm

## 3. QUẢN LÝ THI CÔNG & CÔNG TRƯỜNG
### Phân loại công trình (Điều 3)
#### Điều chỉnh nhóm công trình
- Kế thừa: Dân dụng, công nghiệp, hạ tầng, giao thông, quốc phòng - an ninh
- Sửa đổi: "Công trình phục vụ Nông nghiệp và Môi trường" (Đồng bộ chức năng Bộ NN&PTNT, Bộ TN&MT)
- Phân loại theo công năng: Cập nhật chi tiết tại Phụ lục I
- Quốc phòng/An ninh: Áp dụng theo quy định riêng của Bộ Quốc phòng và Bộ Công an
### Ứng dụng Công nghệ (Điều 11)
#### Khuyến khích số hóa
- **BIM & IT:** Ứng dụng Mô hình thông tin công trình (BIM) trong quản lý, nghiệm thu, bàn giao
- **Hồ sơ điện tử:** Lập hồ sơ hoàn thành theo pháp luật giao dịch điện tử (chịu trách nhiệm tính chính xác, bảo mật, lưu trữ an toàn)
### Khởi công & Quản lý hiện trường (Điều 12, 13, 14)
#### Thủ tục khởi công
- Yêu cầu: Gửi thông báo đến cơ quan quản lý (cho phép trực tuyến) trước khi khởi công
- Xử lý: Cơ quan chức năng cập nhật vào Cơ sở dữ liệu quốc gia về hoạt động XD
#### Quản lý công trường
- Bắt buộc: Rào chắn và biển cảnh báo an toàn
- Khuyến khích mới: CĐT lắp đặt camera giám sát an toàn & tài sản
#### Quản lý vật liệu
- Chuẩn hóa form Biên bản nghiệm thu vật liệu
- Quy định thay đổi vật liệu: Chủng loại/xuất xứ mới phải đạt thiết kế + CĐT chấp thuận
- Điều chỉnh dự án: Áp dụng nếu thay đổi vật liệu làm thay đổi dự án
- CĐT tự mua sắm: CĐT chịu trách nhiệm như bên giao thầu cung ứng
### Xây dựng Nhà ở riêng lẻ (Điều 10)
#### Điều kiện Tự tổ chức thiết kế (Bắt buộc đồng thời)
- 1. Dưới 03 tầng
- 2. Không có tầng hầm
- 3. Tổng diện tích sàn < 250m2
- 4. Chiều cao < 12m
#### Chuyển đổi công năng
- Quy định: Chuyển nhà ở sang mặt bằng kinh doanh bắt buộc tuân thủ nghiêm ngặt quy chuẩn, tiêu chuẩn
- Trọng tâm: Yêu cầu về Phòng cháy chữa cháy (PCCC)

## 4. GIÁM SÁT, KIỂM ĐỊNH & THÍ NGHIỆM
### Thí nghiệm & Quan trắc (Điều 6, 7, 8, 9)
#### Tăng cường kiểm soát
- Phạm vi: Thí nghiệm chuyên ngành, quan trắc thi công, thí nghiệm đối chứng, kiểm định, thử tải
- Hiện trường: Giám sát chặt chẽ lấy mẫu/thí nghiệm theo kế hoạch để tránh làm giả kết quả
### Giám sát thi công (Điều 20)
#### Nhiệm vụ trọng tâm
- Kiểm soát vật liệu, cấu kiện, thiết bị đúng thiết kế
- Kiểm soát an toàn: TVGS có quyền yêu cầu tạm dừng thi công nếu có nguy cơ
- Dự án PPP: Tăng cường kiểm tra năng lực nhà thầu, cơ quan có thẩm quyền được yêu cầu thay nhân sự
#### Tính độc lập của tổ chức giám sát
- **Tự giám sát (CĐT, EPC, Chìa khóa trao tay):** Bắt buộc lập bộ phận giám sát độc lập với bộ phận trực tiếp thi công
- **Vốn Nhà nước:** TVGS phải độc lập hoàn toàn với nhà thầu thi công/cung ứng vật tư thiết bị
- **Kiêm nhiệm:** Tổ chức giám sát KHÔNG được kiểm định công trình mình giám sát. Nhà thầu cung ứng KHÔNG được kiểm định sản phẩm mình cung cấp.

## 5. NGHIỆM THU & BÀN GIAO (Điều 24, 25, 26, 27, 30, 31)
### Hình thức Nghiệm thu
#### Ba (03) trường hợp nghiệm thu
- **1. Toàn bộ:** Xong đầy đủ theo thiết kế, đạt kỹ thuật, thử nghiệm, PCCC, môi trường
- **2. Từng phần:** Đưa vào khai thác phần đã xong. Thi công phần còn lại không được ảnh hưởng an toàn
- **3. Có điều kiện:** Cơ bản hoàn thành, tồn tại lỗi nhỏ không ảnh hưởng chịu lực/tuổi thọ. Phải ghi rõ lỗi & hạn chót khắc phục
#### Thành phần ký Biên bản
- CĐT, Giám sát, Nhà thầu thi công, Thiết kế, và Cơ quan ký Hợp đồng dự án (nếu là PPP)
### Cải cách thủ tục Kiểm tra nghiệm thu
#### Cắt giảm đối tượng kiểm tra
- Loại bỏ: Công trình cấp III, cấp IV (Vốn đầu tư công)
- Loại bỏ: Công trình cấp III (Các nguồn vốn khác)
#### Rút ngắn thời gian xử lý
- Cấp I / Cấp Đặc biệt: Từ 20 ngày -> 16 ngày làm việc
- Công trình còn lại: Từ 14 ngày -> 12 ngày làm việc
#### Phân cấp thẩm quyền kiểm tra
- **Hội đồng kiểm tra Nhà nước:** Dự án quan trọng quốc gia, quy mô lớn, kỹ thuật phức tạp
- **Cơ quan chuyên môn Bộ chuyên ngành:** Dự án do Thủ tướng giao; Cấp Đặc biệt; Trải dài >= 2 tỉnh; Do Bộ đầu tư; Hàng không, đường sắt, hàng hải; Thủy lợi/đê điều liên tỉnh
- **Cơ quan chuyên môn UBND tỉnh:** Các công trình trên địa bàn (trừ các loại trên) & Dự án do Tỉnh đầu tư. Riêng Hà Nội/TP.HCM kiểm tra cả Cấp Đặc biệt
#### Giới hạn phạm vi kiểm tra
- Thiết bị công trình: Chỉ kiểm tra sự tuân thủ hồ sơ lắp đặt/chạy thử
- Không kiểm tra: Dây chuyền/thiết bị công nghệ; Công trình đặc thù theo Điều 69, 70, 71, 72 (Luật XD 2025)
- *Lưu ý:* Cơ quan kiểm tra chịu trách nhiệm về kết quả kiểm tra, nhưng KHÔNG làm giảm trách nhiệm của CĐT và Nhà thầu
### Khai thác & Bàn giao
#### Điều kiện khai thác (Điều 29)
- Tách bạch rõ 3 khâu: Nghiệm thu -> Kiểm tra nghiệm thu -> Đưa vào khai thác
- Thông số kỹ thuật không đạt: CĐT chỉ được xin khai thác có điều kiện nếu là công trình thiết yếu (giao thông, hạ tầng, thủy lợi, đê điều) và phải được Người quyết định đầu tư chấp thuận. Phải chốt lại thông số và mốc bảo hành.
#### Bàn giao (Điều 30, 31)
- Bắt buộc: Giao bản vẽ hoàn công, quy trình vận hành/bảo trì
- Tích hợp Luật: Gom các quy định bàn giao hạ tầng đô thị (từ NĐ 11/2013 và NĐ 35/2023) về chung Nghị định này

## 6. BẢO TRÌ, HẾT HẠN, PHÁ DỠ & SỰ CỐ
### Bảo trì & An toàn
#### Quy định chi tiết
- Luật hóa quy trình, chi phí và trách nhiệm lập kế hoạch bảo trì
- **Bắt buộc quan trắc bảo trì:** Giàn mái không gian, khán đài, silo, ống khói
- **Đánh giá an toàn:** Chỉ tập trung vào kết cấu chịu lực chính. Bãi bỏ thủ tục "Cho ý kiến kết quả đánh giá"
### Công trình hết hạn & Phá dỡ
#### Xử lý hết hạn sử dụng
- Minh bạch: Báo cáo phương án xử lý trước 12 tháng. Cơ quan NN công bố danh sách công khai.
- Gia hạn: Phải kiểm định. Cơ quan NN có tối đa 10 ngày làm việc để trả lời.
- Vô chủ: Giao cơ quan NN rà soát nếu không xác định được chủ hoặc tuổi thọ.
#### Quy trình phá dỡ
- Trình tự chuẩn: Lập phương án -> Thẩm tra (nếu ảnh hưởng cộng đồng) -> Lập biện pháp thi công -> Giám sát, nghiệm thu
- Tình trạng khẩn cấp: Trao toàn quyền quyết định cho người được giao quản lý
### Đổi mới xử lý Sự cố
#### Cơ chế mới
- Bỏ phân cấp mức độ (Cấp 1,2,3), chuyển sang phân cấp theo thẩm quyền quản lý địa bàn/ngành
- Tỉnh có quyền phân cấp thẳng xuống UBND xã xử lý sự cố nhỏ để tăng tính cơ động
- Công trình cộng đồng: Cho phép vừa thi công/khai thác vừa khắc phục nếu cấp bách
#### Tách bạch Tai nạn
- Sự cố Thiết bị vs Tai nạn lao động: TNLĐ xử lý theo Luật An toàn Vệ sinh lao động
- Trách nhiệm: Sự cố thiết bị tại chỗ do CĐT/Nhà thầu tự xử. Nếu rơi/sập ra ngoài công trường -> Cơ quan NN vào cuộc kiểm soát CĐT giải quyết

## 7. CÁC THÔNG TƯ HƯỚNG DẪN (Có hiệu lực 01/07/2026)
### Thông tư 32/2026/TT-BXD (8 Điều, 1 Phụ lục)
- **Nội dung:** Chi tiết hóa quy định về quản lý chất lượng
- **Tiêu điểm:** Kế hoạch thí nghiệm; Quan trắc thi công & bảo trì (đối tượng cụ thể); Trình tự thông báo giám định; Quy trình công bố công trình hết hạn
### Thông tư 33/2026/TT-BXD (12 Điều)
- **Nội dung:** Đánh giá an toàn công trình thuộc Bộ XD quản lý (Bổ sung thêm công trình Giao thông)
- **Cơ chế đánh giá:** 2 cấp độ (Cấp 1 & Cấp 2 gồm sơ bộ/chi tiết)
- **Tần suất nới lỏng:** Lần đầu tối đa 10 năm sau nghiệm thu; Các lần tiếp theo tối đa 05 năm/lần (Không quy định cứng)
- **Chuyển đổi số:** Áp dụng hồ sơ điện tử
- **Ưu tiên Luật chuyên ngành:** Nếu ngành khác có quy định riêng thì áp dụng theo ngành đó
### Thông tư 34/2026/TT-BXD (5 Điều, 3 Phụ lục)
- **Nội dung:** Cấp công trình xây dựng (Kế thừa phần lớn TT 06/2021)
- **Hỗ trợ Doanh nghiệp:** KHÔNG áp dụng cấp công trình cho việc bảo trì không làm thay đổi kết cấu chịu lực (Hỗ trợ SMEs theo NQ 198)
- **Quy định mới:** 
  - Bổ sung quy định xác định cấp khi "Mở rộng công trình hiện hữu"
  - Phân cấp lại cơ sở hạt nhân, dầu khí, nhiệt/thủy/điện gió, hóa chất, đường sắt/bộ
  - Tiêu chí mới: Thêm tiêu chí xác định cấp theo Chiều cao PCCC đối với nhà > 150m

    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
</body>
</html>
