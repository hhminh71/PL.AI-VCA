<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Khẩn Nguy Sân Bay (Mức Trung Cấp)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.15; background-color: #f3f4f6; }
        .compact-opt { padding: 5px 8px; margin-bottom: 3px; border: 1px solid #e5e7eb; border-radius: 4px; background: white; cursor: pointer; transition: all 0.1s; display: flex; align-items: flex-start; }
        .compact-opt:last-child { margin-bottom: 0; }
        .compact-opt:hover { background: #f9fafb; }
        .compact-opt.selected { border-color: #3b82f6; background-color: #eff6ff; }
        .compact-opt.correct { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46 !important; pointer-events: none; }
        .compact-opt.wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; pointer-events: none; }
        
        .review-opt { padding: 4px 6px; margin-bottom: 2px; border-radius: 4px; border: 1px solid transparent; display: flex; align-items: flex-start; }
        .review-opt.correct { background-color: #e0f2fe; border-color: #7dd3fc; color: #075985; font-weight: 500; }
        .review-opt.wrong { background-color: #f9fafb; border-color: #f3f4f6; color: #9ca3af; }
        
        mark { background-color: #fef08a; padding: 0 1px; border-radius: 2px; }
        .opt-label { width: 18px; flex-shrink: 0; font-weight: bold; }
    </style>
</head>
<body class="m-0 p-0 text-gray-800">

    <!-- Header theo chuẩn doanh nghiệp -->
    <div class="bg-blue-900 text-white py-1.5 px-3">
        <div class="text-[10px] uppercase leading-none opacity-90 mb-1">Tổng công ty Cảng hàng không Việt Nam - CTCP</div>
        <div class="font-bold text-lg uppercase leading-tight mb-0.5">Cảng hàng không quốc tế Cần Thơ</div>
        <div class="text-[13px] leading-tight opacity-90">Huấn luyện Đào tạo Cảng HKQT Cần Thơ</div>
    </div>
    <div class="bg-white px-2 py-2 shadow-sm text-center font-bold text-[14px] text-blue-900 border-b">
        KHẨN NGUY SÂN BAY MỨC ĐỘ TRUNG CẤP (KNSB-BĐ-TC)
    </div>

    <!-- Vùng Sticky (Tab + Stats/Search) -->
    <div class="sticky top-0 z-20 shadow-sm flex flex-col">
        <!-- Tabs -->
        <div class="flex border-b text-sm bg-white">
            <button id="tab-test" class="flex-1 py-1.5 font-bold text-blue-800 border-b-2 border-blue-800" onclick="switchTab('test')">Thi Thử (40)</button>
            <button id="tab-review" class="flex-1 py-1.5 font-bold text-gray-500 border-b-2 border-transparent" onclick="switchTab('review')">Ôn Tập (Full)</button>
        </div>
        
        <!-- Tab 1: Stats Bar -->
        <div id="test-stats-bar" class="px-2 py-1.5 flex justify-between items-center border-b bg-gray-50">
            <div>
                <span class="font-bold text-red-600 text-sm">⏱ <span id="timer">00:00</span></span>
                <span class="text-gray-500 text-[10px] ml-2" id="high-score">Điểm cao: 0/40</span>
            </div>
            <div class="flex gap-1 text-xs">
                <button onclick="submitTest()" id="btn-submit-top" class="bg-blue-600 text-white px-2 py-1 rounded font-bold shadow-sm">Nộp Bài</button>
                <button onclick="startTest()" class="bg-gray-200 text-gray-800 px-2 py-1 rounded font-bold shadow-sm">Làm Lại</button>
            </div>
        </div>

        <!-- Tab 2: Search Bar (Hidden default) -->
        <div id="search-container" class="hidden px-2 py-1.5 bg-gray-50 border-b">
            <input type="text" id="search-input" placeholder="🔍 Tìm kiếm câu hỏi, đáp án..." class="w-full border border-gray-300 px-2 py-1.5 rounded text-[13px] outline-none focus:border-blue-500 bg-white" oninput="searchReview()">
        </div>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <!-- Tab 1: View -->
    <div id="test-view" class="p-1.5 pb-20">
        <div id="test-questions" class="flex flex-col gap-1.5"></div>
        <div class="mt-3 flex gap-2 justify-center">
            <button onclick="submitTest()" id="btn-submit-bot" class="bg-blue-600 text-white px-6 py-2 rounded font-bold text-sm shadow-md">Nộp Bài</button>
            <button onclick="startTest()" class="bg-gray-200 text-gray-800 px-6 py-2 rounded font-bold text-sm shadow-md">Làm Lại</button>
        </div>
        <div class="mt-2 flex justify-center">
            <button onclick="shareResult()" id="btn-share" class="hidden bg-green-600 text-white w-full max-w-xs py-2 rounded font-bold text-sm shadow-md">🔗 Chia Sẻ Kết Quả</button>
        </div>
    </div>

    <!-- Tab 2: View -->
    <div id="review-view" class="hidden p-1.5 pb-10">
        <div id="review-questions" class="flex flex-col gap-1.5"></div>
    </div>

<script>
// --- RAW TEXT DỮ LIỆU ---
const rawText = `Câu 1: Một tàu bay bị gãy càng, nằm bất động trên đường cất hạ cánh nhưng không còn nguy cơ cháy và toàn bộ người trên tàu đã được sơ tán. Tài liệu tác nghiệp nào phải được ưu tiên kích hoạt để giải phóng đường cất hạ cánh?
ĐÁP ÁN ĐÚNG: Phương án di dời tàu bay mất khả năng di chuyển
Câu 2: Khi xây dựng phương án xử lý hành vi can thiệp bất hợp pháp tại cảng, tài liệu nào đóng vai trò căn cứ trực tiếp nhất?
ĐÁP ÁN ĐÚNG: Kế hoạch khẩn nguy can thiệp bất hợp pháp của A08
Câu 3: Cảng đã có đủ lực lượng nội bộ nhưng vẫn ký quy chế phối hợp với Công an, Quân đội, bệnh viện và lực lượng kiểm soát an ninh hàng không. Lý do phù hợp nhất là gì?
ĐÁP ÁN ĐÚNG: Đảm bảo tính chủ động và tận dụng tối đa nguồn lực hiệp đồng khi tình huống vượt khả năng nội bộ
Câu 4: Một tàu bay gặp nạn cách điểm quy chiếu sân bay 7,6 km. Nhận định nào chính xác nhất về vùng trách nhiệm tìm kiếm, cứu nạn của Cảng?
ĐÁP ÁN ĐÚNG: Thuộc trong vùng trách nhiệm tìm kiếm, cứu nạn của cảng
Câu 5: Một tàu bay rơi tại vị trí cách điểm quy chiếu sân bay 8,4 km. Phân loại nào phù hợp nhất?
ĐÁP ÁN ĐÚNG: Tai nạn ngoài vùng trách nhiệm tìm kiếm, cứu nạn của cảng
Câu 6: Tổ bay thông báo nghi ngờ có bất thường hệ thống càng, nhưng hệ thống dự phòng vẫn hoạt động và tổ bay chưa gặp khó khăn khi hạ cánh. Cấp độ phù hợp nhất là gì?
ĐÁP ÁN ĐÚNG: Khẩn nguy tại chỗ
Câu 7: Tàu bay tiếp cận hạ cánh, phát tín hiệu khẩn nguy do hỏng hệ thống thủy lực và tổ bay yêu cầu trợ giúp mặt đất. Phân loại nào chính xác nhất?
ĐÁP ÁN ĐÚNG: Khẩn nguy hoàn toàn
Câu 8: Điểm khác biệt quan trọng nhất giữa “khẩn nguy tại chỗ” và “khẩn nguy hoàn toàn” là gì?
ĐÁP ÁN ĐÚNG: Khẩn nguy hoàn toàn phản ánh nguy cơ nghiêm trọng hơn, mức sẵn sàng cao hơn và có yêu cầu trợ giúp mặt đất
Câu 9: Một người cố ý cung cấp thông tin giả về bom trên tàu bay, khiến chuyến bay phải hủy cất cánh và đe dọa an toàn hành khách. Hành vi này thuộc nhóm nào?
ĐÁP ÁN ĐÚNG: Can thiệp bất hợp pháp cấp độ 1
Câu 10: Một đối tượng dùng vũ lực vượt hàng rào để xâm nhập trạm thiết bị dẫn đường, nhưng chưa chiếm đoạt tàu bay. Phân loại nào đúng nhất?
ĐÁP ÁN ĐÚNG: Cấp độ 1 vì xâm nhập bằng vũ lực vào công trình hàng không dân dụng
Câu 11: Hai tình huống xảy ra đồng thời: đối tượng A đưa vật phẩm nguy hiểm vào khu vực hạn chế nhằm phạm tội; đối tượng B cưỡng đoạt tàu bay. Phân loại đúng là gì?
ĐÁP ÁN ĐÚNG: A cấp độ 1, B cấp độ 2
Câu 12: Hành vi nào dưới đây thuộc cấp độ 2? (a. Cố ý vi phạm quy định khai thác cảng, b. Cung cấp thông tin sai uy hiếp an toàn, c. Bắt giữ con tin trong tàu bay, d. Xâm nhập bằng vũ lực vào công trình hàng không)
ĐÁP ÁN ĐÚNG: Bắt giữ con tin trong tàu bay / Cấp độ 2
Câu 13: Một tàu bay bị điều khiển có chủ ý lao vào công trình hàng không nhằm gây thiệt hại nghiêm trọng cho người và tài sản. Cách phân loại phù hợp nhất là gì?
ĐÁP ÁN ĐÚNG: Can thiệp bất hợp pháp cấp độ 2
Câu 14: Một sự kiện xảy ra trong quá trình khai thác tàu bay, uy hiếp an toàn nhưng không có người chết, bị thương nặng, hư hỏng kết cấu nghiêm trọng hoặc mất tích tàu bay. Phân loại phù hợp nhất là gì?
ĐÁP ÁN ĐÚNG: Sự cố tàu bay
Câu 15: Khi xác định khung thời gian pháp lý của tai nạn tàu bay, mốc bắt đầu và kết thúc nào đúng nhất?
ĐÁP ÁN ĐÚNG: Từ khi bất kỳ người nào lên tàu bay với ý định thực hiện chuyến bay đến khi tất cả mọi người đã rời tàu bay
Câu 16: Một tàu bay mất liên lạc và không thể tiếp cận được sau khi hết nhiên liệu dự kiến. Không có bằng chứng trực tiếp về thương vong hoặc hư hỏng. Yếu tố nào đủ để xem xét là tai nạn tàu bay?
ĐÁP ÁN ĐÚNG: Tàu bay bị mất tích hoặc hoàn toàn không thể tiếp cận
Câu 17: Xe kéo tàu bay va vào xe phục vụ trên sân đỗ, làm gián đoạn khai thác nhưng không tác động đến kết cấu tàu bay. Tình huống phù hợp nhất với nhóm nào?
ĐÁP ÁN ĐÚNG: Sự cố mặt đất
Câu 18: Một thùng hàng nguy hiểm bị rò rỉ trong quá trình bốc dỡ, hơi hóa chất lan sang khu vực làm việc và đe dọa sức khỏe nhân viên. Phân loại trực tiếp nhất là gì?
ĐÁP ÁN ĐÚNG: Sự cố đổ vỡ hàng nguy hiểm
Câu 19: Khi tình huống vượt quá phạm vi xử lý thông thường và cần phối hợp với Ban Chỉ đạo phòng, chống khủng bố cùng Ban Chỉ huy phòng thủ dân sự địa phương, chủ thể nào có vai trò làm việc trực tiếp?
ĐÁP ÁN ĐÚNG: Giám đốc cảng hàng không
Câu 20: Trong giai đoạn đầu, Đơn vị điều hành sân bay tiếp nhận tin về tàu bay nghi ngờ hỏng càng. Chuỗi hành động nào phù hợp nhất?
ĐÁP ÁN ĐÚNG: Tiếp nhận thông tin, xác định cấp độ, phối hợp bay thông trường khi cần và thực hiện báo động theo lệnh
Câu 21: Trong trường hợp bay thông trường để quan sát càng tàu bay, phương án phối hợp nào đúng nhất?
ĐÁP ÁN ĐÚNG: Tổ bay, Đài kiểm soát không lưu và đơn vị kỹ thuật phối hợp, sử dụng phương tiện quan sát thích hợp
Câu 22: Sau tai nạn, cơ quan có thẩm quyền yêu cầu tạm thời đóng một phần sân bay. Đơn vị điều hành sân bay phải làm gì?
ĐÁP ÁN ĐÚNG: Phối hợp triển khai việc đóng, mở theo yêu cầu của cơ quan có thẩm quyền
Câu 23: Trong xử lý hiện trường, nhiệm vụ nào không thuộc Đơn vị điều hành sân bay? (a. Tổ chức sơ cứu, phân loại và đưa nạn nhân đi bệnh viện, b. Thống kê nạn nhân để báo cáo chỉ huy, c. Quyết định pháp lý cuối cùng về công bố đóng cửa sân bay, d. Thu thập thông tin, tài liệu và lưu trữ hồ sơ)
ĐÁP ÁN ĐÚNG: Quyết định pháp lý cuối cùng về công bố đóng cửa sân bay
Câu 24: Sau sơ tán, một nhóm hành khách không bị thương cần nơi nghỉ, nước uống, chiếu sáng, điều hòa và phương tiện liên lạc. Đơn vị nào chịu trách nhiệm trực tiếp nhất?
ĐÁP ÁN ĐÚNG: Đơn vị khai thác ga
Câu 25: Đám cháy xảy ra trong nhà ga. Việc cô lập nguồn điện và khí gas tại khu vực cháy thuộc nhóm nhiệm vụ nào?
ĐÁP ÁN ĐÚNG: Kỹ thuật và cô lập an toàn của đơn vị khai thác ga
Câu 26: Lực lượng cứu hộ cần một tuyến tiếp cận tạm thời trong khu bay và một nhà bạt để làm cơ sở hoạt động. Đơn vị nào phù hợp nhất để chủ trì bố trí?
ĐÁP ÁN ĐÚNG: Đơn vị khai thác khu bay
Câu 27: Sau tai nạn, đường lăn và đèn tín hiệu bị hư hỏng do tàu bay. Nhiệm vụ khôi phục ban đầu thuộc đơn vị nào?
ĐÁP ÁN ĐÚNG: Đơn vị khai thác khu bay
Câu 28: Nội dung phát ngôn báo chí sau sự cố nên được triển khai theo cách nào?
ĐÁP ÁN ĐÚNG: Phòng Văn phòng hỗ trợ Giám đốc, dự thảo thông cáo theo chỉ đạo
Câu 29: Đơn vị nào chịu trách nhiệm tiếp đón thân nhân hành khách của chuyến bay khẩn nguy?
ĐÁP ÁN ĐÚNG: Văn phòng cảng phối hợp hãng hàng không tổ chức tiếp đón
Câu 30: Đơn vị nào có nhiệm vụ gồm kiểm tra tính sẵn sàng thiết bị, quay phim chụp ảnh, thu thập chứng cứ và làm thư ký họp bình giảng?
ĐÁP ÁN ĐÚNG: Phòng An toàn và Kiểm soát chất lượng
Câu 31: Chi phí khẩn nguy đã phát sinh và cần thanh quyết toán với hãng hàng không. Đơn vị nào chịu trách nhiệm trực tiếp nhất?
ĐÁP ÁN ĐÚNG: Phòng Tài chính – Kế toán
Câu 32: Cơ quan nào vừa là đầu mối liên lạc chính thức với Cục Hàng không Việt Nam, vừa có thẩm quyền quyết định hoặc chủ động việc tạm thời đóng, mở sân bay theo pháp luật?
ĐÁP ÁN ĐÚNG: Cảng vụ hàng không
Câu 33: Tại Trung tâm khẩn nguy, khi cần duy trì liên lạc trực tiếp với tổ bay từ Trung tâm khẩn nguy, bố trí nào phù hợp nhất?
ĐÁP ÁN ĐÚNG: Bố trí kiểm soát viên không lưu tại Trung tâm khẩn nguy
Câu 34: Tàu bay thực hiện bay thông trường để đánh giá trục trặc càng. Đơn vị quản lý bay có trách nhiệm nào?
ĐÁP ÁN ĐÚNG: Thông báo kênh bộ đàm, phối hợp kỹ thuật quan sát và điều hành ưu tiên hạ cánh an toàn
Câu 35: Danh sách tổ bay, hành khách, và tình trạng thiết bị an toàn là những hồ sơ mà hãng hàng không phải ưu tiên cung cấp để hỗ trợ cứu nạn?
ĐÁP ÁN ĐÚNG: Đúng (hoặc Sai theo slide - lưu ý: đáp án trong slide ghi Sai cho câu này, sẽ giữ nguyên theo hình ảnh)
Câu 36: Trên tàu bay gặp nạn có hàng nguy hiểm. Hành động nào phải thực hiện sớm nhất trong chuỗi báo động?
ĐÁP ÁN ĐÚNG: Thông báo hàng nguy hiểm cho Đài kiểm soát không lưu
Câu 37: Một hành khách bị thương được chuyển đến bệnh viện. Hãng hàng không phải tổ chức theo dõi như thế nào?
ĐÁP ÁN ĐÚNG: Cử người đi theo xe cấp cứu để theo dõi, thống kê tình trạng nạn nhân
Câu 38: Hãng hàng không có tàu bay khẩn nguy chỉ định người phát ngôn chính thức để trả lời báo chí và công bố chính sách hỗ trợ?
ĐÁP ÁN ĐÚNG: Đúng
Câu 39: Hộp đen FDR/CVR sau tai nạn phải được xử lý theo nguyên tắc nào?
ĐÁP ÁN ĐÚNG: Đơn vị kỹ thuật hoặc hãng phối hợp bảo quản và bàn giao cho cơ quan chức năng sớm nhất có thể
Câu 40: Sau khi hành khách đã rời tàu bay, đơn vị phục vụ mặt đất phải ưu tiên chuỗi nhiệm vụ nào?
ĐÁP ÁN ĐÚNG: Sơ tán khách và hàng hóa; hướng dẫn tại khu tiếp nhận; cung cấp danh sách, tài liệu và chứng cứ phục vụ điều tra
Câu 41: Khi lực lượng cứu nạn cần xác định vị trí cưa cắt khẩn cấp trên thân tàu bay, đơn vị nào phải cung cấp sơ đồ kỹ thuật và chỉ dẫn?
ĐÁP ÁN ĐÚNG: Đơn vị sửa chữa, bảo dưỡng tàu bay
Câu 42: Hàng nguy hiểm đã được đưa khỏi hiện trường nhưng cần tập kết, giám sát vận chuyển và cách ly. Đơn vị phù hợp nhất là gì?
ĐÁP ÁN ĐÚNG: Đơn vị Kho hàng
Câu 43: Đơn vị nào Duy trì trật tự, kiểm soát việc ghi hình và ngăn rò rỉ thông tin?
ĐÁP ÁN ĐÚNG: Lực lượng kiểm soát An ninh hàng không
Câu 44: Nhiệm vụ nào thể hiện rõ nhất vai trò “phong tỏa nhưng vẫn bảo đảm cứu nạn” của lực lượng kiểm soát ANHK?
ĐÁP ÁN ĐÚNG: Thiết lập vành đai, bảo vệ hiện trường, đồng thời hướng dẫn lực lượng ứng cứu ra vào theo quy định
Câu 45: Lực lượng cứu nạn cần di chuyển quanh ranh giới sân bay để tiếp cận xử lý khẩn cấp. Tuyến đường phù hợp nhất là gì?
ĐÁP ÁN ĐÚNG: Tuyến đường vành đai

// --- HỆ THỐNG XỬ LÝ & PARSE DỮ LIỆU THÔNG MINH ---
const parseData = () => {
    const paddedText = '\n' + rawText;
    const blocks = paddedText.split(/\nCâu \d+:\s/).filter(b => b.includes('ĐÁP ÁN ĐÚNG:'));
    const answersPool = [];
    
    // Thu thập toàn bộ đáp án đúng để làm phương án nhiễu
    blocks.forEach(block => {
        const parts = block.split(/ĐÁP ÁN ĐÚNG:\s*/);
        if (parts.length > 1) {
            let ans = parts[1].trim();
            if (!ans.toLowerCase().startsWith('đúng') && !ans.toLowerCase().startsWith('sai')) {
                answersPool.push(ans);
            }
        }
    });

    return blocks.map((block, index) => {
        const parts = block.split(/ĐÁP ÁN ĐÚNG:\s*/);
        if (parts.length < 2) return null;
        
        let qText = parts[0].trim();
        let correctAnswer = parts[1].trim();
        let options = [];

        // Kiểm tra xem câu hỏi có chứa cấu trúc (a..., b..., c..., d...) không
        const optMatch = qText.match(/\(a\.\s*(.*?),\s*b\.\s*(.*?),\s*c\.\s*(.*?),\s*d\.\s*(.*?)\)/i);
        if (optMatch) {
            options = [optMatch[1].trim(), optMatch[2].trim(), optMatch[3].trim(), optMatch[4].trim()];
            qText = qText.replace(optMatch[0], '').trim();
            // Đảm bảo đáp án đúng nằm trong mảng options
            if (!options.includes(correctAnswer)) {
                let matchedIdx = options.findIndex(o => correctAnswer.includes(o) || o.includes(correctAnswer));
                if (matchedIdx !== -1) {
                    options[matchedIdx] = correctAnswer;
                } else {
                    options[0] = correctAnswer;
                }
            }
        } else if (correctAnswer.toLowerCase().startsWith('đúng') || correctAnswer.toLowerCase().startsWith('sai')) {
            // Câu hỏi Dúng/Sai
            options = [correctAnswer];
            if (correctAnswer.toLowerCase().startsWith('đúng')) options.push('Sai');
            else options.push('Đúng');
        } else {
            // Bốc ngẫu nhiên 3 phương án nhiễu từ pool
            options = [correctAnswer];
            let attempts = 0;
            while(options.length < 4 && attempts < 100) {
                let randAns = answersPool[Math.floor(Math.random() * answersPool.length)];
                if (!options.includes(randAns)) options.push(randAns);
                attempts++;
            }
        }

        // Cố định xáo trộn thứ tự A,B,C,D một lần khi tạo (Tab 1 đổi câu hỏi nhưng giữ nguyên trật tự này)
        options.sort(() => Math.random() - 0.5);

        return { id: index + 1, question: qText, options: options, correctAnswer: correctAnswer };
    }).filter(q => q !== null);
};

const allQuestions = parseData();

// --- LOGIC GIAO DIỆN (STATE) ---
let currentTestQuestions = [];
let userAnswers = {};
let timerInterval;
let seconds = 0;
let isSubmitted = false;
let isReviewRendered = false; // Flag quản lý render tab Ôn tập

// Các hàm tiện ích
function normalizeString(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").toLowerCase();
}

function createVnRegex(keyword) {
    const map = {
        'a': '[aáàảãạăắằẳẵặâấầẩẫậ]', 'e': '[eéèẻẽẹêếềểễệ]', 'i': '[iíìỉĩị]',
        'o': '[oóòỏõọôốồổỗộơớờởỡợ]', 'u': '[uúùủũụưứừửữự]', 'y': '[yýỳỷỹỵ]', 'd': '[dđ]'
    };
    let pattern = '';
    for(let char of normalizeString(keyword)) {
        pattern += map[char] || char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    return new RegExp(pattern, 'gi');
}

function highlightText(text, keyword) {
    if(!keyword.trim()) return text;
    try {
        const regex = createVnRegex(keyword);
        return text.replace(regex, match => `<mark>${match}</mark>`);
    } catch(e) { return text; }
}

function updateHighScoreDisplay() {
    let hs = localStorage.getItem('knsb_highscore') || 0;
    document.getElementById('high-score').innerText = `Điểm cao: ${hs}/40`;
}

function showToast(msg) {
    let toast = document.createElement('div');
    toast.className = 'fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded text-sm shadow-xl z-50 transition-opacity';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

// Chuyển Tab
function switchTab(tab) {
    const btnTest = document.getElementById('tab-test');
    const btnRev = document.getElementById('tab-review');
    
    if (tab === 'test') {
        document.getElementById('test-view').classList.remove('hidden');
        document.getElementById('review-view').classList.add('hidden');
        document.getElementById('test-stats-bar').classList.remove('hidden');
        document.getElementById('search-container').classList.add('hidden');
        
        btnTest.className = 'flex-1 py-1.5 font-bold text-blue-800 border-b-2 border-blue-800';
        btnRev.className = 'flex-1 py-1.5 font-bold text-gray-500 border-b-2 border-transparent';
    } else {
        document.getElementById('test-view').classList.add('hidden');
        document.getElementById('review-view').classList.remove('hidden');
        document.getElementById('test-stats-bar').classList.add('hidden');
        document.getElementById('search-container').classList.remove('hidden');
        
        btnRev.className = 'flex-1 py-1.5 font-bold text-blue-800 border-b-2 border-blue-800';
        btnTest.className = 'flex-1 py-1.5 font-bold text-gray-500 border-b-2 border-transparent';
        
        // Khắc phục lỗi Tab trắng: Kiểm tra flag logic 
        if (!isReviewRendered || document.getElementById('review-questions').children.length === 0) {
            renderReview(allQuestions);
            isReviewRendered = true;
        }
    }
}

// --- TAB THI THỬ ---
function startTimer() {
    clearInterval(timerInterval);
    seconds = 0;
    document.getElementById('timer').innerText = '00:00';
    timerInterval = setInterval(() => {
        seconds++;
        let m = Math.floor(seconds / 60).toString().padStart(2, '0');
        let s = (seconds % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
    }, 1000);
}

function startTest() {
    isSubmitted = false;
    userAnswers = {};
    document.getElementById('btn-submit-top').disabled = false;
    document.getElementById('btn-submit-bot').disabled = false;
    document.getElementById('btn-share').classList.add('hidden');
    
    // Xáo trộn và lấy ngẫu nhiên 40 câu
    let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
    currentTestQuestions = shuffled.slice(0, 40);
    
    const container = document.getElementById('test-questions');
    container.innerHTML = '';
    
    currentTestQuestions.forEach((q, i) => {
        let optionsHtml = q.options.map((opt, optIndex) => `
            <div class="compact-opt text-[13px] leading-tight" onclick="selectOption(${i}, ${optIndex})" id="opt-${i}-${optIndex}">
                <div class="opt-label">${String.fromCharCode(65 + optIndex)}.</div>
                <div class="w-full">${opt}</div>
            </div>
        `).join('');
        
        container.innerHTML += `
            <div class="bg-white p-2 rounded shadow-sm border border-gray-100">
                <div class="font-bold text-[13px] mb-1.5 text-blue-900 leading-tight">Câu ${i + 1}: <span class="font-normal text-black">${q.question}</span></div>
                <div class="flex flex-col">${optionsHtml}</div>
            </div>
        `;
    });
    
    startTimer();
    updateHighScoreDisplay();
}

function selectOption(qIndex, optIndex) {
    if (isSubmitted) return;
    userAnswers[qIndex] = optIndex;
    
    for(let j=0; j<currentTestQuestions[qIndex].options.length; j++) {
        let el = document.getElementById(`opt-${qIndex}-${j}`);
        if(el) el.classList.remove('selected', 'bg-blue-50', 'border-blue-500');
    }
    let selEl = document.getElementById(`opt-${qIndex}-${optIndex}`);
    if(selEl) selEl.classList.add('selected', 'bg-blue-50', 'border-blue-500');
}

function submitTest() {
    if(isSubmitted) return;
    if(Object.keys(userAnswers).length < currentTestQuestions.length) {
        if(!confirm('Bạn chưa hoàn thành bài thi! Chắc chắn nộp bài?')) return;
    }
    
    isSubmitted = true;
    clearInterval(timerInterval);
    let score = 0;
    
    currentTestQuestions.forEach((q, i) => {
        let correctIdx = q.options.findIndex(opt => opt === q.correctAnswer);
        let userIdx = userAnswers[i];
        
        for(let j=0; j<q.options.length; j++) {
            let el = document.getElementById(`opt-${i}-${j}`);
            if(!el) continue;
            
            el.classList.remove('selected', 'bg-blue-50', 'border-blue-500');
            el.classList.add('pointer-events-none');
            
            let statusIcon = '';
            if (j === correctIdx) {
                el.classList.add('correct');
                statusIcon = '<span class="ml-auto flex-shrink-0 font-bold">✔️</span>';
                if (userIdx === correctIdx) score++;
            } else if (j === userIdx) {
                el.classList.add('wrong');
                statusIcon = '<span class="ml-auto flex-shrink-0 font-bold">✖️</span>';
            } else {
                el.classList.add('bg-gray-50', 'text-gray-400');
            }
            
            if(statusIcon) el.innerHTML += statusIcon;
        }
    });
    
    let hs = localStorage.getItem('knsb_highscore') || 0;
    if (score > hs) localStorage.setItem('knsb_highscore', score);
    updateHighScoreDisplay();
    
    const time = document.getElementById('timer').innerText;
    alert(`Hoàn thành!\nĐiểm số: ${score}/${currentTestQuestions.length}\nThời gian: ${time}`);
    document.getElementById('btn-share').classList.remove('hidden');
}

function shareResult() {
    let score = 0;
    currentTestQuestions.forEach((q, i) => {
        let correctIdx = q.options.findIndex(opt => opt === q.correctAnswer);
        if(userAnswers[i] === correctIdx) score++;
    });
    const time = document.getElementById('timer').innerText;
    const text = `Tôi vừa đạt ${score}/40 điểm bài Sát hạch Khẩn nguy sân bay trong thời gian ${time}!`;
    
    navigator.clipboard.writeText(text).then(() => {
        showToast('✔️ Đã copy kết quả vào khay nhớ tạm!');
    }).catch(() => showToast('Lỗi copy, thử lại sau.'));
}

// --- TAB ÔN TẬP ---
function renderReview(questionsToRender, keyword = '') {
    const container = document.getElementById('review-questions');
    container.innerHTML = '';
    
    if (questionsToRender.length === 0) {
        container.innerHTML = '<div class="text-center text-sm text-gray-500 py-4">Không tìm thấy nội dung.</div>';
        return;
    }

    questionsToRender.forEach(q => {
        let optionsHtml = q.options.map((opt, optIndex) => {
            let isCorrect = (opt === q.correctAnswer);
            let optClass = isCorrect ? 'correct' : 'wrong';
            let icon = isCorrect ? '<span class="ml-auto font-bold text-xs flex-shrink-0">✔️</span>' : '';
            return `
                <div class="review-opt text-[12px] leading-tight ${optClass}">
                    <div class="opt-label">${String.fromCharCode(65 + optIndex)}.</div>
                    <div class="w-full">${highlightText(opt, keyword)}</div>
                    ${icon}
                </div>
            `;
        }).join('');
        
        container.innerHTML += `
            <div class="bg-white p-2 rounded shadow-sm border border-gray-100">
                <div class="font-bold text-[13px] mb-1.5 text-blue-900 leading-tight">Câu ${q.id}: <span class="font-normal text-black">${highlightText(q.question, keyword)}</span></div>
                <div class="flex flex-col gap-0.5">${optionsHtml}</div>
            </div>
        `;
    });
}

function searchReview() {
    const keyword = document.getElementById('search-input').value.trim();
    if (!keyword) {
        renderReview(allQuestions);
        return;
    }
    const normKeyword = normalizeString(keyword);
    const filtered = allQuestions.filter(q => 
        normalizeString(q.question).includes(normKeyword) || 
        q.options.some(opt => normalizeString(opt).includes(normKeyword))
    );
    renderReview(filtered, keyword);
}

// Khởi chạy App ban đầu
window.onload = () => {
    startTest();
};
</script>
