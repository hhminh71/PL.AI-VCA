        // 1. Parsing dữ liệu
        let allQuestions = [];
        function parseData() {
            // Tách theo mẫu "Câu X:"
            const blocks = rawData.split(/(?=Câu\s+\d+:)/).map(b => b.trim()).filter(b => b);
            blocks.forEach((block, index) => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                if (lines.length > 1) {
                    let qText = lines[0].replace(/^Câu\s+\d+:\s*/, '');
                    let options = [];
                    for (let i = 1; i < lines.length; i++) {
                        let text = lines[i];
                        let isCorrect = false;
                        if (text.endsWith('*')) {
                            isCorrect = true;
                            text = text.slice(0, -1).trim();
                        }
                        options.push({ id: `opt_${index}_${i}`, text, isCorrect });
                    }
                    // Nếu không có câu nào đánh dấu, mặc định câu cuối
                    if (!options.some(o => o.isCorrect)) options[options.length - 1].isCorrect = true;
                    
                    allQuestions.push({ id: index + 1, question: qText, options });
                }
            });
        }
        parseData();

        // Biến toàn cục
        let testQuestions = [];
        let userAnswers = {};
        let isSubmitted = false;
        let timerInterval;
        let secondsElapsed = 0;
        const totalTestItems = Math.min(40, allQuestions.length);
        
        // Quản lý Tab 2 Render
        let isReviewRendered = false;

        // Tiện ích
        const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);
        const formatTime = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;

        // 2. Chuyển Tab
        function switchTab(tab) {
            const isTest = tab === 'test';
            document.getElementById('tab-test').style.display = isTest ? 'block' : 'none';
            document.getElementById('tab-review').style.display = !isTest ? 'block' : 'none';
            
            document.getElementById('tab-test-btn').className = isTest ? 'tab-active flex-1 pb-1 text-center transition-colors' : 'tab-inactive flex-1 pb-1 text-center transition-colors';
            document.getElementById('tab-review-btn').className = !isTest ? 'tab-active flex-1 pb-1 text-center transition-colors' : 'tab-inactive flex-1 pb-1 text-center transition-colors';

            if (!isTest && !isReviewRendered) {
                renderReview();
            }
        }

        // ================= TAB 1: THI THỬ =================
        function initBestScore() {
            let best = localStorage.getItem('hkddBestScore') || 0;
            document.getElementById('best-score').innerText = `Điểm cao: ${best}/${totalTestItems}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timer').innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timer').innerText = formatTime(secondsElapsed);
            }, 1000);
        }

        function startTest() {
            isSubmitted = false;
            userAnswers = {};
            document.getElementById('score-display').innerText = '';
            document.getElementById('btn-share').classList.add('hidden');
            document.getElementById('btn-submit-top').classList.remove('hidden');
            document.getElementById('btn-submit-bottom').classList.remove('hidden');

            // Bốc ngẫu nhiên & xáo trộn
            testQuestions = shuffle(allQuestions).slice(0, totalTestItems).map(q => ({
                ...q,
                options: shuffle(q.options)
            }));

            const container = document.getElementById('test-container');
            container.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
            testQuestions.forEach((q, qIndex) => {
                let html = `
                    <div class="mb-4 bg-white p-3 rounded border border-gray-200 shadow-sm" id="qBox_${qIndex}">
                        <p class="font-bold mb-2">Câu ${qIndex + 1}: <span class="font-normal">${q.question}</span></p>
                        <div class="flex flex-col gap-1.5 pl-1">
                `;
                q.options.forEach((opt, oIndex) => {
                    html += `
                        <label class="flex items-start gap-2 cursor-pointer p-1.5 rounded transition-colors hover:bg-blue-50" id="label_${qIndex}_${opt.id}">
                            <input type="radio" name="q_${qIndex}" value="${opt.id}" class="mt-0.5 w-4 h-4 text-blue-600" onchange="selectAnswer(${qIndex}, '${opt.id}')">
                            <span class="flex-1"><strong>${labels[oIndex]}.</strong> ${opt.text}</span>
                            <span class="icon-result hidden font-bold text-lg leading-none" id="icon_${qIndex}_${opt.id}"></span>
                        </label>
                    `;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });

            startTimer();
            window.scrollTo(0, 0);
        }

        function selectAnswer(qIndex, optId) {
            if (isSubmitted) return;
            userAnswers[qIndex] = optId;
        }

        function submitTest() {
            if (isSubmitted) return;
            
            // Hỏi xác nhận nếu chưa chọn hết
            if (Object.keys(userAnswers).length < totalTestItems) {
                if(!confirm(`Bạn mới làm ${Object.keys(userAnswers).length}/${totalTestItems} câu. Bạn có chắc chắn muốn nộp bài?`)) return;
            }

            isSubmitted = true;
            clearInterval(timerInterval);
            
            let score = 0;
            testQuestions.forEach((q, qIndex) => {
                const selectedOptId = userAnswers[qIndex];
                const correctOpt = q.options.find(o => o.isCorrect);
                
                // Vô hiệu hóa input
                document.querySelectorAll(`input[name="q_${qIndex}"]`).forEach(input => input.disabled = true);

                q.options.forEach(opt => {
                    const labelEl = document.getElementById(`label_${qIndex}_${opt.id}`);
                    const iconEl = document.getElementById(`icon_${qIndex}_${opt.id}`);
                    
                    if (opt.isCorrect) {
                        labelEl.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-300');
                        iconEl.innerText = '✔️';
                        iconEl.classList.remove('hidden');
                        iconEl.classList.add('text-green-600');
                    } else if (selectedOptId === opt.id) {
                        labelEl.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-300');
                        iconEl.innerText = '✖️';
                        iconEl.classList.remove('hidden');
                        iconEl.classList.add('text-red-600');
                    }
                });

                if (selectedOptId === correctOpt.id) score++;
            });

            // Cập nhật điểm
            const timeStr = formatTime(secondsElapsed);
            document.getElementById('score-display').innerText = `Kết quả: ${score}/${totalTestItems} (${timeStr})`;
            
            let best = parseInt(localStorage.getItem('hkddBestScore') || 0);
            if (score > best) {
                localStorage.setItem('hkddBestScore', score);
                initBestScore();
            }

            document.getElementById('btn-share').classList.remove('hidden');
            document.getElementById('btn-submit-top').classList.add('hidden');
            document.getElementById('btn-submit-bottom').classList.add('hidden');
            window.scrollTo(0, 0);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            // Remove animation reset
            toast.style.animation = 'none';
            toast.offsetHeight; /* trigger reflow */
            toast.style.animation = null;
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        function shareResult() {
            const scoreText = document.getElementById('score-display').innerText;
            const text = `HKDD: ${scoreText} câu.`;
            navigator.clipboard.writeText(text).then(() => showToast('Đã copy kết quả!'));
        }

        // ================= TAB 2: ÔN TẬP =================
        // Thuật toán tạo Regex tìm kiếm bỏ qua dấu tiếng Việt
        function removeAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
        }

        function createAccentRegExp(keyword) {
            if(!keyword.trim()) return null;
            const map = {
                'a': '[aáàảãạăắằẳẵặâấầẩẫậAÁÀẢÃẠĂẮẰẲẴẶÂẤẦẨẪẬ]',
                'd': '[dđDĐ]',
                'e': '[eéèẻẽẹêếềểễệEÉÈẺẼẸÊẾỀỂỄỆ]',
                'i': '[iíìỉĩịIÍÌỈĨỊ]',
                'o': '[oóòỏõọôốồổỗộơớờởỡợOÓÒỎÕỌÔỐỒỔỖỘƠỚỜỞỠỢ]',
                'u': '[uúùủũụưứừửữựUÚÙỦŨỤƯỨỪỬỮỰ]',
                'y': '[yýỳỷỹỵYÝỲỶỸỴ]'
            };
            let pattern = keyword.split('').map(char => {
                let cleanChar = removeAccents(char.toLowerCase());
                return map[cleanChar] || cleanChar.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }).join('');
            return new RegExp(`(${pattern})`, 'gi');
        }

        function highlightText(text, regex) {
            if (!regex) return text;
            return text.replace(regex, '<mark class="bg-yellow-300 text-black font-semibold rounded px-0.5">$1</mark>');
        }

        function renderReview(keyword = '') {
            const container = document.getElementById('review-container');
            container.innerHTML = '';
            const regex = createAccentRegExp(keyword);
            
            let html = '';
            const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
            
            allQuestions.forEach((q, index) => {
                const qTextClean = removeAccents(q.question).toLowerCase();
                const keyClean = removeAccents(keyword).toLowerCase();
                let matchQ = !keyword || qTextClean.includes(keyClean);
                let matchA = false;
                
                let optsHtml = '';
                q.options.forEach((opt, oIndex) => {
                    const optTextClean = removeAccents(opt.text).toLowerCase();
                    if (keyword && optTextClean.includes(keyClean)) matchA = true;
                    
                    let bgClass = opt.isCorrect ? 'bg-green-100 text-green-900 border border-green-300' : 'bg-gray-50 text-gray-500';
                    let icon = opt.isCorrect ? '✔️' : '';
                    let hText = highlightText(opt.text, regex);
                    
                    optsHtml += `
                        <div class="flex items-start gap-2 p-1.5 rounded ${bgClass}">
                            <span class="flex-1"><strong>${labels[oIndex]}.</strong> ${hText}</span>
                            ${icon ? `<span class="font-bold text-green-600">${icon}</span>` : ''}
                        </div>
                    `;
                });

                if (matchQ || matchA) {
                    let hQuestion = highlightText(q.question, regex);
                    html += `
                        <div class="mb-3 bg-white p-3 rounded border border-gray-200 shadow-sm">
                            <p class="font-bold mb-2">Câu ${index + 1}: <span class="font-normal">${hQuestion}</span></p>
                            <div class="flex flex-col gap-1.5 pl-1">
                                ${optsHtml}
                            </div>
                        </div>
                    `;
                }
            });
            
            if(!html) html = '<p class="text-center text-gray-500 mt-4">Không tìm thấy kết quả phù hợp.</p>';
            container.innerHTML = html;
            isReviewRendered = true; // Đánh dấu đã render
        }

        function handleSearch() {
            const val = document.getElementById('search-input').value;
            renderReview(val);
        }

        // ================= KHỞI TẠO =================
        window.onload = () => {
            initBestScore();
            startTest();
        };
    </script>
</body>
</html>
