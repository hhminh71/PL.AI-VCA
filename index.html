<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pháp Luật HKDD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tối ưu typography để hiển thị nhiều thông tin, dễ đọc lướt */
        body { font-family: 'Inter', system-ui, sans-serif; line-height: 1.25; }
        .hide { display: none !important; }
        
        /* Custom scrollbar thanh mảnh */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Radio button màu custom */
        input[type="radio"] { accent-color: #2563eb; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
    <div class="max-w-2xl mx-auto bg-white min-h-screen shadow-xl flex flex-col relative pb-6">
        
        <!-- Header -->
        <header class="pt-3 pb-2 border-b bg-white relative z-20">
            <div class="text-[11px] sm:text-xs italic text-gray-500 text-center mb-0.5">Huấn luyện Đào tạo Cảng HKQT Cần Thơ</div>
            <h1 class="text-lg sm:text-xl font-bold text-center text-blue-800 uppercase px-2">Pháp Luật Về HKDD</h1>
        </header>

        <!-- Tabs -->
        <div class="flex border-b sticky top-0 z-30 bg-white shadow-sm">
            <button id="tab-quiz" onclick="switchTab('quiz')" class="flex-1 py-2.5 font-bold text-sm sm:text-base text-blue-600 border-b-2 border-blue-600 transition-colors">Thi Thử (40)</button>
            <button id="tab-review" onclick="switchTab('review')" class="flex-1 py-2.5 font-bold text-sm sm:text-base text-gray-400 border-b-2 border-transparent transition-colors hover:text-blue-500">Ôn Tập (Full)</button>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-2xl hide z-50 text-sm font-medium transition-opacity duration-300 opacity-0 pointer-events-none whitespace-nowrap"></div>

        <!-- ================= TAB 1: THI THỬ ================= -->
        <section id="section-quiz" class="flex-1 flex flex-col relative">
            
            <!-- Sticky Controls Top -->
            <div class="sticky top-[45px] sm:top-[49px] z-20 bg-white/95 backdrop-blur-sm p-2 border-b flex justify-between items-center shadow-sm">
                <div class="flex flex-col">
                    <span id="timer" class="text-xl font-black text-red-600 tabular-nums">00:00</span>
                    <span id="high-score" class="text-[10px] sm:text-xs text-green-700 font-bold bg-green-100 px-1.5 py-0.5 rounded-full inline-block w-max mt-0.5">Điểm cao: 0/40</span>
                </div>
                <div class="space-x-1 sm:space-x-2 flex items-center">
                    <button id="btn-share-top" onclick="shareResult()" class="bg-teal-500 text-white px-3 py-1.5 rounded text-sm font-bold shadow active:scale-95 transition-transform hide flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg> Chia sẻ
                    </button>
                    <button id="btn-submit-top" onclick="submitQuiz()" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm font-bold shadow active:scale-95 transition-transform">Nộp Bài</button>
                    <button onclick="retryQuiz()" class="bg-gray-200 text-gray-800 px-3 py-1.5 rounded text-sm font-bold shadow active:scale-95 transition-transform">Làm Lại</button>
                </div>
            </div>

            <!-- Quiz Content -->
            <div id="quiz-container" class="p-2 sm:p-3 space-y-3 pb-6">
                <!-- JS sẽ render câu hỏi tại đây -->
            </div>

            <!-- Bottom Controls -->
            <div id="bottom-controls" class="p-3 border-t bg-gray-50 flex justify-center space-x-3 mt-auto hide">
                <button id="btn-submit-bottom" onclick="submitQuiz()" class="bg-blue-600 text-white px-8 py-2.5 rounded-lg font-bold shadow active:scale-95 transition-transform text-lg">Nộp Bài</button>
                <button onclick="retryQuiz()" class="bg-gray-300 text-gray-800 px-8 py-2.5 rounded-lg font-bold shadow active:scale-95 transition-transform text-lg">Làm Lại</button>
            </div>
        </section>

        <!-- ================= TAB 2: ÔN TẬP ================= -->
        <section id="section-review" class="flex-1 flex flex-col hide relative">
            
            <!-- Sticky Search Bar -->
            <div class="sticky top-[45px] sm:top-[49px] z-20 bg-white p-2 border-b shadow-md">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="Tìm kiếm câu hỏi, đáp án..." class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm bg-gray-50">
                </div>
            </div>

            <!-- Review Content -->
            <div id="review-container" class="p-2 sm:p-3 space-y-2.5 pb-6 bg-gray-50">
                <!-- JS sẽ render câu hỏi tại đây -->
            </div>
        </section>

    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // 1. DỮ LIỆU DẠNG RAW TEXT (Template String)
        const rawTextData = `
Câu 1: Công ước về hàng không dân dụng quốc tế (Công ước Chicago) được thông qua năm nào?
a. 1929.
b. 1944.
c. 1945.
d. 1947.
Đáp án: b. 1944.
Câu 2: Công ước về hàng không dân dụng quốc tế (Công ước Chicago) có hiệu lực năm nào?
a. 1929.
b. 1944.
c. 1945.
d. 1947.
Đáp án: d. 1947.
Câu 3: Tổ chức hàng không dân dụng quốc tế (ICAO) ra đời trên cơ sở văn bản pháp luật nào?
a. Công ước Vácsava 1929.
b. Công ước Chicago 1944.
c. Công ước Montreal năm 1999.
Đáp án: b. Công ước Chicago 1944.
Câu 4: Thương quyền hàng không là gì?
a. Là một bộ các quyền khai thác các chuyến bay thương mại cấp cho các quốc gia được quyền bay vào không phận hoặc hạ cánh đến quốc gia khác.
b. Là một bộ các quyền khai thác các chuyến bay thương mại cấp cho các hãng hàng không của một quốc gia được quyền bay vào không phận hoặc hạ cánh đến quốc gia khác.
c. Là một bộ các quyền khai thác các chuyến bay thương mại cấp cho các hãng hàng không.
Đáp án: b. Là một bộ các quyền khai thác các chuyến bay thương mại cấp cho các hãng hàng không của một quốc gia được quyền bay vào không phận hoặc hạ cánh đến quốc gia khác.
Câu 5: Có bao nhiêu loại thương quyền?
a. 6 loại.
b. 7 loại.
c. 8 loại.
d. 9 loại.
Đáp án: d. 9 loại.
Câu 6: Luật Hàng không dân dụng Việt Nam số 130/2025/QH15 có hiệu lực từ thời điểm nào?
a. 01/01/2007.
b. 01/7/2015.
c. 01/7/2025.
d. 01/7/2026.
Đáp án: d. 01/7/2026.
Câu 7: Hành vi nào bị nghiêm cấm trong hoạt động hàng không dân dụng
a. Đưa thiết bị, vật dụng hoặc các vật thể khác vào không trung gây ảnh hưởng đến an toàn bay.
b. Đưa vật phẩm nguy hiểm vào tàu bay, cảng hàng không và khu vực hạn chế trái quy định.
c. Đe dọa, uy hiếp an toàn bay, gây nguy hiểm đến tính mạng, sức khỏe, tài sản của người khác trong tàu bay.
d. Tiết lộ trái phép thông tin hành khách, người sử dụng dịch vụ vận tải hàng không.
e. Cả a, b, c và d đều đúng.
Đáp án: e. Cả a, b, c và d đều đúng.
Câu 8: An ninh hàng không là gì?
a. An ninh hàng không là bộ phận của an ninh quốc gia, được tiến hành bằng việc kết hợp sử dụng các biện pháp, nhân lực và nguồn lực vật chất nhằm bảo vệ hoạt động hàng không dân dụng, phòng ngừa và chống lại các hành vi can thiệp bất hợp pháp.
b. An ninh hàng không là việc kết hợp sử dụng các biện pháp, nhân lực và nguồn lực vật chất nhằm bảo vệ hoạt động hàng không dân dụng, phòng ngừa và chống lại các hành vi can thiệp bất hợp pháp.
c. An ninh hàng không là việc bảo vệ hoạt động hàng không dân dụng, phòng ngừa và chống lại các hành vi can thiệp bất hợp pháp.
Đáp án: a. An ninh hàng không là bộ phận của an ninh quốc gia, được tiến hành bằng việc kết hợp sử dụng các biện pháp, nhân lực và nguồn lực vật chất nhằm bảo vệ hoạt động hàng không dân dụng, phòng ngừa và chống lại các hành vi can thiệp bất hợp pháp.
Câu 9: Theo Anh/Chị, hành vi nuôi, thả động vật trong khu vực cảng hàng không có được phép hay không?
a. Có
b. Không
Đáp án: b. Không
Câu 10: Tổ chức, cá nhân tham gia hoạt động hàng không dân dụng phải thực hiện các quy định của pháp luật về an ninh hàng không?
a. Đúng
b. Sai
Đáp án: a. Đúng
Câu 11: Mọi biện pháp đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng phải ưu tiên bảo đảm an toàn cho tàu bay và tính mạng con người.
a. Sai
b. Đúng
Đáp án: b. Đúng
Câu 12: Cảng hàng không là gì?
a. Cảng hàng không là sân bay.
b. Cảng hàng không là một khu vực xác định, bao gồm sân bay và các công trình, trang thiết bị phục vụ hoạt động hàng không.
c. Cảng hàng không là nơi có các công trình, trang thiết bị phục vụ hoạt động hàng không.
d. Cảng hàng không là khu vực xác định trên mặt đất, mặt nước thuộc cảng hàng không để bảo đảm cho tàu bay cất cánh, hạ cánh và di chuyển.
Đáp án: b. Cảng hàng không là một khu vực xác định, bao gồm sân bay và các công trình, trang thiết bị phục vụ hoạt động hàng không.
Câu 13: Sân bay là gì?
a. Là cảng hàng không.
b. Là một khu vực xác định, bao gồm sân bay và các công trình, trang thiết bị phục vụ hoạt động hàng không.
c. Là khu vực xác định trên mặt đất, mặt nước thuộc cảng hàng không để bảo đảm cho tàu bay cất cánh, hạ cánh và di chuyển.
Đáp án: c. Là khu vực xác định trên mặt đất, mặt nước thuộc cảng hàng không để bảo đảm cho tàu bay cất cánh, hạ cánh và di chuyển.
Câu 14: Cảng vụ hàng không trực thuộc cơ quan nào?
a. Cảng vụ hàng không là cơ quan trực thuộc Nhà chức trách hàng không Việt Nam.
b. Cảng vụ hàng không là cơ quan trực thuộc Nhà chức trách an ninh hàng không Việt Nam.
c. Cảng vụ hàng không là cơ quan trực thuộc Hãng hàng không.
d. Cảng vụ hàng không là cơ quan trực thuộc Người khai thác cảng hàng không.
Đáp án: a. Cảng vụ hàng không là cơ quan trực thuộc Nhà chức trách hàng không Việt Nam.
Câu 15: Hành vi nào sau đây không phải là hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng?
a. Cưỡng đoạt trái phép tàu bay.
b. Phá hủy tàu bay đang khai thác.
c. Bắt giữ con tin trong tàu bay hoặc tại cảng hàng không.
d. Buôn lậu kim loại quý bằng đường hàng không.
Đáp án: d. Buôn lậu kim loại quý bằng đường hàng không.
Câu 16: Hành vi nào sau đây là hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng?
a. Xâm nhập bằng vũ lực vào tàu bay, cảng hàng không và công trình, trang thiết bị hàng không dân dụng.
b. Cố ý thực hiện hành vi vi phạm pháp luật uy hiếp đến an toàn khai thác tàu bay; khai thác cảng hàng không; bảo đảm hoạt động bay.
c. Cung cấp thông tin sai đến mức uy hiếp an toàn của tàu bay đang bay hoặc trên mặt đất; an toàn của hành khách, tổ bay, nhân viên mặt đất hoặc người tại cảng hàng không và công trình, trang thiết bị hàng không dân dụng.
d. Đưa vật phẩm nguy hiểm vào tàu bay, cảng hàng không và khu vực hạn chế khác cho mục đích phạm tội.
e. Cả a, b, c và d đều đúng.
Đáp án: e. Cả a, b, c và d đều đúng.
Câu 17: Nhà chức trách an ninh hàng không Việt Nam trực thuộc cơ quan nào?
a. Là cơ quan thuộc Bộ Công an.
b. Là cơ quan thuộc Bộ Xây dựng.
c. Là cơ quan thuộc Bộ Quốc phòng.
Đáp án: a. Là cơ quan thuộc Bộ Công an.
Câu 18: Đối tượng chịu sự điều chỉnh của Nghị Định xử phạt vi phạm hành chính trong lĩnh vực hàng không dân dụng bao gồm:
a. Cá nhân, tổ chức Việt Nam có hành vi vi phạm hành chính trong lĩnh vực hàng không dân dụng trong lãnh thổ Việt Nam, trên tàu bay đăng ký quốc tịch Việt Nam.
b. Cá nhân, tổ chức nước ngoài có hành vi vi phạm hành chính trong lĩnh vực hàng không dân dụng trong lãnh thổ Việt Nam, trên tàu bay đăng ký quốc tịch Việt Nam
c. Câu a, b đúng.
d. Câu a, b sai.
Đáp án: c. Câu a, b đúng.
Câu 19: Hình thức xử phạt chính đối với mỗi hành vi vi phạm hành chính trong lĩnh vực hàng không dân dụng là:
a. Cảnh cáo.
b. Phạt tiền.
c. Phạt tù.
d. Cả a, b và c đúng.
e. Chỉ a và b đúng.
Đáp án: e. Chỉ a và b đúng.
Câu 20: Ngoài các hình thức xử phạt chính, tùy theo tính chất, mức độ vi phạm, cá nhân, tổ chức có hành vi vi phạm hành chính trong lĩnh vực hàng không dân dụng có thể bị áp dụng các hình thức xử phạt bổ sung.
a. Đúng.
b. Sai.
Đáp án: a.
Câu 21: Ngoài hình thức xử phạt chính, xử phạt bổ sung, cá nhân, tổ chức vi phạm hành chính trong lĩnh vực hàng không dân dụng còn có thể bị áp dụng một hoặc nhiều biện pháp khắc phục hậu quả.
a. Đúng.
b. Sai.
Đáp án: a. Đúng.
Câu 22: Mục đích chính của công ước Chicago 1944 là gì?
a. Thúc đẩy sự phát triển của ngành Hàng không dân dụng quốc tế.
b. Tăng cường sự hợp tác hữu nghị giữa các dân tộc trên thế giới.
c. Bảo đảm phát triển an ninh trật tự có hiệu quả và bình đẳng dịch vụ vận chuyển hàng không quốc tế.
d. Tất cả đều đúng.
Đáp án: d. Tất cả đều đúng.
Câu 23: Theo Luật Hàng không dân dụng Việt Nam số 130/2025/QH15, tàu bay được xác định là đang bay được tính từ thời điểm nào?
a. Từ thời điểm tàu bay rời khỏi mặt đất đến thời điểm tàu bay hạ cánh.
b. Từ thời điểm mà tất cả các cánh cửa ngoài được đóng lại sau khi hoàn thành xếp tải đến thời điểm mà bất kỳ cửa ngoài nào được mở ra để dỡ tải.
c. Từ thời điểm tàu bay nổ máy để cất cánh cho đến thời điểm tắt máy sau khi hạ cánh.
d. Cả a, b và c đều sai.
Đáp án: c. Từ thời điểm tàu bay nổ máy để cất cánh cho đến thời điểm tắt máy sau khi hạ cánh.
Câu 24: Đối tượng nào sau đây có thẩm quyền xử phạt vi phạm hành chính trong lĩnh vực hàng không dân dụng:
a. Giám đốc Cảng vụ hàng không; Trưởng đại diện Cảng vụ hàng không.
b. Chủ tịch Ủy ban nhân dân cấp xã, tỉnh; Lực lượng Công an nhân dân.
c. Giám đốc cảng hàng không.
d. Cả a, b và c đều đúng.
e. Chỉ a và b đúng.
Đáp án: e. Chỉ a và b đúng.
Câu 25: Cơ quan nào có thẩm quyền cấp thẻ, giấy phép kiểm soát an ninh hàng không và chứng nhận đào tạo, chứng chỉ năng lực, giấy phép liên quan đến an ninh hàng không?
a. Nhà chức trách hàng không Việt Nam.
b. Nhà chức trách an ninh hàng không Việt Nam.
c. Cảng vụ hàng không.
d. Người khai thác cảng hàng không.
e. Hãng hàng không.
Đáp án: b. Nhà chức trách an ninh hàng không Việt Nam.
Câu 26: Cảng hàng không được sử dụng phục vụ hàng không chung, vận tải hàng không chuyên dùng hoặc vận tải hàng không thương mại không thường lệ là:
a. Cảng hàng không quốc tế.
b. Cảng hàng không nội địa.
c. Cảng hàng không chuyên dùng.

        // 2. PARSE DATA TỪ RAW TEXT
        let allQuestions = [];
        
        function parseRawData() {
            // Tách các khối câu hỏi dựa vào "Câu X:"
            const blocks = rawTextData.split(/Câu \d+:/).filter(b => b.trim() !== '');
            
            allQuestions = blocks.map(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l !== '');
                if (lines.length === 0) return null;
                
                const questionText = lines[0];
                const options = [];
                let correctStr = '';
                
                for(let i = 1; i < lines.length; i++) {
                    if (lines[i].startsWith('Đáp án:')) {
                        correctStr = lines[i].replace('Đáp án:', '').trim();
                    } else if (/^[a-e]\./i.test(lines[i])) {
                        options.push(lines[i]);
                    }
                }
                
                // Xác định index của đáp án đúng dựa vào ký tự đầu (a, b, c, d...)
                let correctIndex = 0;
                const match = correctStr.match(/^([a-e])\./i);
                if (match) {
                    const char = match[1].toLowerCase();
                    correctIndex = options.findIndex(opt => opt.toLowerCase().startsWith(char + '.'));
                    if(correctIndex === -1) correctIndex = 0; // fallback
                }

                return {
                    question: questionText,
                    options: options,
                    correctIndex: correctIndex
                };
            }).filter(q => q !== null);
        }

        // 3. LOGIC APP (Variables)
        let currentQuiz = [];
        let timerInterval;
        let seconds = 0;
        let isSubmitted = false;
        const NUM_QUESTIONS = 40;
        const HIGH_SCORE_KEY = 'hkdd_highscore';
        
        // FLAG BẮT BUỘC: ĐỂ SỬA LỖI TAB TRẮNG
        let isReviewRendered = false; 

        // 4. LOGIC TÌM KIẾM & HIGHLIGHT (Xử lý tiếng Việt không dấu)
        function removeAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
        }

        function highlightText(text, keyword) {
            if (!keyword) return text;
            const normalizedText = removeAccents(text).toLowerCase();
            const normalizedKeyword = removeAccents(keyword).toLowerCase();
            if (!normalizedKeyword) return text;

            let result = '';
            let currentIndex = 0;
            let matchIndex = normalizedText.indexOf(normalizedKeyword, currentIndex);

            if (matchIndex === -1) return text;

            while (matchIndex !== -1) {
                result += text.substring(currentIndex, matchIndex);
                // Bọc thẻ mark vào phần text gốc trùng khớp
                result += `<mark class="bg-yellow-300 text-black px-0.5 rounded font-medium">` + text.substring(matchIndex, matchIndex + keyword.length) + `</mark>`;
                currentIndex = matchIndex + keyword.length;
                matchIndex = normalizedText.indexOf(normalizedKeyword, currentIndex);
            }
            result += text.substring(currentIndex);
            return result;
        }

        // 5. HIỂN THỊ ĐIỂM CAO
        function updateHighScoreDisplay() {
            const high = localStorage.getItem(HIGH_SCORE_KEY) || 0;
            document.getElementById('high-score').textContent = `Điểm cao: ${high}/${NUM_QUESTIONS}`;
        }

        // 6. LOGIC TIMER
        function startTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                seconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }
        
        function getFormattedTime() {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // 7. KHỞI TẠO BÀI THI (THI THỬ)
        function generateQuiz() {
            // Xáo trộn mảng câu hỏi
            const shuffledQuestions = [...allQuestions].sort(() => 0.5 - Math.random());
            currentQuiz = shuffledQuestions.slice(0, NUM_QUESTIONS);
            
            // LƯU Ý: Không xáo trộn mảng options bên trong mỗi câu hỏi (theo yêu cầu: "không trộn thứ tự đáp án a b c d")

            const container = document.getElementById('quiz-container');
            
            let html = '';
            currentQuiz.forEach((q, qIndex) => {
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="flex items-start space-x-2 p-1.5 rounded-md cursor-pointer hover:bg-gray-100 transition-colors border border-transparent" id="label-${qIndex}-${optIndex}">
                            <input type="radio" name="q-${qIndex}" value="${optIndex}" class="mt-0.5 w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm flex-1 leading-snug">${opt}</span>
                        </label>
                    `;
                });

                html += `
                    <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm" id="card-${qIndex}">
                        <div class="font-bold text-sm mb-2 text-gray-800">
                            <span class="text-blue-700 mr-1">Câu ${qIndex + 1}:</span>${q.question}
                        </div>
                        <div class="space-y-0.5">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // Reset UI states

            document.getElementById('btn-submit-top').classList.remove('hide');
            document.getElementById('btn-share-top').classList.add('hide');
            document.getElementById('bottom-controls').classList.remove('hide');
            
            startTimer();
            window.scrollTo(0, 0);
        }

        // 8. CHỨC NĂNG NỘP BÀI
        function submitQuiz() {
            if (isSubmitted) return;
            stopTimer();
            isSubmitted = true;
            
            let score = 0;
            
            currentQuiz.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`q-${qIndex}`);
                let selectedIndex = -1;
                
                // Khóa input và tìm câu trả lời
                radios.forEach(radio => {
                    radio.disabled = true;
                    if(radio.checked) selectedIndex = parseInt(radio.value);
                });

                const card = document.getElementById(`card-${qIndex}`);
                
                // Xử lý giao diện kết quả
                if (selectedIndex === q.correctIndex) {
                    score++;
                    // Đáp án đúng + Đã chọn
                    const correctLabel = document.getElementById(`label-${qIndex}-${q.correctIndex}`);
                    correctLabel.classList.add('bg-green-50', 'border-green-300', 'text-green-800', 'font-medium');
                    correctLabel.querySelector('span').innerHTML = `✔️ ` + correctLabel.querySelector('span').innerHTML;
                } else {
                    // Chọn sai
                    if (selectedIndex !== -1) {
                        const wrongLabel = document.getElementById(`label-${qIndex}-${selectedIndex}`);
                        wrongLabel.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
                        wrongLabel.querySelector('span').innerHTML = `✖️ ` + wrongLabel.querySelector('span').innerHTML;
                    }
                    // Bôi xanh đáp án đúng để học
                    const correctLabel = document.getElementById(`label-${qIndex}-${q.correctIndex}`);
                    correctLabel.classList.add('bg-green-50', 'border-green-300', 'text-green-800', 'font-medium');
                    correctLabel.querySelector('span').innerHTML = `✔️ ` + correctLabel.querySelector('span').innerHTML;
                }
            });

            // Cập nhật điểm cao
            const currentHighScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0');
            if (score > currentHighScore) {
                localStorage.setItem(HIGH_SCORE_KEY, score);
                updateHighScoreDisplay();
            }

            // Đổi giao diện
            document.getElementById('timer').textContent = `${score}/${NUM_QUESTIONS}`;
            document.getElementById('btn-submit-top').classList.add('hide');
            document.getElementById('btn-submit-bottom').classList.add('hide');
            document.getElementById('btn-share-top').classList.remove('hide');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast(`Hoàn thành! Bạn đạt ${score}/${NUM_QUESTIONS} điểm.`);
        }

                        const hlOpt = highlightText(opt, keyword);
                        if (oIndex === q.correctIndex) {
                            optionsHtml += `
                                <div class="p-1.5 bg-blue-50 border border-blue-200 text-blue-900 rounded-md font-medium text-sm flex items-start gap-1.5">
                                    <span class="mt-0.5 text-blue-600">✔️</span>
                                    <span class="flex-1 leading-snug">${hlOpt}</span>
                                </div>`;
                        } else {
                            optionsHtml += `
                                <div class="p-1.5 text-gray-500 text-sm flex items-start gap-1.5">
                                    <span class="mt-0.5 opacity-0">✔️</span>
                                    <span class="flex-1 leading-snug">${hlOpt}</span>
                                </div>`;
                        }
                    });

                    html += `
                        <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm">
                            <div class="font-bold text-sm mb-2 text-gray-800">
                                <span class="text-gray-400 mr-1">Câu ${index + 1}:</span>${hlQuestion}
                            </div>
                            <div class="space-y-1">
                                ${optionsHtml}
                            </div>
                        </div>
                    `;
                }
            });

            if(html === '') {
                html = '<div class="text-center text-gray-500 text-sm p-6 bg-white rounded-xl border">Không tìm thấy nội dung phù hợp.</div>';
            }
            container.innerHTML = html;
            isReviewRendered = true; // Set cờ hiệu đã render
        }

        function handleSearch() {
            const keyword = document.getElementById('search-input').value;
            renderReview(keyword);
        }

        // 12. LOGIC CHUYỂN TAB
        function switchTab(tabName) {
            const tabQuizBtn = document.getElementById('tab-quiz');
            const tabReviewBtn = document.getElementById('tab-review');
            const secQuiz = document.getElementById('section-quiz');
            const secReview = document.getElementById('section-review');

            if (tabName === 'quiz') {
                tabQuizBtn.className = 'flex-1 py-2.5 font-bold text-sm sm:text-base text-blue-600 border-b-2 border-blue-600 transition-colors';
                tabReviewBtn.className = 'flex-1 py-2.5 font-bold text-sm sm:text-base text-gray-400 border-b-2 border-transparent transition-colors hover:text-blue-500';
                secQuiz.classList.remove('hide');
                secReview.classList.add('hide');
            } else {
                tabReviewBtn.className = 'flex-1 py-2.5 font-bold text-sm sm:text-base text-blue-600 border-b-2 border-blue-600 transition-colors';
                tabQuizBtn.className = 'flex-1 py-2.5 font-bold text-sm sm:text-base text-gray-400 border-b-2 border-transparent transition-colors hover:text-blue-500';
                secReview.classList.remove('hide');
                secQuiz.classList.add('hide');

                // FIX BUG TAB TRẮNG: Sử dụng cờ hiệu boolean thay vì kiểm tra container innerHTML
                if (!isReviewRendered) {
                    renderReview();
                }
            }
        }

        // 13. TIỆN ÍCH TOAST MESSAGE
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hide');
            // Force reflow
            void toast.offsetWidth;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hide'), 300);
            }, 2500);
        }

        // 14. KHỞI CHẠY APP
        window.onload = () => {
            parseRawData();
            updateHighScoreDisplay();
            generateQuiz();
        };
    </script>
</body>
</html>
