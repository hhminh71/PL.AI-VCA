    /* --- CẤU HÌNH GIAO DIỆN VCA (ACV STYLE) --- */
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; display: flex; flex-direction: column;}
    
    /* Header */
    .vca-header {
        background: #0056b3; /* Xanh ACV */
        color: white;
        padding: 12px 20px;
        border-bottom: 4px solid #d4af37; /* Vàng Gold */

        flex-shrink: 0;
    }
    .vca-top { font-size: 11px; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }
    .vca-title { font-size: 18px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .vca-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}

    /* Main Container */
    .main-area { flex-grow: 1; position: relative; overflow: hidden; }
    
    /* Mindmap container - Full Size */
    .markmap { width: 100%; height: 100vh; }

    /* Footer */
    .vca-footer { 
        background: #e9ecef; color: #555; text-align: center; 
        padding: 5px; font-size: 11px; flex-shrink: 0; border-top: 1px solid #ddd;
    }

            <script type="text/template">
# VBHN 02/2026/VBHN-BXD
## I. QUY ĐỊNH CHUNG
- **Cơ sở pháp lý**
  - NĐ 162/2018/NĐ-CP
  - NĐ 123/2021/NĐ-CP
  - NĐ 17/2026/NĐ-CP (Mới)
- **Nguyên tắc phạt (Điều 3)**
  - Mức phạt trong NĐ là cho **Cá nhân** (trừ một số điều khoản đặc thù)
  - Phạt tiền **Tổ chức = 02 lần Cá nhân**
- **Thời hiệu (Điều 4a)**
  - **01 năm**: Vi phạm thông thường
  - **02 năm**: Xây dựng, Môi trường, Đất đai, Giá, Phí, Hàng cấm

## II. VI PHẠM VỀ TÀU BAY & KHAI THÁC
- **Quốc tịch & Đủ điều kiện bay (Điều 5, 6)**
  - **20 - 30 triệu**: Sai dấu hiệu quốc tịch/đăng ký
  - **30 - 50 triệu**: Không sơn/gắn dấu hiệu
  - **50 - 60 triệu**: Không có Giấy chứng nhận đăng ký
  - **80 - 100 triệu**: Không có Giấy chứng nhận đủ điều kiện bay
- **Khai thác Tàu bay (Điều 8)**
  - **1 - 3 triệu**: Không tuân hướng dẫn an toàn
  - **3 - 5 triệu**: Hút thuốc, dùng thiết bị điện tử sai quy định
  - **10 - 20 triệu**: Tự ý mở cửa thoát hiểm
  - **40 - 50 triệu**: Khai thác thương mại không phép

## III. CẢNG HÀNG KHÔNG & DỊCH VỤ (Trọng tâm)
- **Quản lý Cảng & Sân bay (Điều 9)**
  - **1 - 5 triệu**: Thả vật nuôi/chim, không mặc áo phản quang
  - **5 - 10 triệu**: Làm hư hại trang thiết bị, đào bới trái phép
  - **10 - 20 triệu**: Thi công không thông báo tin tức HK
  - **30 - 40 triệu**: Lấn chiếm đất, sử dụng đất sai mục đích
  - **40 - 50 triệu**: Khai thác cảng không có giấy chứng nhận
- **Cung cấp Dịch vụ (Điều 10)**
  - **3 - 5 triệu**: DV phi hàng không kém chất lượng, niêm yết giá sai
  - **5 - 10 triệu**: Bán hàng rong, vệ sinh kém, quảng cáo sai phép
  - **30 - 40 triệu**: Kinh doanh hàng cấm, không có giấy phép DVHK
- **Hoạt động của Phương tiện (Điều 11)**
  - **1 - 3 triệu**: Không bật đèn, chở quá người
  - **3 - 5 triệu**: Chạy quá tốc độ, không giữ khoảng cách
  - **5 - 10 triệu**: Đi sai luồng tuyến, phương tiện không đủ chuẩn
  - **10 - 20 triệu**: Chạy ngược chiều, vào khu vực cấm
  - **20 - 30 triệu**: Phương tiện hết hạn kiểm định/không giấy phép

## IV. AN NINH, AN TOÀN & MÔI TRƯỜNG
- **An ninh Hàng không (Điều 25, 26)**
  - **Cảnh cáo / 500k - 1tr**: Đeo thẻ sai quy định
  - **3 - 5 triệu**: Dùng thẻ người khác, gây rối trật tự
  - **7 - 10 triệu**: Xâm nhập khu hạn chế, hành hung nhân viên/hành khách
  - **10 - 15 triệu**: Xâm nhập tàu bay, mang vũ khí thô sơ
  - **20 - 30 triệu**: Dọa bom, đưa chất nổ lên tàu bay
- **Nhân viên Hàng không (Điều 16)**
  - **500k - 1 triệu**: Quên mang bằng lái/giấy sức khỏe
  - **5 - 10 triệu**: Vi phạm nồng độ cồn (trong hơi thở/máu), ma túy
- **Môi trường & PCCC (Điều 15, 28)**
  - **500k - 1 triệu**: Hút thuốc sai nơi quy định (tại Cảng)
  - **3 - 5 triệu**: Vứt rác bừa bãi
  - **5 - 10 triệu**: Đốt lửa, để vật liệu nổ sai quy định

## V. THẨM QUYỀN XỬ PHẠT (Chương III)
- **Giám đốc Cảng vụ Hàng không**
  - Phạt tiền đến **50.000.000 đ**
  - Tước giấy phép, đình chỉ hoạt động
  - Tịch thu tang vật
- **Thanh tra Hàng không**
  - Chánh Thanh tra: Đến **80.000.000 đ**
  - Trưởng đoàn thanh tra: Đến **50.000.000 đ**
- **Cục trưởng Cục HKVN**
  - Phạt tiền đến **100.000.000 đ**
  - Tước giấy phép, đình chỉ hoạt động
