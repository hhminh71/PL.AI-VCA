a. Thành viên liên danh A bị cấm tham gia hoạt động đấu thầu từ 03 năm đến 05 năm
b. Tất cả thành viên trong liên danh A-B bị cấm tham gia hoạt động đấu thầu từ 03 năm đến 05 năm
c. Thành viên liên danh A bị cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm
d. Tất cả thành viên trong liên danh A-B bị cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm
Đáp án đúng: B
Câu 169: Nhà thầu liên danh A-B gồm 2 thành viên là nhà thầu A và nhà thầu B. Trong đó nhà thầu A có hành vi vi phạm dẫn đến bị cấm tham gia hoạt động đấu thầu thì việc cấm tham gia hoạt động đấu thầu được xử lý như thế nào?
a. Thành viên liên danh A bị cấm tham gia hoạt động đấu thầu từ 03 năm đến 05 năm
b. Tất cả thành viên trong liên danh A-B bị cấm tham gia hoạt động đấu thầu từ 03 năm đến 05 năm
c. Thành viên liên danh A bị cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm
d. Tất cả thành viên trong liên danh A-B bị cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm
Đáp án đúng: A
Câu 170: Trường hợp nhà thầu bị đánh giá về uy tín khi thực hiện hành vi: được lựa chọn trúng thầu nhưng không tiến hành hoặc từ chối tiến hành hoàn thiện hợp đồng hoặc không ký kết hợp đồng thì khi tham gia gói thầu khác, nhà thầu sẽ bị bất lợi như thế nào?
a. Đối với gói thầu hàng hóa, xây lắp, phi tư vấn, hỗn hợp, nhà thầu bị đánh giá về uy tín phải nộp gấp 3 lần bảo đảm dự thầu trong vòng 03 năm kể từ lần cuối cùng thực hiện hành vi
b. Đối với gói thầu tư vấn, thông tin uy tín này sẽ được sử dụng để đánh giá về kỹ thuật
c. Bị đưa vào xem xét, đánh giá về kỹ thuật trong quá trình lựa chọn nhà thầu đối với gói thầu xây lắp, phi tư vấn, hàng hóa, hỗn hợp
d. Đáp án B và C đều đúng
Đáp án đúng: B
Câu 171: Trong gói thầu dịch vụ tư vấn, thông tin về uy tín của nhà thầu được sử dụng để?
a. Đánh giá về năng lực, kinh nghiệm
b. Đánh giá tư cách hợp lệ của nhà thầu
c. Đánh giá về kỹ thuật
d. Loại nhà thầu đã bị đánh giá về uy tín
Đáp án đúng: B
Câu 172: Đối với việc giải quyết kiến nghị về các vấn đề trước khi có thông báo kết quả lựa chọn nhà thầu, cá nhân, đơn vị nào sau đây có trách nhiệm giải quyết kiến nghị?
a. Chủ đầu tư, người có thẩm quyền
b. Chủ đầu tư, Hội đồng giải quyết kiến nghị
c. Người có thẩm quyền, Hội đồng giải quyết kiến nghị
d. Chủ đầu tư, tổ chuyên gia
Đáp án đúng: A
Câu 173: Đối với việc giải quyết kiến nghị về kết quả lựa chọn nhà thầu, cá nhân, đơn vị nào sau đây có trách nhiệm giải quyết kiến nghị?
a. Chủ đầu tư, người có thẩm quyền
b. Chủ đầu tư, Hội đồng giải quyết kiến nghị
c. Người có thẩm quyền, Hội đồng giải quyết kiến nghị
d. Chủ đầu tư, Hội đồng tư vấn giải quyết kiến nghị
Đáp án đúng: B
Câu 174: Trường hợp đang trong quá trình giải quyết kiến nghị mà nhà thầu gửi đơn khiếu nại thì việc giải quyết kiến nghị được xử lý thế nào?
a. Tiếp tục giải quyết kiến nghị
b. Chấm dứt ngay việc giải quyết kiến nghị
c. Tạm dừng việc giải quyết kiến nghị đến khi có kết quả giải quyết khiếu nại
d. Tất cả phương án trên đều sai
Đáp án đúng: B
Câu 175: Chi phí giải quyết kiến nghị được nhà thầu nộp cho chủ thể nào sau đây?
a. Chủ tịch Hội đồng tư vấn giải quyết kiến nghị
b. Bộ phận thường trực giúp việc cho Chủ tịch Hội đồng giải quyết kiến nghị
c. Chủ đầu tư
d. Người có thẩm quyền
Đáp án đúng: B
Câu 176: Trường hợp nào sau đây nhà thầu không được hoàn trả chi phí giải quyết kiến nghị?
a. Kiến nghị của nhà thầu được kết luận là đúng
b. Một hoặc các nội dung kiến nghị của nhà thầu được kết luận là không đúng
c. Nhà thầu rút đơn kiến nghị trong quá trình giải quyết kiến nghị
d. Phương án B và C đều đúng
Đáp án đúng: D
Câu 177: Đối với kiến nghị về kết quả lựa chọn nhà thầu, Hội đồng giải quyết kiến nghị phải có văn bản giải quyết kiến nghị trong thời hạn bao nhiêu ngày kể từ ngày Hội đồng được thành lập?
a. 25 ngày
b. 30 ngày
c. 35 ngày
d. 20 ngày
Đáp án đúng: B
Câu 178: Phương án nào sau đây là đúng trong việc giải quyết kiến nghị đối với gói thầu sử dụng vốn sản xuất kinh doanh của doanh nghiệp nhà nước?
a. Hội đồng giải quyết kiến nghị do Sở Tài chính thành lập có trách nhiệm giải quyết kiến nghị cho gói thầu
b. Hội đồng giải quyết kiến nghị do Bộ trưởng Bộ Tài chính thành lập có trách nhiệm giải quyết kiến nghị cho gói thầu
c. Người đứng đầu doanh nghiệp nhà nước tự ban hành điều kiện, quy trình về giải quyết kiến nghị trong đơn vị mình
d. Tất cả phương án A, B, C đều sai
Đáp án đúng: C
Câu 179: Đối với kiến nghị về các vấn đề trước khi có thông báo kết quả lựa chọn nhà thầu, trường hợp nhà thầu gửi đơn kiến nghị đồng thời đến người có thẩm quyền và chủ đầu tư thì chủ thể nào có trách nhiệm giải quyết kiến nghị?
a. Người có thẩm quyền
b. Chủ đầu tư
c. Bộ phận thường trực
d. Hội đồng giải quyết kiến nghị
Đáp án đúng: B
Câu 180: Đối với kiến nghị về kết quả lựa chọn nhà thầu, trường hợp nhà thầu gửi đơn kiến nghị đồng thời đến bộ phận thường trực giúp việc Hội đồng giải quyết kiến nghị và chủ đầu tư thì chủ thể nào có trách nhiệm giải quyết kiến nghị?
a. Người có thẩm quyền
b. Chủ đầu tư
c. Bộ phận thường trực
d. Hội đồng giải quyết kiến nghị
Đáp án đúng: D
Câu 181: Đơn vị sự nghiệp công lập (tự chủ chi thường xuyên và chi đầu tư) thuộc tỉnh B tổ chức đấu thầu cho dự án sử dụng vốn ngân sách nhà nước thì Giám đốc Sở Tài chính Tỉnh B có trách nhiệm thành lập Hội đồng giải quyết kiến nghị cho gói thầu có kiến nghị tại Dự án này hay không?
a. Có trách nhiệm thành lập
b. Không có trách nhiệm thành lập
c. Thành lập khi chủ tịch UBND tỉnh yêu cầu
d. Thành lập khi Giám đốc doanh nghiệp A đề nghị
Đáp án đúng: A
Câu 182: Hội đồng giải quyết kiến nghị có quyền thực hiện việc nào sau đây?
a. Hủy thầu
b. Yêu cầu chủ đầu tư tạm dừng ký kết hợp đồng
c. Yêu cầu nhà thầu, chủ đầu tư và các cơ quan liên quan cung cấp thông tin của gói thầu, dự án và các thông tin liên quan khác để thực hiện nhiệm vụ
d. Không công nhận kết quả lựa chọn nhà thầu
Đáp án đúng: C
Câu 183: Đối với kiến nghị về quá trình tổ chức lựa chọn nhà thầu (không phải kiến nghị về nội dung hồ sơ mời thầu), đơn kiến nghị phải là của chủ thể nào?
a. Cá nhân quan tâm đến gói thầu
b. Nhà thầu tham dự thầu
c. Cơ quan, tổ chức quan tâm đến gói thầu
d. Phương án B và C đều đúng
Đáp án đúng: D
Câu 184: Các tài liệu, thông tin nào sau đây trong việc giải quyết kiến nghị được công khai trên Hệ thống mạng đấu thầu quốc gia?
a. Nội dung kiến nghị kết quả lựa chọn nhà thầu
b. Văn bản giải quyết kiến nghị của chủ đầu tư
c. Văn bản giải quyết kiến nghị của người có thẩm quyền
d. Tất cả phương án trên đều đúng
Đáp án đúng: D
Câu 185: Nhà thầu có trách nhiệm nộp chi phí giải quyết kiến nghị trong thời hạn bao lâu kể từ ngày nhận được thông báo của bộ phận thường trực giúp việc cho Chủ tịch Hội đồng giải quyết kiến nghị?
a. 03 ngày làm việc
b. 02 ngày làm việc
c. 04 ngày làm việc
d. 05 ngày làm việc
Đáp án đúng: B
Câu 186: Trung tâm X là đơn vị sự nghiệp công lập tự chủ chi thường xuyên thuộc tỉnh A tổ chức lựa chọn nhà thầu đối với gói thầu mua sắm hàng hóa sử dụng nguồn thu hợp pháp (không sử dụng ngân sách nhà nước), trường hợp nhà thầu có kiến nghị về hồ sơ mời thầu gửi cả người có thẩm quyền và chủ đầu tư của gói thầu thì việc giải quyết kiến nghị được thực hiện theo quy trình nào?
a. Chủ đầu tư thực hiện giải quyết kiến nghị theo quy trình giải quyết kiến nghị về các vấn đề trước khi có thông báo kết quả lựa chọn nhà thầu theo quy định của pháp luật về đấu thầu
b. Người có thẩm quyền giải quyết kiến nghị theo quy trình giải quyết kiến nghị về các vấn đề trước khi có thông báo kết quả lựa chọn nhà thầu theo quy định của pháp luật về đấu thầu
c. Thực hiện theo quy trình về giải quyết kiến nghị do người đứng đầu Trung tâm X ban hành trong đơn vị mình
d. Phương án A và B đều đúng
Đáp án đúng: C
Câu 187: Ông A là người đại diện hợp pháp của nhà thầu B ký đơn kiến nghị về kết quả lựa chọn nhà thầu. Trong trường hợp này, anh C là con đẻ của ông A có được tham gia là thành viên Hội đồng giải quyết kiến nghị hay không?
a. Không được tham gia
b. Được tham gia nếu đủ năng lực, kinh nghiệm
c. Được tham gia khi Chủ tịch Hội đồng giải quyết kiến nghị chấp thuận
d. Được tham gia khi người có thẩm quyền chấp thuận
Đáp án đúng: A
Câu 188: Đơn vị nào có trách nhiệm tiếp nhận và quản lý chi phí do nhà thầu có kiến nghị nộp?
a. Người có thẩm quyền
b. Chủ đầu tư
c. Bộ phận thường trực giúp việc cho Chủ tịch Hội đồng giải quyết kiến nghị
d. Tổ chuyên gia
Đáp án đúng: C
Câu 189: Gói thầu mua thuốc áp dụng phương thức một giai đoạn hai túi hồ sơ có giá gói thầu 100 tỷ đồng. Trong quá trình tham dự thầu, nhà thầu X không đạt về kỹ thuật có kiến nghị về kết quả lựa chọn nhà thầu của gói thầu gửi Hội đồng giải quyết kiến nghị (trong đơn kiến nghị nhà thầu nêu giá dự thầu của mình là 90 tỷ đồng). Chi phí giải quyết kiến nghị nhà thầu X phải nộp là?
a. Nhà thầu X phải nộp 25 triệu đồng
b. Nhà thầu X phải nộp 22,5 triệu đồng
c. Nhà thầu X phải nộp 20 triệu đồng
d. Nhà thầu X phải nộp 15 triệu đồng
Đáp án đúng: A
Câu 190: Trường hợp hồ sơ mời thầu cho phép nhà thầu đề xuất biện pháp thi công khác với biện pháp thi công nêu trong hồ sơ mời thầu thì phần sai khác giữa khối lượng công việc theo biện pháp thi công nêu trong hồ sơ mời thầu và khối lượng công việc theo biện pháp thi công do nhà thầu đề xuất được xem xét thế nào?
a. Bị hiệu chỉnh sai lệch, phần sai khác được tính là sai lệch thừa
b. Không bị hiệu chỉnh sai lệch, phần sai khác không được tính là sai lệch thừa
c. Bị hiệu chỉnh sai lệch, phần sai khác được tính là sai lệch thiếu
d. Không bị hiệu chỉnh sai lệch, phần sai khác không bị tính là sai lệch thiếu
Đáp án đúng: D
Câu 191: Trường hợp hồ sơ dự thầu có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) thấp khác thường thì chủ đầu tư có thể quy định giá trị bảo đảm thực hiện hợp đồng tối đa là bao nhiêu để đề phòng rủi ro?
a. 30% giá hợp đồng
b. 35% giá hợp đồng
c. 40% giá hợp đồng
d. 45% giá hợp đồng
Đáp án đúng: A
Câu 192: Đối với gói thầu chia phần, chủ đầu tư có thể phê duyệt kết quả lựa chọn nhà thầu cho từng phần hay không?
a. Không thể
b. Có thể nhưng phải bảo đảm điều kiện giá đề nghị trúng thầu không vượt giá gói thầu
c. Có thể nhưng phải bảo đảm tỷ lệ tiết kiệm tối thiểu 5%
d. Có thể nhưng phải bảo đảm điều kiện giá đề nghị trúng thầu không vượt giá của phần đó trong giá gói thầu
Đáp án đúng: D
Câu 193: Đối với gói thầu chia phần, trường hợp một phần của gói thầu không có nhà thầu tham dự thầu thì chủ đầu tư xử lý thế nào?
a. Tách phần đó ra thành gói thầu riêng biệt để tổ chức lựa chọn nhà thầu theo quy định
b. Hủy thầu
c. Đàm phán với nhà thầu trúng thầu của phần khác để thực hiện
d. Phương án B và C đều đúng
Đáp án đúng: A
Câu 194: Thẩm quyền xử lý tình huống phức tạp trong đấu thầu?
a. Chủ đầu tư quyết định xử lý tình huống sau khi có ý kiến của người có thẩm quyền
b. Người có thẩm quyền quyết định xử lý tình huống sau khi có ý kiến của Tổ chuyên gia
c. Người có thẩm quyền quyết định xử lý tình huống sau khi có ý kiến của chủ đầu tư
d. Người có thẩm quyền quyết định xử lý tình huống sau khi có ý kiến của chủ đầu tư và Tổ chuyên gia
Đáp án đúng: A
Câu 195: Trường hợp một hoặc một số thành viên liên danh vi phạm hợp đồng, không còn năng lực để tiếp tục thực hiện hợp đồng, làm ảnh hưởng nghiêm trọng đến tiến độ, chất lượng, hiệu quả của gói thầu thì việc đánh giá uy tín của nhà thầu trong việc thực hiện hợp đồng được xử lý như nào?
a. Nhà thầu liên danh vi phạm hợp đồng bị coi là không hoàn thành hợp đồng và bị chủ đầu tư đăng tải thông tin nhà thầu liên danh vi phạm hợp đồng trên Hệ thống mạng đấu thầu quốc gia
b. Chỉ một hoặc một số thành viên liên danh vi phạm hợp đồng bị coi là không hoàn thành hợp đồng và bị chủ đầu tư đăng tải thông tin thành viên liên danh vi phạm hợp đồng trên Hệ thống mạng đấu thầu quốc gia
c. Chỉ một hoặc một số thành viên liên danh vi phạm hợp đồng bị coi là không hoàn thành hợp đồng và bị bên mời thầu đăng tải thông tin thành viên liên danh vi phạm hợp đồng trên Hệ thống mạng đấu thầu quốc gia
d. Nhà thầu liên danh vi phạm hợp đồng bị coi là không hoàn thành hợp đồng và bị bên mời thầu đăng tải thông tin nhà thầu liên danh vi phạm hợp đồng trên Hệ thống mạng đấu thầu quốc gia
Đáp án đúng: B
Câu 196: Trường hợp phải chấm dứt hợp đồng với nhà thầu vi phạm hợp đồng để thay thế nhà thầu mới thì phần công việc chưa thực hiện được áp dụng hình thức chỉ định thầu cho nhà thầu khác với giá trị được tính như nào?
a. Bằng giá trị ghi trong hợp đồng trừ đi giá trị của phần công việc đã thực hiện, được nghiệm thu trước đó
b. Bằng giá trị ghi trong hợp đồng được cập nhật giá tại thời điểm áp dụng hình thức chỉ định thầu trừ đi giá trị của phần công việc đã thực hiện, được nghiệm thu trước đó
c. Bằng giá trị của phần công việc còn lại được cập nhật giá tại thời điểm áp dụng hình thức chỉ định thầu
d. Bằng giá trị ghi trong hợp đồng trừ đi giá trị của phần công việc đã thực hiện trước đó theo dự toán được duyệt
Đáp án đúng: A
Câu 197: Đối với nhà thầu liên danh, trường hợp trong quá trình thực hiện hợp đồng cần đẩy nhanh tiến độ thực hiện so với hợp đồng đã ký (cần sửa đổi hợp đồng) thì cần thực hiện như thế nào?
a. Các thành viên liên danh thỏa thuận, điều chỉnh về phạm vi công việc, tiến độ được rút ngắn và không phải thông báo cho chủ đầu tư
b. Các thành viên liên danh thỏa thuận, điều chỉnh về phạm vi công việc, tiến độ được rút ngắn và thông báo cho chủ đầu tư
c. Phải được người có thẩm quyền cho phép chủ đầu tư và nhà thầu thỏa thuận, điều chỉnh phạm vi công việc giữa các thành viên liên danh phù hợp với tiến độ hoặc tiến độ được rút ngắn
d. Chủ đầu tư và nhà thầu được thỏa thuận điều chỉnh phạm vi công việc giữa các thành viên liên danh phù hợp với tiến độ hoặc tiến độ được rút ngắn
Đáp án đúng: C
Câu 198: Trường hợp nhà thầu có nhân sự (ký kết hợp đồng lao động với nhà thầu tại thời điểm nhân sự thực hiện hành vi vi phạm) bị cơ quan điều tra kết luận có hành vi vi phạm quy định về đấu thầu gây hậu quả nghiêm trọng theo quy định pháp luật về hình sự nhằm mục đích cho nhà thầu trúng thầu nhưng nhân sự của nhà thầu chưa bị Tòa án kết án hoặc nhà thầu chưa bị người có thẩm quyền ra quyết định cấm tham gia hoạt động đấu thầu thì tại thời điểm này nhà thầu có được tham dự thầu hay không?
a. Nhà thầu không được tham dự thầu
b. Hồ sơ dự thầu, hồ sơ đề xuất của nhà thầu sẽ được mở nhưng không được xem xét, đánh giá
c. Hồ sơ dự thầu, hồ sơ đề xuất của nhà thầu không được mở thầu và trả lại theo nguyên trạng
d. Nhà thầu vẫn được tiếp tục tham dự thầu
Đáp án đúng: D
Câu 199: Trường hợp nào là một trong những điều kiện để chủ đầu tư chấp thuận đề xuất của nhà thầu trong quá trình thực hiện hợp đồng về việc thay đổi các hàng hóa có phiên bản sản xuất, năm sản xuất mới hơn so với hàng hóa ghi trong hợp đồng?
a. Hàng hóa thay thế có tính năng kỹ thuật, cấu hình, thông số và các yêu cầu kỹ thuật khác tương đương hoặc tốt hơn hàng hóa ghi trong hợp đồng nhưng bắt buộc phải cùng hãng sản xuất và xuất xứ
b. Hàng hóa thay thế có tính năng kỹ thuật, cấu hình, thông số và các yêu cầu kỹ thuật khác tương đương hoặc tốt hơn hàng hóa ghi trong hợp đồng, phải cùng hãng sản xuất nhưng không bắt buộc cùng xuất xứ
c. Hàng hóa thay thế có tính năng kỹ thuật, cấu hình, thông số và các yêu cầu kỹ thuật khác tương đương hoặc tốt hơn hàng hóa ghi trong hợp đồng, phải cùng xuất xứ nhưng không bắt buộc cùng hãng sản xuất
d. Hàng hóa thay thế có tính năng kỹ thuật, cấu hình, thông số và các yêu cầu kỹ thuật khác tương đương hoặc tốt hơn hàng hóa ghi trong hợp đồng nhưng không bắt buộc cùng hãng sản xuất và cùng xuất xứ
Đáp án đúng: A
Câu 200: Trường hợp gói thầu có tính chất đặc thù và áp dụng hình thức chỉ định thầu hoặc lựa chọn nhà thầu trong trường hợp đặc biệt, nhà thầu nước ngoài có yêu cầu ràng buộc chỉ ký hợp đồng khi không phải đăng ký trên Hệ thống mạng đấu thầu quốc gia thì chủ đầu tư xử lý như thế nào?
a. Không cần yêu cầu nhà thầu nước ngoài đăng ký khi đăng tải kết quả lựa chọn nhà thầu
b. Yêu cầu nhà thầu nước ngoài đăng ký khi đăng tải kết quả lựa chọn nhà thầu
c. Nhà thầu không được chấp nhận và bị loại
d. Hủy thầu
Đáp án đúng: A
Câu 201: Đối với trường hợp hủy thầu thì phải thực hiện giải pháp nào sau đây?
a. Phải điều chỉnh thời gian bắt đầu tổ chức lựa chọn nhà thầu trong kế hoạch lựa chọn nhà thầu
b. Phải điều chỉnh thời gian thực hiện gói thầu trong kế hoạch lựa chọn nhà thầu
c. Không phải điều chỉnh thời gian bắt đầu tổ chức lựa chọn nhà thầu trong kế hoạch lựa chọn nhà thầu
d. Tất cả các đáp án trên đều không đúng
Đáp án đúng: C
Câu 202: Hủy thầu được thực hiện trong thời gian nào?
a. Từ ngày có thời điểm đóng thầu đến khi có kết quả lựa chọn nhà thầu
b. Từ ngày phát hành hồ sơ mời sơ tuyển, hồ sơ mời quan tâm, hồ sơ mời thầu, hồ sơ yêu cầu đến trước khi ký kết hợp đồng, thỏa thuận khung đối với mua sắm tập trung
c. Từ ngày có thời điểm đóng thầu đến khi ký kết hợp đồng, thỏa thuận khung đối với mua sắm tập trung
d. Từ ngày phát hành hồ sơ mời sơ tuyển, hồ sơ mời quan tâm, hồ sơ mời thầu, hồ sơ yêu cầu kể cả sau khi đã ký hợp đồng
Đáp án đúng: B
Câu 203: Đối với gói thầu tổ chức lựa chọn nhà thầu qua mạng, trường hợp trong quá trình đánh giá E-HSDT mà chưa có kết quả lựa chọn nhà thầu, nhà thầu có tên trong biên bản mở thầu bị khóa tài khoản theo quy định của pháp luật về đấu thầu thì chủ đầu tư xử lý như thế nào?
a. Yêu cầu nhà thầu thực hiện các thủ tục để mở khóa tài khoản làm cơ sở xem xét, đánh giá E-HSDT của nhà thầu
b. Tiếp tục xem xét, đánh giá E-HSDT của nhà thầu
c. Không tiếp tục xem xét, đánh giá E-HSDT của nhà thầu
d. Tiếp tục xem xét, đánh giá E-HSDT của nhà thầu và yêu cầu nhà thầu thực hiện các thủ tục để mở khóa tài khoản trước khi phê duyệt kết quả lựa chọn nhà thầu
Đáp án đúng: C
Câu 204: Đối với gói thầu xây lắp, dịch vụ phi tư vấn, dịch vụ tư vấn áp dụng đấu thầu trước quy định tại Điều 42 của Luật Đấu thầu, trường hợp dự án được phê duyệt có các nội dung dẫn đến tăng giá gói thầu (hoặc tăng dự toán nếu dự toán được phê duyệt sau khi phê duyệt kế hoạch lựa chọn nhà thầu) từ 30% trở lên hoặc thay đổi tiêu chuẩn đánh giá quan trọng về kỹ thuật hoặc thay đổi cấp công trình quy định trong hồ sơ mời thầu đã phát hành thì chủ đầu tư xử lý như thế nào?
a. Tiếp tục đánh giá hồ sơ dự thầu trong trường hợp đã mở thầu
b. Được sửa đổi và phát hành bổ sung hồ sơ mời thầu trong trường hợp chưa mở thầu
c. Được sửa đổi, bổ sung khối lượng công việc, hoàn thiện để ký kết hợp đồng với nhà thầu
d. Hủy thầu
Đáp án đúng: D
Câu 205: Trường hợp nhà thầu trúng thầu không tiến hành hoàn thiện, ký kết hợp đồng hoặc tại thời điểm ký kết hợp đồng, nhà thầu trúng thầu không đáp ứng yêu cầu về năng lực kỹ thuật, tài chính quy định tại khoản 2 Điều 66 của Luật Đấu thầu thì chủ đầu tư xử lý như thế nào trong trường hợp này?
a. Hủy quyết định phê duyệt kết quả lựa chọn nhà thầu trúng thầu
b. Hủy thầu
c. Không công nhận kết quả lựa chọn nhà thầu
d. Đình chỉ cuộc thầu
Đáp án đúng: A
Câu 206: Trường hợp nào sau đây, chủ đầu tư và nhà thầu liên danh được thỏa thuận điều chỉnh phạm vi công việc giữa các thành viên liên danh?
a. Khi một thành viên liên danh không muốn tiếp tục thực hiện phần việc đã cam kết
b. Khi chủ đầu tư thấy một thành viên trong liên danh thực hiện tốt nên muốn điều chuyển toàn bộ phần việc cho thành viên liên danh đó
c. Khi cần đẩy nhanh tiến độ thực hiện hợp đồng hoặc do điều kiện khách quan không phải lỗi của nhà thầu làm ảnh hưởng tiến độ
d. Khi một thành viên liên danh đề nghị chuyển nhượng phần việc để tiết kiệm chi phí
Đáp án đúng: C
Câu 207: Gói thầu EC có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá bằng 85% giá gói thầu thì chủ đầu tư có thể quy định giá trị bảo đảm thực hiện hợp đồng ở mức 15% hay không?
a. Không được quy định
b. Có thể quy định nhưng phải được sự đồng ý của nhà thầu
c. Chủ đầu tư quyết định để ngừa rủi ro cho quá trình thực hiện
d. Có thể quy định nhưng phải được người có thẩm quyền chấp thuận
Đáp án đúng: C
Câu 208: Đối với gói thầu hỗn hợp có yêu cầu đặc thù về kỹ thuật chỉ có một số nhà thầu đáp ứng yêu cầu của gói thầu áp dụng bước thương thảo hợp đồng, trường hợp nhà thầu xếp hạng thứ nhất (danh sách xếp hạng có 03 nhà thầu) không tiến hành thương thảo, không ký biên bản thương thảo, thương thảo không thành công thì chủ đầu tư thực hiện bước tiếp theo như thế nào?
a. Mời nhà thầu xếp hạng tiếp theo vào thương thảo hợp đồng
b. Hủy thầu
c. Cho phép các nhà thầu còn lại chào lại giá dự thầu
d. Mời nhà thầu xếp hạng tiếp theo vào hoàn thiện hợp đồng
Đáp án đúng: A
Câu 209: Đối với gói thầu xây lắp áp dụng đấu thầu quốc tế, trường hợp nhà thầu xếp thứ nhất có hồ sơ dự thầu không cân bằng (có đơn giá chào cao hơn đáng kể so với đơn giá tương ứng trong dự toán gói thầu ở các hạng mục công việc có các yêu cầu kỹ thuật đơn giản, dễ thực hiện, hạng mục công việc có khả năng phát sinh khối lượng ngoài khối lượng trong bảng giá dự thầu và có đơn giá chào thấp hơn đáng kể so với đơn giá tương ứng trong dự toán gói thầu ở các hạng mục công việc phức tạp, khó thực hiện) thì chủ đầu tư có thể xử lý thế nào?
a. Yêu cầu nhà thầu làm rõ bằng văn bản về các chi phí cấu thành giá dự thầu
b. Có thể quy định giá trị bảo đảm thực hiện hợp đồng lớn hơn 10% nhưng không quá 30% giá hợp đồng để đề phòng rủi ro
c. Mời nhà thầu chào lại giá
d. Phương án A và B đều đúng
Đáp án đúng: A
Câu 210: Trường hợp xí nghiệp X được tách ra khỏi pháp nhân theo quy định của pháp luật về dân sự thì nhà thầu tiếp nhận xí nghiệp X có được kế thừa năng lực, kinh nghiệm của xí nghiệp hay không?
a. Không được kế thừa năng lực, kinh nghiệm của xí nghiệp X
b. Được kế thừa năng lực, kinh nghiệm của xí nghiệp X
c. Chỉ được kế thừa về kinh nghiệm của xí nghiệp X
d. Chỉ được kế thừa về năng lực của xí nghiệp X
Đáp án đúng: B
Câu 211: Trong quá trình thực hiện hợp đồng của nhà thầu liên danh A-B, nhà thầu B không còn năng lực để tiếp tục thực hiện hợp đồng, làm ảnh hưởng nghiêm trọng đến tiến độ, chất lượng, hiệu quả của gói thầu. Trong trường hợp này, bảo đảm thực hiện hợp đồng của nhà thầu xử lý như thế nào?
a. Không tịch thu giá trị bảo đảm thực hiện hợp đồng của nhà thầu A-B
b. Tịch thu giá trị bảo đảm thực hiện hợp đồng của tất cả thành viên liên danh trong trường hợp phần công việc còn lại của các thành viên liên danh vi phạm hợp đồng được tách thành gói thầu riêng để lựa chọn nhà thầu
c. Chỉ tịch thu giá trị bảo đảm thực hiện hợp đồng của nhà thầu B nếu nhà thầu A có đủ năng lực, kinh nghiệm đảm nhận phần công việc còn lại của nhà thầu B
d. Phương án B và C đều đúng
Đáp án đúng: B
Câu 212: Đối với gói thầu mua sắm thiết bị y tế, tổ chức đấu thầu rộng rãi qua mạng gói thầu mua sắm thiết bị y tế, trường hợp nhà thầu dự thầu không đề xuất cụ thể ký mã hiệu, nhãn hiệu, xuất xứ, hãng sản xuất thì xử lý như thế nào?
a. Chủ đầu tư yêu cầu nhà thầu bổ sung, làm rõ E-HSDT
b. Chủ đầu tư tiếp tục đánh giá E-HSDT, trường hợp nhà thầu xếp thứ nhất thì yêu cầu nhà thầu bổ sung thông tin để hoàn thiện hợp đồng
c. E-HSDT của nhà thầu bị đánh giá không đáp ứng và bị loại
d. Xin ý kiến người có thẩm quyền để xử lý tình huống trong đấu thầu
Đáp án đúng: C
Câu 213: Nhận định nào sau đây đúng về văn bản điện tử trên Hệ thống mạng đấu thầu quốc gia?
a. Văn bản điện tử trên Hệ thống có giá trị theo quy định của pháp luật về giao dịch điện tử, làm cơ sở đối chiếu, so sánh, xác thực thông tin phục vụ công tác đánh giá, thẩm định, thanh tra, kiểm tra, kiểm toán và giải ngân
b. Thời điểm gửi, nhận văn bản điện tử được xác định căn cứ theo thời gian thực ghi lại trên Hệ thống
c. Khi gửi hồ sơ thanh quyết toán đến Kho bạc Nhà nước, nhà thầu không phải cung cấp thông tin, tài liệu cho Kho bạc Nhà nước đối với các thông tin, tài liệu là văn bản điện tử trên Hệ thống
d. Cả 3 phương án trên đều đúng
Đáp án đúng: D
Câu 214: Tài khoản nghiệp vụ trên Hệ thống mạng đấu thầu quốc gia là gì?
a. Tài khoản do người sử dụng đăng ký và được phê duyệt trên Hệ thống mạng đấu thầu quốc gia
b. Tài khoản do Trung tâm Đấu thầu qua mạng quốc gia cấp phép theo quy định
c. Tài khoản do Tài khoản tham gia hệ thống tạo ra
d. Phương án A và B đều đúng
Đáp án đúng: C
Câu 215: Nhà thầu có trách nhiệm kê khai thông tin nào trên Hệ thống mạng đấu thầu quốc gia?
a. Thông tin về uy tín của nhà thầu trong việc tham dự thầu
b. Thông tin về vi phạm của nhà thầu
c. Thông tin về năng lực, kinh nghiệm của nhà thầu
d. Cả 3 phương án trên đều đúng
Đáp án đúng: C
Câu 216: Ai chịu trách nhiệm đăng tải thông tin chủ yếu của hợp đồng trên Hệ thống mạng đấu thầu quốc gia?
a. Bên mời thầu
b. Tổ chuyên gia
c. Tư vấn đấu thầu
d. Chủ đầu tư
Đáp án đúng: D
Câu 217: Trong đấu thầu qua mạng, nhà thầu tư vấn đấu thầu bị khoá tài khoản trong vòng 06 tháng khi thực hiện hành vi nào sau đây?
a. Tham gia vào quá trình lập và đánh giá E-HSMT
b. Tham gia vào quá trình thẩm định hồ sơ mời thầu và kết quả lựa chọn nhà thầu
c. Thay chủ đầu tư đăng tải các nội dung thuộc trách nhiệm đăng tải của chủ đầu tư
d. Đăng tải thông tin về năng lực, kinh nghiệm của mình trên Hệ thống mạng đấu thầu quốc gia
Đáp án đúng: C
Câu 218: Chủ đầu tư có trách nhiệm đăng tải thông tin chủ yếu của hợp đồng trên Hệ thống đấu thầu qua mạng quốc gia chậm nhất là?
a. 05 ngày làm việc kể từ ngày ký kết hợp đồng
b. 05 ngày làm việc kể từ ngày hợp đồng có hiệu lực
c. 05 ngày kể từ ngày hợp đồng có hiệu lực
d. 05 ngày làm việc kể từ ngày nhà thầu nộp bảo đảm thực hiện hợp đồng
Đáp án đúng: B
Câu 219: Danh sách nhà thầu có hành vi vi phạm và bị đánh giá về uy tín được đăng tải trên Hệ thống mạng đấu thầu quốc gia như thế nào?
a. Tổ chuyên gia đăng tải trong thời hạn 03 ngày làm việc kể từ ngày nhà thầu có hành vi vi phạm
b. Bên mời thầu đăng tải trong thời hạn 05 ngày làm việc kể từ ngày nhà thầu có hành vi vi phạm
c. Chủ đầu tư đăng tải trong thời hạn 07 ngày làm việc kể từ ngày nhà thầu có hành vi vi phạm
d. Người có thẩm quyền đăng tải trong thời hạn 05 ngày làm việc kể từ ngày nhà thầu có hành vi vi phạm
Đáp án đúng: C
Câu 220: Chủ thể nào sau đây được gia hạn thời điểm đóng thầu trên Hệ thống mạng đấu thầu quốc gia?
a. Người có thẩm quyền
b. Chủ đầu tư
c. Tổ chuyên gia
d. Tư vấn đấu thầu
Đáp án đúng: B
Câu 221: Chọn phương án đúng về thời gian áp dụng mua sắm trực tuyến đối với các hạng mục trong danh mục hàng hóa, dịch vụ mua sắm tập trung?
a. Thời gian áp dụng là thời gian thực hiện hợp đồng trong trường hợp không ký thỏa thuận khung nhưng không quá 24 tháng kể từ ngày hợp đồng có hiệu lực hoặc thời gian có hiệu lực của thỏa thuận khung
b. Thời gian áp dụng là 24 tháng kể từ ngày kết quả lựa chọn nhà thầu được đăng tải trên Hệ thống mạng đấu thầu quốc gia trong trường hợp hợp đồng, thỏa thuận khung chưa được công khai
c. Thời gian áp dụng là 24 tháng kể từ ngày kết quả lựa chọn nhà thầu được đăng tải trên Hệ thống mạng đấu thầu quốc gia
d. Phương án A và B đều đúng
Đáp án đúng: D
Câu 222: Công việc nào sau đây phải thực hiện trên Hệ thống mạng đấu thầu quốc gia?
a. Lập E-HSMT
b. Trình phê duyệt E-HSMT, phê duyệt E-HSMT
c. Phê duyệt kết quả lựa chọn nhà thầu
d. Tất cả các phương án trên đều đúng
Đáp án đúng: D
Câu 223: Đối với đấu thầu qua mạng, việc trả lời làm rõ E-HSMT được thực hiện ở đâu?
a. Trả lời bằng văn bản giấy cho nhà thầu có yêu cầu làm rõ theo đúng địa chỉ nhà thầu đăng ký trên Hệ thống mạng đấu thầu quốc gia
b. Chủ đầu tư trả lời làm rõ trên Hệ thống mạng đấu thầu quốc gia
c. Bên mời thầu trả lời làm rõ trên Hệ thống mạng đấu thầu quốc gia
d. Trả lời bằng văn bản điện tử qua email của nhà thầu yêu cầu làm rõ
Đáp án đúng: B
Câu 224: Đâu là một trong các nội dung thuộc quy trình lựa chọn nhà thầu đối với đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh qua mạng theo phương thức một giai đoạn một túi hồ sơ?
a. Chuẩn bị lựa chọn nhà thầu
b. Chuẩn bị lập E-HSMT
c. Đăng tải E-HSMT
d. Lập E-HSDT
Đáp án đúng: A
Câu 225: Trong quy trình lựa chọn nhà thầu đối với đấu thầu rộng rãi, đấu thầu hạn chế qua mạng theo phương thức một giai đoạn hai túi hồ sơ không bao gồm nội dung nào sau đây?
a. Mở thầu và đánh giá E-HSĐXKT
b. Thương thảo hợp đồng (áp dụng đối với một số gói thầu)
c. Mở thầu
d. Đánh giá E-HSĐXTC
Đáp án đúng: C
Câu 226: Đối với đấu thầu qua mạng, thời hạn nộp bảo lãnh tạm ứng tính theo ngày nào?
a. Ngày chậm nhất được ghi trong hợp đồng
b. Ngày hệ thống mạng đấu thầu quốc gia thông báo
c. Trong vòng 5 ngày làm việc kể từ ngày hợp đồng có hiệu lực
d. Cùng thời điểm ký hợp đồng
Đáp án đúng: A
Câu 227: Hồ sơ dự thầu qua mạng (E-HSDT) được mở vào thời điểm nào?
a. Ngay sau thời điểm đóng thầu
b. Tối đa 24 giờ kể từ thời điểm đóng thầu
c. Trong vòng 12 giờ sau thời điểm đóng thầu
d. Tối đa 02 giờ kể từ thời điểm đóng thầu
Đáp án đúng: D
Câu 228: Khi tổ chức đấu thầu qua mạng theo phương thức một giai đoạn hai túi hồ sơ, biên bản mở thầu (E-HSĐXKT) chứa nội dung nào sau đây?
a. Tên gói thầu, tên chủ đầu tư, bên mời thầu
b. Tên các nhà thầu nộp E-HSDT
c. Thời gian có hiệu lực của E-HSĐXKT
d. Tất cả các phương án trên
Đáp án đúng: D
Câu 229: Trường hợp có sự sai khác giữa thông tự về năng lực, kinh nghiệm mà nhà thầu kê khai trên Hệ thống mạng đấu thầu quốc gia và thông tin trong E-HSDT thì đánh giá dựa trên thông tin nào?
a. Thông tin trên Hệ thống mạng đấu thầu quốc gia
b. Thông tin trong E-HSDT
c. Bắt buộc phải đánh giá lại toàn bộ hồ sơ
d. Cho phép nhà thầu làm rõ
Đáp án đúng: B
Câu 230: Thời hạn để làm rõ hồ sơ dự thầu qua mạng là bao lâu?
a. Không được quy định cụ thể, phụ thuộc vào bên mời thầu
b. Tối thiểu 03 ngày làm việc đối với đấu thầu trong nước và tối thiểu 05 ngày làm việc đối với đấu thầu quốc tế
c. Tùy thuộc vào thời gian quy định tại E-HSMT và yêu cầu của bên mời thầu
d. 07 ngày làm việc kể từ ngày mở thầu
Đáp án đúng: C
Câu 231: Theo pháp luật về đấu thầu, trường hợp Hệ thống mạng đấu thầu quốc gia có sự cố không thể mở thầu được thì thời gian mở thầu sẽ được xử lý như thế nào?
a. Tự động chuyển sang 08 giờ ngày làm việc tiếp theo
b. Ngay sau khi sự cố của Hệ thống được khắc phục
c. Tối đa 02 giờ kể từ thời điểm sự cố của Hệ thống được khắc phục
d. Phải có văn bản chấp thuận của Cục Quản lý Đấu thầu để gia hạn mở thầu
Đáp án đúng: C
Câu 232: Việc đăng tải kết quả lựa chọn nhà thầu qua mạng bao gồm các nội dung gì?
a. Quyết định phê duyệt kết quả lựa chọn nhà thầu
b. Tên nhà thầu trúng thầu, giá trúng thầu, loại hợp đồng, thời gian thực hiện hợp đồng
c. Danh sách các nhà thầu không được lựa chọn và lý do tóm tắt
d. Tất cả các phương án trên
Đáp án đúng: D
Câu 233: Đối với các gói thầu đấu thầu qua mạng, trường hợp cần hủy thầu do tất cả E-HSDT đều không đáp ứng, quy trình công khai hủy thầu được thực hiện thế nào?
a. Chỉ gửi email thông báo cho các nhà thầu đã nộp E-HSDT
b. Đăng tải quyết định hủy thầu trên Hệ thống mạng đấu thầu quốc gia trong thời hạn quy định
c. Thông báo trực tiếp bằng văn bản đến người có thẩm quyền để xin ý kiến rồi mới thông báo cho nhà thầu
d. Không bắt buộc phải công khai, tự động lưu trữ trên Hệ thống
Đáp án đúng: B
Câu 234: Theo quy định, gói thầu nào sau đây BẮT BUỘC phải tổ chức lựa chọn nhà thầu qua mạng?
a. Gói thầu thuộc dự án quan trọng quốc gia có giá trị trên 5.000 tỷ đồng
b. Gói thầu có liên quan đến bí mật quốc gia
c. Gói thầu mua sắm tập trung, đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh trong nước trừ gói thầu có tính chất đặc thù không thể đấu thầu qua mạng
d. Tất cả các hình thức chỉ định thầu
Đáp án đúng: C
Câu 235: Nhà thầu muốn nộp E-HSDT qua Hệ thống mạng đấu thầu quốc gia thì cần phải đáp ứng điều kiện gì đầu tiên?
a. Có tài khoản ngân hàng liên kết với Hệ thống để trừ phí dự thầu tự động
b. Có chứng thư số đang còn hiệu lực và đã đăng ký thành công trên Hệ thống mạng đấu thầu quốc gia
c. Đã từng trúng thầu ít nhất 01 dự án trong 03 năm gần nhất
d. Phải có thư bảo lãnh của ngân hàng phát hành bản giấy nộp trước thời điểm đóng thầu
Đáp án đúng: B
Câu 236: Đấu thầu qua mạng có lợi ích gì nổi bật nhất so với đấu thầu truyền thống?
a. Tăng tính bảo mật cho hồ sơ kỹ thuật của nhà thầu
b. Giảm thiểu chi phí in ấn, di chuyển và nâng cao tính công khai, minh bạch, cạnh tranh
c. Không cần phải nộp bảo đảm dự thầu
d. Thời gian đánh giá hồ sơ được rút ngắn xuống còn 01 ngày
Đáp án đúng: B
Câu 237: Đâu là phát biểu đúng về bảo đảm dự thầu khi đấu thầu qua mạng?
a. Chỉ chấp nhận bảo đảm dự thầu bằng tiền mặt nộp trực tiếp tại kho bạc
b. Chấp nhận bảo lãnh điện tử do ngân hàng phát hành thông qua Hệ thống hoặc đính kèm bản scan bảo lãnh giấy (nếu E-HSMT cho phép)
c. Không yêu cầu bảo đảm dự thầu đối với gói thầu xây lắp dưới 20 tỷ đồng
d. Bảo đảm dự thầu phải nộp trước 03 ngày so với thời điểm đóng thầu
Đáp án đúng: B
Câu 238: Nếu phát hiện có sai sót trong E-HSMT đã đăng tải trên Hệ thống, Chủ đầu tư phải làm gì?
a. Tự động gọi điện cho các nhà thầu để thông báo
b. Đăng tải văn bản quyết định sửa đổi E-HSMT và bản E-HSMT đã sửa đổi trên Hệ thống mạng đấu thầu quốc gia theo thời gian quy định trước thời điểm đóng thầu
c. Hủy thầu và đăng tải lại E-HSMT từ đầu
d. Không được phép sửa đổi E-HSMT sau khi đã đăng tải
Đáp án đúng: B
Câu 239: Đối với đấu thầu qua mạng, thời điểm nhà thầu được đánh giá là đã nộp E-HSDT thành công là lúc nào?
a. Lúc nhà thầu nhấn nút "Nộp hồ sơ" trên giao diện
b. Lúc nhà thầu in được phiếu thu từ Hệ thống
c. Là thời điểm Hệ thống mạng đấu thầu quốc gia phản hồi thông báo đã nhận thành công E-HSDT của nhà thầu
d. Lúc thời điểm đóng thầu kết thúc
Đáp án đúng: C
Câu 240: Trong E-HSDT, nếu nhà thầu tải lên một file tài liệu bị lỗi, không thể mở hoặc không thể đọc được nội dung thì Tổ chuyên gia sẽ xử lý như thế nào?
a. Tự động đánh giá là không đáp ứng đối với tiêu chí tương ứng của file đó
b. Yêu cầu nhà thầu làm rõ, nộp lại file tài liệu (trong trường hợp file này chứng minh năng lực, kinh nghiệm hoặc không làm thay đổi bản chất của hồ sơ dự thầu)
c. Hủy toàn bộ E-HSDT của nhà thầu đó
d. Đề nghị chủ đầu tư hủy thầu do lỗi kỹ thuật
Đáp án đúng: B
Câu 241: Theo Luật Đấu thầu 22/2023/QH15, cơ quan nào có thẩm quyền quản lý trực tiếp Hệ thống mạng đấu thầu quốc gia?
a. Bộ Tài chính
b. Bộ Thông tin và Truyền thông
c. Bộ Kế hoạch và Đầu tư
d. Văn phòng Chính phủ
Đáp án đúng: C
Câu 242: Thông báo mời thầu qua mạng phải được đăng tải tối thiểu bao nhiêu ngày trước thời điểm đóng thầu đối với gói thầu mua sắm hàng hóa (đấu thầu trong nước, không áp dụng rút ngắn thời gian)?
a. Tối thiểu 05 ngày
b. Tối thiểu 10 ngày
c. Tối thiểu 20 ngày
d. Tối thiểu 07 ngày
Đáp án đúng: B
Câu 243: Khi một liên danh nộp E-HSDT, ai là người sử dụng chứng thư số để ký và nộp hồ sơ trên Hệ thống?
a. Tất cả các thành viên trong liên danh phải cùng ký
b. Thành viên đứng đầu liên danh sử dụng chứng thư số của mình để ký và nộp theo phân công trong thỏa thuận liên danh
c. Chủ đầu tư sẽ cấp một chứng thư số riêng cho liên danh đó
d. Không cần dùng chứng thư số, chỉ cần nộp bản scan thỏa thuận liên danh
Đáp án đúng: B
Câu 244: Đối với gói thầu tư vấn áp dụng đấu thầu qua mạng, E-HSMT quy định đánh giá hồ sơ theo phương pháp nào?
a. Chỉ được áp dụng phương pháp giá thấp nhất
b. Chỉ được áp dụng phương pháp giá cố định
c. Có thể áp dụng phương pháp giá thấp nhất, phương pháp giá cố định, phương pháp kết hợp kỹ thuật và giá hoặc phương pháp dựa trên kỹ thuật
d. Bắt buộc áp dụng phương pháp dựa trên kỹ thuật
Đáp án đúng: C
Câu 245: Tại bước mở thầu E-HSĐXTC (hồ sơ đề xuất tài chính) trong phương thức một giai đoạn hai túi hồ sơ, biên bản mở thầu trên Hệ thống sẽ công khai thông tin gì?
a. Điểm kỹ thuật của từng nhà thầu
b. Giá dự thầu, giá trị giảm giá (nếu có) của các nhà thầu vượt qua bước đánh giá kỹ thuật
c. Tên các nhà thầu không vượt qua bước đánh giá kỹ thuật
d. Tất cả các phương án trên
Đáp án đúng: D
Câu 246: Chào giá trực tuyến theo quy trình thông thường áp dụng đối với gói thầu nào sau đây?
a. Dịch vụ phi tư vấn thông dụng, đơn giản
b. Xây lắp
c. Dịch vụ tư vấn
d. Hỗn hợp
Đáp án đúng: A
Câu 247: Nhà thầu phải thực hiện xác nhận về việc chấp thuận được trao hợp đồng trên Hệ thống mạng đấu thầu quốc gia đối với các hình thức lựa chọn nhà thầu qua mạng nào?
a. Đấu thầu rộng rãi, chào hàng cạnh tranh, đấu thầu hạn chế.
b. Chào giá trực tuyến theo quy trình thông thường
c. Chào giá trực tuyến theo quy trình rút gọn
d. Các phương án trên đều đúng
Đáp án đúng: C
Câu 248: Đối với chào giá trực tuyến rút gọn, kể từ lượt chào giá thứ hai, giá chào của nhà thầu không được thấp hơn giá thấp nhất hiển thị trên Hệ thống mạng đấu thầu quốc gia là bao nhiêu %?
a. 80%
b. 85%
c. 90%
d. 95%
Đáp án đúng: A
Câu 249: Đối với chào giá trực tuyến rút gọn, giá trị bảo đảm dự thầu tối đa là giá trị nào sau đây?
a. 5% giá gói thầu
b. 10% giá gói thầu
c. 1-3% giá gói thầu
d. Không yêu cầu về bảo đảm dự thầu
Đáp án đúng: D
Câu 250: Đối với gói thầu áp dụng chào giá trực tuyến theo quy trình thông thường, trường hợp nhà thầu được mời tham gia chào giá trực tuyến nhưng nhà thầu từ chối tham gia thì xử lý thế nào?
a. Đề xuất về tài chính của nhà thầu sẽ bị đánh giá là không đạt
b. Nhà thầu sẽ bị loại và bị khóa tài khoản trên Hệ thống mạng đấu thầu quốc gia trong vòng 06 tháng
c. Hồ sơ dự thầu của nhà thầu sẽ tiếp tục được đánh giá về tài chính căn cứ theo hồ sơ dự thầu đã nộp trước thời điểm đóng thầu
d. Phương án A và B đều đúng
Đáp án đúng: C
Câu 251: Mua sắm trực tuyến được áp dụng đối với hàng hoá, dịch vụ của gói thầu thuộc dự toán mua sắm với giá gói thầu có hạn mức tối đa là bao nhiêu?
a. 100 triệu đồng
b. 300 triệu đồng
c. 500 triệu đồng
d. 01 tỷ đồng
Đáp án đúng: C
Câu 252: Trong mua sắm tập trung áp dụng đấu thầu rộng rãi, hợp đồng điện tử có thể được ký kết giữa các đối tượng nào?
a. Đơn vị mua sắm tập trung và các nhà thầu trúng thầu (trong trường hợp không ký thỏa thuận khung)
b. Đơn vị có nhu cầu mua sắm với các nhà thầu trúng thầu (trong trường hợp đơn vị mua sắm tập trung ký thỏa thuận khung với nhà thầu trúng thầu)
c. Phương án A và B đều đúng
d. Phương án A và B đều sai
Đáp án đúng: C
Câu 253: Mua sắm trực tuyến được áp dụng đối với gói thầu nào sau đây?
a. Gói thầu mua sắm hàng hóa, dịch vụ thuộc dự toán mua sắm có giá gói thầu không quá 500 triệu đồng; gói thầu mua sắm hàng hóa, dịch vụ thuộc dự án có giá gói thầu không quá 01 tỷ đồng
b. Gói thầu xây lắp thuộc dự toán mua sắm có giá gói thầu không quá 01 tỷ đồng; gói thầu xây lắp thuộc dự án có giá gói thầu không quá 02 tỷ đồng
c. Gói thầu mua sắm hàng hóa, cung cấp dịch vụ phi tư vấn thuộc dự án có giá gói thầu không quá 05 tỷ đồng
d. Phương án B và C đều đúng
Đáp án đúng: A
Câu 254: Đối với gói thầu áp dụng hình thức chào giá trực tuyến rút gọn, việc thẩm định kết quả lựa chọn nhà thầu được thực hiện như thế nào?
a. Chỉ thẩm định nội dung về giá chào của nhà thầu
b. Bắt buộc thẩm định khi người có thẩm quyền yêu cầu
c. Không phải thẩm định kết quả lựa chọn nhà thầu
d. Phương án A và B đều đúng
Đáp án đúng: C
Câu 255: Khi đánh giá E-HSDT gói thầu xây lắp áp dụng đấu thầu rộng rãi qua mạng, trường hợp có sự không thống nhất giữa thông tin về hợp đồng tương tự kê khai trên webform và file tài liệu chứng minh các thông tin về hợp đồng đó thì phương án nào sau đây là đúng?
a. Đánh giá nhà thầu không đạt yêu cầu về hợp đồng tương tự
b. Yêu cầu nhà thầu làm rõ E-HSDT trên Hệ thống mạng đấu thầu quốc gia
c. Yêu cầu nhà thầu gửi bổ sung hợp đồng tương tự bằng bản giấy để đánh giá
d. Phương án B và C đều đúng
Đáp án đúng: B
Câu 256: Nhận định nào sau đây về văn bản điện tử trên Hệ thống mạng đấu thầu quốc gia là đúng?
a. Văn bản điện tử trên Hệ thống có giá trị theo quy định của pháp luật về giao dịch điện tử, làm cơ sở đối chiếu, so sánh, xác thực thông tin phục vụ công tác đánh giá, thẩm định, thanh tra, kiểm tra, kiểm toán và giải ngân
b. Thời điểm gửi, nhận văn bản điện tử được xác định căn cứ theo thời gian thực ghi lại trên Hệ thống
c. Khi gửi hồ sơ thanh quyết toán đến Kho bạc Nhà nước, nhà thầu không phải cung cấp thông tin, tài liệu cho Kho bạc Nhà nước đối với các thông tin, tài liệu là văn bản điện tử trên Hệ thống
d. Các phương án trên đều đúng
Đáp án đúng: D
Câu 257: Đối với đấu thầu qua mạng, chức năng trả lời làm rõ E-HSDT trên Hệ thống mạng đấu thầu quốc gia được thực hiện bao nhiêu lần đối với mỗi yêu cầu làm rõ?
a. 01 lần
b. 02 lần
c. 03 lần
d. Không giới hạn số lần
Đáp án đúng: D
Câu 258: Đối với đấu thầu qua mạng, nhà thầu liên danh nộp bảo đảm dự thầu theo thể thức nào sau đây?
a. Từng thành viên liên danh có thể sử dụng thể thức bảo lãnh dự thầu khác nhau
b. Các thành viên liên danh bắt buộc phải sử dụng cùng thể thức bảo lãnh dự thầu điện tử
c. Các thành viên liên danh phải sử dụng cùng thể thức: bảo lãnh dự thầu điện tử hoặc bảo lãnh dự thầu bằng giấy
d. Các thành viên liên danh bắt buộc phải sử dụng cùng thể thức bảo lãnh dự thầu bằng giấy
Đáp án đúng: C
Câu 259: Nhận định nào sau đây là đúng?
a. Trong vòng 05 ngày làm việc, kể từ ngày nhận được yêu cầu của chủ đầu tư, nếu nhà thầu từ chối hoặc không nộp bản gốc thư bảo lãnh dự thầu, giấy chứng nhận bảo hiểm bảo lãnh (đối với trường hợp sử dụng bảo lãnh dự thầu bằng văn bản giấy) theo yêu cầu của chủ đầu tư thì nhà thầu sẽ bị xử lý theo đúng cam kết của nhà thầu trong đơn dự thầu
b. Trong vòng 05 ngày làm việc, kể từ ngày nhận được yêu cầu của bên mời thầu, nếu nhà thầu từ chối hoặc không nộp bản gốc thư bảo lãnh dự thầu, giấy chứng nhận bảo hiểm bảo lãnh (đối với trường hợp sử dụng bảo lãnh dự thầu bằng văn bản giấy) theo yêu cầu của bên mời thầu thì nhà thầu sẽ bị xử lý theo đúng cam kết của nhà thầu trong đơn dự thầu
c. Trong vòng 05 ngày làm việc, kể từ ngày nhận được yêu cầu của tổ chuyên gia, nếu nhà thầu từ chối hoặc không nộp bản gốc thư bảo lãnh dự thầu, giấy chứng nhận bảo hiểm bảo lãnh (đối với trường hợp sử dụng bảo lãnh dự thầu bằng văn bản giấy) theo yêu cầu của tổ chuyên gia thì nhà thầu sẽ bị xử lý theo đúng cam kết của nhà thầu trong đơn dự thầu
d. Trong vòng 05 ngày làm việc, kể từ ngày nhận được yêu cầu của tư vấn đấu thầu, nếu nhà thầu từ chối hoặc không nộp bản gốc thư bảo lãnh dự thầu, giấy chứng nhận bảo hiểm bảo lãnh theo yêu cầu của tư vấn đấu thầu thì nhà thầu sẽ bị xử lý theo đúng cam kết của nhà thầu trong đơn dự thầu
Đáp án đúng: A
Câu 260: Gói thầu nào sau đây không phải áp dụng đấu thầu qua mạng trên Hệ thống mạng đấu thầu quốc gia?
a. Gói thầu hỗn hợp theo phương thức 02 giai đoạn
b. Gói thầu đấu thầu rộng rãi quốc tế
c. Gói thầu áp dụng hình thức chỉ định thầu, đặt hàng, giao nhiệm vụ, mua sắm trực tiếp, tự thực hiện, đàm phán giá, lựa chọn nhà thầu trong trường hợp đặc biệt, gói thầu có sự tham gia của cộng đồng
d. Các phương án trên đều đúng
Đáp án đúng: D
Câu 261: Việc hủy E-TBMT có thể được thực hiện tại thời điểm nào?
a. Được thực hiện tại thời điểm đóng thầu trong trường hợp không có nhà thầu tham dự thầu
b. Được thực hiện sau thời điểm mở thầu
c. Được thực hiện trước thời điểm đóng thầu trong trường hợp đã phát hành hồ sơ mời thầu trước ngày 01/7/2025 nhưng đến ngày 4/8/2025 chưa đóng thầu
d. Phương án A và C đều đúng
Đáp án đúng: A
Câu 262: Khi chủ đầu tư sửa đổi E-HSMT, thay đổi thời điểm đóng thầu (nếu có) trên Hệ thống mạng đấu thầu quốc gia, nhận định nào sau đây đúng?
a. Nhà thầu chịu trách nhiệm theo dõi thông tin trên Hệ thống mạng đấu thầu quốc gia để cập nhật thông tin về việc sửa đổi E- HSMT, thay đổi thời điểm đóng thầu (nếu có) để làm cơ sở chuẩn bị E-HSDT
b. Nhà thầu phải tự chịu trách nhiệm và chịu bất lợi trong quá trình tham dự thầu nếu không theo dõi, cập nhật thông tin sửa đổi E-HSMT, thời điểm đóng thầu trên Hệ thống mạng đấu thầu quốc gia trong quá trình tham dự thầu
c. Hệ thống mạng đấu thầu quốc gia tự động gửi email thông báo về việc sửa đổi E-HSMT, thay đổi thời điểm đóng thầu (nếu có) cho các nhà thầu quan tâm đến gói thầu
d. Các phương án trên đều đúng
Đáp án đúng: D
Câu 263: Trường hợp E-HSMT không đầy đủ thông tin (thiếu thiết kế, bản vẽ và các tài liệu khác) hoặc thông tin không rõ ràng, gây khó khăn cho nhà thầu trong việc chuẩn bị E- HSDT thì chủ đầu tư phải làm gì?
a. Phải sửa đổi, bổ sung E-HSMT cho phù hợp và tiến hành đăng tải lại E-HSMT
b. Thực hiện bổ sung, hoàn thiện cho phù hợp và sửa đổi trên Hệ thống
c. Đính kèm thêm các thành phần còn thiếu của E-HSMT trên Hệ thống
d. Hủy thầu
Đáp án đúng: A
Câu 264: Việc phải ký kết hợp đồng điện tử trên Hệ thống mạng đấu thầu quốc gia bắt buộc áp dụng đối với gói thầu nào sau đây?
a. Gói thầu áp dụng đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh, chào giá trực tuyến, mua sắm trực tuyến mà việc thanh toán hợp đồng được thực hiện qua Kho bạc nhà nước
b. Gói thầu áp dụng đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh, chào giá trực tuyến, mua sắm trực tuyến mà việc thanh toán hợp đồng không thực hiện qua Kho bạc nhà nước
c. Tất cả các gói thầu áp dụng đấu thầu qua mạng
d. Tất cả các gói thầu áp dụng đấu thầu qua mạng và không qua mạng
Đáp án đúng: A
Câu 265: Đối với đấu thầu qua mạng, sau khi đánh giá E-HSDT, tổ trưởng tổ chuyên gia phải thực hiện nội dung gì sau đây trên Hệ thống mạng đấu thầu quốc gia?
a. Đính kèm bản scan báo cáo đánh giá E-HSDT (có chữ ký của tất cả thành viên trong tổ chuyên gia)
b. Đính kèm bản scan báo cáo đánh giá E-HSDT (không cần có chữ ký của tất cả thành viên trong tổ chuyên gia)
c. Đính kèm bản scan báo cáo đánh giá E-HSDT (chỉ cần chữ ký của tổ trưởng tổ chuyên gia)
d. Tất cả các phương án đều sai
Đáp án đúng: A
Câu 266: Gói thầu hàng hóa có giá gói thầu 02 tỷ đồng thực hiện chào giá trực tuyến theo quy trình rút gọn, trường hợp chủ đầu tư đăng tải thông báo mời thầu vào 11h00 ngày Thứ 2 (15/9/2025), thời điểm nào sau đây là thời điểm kết thúc chào giá trực tuyến sớm nhất?
a. 11h00 ngày Thứ 6 (19/9/2025)
b. 08h00 ngày Thứ 3 (23/9/2025)
c. 11h00 ngày Thứ 3 (23/9/2025)
d. 08h00 ngày Thứ 4 (24/9/2025)
Đáp án đúng: C
Câu 267: Đối với đấu thầu qua mạng, nhà thầu đính kèm bản scan thư giảm giá khi tham dự thầu trên Hệ thống mạng đấu thầu quốc gia thì việc đánh giá tệp tin đính kèm này được thực hiện theo phương án nào sau đây?
a. Không được xem xét, đánh giá
b. Được xem xét, đánh giá căn cứ tệp tin đính kèm
c. Được làm rõ trong trường hợp có sự sai khác thông tin về giảm giá giữa tệp tin đính kèm này và thông kho kê khai trong đơn dự thầu
d. Được bổ sung trong trường hợp có sự sai khác thông tin về giảm giá giữa tệp tin đính kèm này và thông tin kê khai trong đơn dự thầu
Đáp án đúng: A
Câu 268: Đối với gói thầu mua sắm hàng hóa có giá gói thầu 15 tỷ đồng thực hiện đấu thầu rộng rãi qua mạng, trường hợp tại thời điểm đóng thầu không có nhà thầu tham dự thầu, chủ đầu tư quyết định xử lý tình huống theo cách gia hạn thời điểm đóng thầu thì thời gian gia hạn tối thiểu là bao nhiêu ngày?
a. 10 ngày
b. 05 ngày làm việc
c. 05 ngày
d. 03 ngày làm việc
Đáp án đúng: B
Câu 269: Phương thức lựa chọn nhà thầu nào sau đây áp dụng cho đấu thầu qua mạng?
a. 01 giai đoạn, 01 túi hồ sơ
b. 02 giai đoạn, 01 túi hồ sơ
c. 02 giai đoạn, 02 túi hồ sơ
d. Các phương án trên đều đúng
Đáp án đúng: D
Câu 270: Đối với dự toán mua sắm, hạn mức áp dụng chào giá trực tuyến theo quy trình thông thường đối với gói thầu mua sắm hàng hóa là?
a. Có giá gói thầu không quá 500 triệu đồng
b. Có giá gói thầu không quá 02 tỷ đồng
c. Có giá gói thầu không quá 05 tỷ đồng
d. Không có quy định về hạn mức áp dụng
Đáp án đúng: D
Câu 271: Gói thầu hàng hóa có giá gói thầu 01 tỷ đồng thực hiện chào giá trực tuyến theo quy trình rút gọn, trường hợp chủ đầu tư đăng tải thông báo mời thầu vào 11h00 ngày Thứ 2 (15/9/2025), thời điểm nào sau đây là thời điểm kết thúc chào giá trực tuyến sớm nhất?
a. 08h00 ngày thứ 6 (19/9/2025)
b. 08h00 ngày thứ bẩy (20/9/2025)
c. 11h00 ngày thứ 6 (19/9/2025)
d. 08h00 ngày thứ 2 (22/9/2025)
Đáp án đúng: A
Câu 272: Đối với đấu thầu qua mạng, thành phần nào sau đây không được coi là một phần của E- HSMST, E-HSMT và nhà thầu không phải đáp ứng các yêu cầu này?
a. Bảng dữ liệu được số hóa dưới dạng webform trên Hệ thống mạng đấu thầu quốc gia
b. Tiêu chuẩn đánh giá về tính hợp lệ được đính kèm trên Hệ thống mạng đấu thầu quốc gia
c. Yêu cầu về năng lực, kinh nghiệm được đính kèm trên Hệ thống mạng đấu thầu quốc gia
d. Phương án B và C đều đúng
Đáp án đúng: D
Câu 273: Yêu cầu nào sau đây là đúng đối với tệp tin (file) đăng tải trên Hệ thống mạng đấu thầu quốc gia?
a. Các file mở, đọc được bằng các phần mềm thông dụng như: các phần mềm đọc, soạn thảo văn bản MS Office hoặc Open Office; các phần mềm đọc file PDF; các phần mềm thiết kế thông dụng như AutoCad, Photoshop; phần mềm đọc file ảnh tích hợp sẵn trên Hệ điều hành Windows. Các file sử dụng phông chữ không thuộc bảng mã Unicode
b. Các file nén mở được bằng các phần mềm giải nén thông dụng như phần mềm giải nén ZIP tích hợp sẵn trên hệ điều hành Windows, MacOS hoặc phần mềm giải nén Rar hoặc 7Zip. Trường hợp sử dụng file nén, các file sau khi giải nén phải có định dạng đúng quy định.
c. Không bị nhiễm virus, không bị lỗi, hỏng và không thiết lập mật khẩu
d. Các phương án trên đều đúng
Đáp án đúng: D
Câu 274: Đối với đấu thầu qua mạng, trường hợp file đính kèm trong E-HSMT không thể mở hoặc không đọc được thì chủ đầu tư phải thực hiện hành động nào sau đây?
a. Đăng tải và phát hành lại toàn bộ E-HSMT
b. Sửa đổi E-HSMT và không phải phát hành lại toàn bộ E- HSMT
c. Đề nghị Trung tâm Đấu thầu qua mạng quốc gia sửa đổi E- HSMT trong trường hợp chủ đầu tư không sửa đổi được E-HSMT
d. Các phương án trên đều đúng
Đáp án đúng: A
Câu 275: Đối với đấu thầu qua mạng, trường hợp Hệ thống mạng đấu thầu quốc gia gặp sự cố không thể vận hành và phải tự động gia hạn thời điểm đóng thầu của các gói thầu bị ảnh hưởng (có thời điểm đóng thầu trong thời gian từ khi Hệ thống bị sự cố cho đến thời điểm sau hoàn thành khắc phục sự cố 02 giờ) thì việc đánh giá E-HSDT được thực hiện trên cơ sở thời điểm đóng thầu nào sau đây?
a. Thời điểm đóng thầu nêu trong E-TBMT đã được đăng tải trước thời điểm Hệ thống mạng đấu thầu quốc gia gặp sự cố
b. Thời điểm đóng thầu mà Hệ thống mạng đấu thầu quốc gia tự động gia hạn
c. Do Chủ đầu tư quyết định
d. Phương án A và B đều đúng
Đáp án đúng: D
Câu 276: Loại Chứng thư số nào sau đây được sử dụng trên Hệ thống mạng đấu thầu quốc gia?
a. Chứng thư số chuyên dùng do tất cả tổ chức có chức năng cung cấp dịch vụ chứng thực chữ ký số chuyên dùng cấp
b. Tất cả các loại chứng thư số
c. Chứng thư số công cộng do tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng cấp hoặc chứng thư số do tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng Chính phủ cấp
d. Phương án A và C đều đúng
Đáp án đúng: C
Câu 277: Đối với đấu thầu qua mạng, trường hợp nhà thầu sử dụng bảo lãnh dự thầu điện tử trên Hệ thống mạng đấu thầu quốc gia, phát biểu nào sau đây là đúng?
a. Giá trị bảo lãnh dự thầu luôn đáp ứng yêu cầu trong E-HSMT
b. Thời gian hiệu lực của bảo lãnh dự thầu luôn đáp ứng yêu cầu trong E-HSMT
c. Đối tượng thụ hưởng bảo lãnh dự thầu luôn đáp ứng yêu cầu trong E-HSMT
d. Các phương án trên đều đúng
Đáp án đúng: D
Câu 278: Gói thầu mua sắm hàng hóa có: - Thời điểm đóng thầu theo E-TBMT là: 8h00 ngày 25/9/2025 - Hiệu lực của bảo đảm dự thầu theo yêu cầu của E-HSMT là: 90 ngày - Do lỗi hệ thống nên Hệ thống tự động gia hạn thời điểm đóng thầu mới là: 11h ngày 26/9/2025 Nhà thầu A đã nộp E-HSDT trước thời điểm Hệ thống xảy ra sự cố với hiệu lực của bảo đảm dự thầu là 90 ngày kể từ ngày 25/9/2025; Nhà thầu B nộp E-HSDT sau khi Hệ thống được khắc phục và trước thời điểm đóng thầu mới với hiệu lực của bảo đảm dự thầu là 90 ngày kể từ ngày 26/9/2025. Trong trường hợp này, bảo đảm dự thầu của nhà thầu A và nhà thầu B được đánh giá như thế nào?
a. Bảo đảm dự thầu của nhà thầu A được đánh giá là không hợp lệ; Bảo đảm dự thầu của nhà thầu B được đánh giá là hợp lệ
b. Bảo đảm dự thầu của nhà thầu A và nhà thầu B đều được đánh giá là hợp lệ
c. Bảo đảm dự thầu của nhà thầu A được đánh giá là hợp lệ; Bảo đảm dự thầu của nhà thầu B được đánh giá là không hợp lệ
d. Bảo đảm dự thầu của nhà thầu A và nhà thầu B đều được đánh giá là không hợp lệ
Đáp án đúng: B
Câu 279: So sánh điều kiện xét duyệt trúng thầu giữa phương pháp giá cố định và phương pháp dựa trên kỹ thuật đối với gói thầu dịch vụ tư vấn, điểm chung quyết định để nhà thầu được xếp hạng thứ nhất là gì?
a. Có giá dự thầu thấp nhất
b. Có điểm tổng hợp cao nhất
c. Có điểm kỹ thuật cao nhất
d. Có giá đề nghị trúng thầu thấp nhất
Đáp án đúng: C
Câu 280: Phương pháp kết hợp giữa kỹ thuật và giá được áp dụng cho gói thầu tư vấn có đặc điểm nào trong các phương án sau đây?
a. Gói thầu tư vấn đơn giản, chi phí thấp
b. Gói thầu tư vấn có yêu cầu kỹ thuật rất cao, chi phí cố định
c. Gói thầu tư vấn chú trọng tới cả chất lượng và chi phí thực hiện
d. Gói thầu tư vấn có quy trình thực hiện đã được tiêu chuẩn hoá
Đáp án đúng: C
Câu 281: Khi sử dụng phương pháp chấm điểm để xây dựng tiêu chuẩn đánh giá về kỹ thuật, mức điểm yêu cầu tối thiểu về kỹ thuật được quy định là bao nhiêu?
a. Không thấp hơn 60% tổng số điểm kỹ thuật
b. Không thấp hơn 70% tổng số điểm kỹ thuật
c. Không thấp hơn 80% tổng số điểm kỹ thuật
d. Không thấp hơn 90% tổng số điểm kỹ thuật
Đáp án đúng: B
Câu 282: Đối với gói thầu mua sắm hàng hóa, xây lắp, phi tư vấn, hỗn hợp, phương pháp giá đánh giá được áp dụng cho các hình thức lựa chọn nhà thầu nào?
a. Chỉ áp dụng với đấu thầu rộng rãi
b. Chỉ định thầu và mua sắm trực tiếp
c. Đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh
d. Tất cả hình thức lựa chọn nhà thầu
Đáp án đúng: C
Câu 283: Điều kiện nào sau đây là bắt buộc đối với nhà thầu xây lắp nhưng không được đề cập trong điều kiện xét duyệt trúng thầu đối với nhà thầu tư vấn là tổ chức?
a. Có hồ sơ dự thầu hợp lệ
b. Có giá đề nghị trúng thầu không vượt giá gói thầu
c. Có đề xuất kỹ thuật đáp ứng yêu cầu
d. Có giá trị phần sai lệch thiếu không quá 10% giá dự thầu
Đáp án đúng: D
Câu 284: Khi sửa đổi hợp đồng làm thay đổi thời gian thực hiện nhưng không vượt thời gian thực hiện dự án, ai có quyền quyết định sửa đổi hợp đồng?
a. Người có thẩm quyền
b. Chủ đầu tư
c. Cơ quan quản lý cấp trên của chủ đầu tư
d. Bên mời thầu
Đáp án đúng: B
Câu 285: Thời gian có hiệu lực của bảo đảm thực hiện hợp đồng được tính từ khi nào đến khi nào?
a. Từ ngày ký hợp đồng đến ngày thanh toán cuối cùng
b. Từ ngày hợp đồng có hiệu lực đến ngày các bên hoàn thành nghĩa vụ hoặc chuyển sang thực hiện nghĩa vụ bảo hành đối với trường hợp có quy định về bảo hành
c. Từ ngày nộp hồ sơ dự thầu đến ngày hoàn thành nghĩa vụ theo hợp đồng
d. Từ ngày thông báo trúng thầu đến ngày hết thời hạn bảo hành
Đáp án đúng: B
Câu 286: Hợp đồng theo thời gian có thể áp dụng trong trường hợp nào?
a. Trong tình trạng khẩn cấp
b. Sửa chữa, bảo trì công trình, máy móc, thiết bị
c. Dịch vụ tư vấn khi khó xác định được phạm vi và thời gian thực hiện dịch vụ
d. Tất cả phương án trên đều đúng
Đáp án đúng: C
Câu 287: Giá trị bảo đảm thực hiện hợp đồng được xác định dựa trên cơ sở nào?
a. Giá gói thầu
b. Giá hợp đồng
c. Giá dự thầu của nhà thầu
d. Tổng mức đầu tư của dự án
Đáp án đúng: B
Câu 288: Trường hợp nào sau đây chủ đầu tư được tự quyết định sửa đổi hợp đồng mà không cần người có thẩm quyền cho phép?
a. Sửa đổi hợp đồng làm vượt giá gói thầu đã duyệt và vượt tổng mức đầu tư của dự án
b. Sửa đổi hợp đồng làm thay đổi thời gian thực hiện hợp đồng nhưng không làm vượt thời gian thực hiện dự án hoặc vượt giá gói thầu (bao gồm dự phòng) được duyệt nhưng không làm vượt tổng mức đầu tư
c. Sửa đổi hợp đồng làm thay đổi thời gian thực hiện hợp đồng và vượt thời gian thực hiện dự án
d. Sửa đổi hợp đồng làm thay đổi thiết kế cơ sở dẫn đến phải điều chỉnh chủ trương đầu tư
Đáp án đúng: B
Câu 289: Các bên không phải ký kết văn bản sửa đổi hợp đồng khi thay đổi giá hợp đồng nếu đáp ứng đủ điều kiện nào sau đây?
a. Không vượt giá gói thầu, nhưng có thể vượt thời gian thực hiện gói thầu ghi trong hợp đồng
b. Không vượt giá gói thầu, không vượt thời gian thực hiện gói thầu ghi trong hợp đồng và phương pháp, công thức, hạng mục và các nội dung cần thiết để điều chỉnh đã quy định trong hợp đồng
c. Không vượt thời gian thực hiện gói thầu ghi trong hợp đồng nhưng có thể vượt giá gói thầu
d. Khi thay đổi thời gian thực hiện hợp đồng nhưng không làm vượt thời gian thực hiện dự án hoặc vượt giá gói thầu (bao gồm dự phòng) được duyệt nhưng không làm vượt tổng mức đầu tư
Đáp án đúng: B
Câu 290: Đâu là điểm khác biệt chính giữa hợp đồng theo đơn giá cố định và hợp đồng theo đơn giá điều chỉnh?
a. Hợp đồng theo đơn giá cố định áp dụng cho gói thầu có thời gian thực hiện dài, hợp đồng theo đơn giá điều chỉnh áp dụng cho gói thầu có thời gian thực hiện ngắn
b. Đơn giá trong hợp đồng đơn giá cố định không thay đổi, còn đơn giá trong hợp đồng đơn giá điều chỉnh có thể thay đổi
c. Hợp đồng theo đơn giá cố định không có chi phí dự phòng, còn hợp đồng theo đơn giá điều chỉnh có chi phí dự phòng
d. Hợp đồng theo đơn giá cố định chỉ áp dụng cho gói thầu dịch vụ tư vấn, hợp đồng theo đơn giá điều chỉnh áp dụng cho gói thầu xây lắp
Đáp án đúng: B
Câu 291: So sánh hai tình huống sửa đổi hợp đồng: (1) Vượt giá gói thầu 10% nhưng không vượt tổng mức đầu tư; (2) Vượt giá gói thầu 2% và làm tổng mức đầu tư tăng 1%, thẩm quyền phê duyệt có gì khác nhau?
a. Cả 2 tình huống đều do chủ đầu tư quyết định
b. Tình huống (1) do chủ đầu tư quyết định, tình huống (2) phải trình người có thẩm quyền xem xét, quyết định
c. Cả 2 tình huống đều do người có thẩm quyền quyết định
d. Tình huống (1) phải trình người có thẩm quyền cho phép, tình huống (2) do Chủ tịch Uỷ ban nhân dân tỉnh quyết định
Đáp án đúng: B
Câu 292: Loại hợp đồng nào được áp dụng khi tại thời điểm lựa chọn nhà thầu chưa đủ cơ sở xác định phạm vi công việc, nhu cầu cần thiết về các yếu tố, chi phí đầu vào để thực hiện các công việc dự kiến của hợp đồng?
a. Hợp đồng trọn gói
b. Hợp đồng theo chi phí cộng phí
c. Hợp đồng theo đơn giá cố định
d. Hợp đồng theo kết quả đầu ra
Đáp án đúng: B
Câu 293: Gói thầu xây lắp A được phê duyệt KHLCNT với thời gian thực hiện gói thầu là 120 ngày. Trong quá trình thực hiện Hợp đồng, do có phát sinh dẫn tới thời gian thực hiện gói thầu bị kéo dài thành 180 ngày. Trong trường hợp này, chủ đầu tư xử lý như thế nào?
a. Báo cáo người có thẩm quyền trước khi điều chỉnh thời gian thực hiện gói thầu trong kế hoạch lựa chọn nhà thầu đã được phê duyệt
b. Chủ đầu tư thực hiện điều chỉnh thời gian thực hiện gói thầu trong kế hoạch lựa chọn nhà thầu đã được phê duyệt mà không cần báo cáo người có thẩm quyền
c. Chủ đầu tư không cần điều chỉnh kế hoạch lựa chọn nhà thầu
d. Các phương án trên đều sai
Đáp án đúng: C
Câu 294: Gói thầu áp dụng hình thức chào giá trực tuyến rút gọn, việc phê duyệt kết quả lựa chọn nhà thầu thực hiện như thế nào?
a. Trên cơ sở đề nghị của tổ chuyên gia
b. Trên cơ sở đề nghị của tổ thẩm định
c. Trên cơ sở chấp thuận được trao hợp đồng của nhà thầu
d. Phương án A và B đều đúng
Đáp án đúng: C
Câu 295: Việc xét duyệt trúng thầu đối với gói thầu áp dụng hình thức chào giá trực tuyến theo quy trình rút gọn thực hiện như thế nào?
a. Căn cứ vào giá dự thầu trong đơn dự thầu của nhà thầu
b. Căn cứ vào giá gói thầu trong kế hoạch lựa chọn nhà thầu được phê duyệt
c. Căn cứ vào giá dự thầu tại thời điểm kết thúc chào giá trực tuyến của nhà thầu xếp thứ nhất
d. Các phương án trên đều sai
Đáp án đúng: C
Câu 296: Nhận định nào sau đây là đúng?
a. Việc áp dụng mua sắm trực tuyến không cần phê duyệt trong kế hoạch lựa chọn nhà thầu và được áp dụng đối với hàng hóa, dịch vụ tư vấn của gói thầu thuộc dự toán mua sắm có giá gói thầu không quá 500 triệu đồng
b. Việc áp dụng mua sắm trực tuyến phải được phê duyệt trong kế hoạch lựa chọn nhà thầu và được áp dụng đối với gói thầu mua sắm hàng hóa, gói thầu dịch vụ tư vấn thuộc dự toán mua sắm có giá gói thầu không quá 500 triệu đồng
c. Mua sắm trực tuyến phải được phê duyệt trong kế hoạch lựa chọn nhà thầu và được áp dụng đối với gói thầu mua sắm hàng hóa, gói thầu dịch vụ tư vấn thuộc dự toán có giá gói thầu không quá 01 tỷ đồng
d. Các phương án trên đều sai
Đáp án đúng: D
Câu 297: Trường hợp gói thầu có giá gói thầu dưới 500 triệu đồng đối với dự toán mua sắm thì chủ đầu tư được quyết định cho phép nhà thầu nào sau đây được tham dự thầu?
a. Nhà thầu có từ 50% lao động trở lên là người khuyết tật, thương binh, dân tộc thiểu số có hợp đồng lao động với thời gian thực hiện hợp đồng từ 03 tháng trở lên và đến thời điểm đóng thầu hợp đồng vẫn còn hiệu lực
b. Nhà thầu có từ 25% lao động trở lên là người khuyết tật, thương binh, dân tộc thiểu số có hợp đồng lao động với thời gian thực hiện hợp đồng từ 03 tháng trở lên và đến thời điểm đóng thầu hợp đồng vẫn còn hiệu lực
c. Nhà thầu có từ 50% lao động trở lên là người khuyết tật, thương binh, dân tộc thiểu số có hợp đồng lao động với thời gian thực hiện hợp đồng dưới 03 tháng và đến thời điểm đóng thầu hợp đồng vẫn còn hiệu lực
d. Nhà thầu có từ 25% lao động trở lên là người khuyết tật, thương binh, dân tộc thiểu số có hợp đồng lao động với thời gian thực hiện hợp đồng dưới 03 tháng và đến thời điểm đóng thầu hợp đồng vẫn còn hiệu lực
Đáp án đúng: A
Câu 298: Trường hợp nào sau đây nhà thầu bị coi là không đáp ứng tư cách hợp lệ khi tham dự thầu theo quy định tại khoản 1 Điều 5 của Luật Đấu thầu?
a. Nhà thầu A sử dụng tài khoản tham gia Hệ thống của chi nhánh B để tham dự thầu
b. Nhà thầu A sử dụng tài khoản tham gia Hệ thống của chính đơn vị mình để tham dự thầu
c. Nhà thầu A sử dụng tài khoản tham gia Hệ thống của công ty con hạch toán phụ thuộc C để tham dự thầu
d. Đáp án A và C là đúng
Đáp án đúng: D
Câu 299: E-HSMT gói thầu mua sắm hàng hóa có yêu cầu cung cấp hàng mẫu, trong trường hợp này hàng mẫu được nhà thầu gửi đến chủ đầu tư theo cách thức nào sau đây là phù hợp?
a. Nhà thầu có thể nộp bổ sung hàng mẫu trong thời hạn 05 ngày làm việc sau thời điểm đóng thầu
b. Nhà thầu phải nộp hàng mẫu ngay sau khi nộp thành công E- HSDT trên Hệ thống mạng đấu thầu quốc gia
c. Nhà thầu nộp hàng mẫu trong thời hạn 05 ngày sau khi nộp thành công E-HSDT trên Hệ thống mạng đấu thầu quốc gia
d. Các phương án trên đều sai.
Đáp án đúng: D
Câu 300: Đối với đấu thầu không qua mạng, biên bản mở thầu bắt buộc phải có chữ ký của các chủ thể nào sau đây?
a. Chủ đầu tư, tổ chuyên gia và các nhà thầu tham dự lễ mở thầu
b. Chủ đầu tư, tổ chuyên gia và các nhà thầu tham dự thầu
c. Chủ đầu tư và các nhà thầu tham dự lễ mở thầu
d. Các phương án trên đều đúng
Đáp án đúng: A
Câu 301: Đối với đấu thầu qua mạng, nội dung nào sau đây là đúng?
a. Việc đánh giá HSDT được thực hiện trên bản chụp
b. Nhà thầu phải chịu trách nhiệm về tính thống nhất giữa bản gốc và bản chụp
c. Trường hợp có sự sai khác giữa bản gốc và bản chụp nhưng không làm thay đổi thứ tự xếp hạng nhà thầu thì căn cứ vào bản gốc để đánh giá
d. Các phương án trên đều sai
Đáp án đúng: B
Câu 302: Đối với nhà thầu liên danh, việc ký kết văn bản hợp đồng được thực hiện như thế nào?
a. Các thành viên liên danh có thể ủy quyền cho thành viên đứng đầu liên danh ký, đóng dấu (nếu có)
b. Tất cả thành viên tham gia liên danh phải trực tiếp ký, đóng dấu (nếu có)
c. Các thành viên liên danh có thể ủy quyền cho bất kỳ thành viên nào trong liên danh ký, đóng dấu (nếu có)
d. Bất kỳ thành viên nào trong liên danh cũng có thể đại diện ký, đóng dấu (nếu có)
Đáp án đúng: B
Câu 303: Nhà thầu thực hiện gói thầu xây lắp theo hình thức lựa chọn nhà thầu nào thì không phải thực hiện bảo đảm thực hiện hợp đồng?
a. Đấu thầu rộng rãi
b. Tự thực hiện
c. Đấu thầu hạn chế
d. Chào hàng cạnh tranh
Đáp án đúng: B
Câu 304: Chào giá trực tuyến theo quy trình thông thường được thực hiện ở bước nào trong quá trình lựa chọn nhà thầu?
a. Bước chuẩn bị lựa chọn nhà thầu
b. Bước đánh giá về tài chính
c. Bước thương thảo hợp đồng
d. Bước đánh giá hồ sơ đề xuất kỹ thuật
Đáp án đúng: B
Câu 305: Trong quá trình chào giá trực tuyến, thông tin nào của nhà thầu không được công khai trên Hệ thống mạng đấu thầu quốc gia?
a. Mức giá chào
b. Tên nhà thầu
c. Các yếu tố khác ngoài giá (nếu có)
d. Thời gian còn lại của phiên chào giá

Câu 306: Mua sắm trực tuyến có cần được phê duyệt trong kế hoạch lựa chọn nhà thầu không?
a. Không phải phê duyệt trong kế hoạch lựa chọn nhà thầu
b. Phải được phê duyệt trong kế hoạch lựa chọn nhà thầu

d. Chỉ phải phê duyệt trong kế hoạch lựa chọn nhà thầu đối với các gói thầu thuộc dự án đầu tư
Đáp án đúng: B
Câu 307: Khi có yêu cầu đặt hàng trong mua sắm trực tuyến, Hệ thống mạng đấu thầu quốc gia sẽ tự động gửi thông báo cho ai?
a. Nhà thầu đã trúng thầu thông qua hình thức mua sắm tập trung hoặc không tập trung trên Hệ thống mạng đấu thầu quốc gia
b. Nhà thầu đã trúng thầu trong mua sắm tập trung trước đó
c. Chủ đầu tư
d. Đơn vị mua sắm tập trung

Câu 308: Sau khi nhận được yêu cầu đặt hàng qua hình thức mua sắm trực tuyến, nhà thầu có bao nhiêu thời gian để xác nhận hoặc từ chối đơn hàng?
a. 24 giờ
b. 03 ngày làm việc
c. 05 ngày
d. 05 ngày làm việc
Đáp án đúng: B
Câu 309: Sau khi kết thúc chào giá trực tuyến, nếu có nhiều nhà thầu cùng chào giá thấp nhất bằng nhau, nhà thầu nào sẽ được xếp hạng thứ nhất?
a. Nhà thầu có năng lực tài chính tốt nhất
b. Nhà thầu chào giá đầu tiên thấp nhất
c. Nhà thầu nộp hồ sơ dự thầu sớm nhất
d. Yêu cầu các nhà thầu này chào lại giá

Câu 310: Chủ đầu tư phải gửi thông báo mời tham gia chào giá trực tuyến theo quy trình thông thường đến các nhà thầu đáp ứng yêu cầu kỹ thuật trong thời hạn tối thiểu bao lâu trước thời điểm bắt đầu chào giá?
a. 24 giờ
b. 03 ngày làm việc
c. 05 ngày
d. 05 ngày làm việc
Đáp án đúng: B
Câu 311: Đối với đấu thầu rộng rãi không qua mạng, nếu sau khi đóng thầu, nhà thầu tự phát hiện hồ sơ dự thầu thiếu tài liệu chứng minh năng lực, kinh nghiệm thì nhà thầu nên làm gì?
a. Trường hợp chủ đầu tư có yêu cầu bổ sung, làm rõ nhà thầu mới được bổ sung tài liệu chứng minh năng lực, kinh nghiệm
b. Được phép gửi tài liệu đến chủ đầu tư để làm rõ về năng lực, kinh nghiệm
c. Không được bổ sung tài liệu chứng minh năng lực, kinh nghiệm còn thiếu
d. Rút hồ sơ dự thầu để nộp lại
Đáp án đúng: B
Câu 312: Trường hợp nào nhà thầu được quyền từ chối hoàn thiện hợp đồng mà không bị đánh giá về uy tín khi tham dự thầu, không bị tịch thu bảo đảm dự thầu?
a. Nhà thầu được quyền từ chối hoàn thiện hợp đồng trong mọi trường hợp
b. Khi chủ đầu tư đưa ra các yêu cầu khi hoàn thiện hợp đồng không phù hợp với nội dung hồ sơ mời thầu, hồ sơ dự thầu
c. Khi nhà thầu đề nghị điều chỉnh đơn giá hạng mục mà nhà thầu đã chào theo yêu cầu của hồ sơ mời thầu nhưng chủ đầu tư không chấp nhận
d. Phương án B và C đều đúng
Đáp án đúng: B
Câu 313: Đối với đấu thầu không qua mạng, trường hợp hồ sơ dự thầu của nhà thầu có sai lệch thiếu sau khi hiệu chỉnh sai lệch vẫn được xếp hạng thứ nhất và hồ sơ dự thầu của nhà thầu này không có đơn giá của phần sai lệch thiếu, đơn giá nào sẽ được ưu tiên áp dụng đầu tiên để đề nghị trúng thầu?
a. Đơn giá trong dự toán gói thầu
b. Đơn giá tương ứng có giá trị thấp nhất trong các hồ sơ dự thầu khác vượt qua bước đánh giá về kỹ thuật
c. Đơn giá hình thành giá gói thầu
d. Đơn giá tương ứng có giá trị cao nhất trong các hồ sơ dự thầu khác vượt qua bước đánh giá về kỹ thuật
Đáp án đúng: D
Câu 314: Đối với gói thầu bảo hiểm, nhà thầu tham dự thầu có được xuất trình giấy chứng nhận bảo hiểm bảo lãnh do chính mình phát hành không?
a. Được dùng giấy chứng nhận bảo hiểm bảo lãnh do chính mình phát hành nếu nhà thầu là doanh nghiệp bảo hiểm uy tín
b. Không được dùng giấy chứng nhận bảo hiểm bảo lãnh do chính mình phát hành nếu giá trị bảo lãnh từ 50 triệu đồng trở lên, được dùng nếu giá trị bảo lãnh nhỏ hơn 50 triệu đồng
c. Chỉ được dùng giấy chứng nhận bảo hiểm bảo lãnh do chính mình phát hành nếu giá trị bảo lãnh nhỏ hơn 50 triệu đồng
d. Tất cả phương án đều sai
Đáp án đúng: A
Câu 315: Trường hợp sau khi có quyết định phê duyệt kết quả lựa chọn nhà thầu, nhà thầu không trúng thầu có yêu cầu giải thích về lý do cụ thể không trúng thầu, chủ đầu tư phải trả lời trong thời hạn bao lâu?
a. 02 ngày làm việc kể từ ngày được yêu cầu
b. 03 ngày làm việc kể từ ngày được yêu cầu
c. 05 ngày làm việc kể từ ngày được yêu cầu
d. 07 ngày làm việc kể từ ngày được yêu cầu

Câu 316: Đối với gói thầu đấu thầu trước, nhà thầu có phải thực hiện biện pháp bảo đảm dự thầu không?
a. Không phải thực hiện nhưng phải có cam kết trong đơn dự thầu
b. Bắt buộc phải thực hiện
c. Tuỳ thuộc vào quyết định của chủ đầu tư
d. Chỉ phải thực hiện đối với gói thầu có giá trị bảo đảm dự thầu trên 50 triệu đồng

Câu 317: Trường hợp các nhà thầu chào hàng hóa có cùng ký mã hiệu (nếu có), hãng sản xuất, năm sản xuất, xuất xứ Việt Nam nhưng có nhà thầu kê khai, có nhà thầu không kê khai hàng hóa này thuộc đối tượng ưu đãi thì chủ đầu tư xử lý thế nào?
a. Không tính ưu đãi của tất cả các nhà thầu tham dự

c. Chỉ xét ưu đãi cho các nhà thầu đã kê khai
d. Tính ưu đãi cho tất cả nhà nhà thầu tham dự mà không cần làm rõ với nhà thầu không kê khai

Câu 318: Đối với đấu thầu qua mạng, sau khi đánh giá E-HSDT, tổ trưởng tổ chuyên gia đính kèm bản scan báo cáo đánh giá E-HSDT lên Hệ thống mạng đấu thầu quốc gia với yêu cầu nào sau đây?

a. Chỉ Hiệp định CPTPP

c. Hiệp định CPTPP, Hiệp định EVFTA và Hiệp định Thương mại Tự do giữa Việt Nam và Liên hiệp Vương quốc Anh và Bắc Ailen (UKVFTA)

a. Hiệp định Đối tác Toàn diện và Tiến bộ Xuyên Thái Bình Dương (CPTPP)
b. Hiệp định thương mại tự do giữa Cộng hòa xã hội chủ nghĩa Việt Nam và Liên minh Châu Âu (EVFTA)
c. Hiệp định EVFTA và Hiệp định Thương mại Tự do giữa Việt Nam và Liên hiệp Vương quốc Anh và Bắc Ailen (UKVFTA)
d. Hiệp định Đối tác Kinh tế Toàn diện Khu vực (RCEP)

a. 01/7/2020

d. Việt Nam chưa phải là thành viên của GPA
