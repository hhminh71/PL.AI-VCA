Câu 331: Theo quy định tại Nghị định số 95/2020/NĐ-CP (được sửa đổi, bổ sung tại Nghị định số 09/2022/NĐ-CP, Nghị định số 17/2025/NĐ-CP), khái niệm Nước thành viên không bao gồm:
a. Nước thành viên Hiệp định Đối tác Toàn diện và Tiến bộ Xuyên Thái Bình Dương (CPTPP)
b. Nước thành viên EU
c. Vương quốc Anh và Bắc Ai-len
d. Các nước ASEAN chưa gia nhập Hiệp định CPTPP
Đáp án đúng: D
Câu 332: Đối với gói thầu thuộc phạm vi điều chỉnh của Hiệp định Đối tác Toàn diện và Tiến bộ Xuyên Thái Bình Dương (CPTPP), ngôn ngữ sử dụng trong đấu thầu nội khối là:
a. Chỉ tiếng Việt
b. Chỉ tiếng Anh
c. Tiếng Việt; hoặc tiếng Việt và tiếng Anh
d. Bất kỳ ngôn ngữ nào của các nước thành viên
Đáp án đúng: C
Câu 333: Theo quy định tại Thông tư số 21/2022/TT-BKHĐT, hồ sơ mời thầu gói thầu dịch vụ phi tư vấn không được đưa ra yêu cầu nào sau đây:
a. Yêu cầu về năng lực
b. Yêu cầu về kinh nghiệm
c. Yêu cầu nhà thầu phải có kinh nghiệm cung cấp dịch vụ trong lãnh thổ của một quốc gia cụ thể
d. Yêu cầu về chất lượng dịch vụ
Đáp án đúng: C
Câu 334: Trong Hiệp định Đối tác Toàn diện và Tiến bộ Xuyên Thái Bình Dương (CPTPP), việc áp dụng biện pháp ưu đãi trong nước:
a. Được phép áp dụng vĩnh viễn
b. Không bao giờ được phép áp dụng
c. Được phép áp dụng trong thời gian chuyển tiếp
d. Tùy quy mô, tính chất từng gói thầu
Đáp án đúng: C
Câu 335: Đối với gói thầu thuộc phạm vi điều chỉnh của Hiệp định Đối tác Toàn diện và Tiến bộ xuyên Thái Bình Dương (CPTPP), Nghị định số 95/2020/NĐ-CP quy định những hình thức lựa chọn nhà thầu nào?
a. Đấu thầu hạn chế và chỉ định thầu
b. Chỉ có chỉ định thầu
c. Đấu thầu rộng rãi và chỉ định thầu
d. Chỉ có đấu thầu rộng rãi
Đáp án đúng: A
Câu 336: Hiệp định Đối tác Toàn diện và Tiến bộ Xuyên Thái Bình Dương (CPTPP) có cho phép áp dụng đấu thầu qua mạng không?
a. Không cho phép
b. Bắt buộc phải áp dụng
c. Khuyến khích áp dụng
d. Tùy quy mô, tính chất từng gói thầu
Đáp án đúng: C
Câu 337: Gói thầu mua thuốc là gói thầu nào?
a. Gói thầu mua sắm hàng hóa
b. Gói thầu cung cấp dịch vụ phi tư vấn
c. Gói thầu hỗn hợp
d. Gói thầu xây lắp
Đáp án đúng: A
Câu 338: Đàm phán giá được áp dụng trong trường hợp nào sau đây?
a. Mua vật tư tiêu hao
b. Mua thuốc, thiết bị y tế, vật tư xét nghiệm chỉ có 01 hoặc 02 hãng sản xuất
c. Mua hàng hóa chỉ có 01 hãng sản xuất
d. Mua hàng hóa chỉ có 01 hoặc 02 hãng sản xuất
Đáp án đúng: B
Câu 339: Thời gian có hiệu lực thi hành của Luật số 90/2025/QH15?
a. Từ ngày 01 tháng 7 năm 2025
b. Từ ngày 04 tháng 8 năm 2025
c. Từ ngày 08 tháng 8 năm 2025
d. Tất cả các đáp án trên đều sai
Đáp án đúng: A
Câu 340: Thông tư số 80/2025/TT-BTC quy định chi tiết mẫu hồ sơ yêu cầu, báo cáo đánh giá, báo cáo thẩm định, kiểm tra, báo cáo tình hình thực hiện hoạt động đấu thầu có hiệu lực từ thời điểm nào?
a. Ngày 08/8/2025
b. Ngày 04/8/2025
c. Ngày 01/8/2025
d. Ngày 01/7/2025
Đáp án đúng: A
Câu 341: Nhận định nào sau đây về việc sử dụng hợp đồng điện tử đối với gói thầu sử dụng vốn ngân sách nhà nước là đúng?
a. Bắt buộc sử dụng hợp đồng điện tử đối với tất cả gói thầu tổ chức lựa chọn nhà thầu qua mạng và không qua mạng theo hình thức đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh, chào giá trực tuyến, mua sắm trực tuyến mà việc thanh toán hợp đồng được thực hiện qua Kho bạc nhà nước
b. Bắt buộc sử dụng hợp đồng điện tử đối với gói thầu áp dụng hình thức đặt hàng, chỉ định thầu, mua sắm trực tiếp, đàm phán giá, lựa chọn nhà thầu trong trường hợp đặc biệt, gói thầu có sự tham gia của cộng đồng, lựa chọn tư vấn cá nhân theo quy trình rút gọn
c. Bắt buộc sử dụng hợp đồng điện tử đối với các gói thầu mà việc thanh toán hợp đồng không được thực hiện qua Kho bạc nhà nước
d. Bắt buộc sử dụng hợp đồng điện tử đối với tất cả gói thầu tổ chức lựa chọn nhà thầu trên Hệ thống mạng đấu thầu Quốc gia theo hình thức đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh, chào giá trực tuyến, mua sắm trực tuyến mà việc thanh toán hợp đồng được thực hiện qua Kho bạc nhà nước
Đáp án đúng: D
Câu 342: Đối với gói thầu đã áp dụng sơ tuyển, trường hợp năng lực và kinh nghiệm của nhà thầu vượt qua bước sơ tuyển khi nộp E-HSDT có sự thay đổi so với khi tham dự sơ tuyển, thì nhà thầu cần phải?
a. Cập nhật lại năng lực và kinh nghiệm của mình khi tham dự thầu
b. Chỉ phải đính kèm hồ sơ năng lực và kinh nghiệm của mình khi tham dự thầu
c. Không phải cập nhật năng lực và kinh nghiệm của mình khi tham dự thầu nhưng phải đính kèm hồ sơ năng lực và kinh nghiệm
d. Phương án A và C đúng
Đáp án đúng: A
Câu 343: Đối với đấu thầu qua mạng, nội dung nào sau đây là đúng khi đánh giá E-HSDT?
a. Quy trình 02 áp dụng đối với gói thầu mua sắm hàng hóa, dịch vụ phi tư vấn, máy đặt, máy mượn theo phương thức một giai đoạn một túi hồ sơ, sử dụng phương pháp "giá thấp nhất" và các nhà thầu, E-HSDT đều không có bất kỳ ưu đãi nào
b. Hệ thống tự động xếp hạng nhà thầu theo giá dự thầu sau khi trừ đi giá trị giảm giá (nếu có) thấp nhất (không phải phê duyệt danh sách xếp hạng nhà thầu) đối với gói thầu áp dụng quy trình 02
c. Trường hợp có từ 02 nhà thầu trở lên cùng xếp thứ nhất thì không đánh giá theo quy trình 02 mà phải đánh giá theo quy trình 01
d. Cả 3 đáp án đều đúng
Đáp án đúng: D
Câu 344: Việc đánh giá E-HSDT gói thầu mua sắm hàng hóa theo quy trình 02 được thực hiện theo trình tự nào sau đây?
a. Đánh giá E-HSDT của tất cả nhà thầu tham dự thầu về: tính hợp lệ của E-HSDT; năng lực và kinh nghiệm; kỹ thuật. Trường hợp nhà thầu không đáp ứng bước trước thì không tiếp tục đánh giá bước tiếp theo
b. Đánh giá E-HSDT của nhà thầu xếp hạng thứ nhất về: tính hợp lệ của E-HSDT; năng lực và kinh nghiệm; kỹ thuật. Trường hợp nhà thầu xếp hạng thứ nhất không đáp ứng thì đánh giá đối với nhà thầu xếp hạng tiếp theo
c. Đánh giá E-HSDT của nhà thầu xếp hạng thứ nhất về: tính hợp lệ của E-HSDT; kỹ thuật; tài chính; năng lực và kinh nghiệm. Trường hợp nhà thầu xếp hạng thứ nhất không đáp ứng thì đánh giá đối với nhà thầu xếp hạng tiếp theo
d. Đánh giá E-HSDT của tất cả nhà thầu tham dự thầu về: tính hợp lệ của E-HSDT; kỹ thuật; tài chính; năng lực và kinh nghiệm. Trường hợp nhà thầu không đáp ứng bước trước thì không tiếp tục đánh giá bước tiếp theo
Đáp án đúng: B
Câu 345: Gói thầu phi tư vấn có giá gói thầu 2 tỷ đồng thực hiện đấu thầu rộng rãi qua mạng đóng thầu ngày 11/11/2025 (Thứ 3), Chủ đầu tư tiếp nhận nội dung yêu cầu làm rõ của nhà thầu ngày 04/11/2025. Chủ đầu tư phải trả lời yêu cầu làm rõ E-HSMT trên Hệ thống chậm nhất ngày nào dưới đây để đảm bảo không phải gia hạn thời điểm đóng thầu?
a. Thứ tư ngày 05/11/2025
b. Thứ năm ngày 06/11/2025
c. Thứ sáu ngày 07/11/2025
d. Thứ 7 ngày 08/11/2025
Đáp án đúng: C
Câu 346: Sau khi có quyết định phê duyệt kết quả lựa chọn nhà thầu, nhà thầu không trúng thầu có yêu cầu giải thích về lý do cụ thể không trúng thầu thì thủ tục thực hiện như thế nào?
a. Nhà thầu gửi văn bản giấy đến Chủ đầu tư yêu cầu giải thích lý do cụ thể không trúng thầu
b. Nhà thầu gửi đề nghị trên Hệ thống hoặc gặp trực tiếp Chủ đầu tư yêu cầu giải thích lý do cụ thể
c. Chủ đầu tư có trách nhiệm trả lời yêu cầu giải thích lý do cụ thể nhà thầu không trúng thầu trên Hệ thống trong thời hạn tối đa 05 ngày làm việc kể từ ngày nhận được đề nghị của nhà thầu
d. Chủ đầu tư gửi văn bản thông báo kết quả lựa chọn nhà thầu cho các nhà thầu tham dự thầu
Đáp án đúng: C
Câu 347: Đối với đấu thầu qua mạng, nhận định nào sau đây về thông báo chấp thuận E-HSDT và trao hợp đồng là đúng?
a. Sau khi đăng tải kết quả lựa chọn nhà thầu trên Hệ thống, Hệ thống tự động trích xuất và gửi thông báo đến các nhà thầu tham dự
b. Thông báo chấp thuận E-HSDT và trao hợp đồng là một phần của hồ sơ hợp đồng
c. Thời hạn nêu trong thông báo chấp thuận E-HSDT và trao hợp đồng được tính kể từ ngày gửi thông báo trên Hệ thống
d. Tất cả các phương án trên đều đúng
Đáp án đúng: D
Câu 348: Trong chào giá trực tuyến rút gọn, nhận định nào sau đây là đúng?
a. Đối với loại hợp đồng trọn gói, giá trần không được hiển thị trên Hệ thống mạng đấu thầu quốc gia
b. Đối với loại hợp đồng trọn gói, giá trần là giá gói thầu trong kế hoạch lựa chọn nhà thầu
c. Đối với loại hợp đồng theo đơn giá cố định hoặc đơn giá điều chỉnh, giá trần là giá gói thầu trong kế hoạch lựa chọn nhà thầu
d. Cả phương án B và C đều đúng
Đáp án đúng: D
Câu 349: Trong chào giá trực tuyến rút gọn, nhà thầu được coi là trúng thầu khi đáp ứng các điều kiện nào sau đây?
a. Đã thực hiện xác nhận về việc chấp thuận được trao hợp đồng trên Hệ thống và có giá dự thầu sau khi chào giá trực tuyến không vượt giá trần, thấp nhất
b. Đã thực hiện xác nhận về việc chấp thuận được trao hợp đồng trên Hệ thống và có giá dự thầu sau khi chào giá trực tuyến không vượt giá gói thầu, thấp nhất
c. Đã cung cấp các tài liệu chứng minh năng lực, kinh nghiệm theo yêu cầu của E-HSMT và có giá dự thầu sau khi chào giá trực tuyến không vượt giá trần, thấp nhất
d. Đã đính kèm hồ sơ dự thầu trên Hệ thống và có giá dự thầu sau khi chào giá trực tuyến không vượt giá gói thầu, thấp nhất
Đáp án đúng: A
Câu 350: Trường hợp gặp sự cố dẫn đến Hệ thống mạng đấu thầu quốc gia không thể vận hành thì việc mở thầu đối với các gói thầu có thời điểm đóng thầu trước thời điểm Hệ thống gặp sự cố nhưng chưa mở thầu được thực hiện như thế nào?
a. Chủ đầu tư tổ chức mở thầu trên Hệ thống trong thời hạn tối đa 02 giờ kể từ thời điểm sự cố được khắc phục
b. Chủ đầu tư tổ chức mở thầu trên Hệ thống trong thời hạn tối đa 12 giờ kể từ thời điểm sự cố được khắc phục
c. Chủ đầu tư tổ chức mở thầu trên Hệ thống trong thời hạn tối đa 24 giờ kể từ thời điểm sự cố được khắc phục
d. Không có phương án nào đúng
Đáp án đúng: A
Câu 351: Trường hợp gặp sự cố dẫn đến Hệ thống mạng đấu thầu quốc gia không thể vận hành và việc khắc phục sự cố dự kiến diễn ra trong thời gian dài, Bộ Tài chính thông báo ở đâu?
a. Cổng thông tin điện tử của Chính phủ
b. Cổng thông tin điện tử của Bộ Tài chính
c. Hệ thống mạng đấu thầu quốc gia
d. Tất cả phương án trên đều đúng
Đáp án đúng: C
Câu 352: Đối với gói thầu mua sắm hàng hóa, trường hợp cần yêu cầu về hàng mẫu để đánh giá về kỹ thuật thì nhận định nào sau đây là đúng?
a. Nhà thầu có thể nộp bổ sung hàng mẫu trong thời hạn 05 ngày làm việc sau thời điểm đóng thầu
b. Chủ đầu tư phải bảo đảm việc yêu cầu cung cấp hàng mẫu không dẫn đến làm tăng chi phí của gói thầu, hạn chế sự tham gia của nhà thầu hoặc nhằm tạo lợi thế cho một hoặc một số nhà thầu gây ra sự cạnh tranh không bình đẳng
c. Phương án A và B đều sai
d. Phương án A và B đều đúng
Đáp án đúng: D
Câu 353: Đối với gói thầu mua sắm hàng hóa, dịch vụ có giá trị dưới 500 triệu đồng áp dụng lựa chọn nhà thầu theo hình thức mua sắm trực tuyến, việc ký kết hợp đồng được thực hiện như thế nào?
a. Bắt buộc ký hợp đồng điện tử trên Hệ thống mạng đấu thầu quốc gia
b. Không bắt buộc ký hợp đồng điện tử, chủ đầu tư quyết định hình thức ký kết
c. Ký hợp đồng điện tử trên Hệ thống khi việc thanh toán hợp đồng được thực hiện qua Kho bạc nhà nước
d. Không ký hợp đồng điện tử đối với gói thầu có giá trị nhỏ hơn 500 triệu đồng
Đáp án đúng: C
Câu 354: Nhận định nào sau đây là không phù hợp đối với gói thầu mua sắm hàng hoá áp dụng chào giá trực tuyến theo quy trình rút gọn?
a. Chủ đầu tư được nêu yêu cầu cụ thể về xuất xứ, ký mã hiệu, nhãn hiệu, hãng sản xuất, thông số kỹ thuật của hàng hóa và các yêu cầu khác (nếu có) như: lắp đặt, đào tạo, bảo hành...
b. Chủ đầu tư cần nghiên cứu để đưa ra khoảng thời gian phù hợp giữa ngày giao hàng sớm nhất và ngày giao hàng muộn nhất
c. Nhà thầu sẽ không đề xuất ngày giao hàng cụ thể mà chỉ cam kết tuân thủ theo yêu cầu của chủ đầu tư tại E-TBMT
d. Trong quá trình chào giá, mức giá do các nhà thầu chào và tên nhà thầu được công khai trên Hệ thống mạng đấu thầu quốc gia
Đáp án đúng: D
Câu 355: Đối với gói thầu áp dụng theo phương thức một giai đoạn một túi hồ sơ, căn cứ vào E-HSDT của các nhà thầu đã nộp trên Hệ thống và phương pháp đánh giá E-HSDT quy định trong E-HSMT, tổ chuyên gia được chọn quy trình 02 để đánh giá E-HSDT trong trường hợp nào sau đây?
a. Gói thầu mua sắm hàng hóa, dịch vụ phi tư vấn, máy đặt, máy mượn theo phương thức một giai đoạn một túi hồ sơ, sử dụng phương pháp “giá thấp nhất” và các nhà thầu, E-HSDT đều không có bất kỳ ưu đãi nào
b. Gói thầu mua sắm hàng hóa, dịch vụ tư vấn theo phương thức một giai đoạn một túi hồ sơ, sử dụng phương pháp “giá thấp nhất” và các nhà thầu, E-HSDT đều không có bất kỳ ưu đãi nào
c. Gói thầu xây lắp theo phương thức một giai đoạn một túi hồ sơ, sử dụng phương pháp “giá thấp nhất”
d. Cả 3 phương án đều sai
Đáp án đúng: A
Câu 356: Khi xây dựng hồ sơ yêu cầu đối với hình thức chỉ định thầu, chủ đầu tư quy định nhà thầu chuẩn bị 01 bản gốc và tối đa bao nhiêu bản chụp hồ sơ đề xuất?
a. 01 bản chụp
b. 02 bản chụp
c. 03 bản chụp
d. 04 bản chụp
Đáp án đúng: C
Câu 357: Trong chào giá trực tuyến theo quy trình rút gọn gói thầu hàng hóa, phát biểu nào sau đây không đúng?
a. Đối với lần chào giá đầu tiên nhà thầu nhập các trọng số là đơn giá của hàng hóa nhà thầu dự kiến xác định sẽ chào
b. Nhà thầu không được thay đổi trọng số của từng hạng mục hàng hóa trong quá trình chào giá
c. Nhà thầu cần nghiên cứu công thức tính thành tiền và đơn giá dự thầu từ các trọng số để đề xuất các trọng số cho phù hợp
d. Nhà thầu phải điền các trọng số về đơn giá (N1, N2,...) của từng hạng mục
Đáp án đúng: B
Câu 358: Trong chào giá trực tuyến theo quy trình rút gọn, khi nhập trọng số trong lần chào giá đầu tiên, nhà thầu cần làm gì?
a. Nhập ngẫu nhiên các giá trị trọng số
b. Nhập trọng số bằng giá trị khối lượng từng hạng mục
c. Nhập trọng số là đơn giá dự kiến chào cho từng hạng mục
d. Không cần nhập trọng số, hệ thống sẽ tự động tính
Đáp án đúng: C
Câu 359: Khi đánh giá E-HSDT đối với gói thầu mua sắm hàng hóa, trường hợp có sự sai khác giữa thông tin kê khai về ký mã hiệu, nhãn hiệu, xuất xứ, hãng sản xuất trong bảng đề xuất về hàng hóa của nhà thầu (Mẫu số 10B chương IV) so với tài liệu đính kèm thì Tổ chuyên gia đánh giá như thế nào?
a. Đánh giá theo thông tin trong tài liệu đính kèm trong trường hợp sau khi làm rõ E-HSDT thông tin trong tài liệu đính kèm là chính xác
b. Đánh giá theo thông tin trong Mẫu số 10B nhà thầu kê khai, trừ trường hợp ký mã hiệu (nếu có), nhãn hiệu, hãng sản xuất kê khai tại Mẫu số 10B không tồn tại trên thị trường
c. Loại nhà thầu E-HSDT của nhà thầu do có sự sai khác giữa thông tin kê khai và tài liệu đính kèm
d. Phương án A và B đều đúng
Đáp án đúng: B
Câu 360: Đối với đấu thầu qua mạng, khi tham dự gói thầu mua sắm hàng hóa, trong bảng đề xuất về hàng hóa (Mẫu số 10B chương IV), nhà thầu A chào “theo catalog đính kèm” thay vì kê khai thông tin theo Mẫu số 10B. Tổ chuyên gia đánh giá nội dung này trong E-HSDT của nhà thầu như thế nào là phù hợp?
a. Tổ chuyên gia đánh giá nội dung này theo Catalog nhà thầu A đính kèm. Nội dung này được tiếp tục đánh giá khi Catalog không tham chiếu đến nhiều hơn 01 ký mã hiệu, nhãn hiệu, hãng sản xuất... cho một loại hàng hóa
b. Báo cáo chủ đầu tư yêu cầu nhà thầu A làm rõ nội dung này nếu Catalog tham chiếu đến nhiều hơn 01 ký mã hiệu, nhãn hiệu, hãng sản xuất... cho một loại hàng hóa để làm cơ sở đánh giá
c. E-HSDT của nhà thầu A không được xem xét, đánh giá
d. Phương án A và B đều đúng
Đáp án đúng: C
Câu 361: Đối với đấu thầu qua mạng, khi tham dự gói thầu mua sắm hàng hóa, trong bảng đề xuất về hàng hóa (Mẫu số 10B chương IV), nhà thầu A chào "không có" đối với nội dung ký, mã hiệu. Tuy nhiên, trong quá trình đánh giá, Tổ chuyên gia phát hiện hãng sản xuất có ký, mã hiệu của hàng hóa này. Tổ chuyên gia đánh giá như thế nào trong tình huống này?
a. Báo cáo chủ đầu tư yêu cầu nhà thầu A làm rõ nội dung này trên Hệ thống
b. E-HSDT không được xem xét, đánh giá
c. Tiếp tục xem xét, đánh giá nếu tài liệu đính kèm của nhà thầu đầy đủ thông tin
d. Cả 3 phương án đều sai
Đáp án đúng: B
Câu 362: Trường hợp gói thầu đủ điều kiện áp dụng hình thức chỉ định thầu theo quy định tại khoản 1 Điều 78 của Nghị định số 214/2025/NĐ-CP nhưng chủ đầu tư quyết định áp dụng hình thức đấu thầu rộng rãi để lựa chọn nhà thầu thì thời gian chuẩn bị hồ sơ dự thầu là?
a. Tối thiểu là 18 ngày kể từ ngày đầu tiên hồ sơ mời thầu được phát hành đến ngày có thời điểm đóng thầu
b. Tối thiểu là 09 ngày làm việc kể từ ngày đầu tiên hồ sơ mời thầu được phát hành đến ngày có thời điểm đóng thầu
c. Tối thiểu là 09 ngày kể từ ngày đầu tiên hồ sơ mời thầu được phát hành đến ngày có thời điểm đóng thầu
d. Tối thiểu là 18 ngày làm việc kể từ ngày đầu tiên hồ sơ mời thầu được phát hành đến ngày có thời điểm đóng thầu
Đáp án đúng: C
Câu 363: Đối với đấu thầu không qua mạng, trường hợp nhà thầu có thư giảm giá, việc hiệu chỉnh sai lệch được thực hiện trên cơ sở nào?
a. Giá dự thầu của nhà thầu sau khi trừ đi giá trị giảm giá
b. Giá đề nghị trúng thầu
c. Giá gói thầu
d. Giá dự thầu của nhà thầu chưa trừ đi giá trị giảm giá
Đáp án đúng: D
Câu 364: Đối với gói thầu mua sắm hàng hóa tổ chức đấu thầu rộng rãi qua mạng, trường hợp nhà thầu là liên danh thì nhà thầu chứng minh khả năng thực hiện nghĩa vụ bảo hành như thế nào?
a. Từng thành viên liên danh phải cam kết có năng lực thực hiện nghĩa vụ bảo hành theo yêu cầu của E-HSMT và có hợp đồng nguyên tắc với đơn vị có đủ khả năng thực hiện nghĩa vụ bảo hành theo yêu cầu của E-HSMT
b. Từng thành viên liên danh phải cam kết có năng lực tự thực hiện nghĩa vụ bảo hành theo yêu cầu của E-HSMT hoặc có hợp đồng nguyên tắc với đơn vị có đủ khả năng thực hiện nghĩa vụ bảo hành theo yêu cầu của E-HSMT
c. Nhà thầu liên danh có cam kết có năng lực thực hiện nghĩa vụ bảo hành theo yêu cầu của E-HSMT và có hợp đồng nguyên tắc với đơn vị có đủ khả năng thực hiện nghĩa vụ bảo hành theo yêu cầu của E-HSMT
d. Nhà thầu liên danh có cam kết có năng lực tự thực hiện nghĩa vụ bảo hành theo yêu cầu của E-HSMT hoặc có hợp đồng nguyên tắc với đơn vị có đủ khả năng thực hiện nghĩa vụ bảo hành theo yêu cầu của E-HSMT
Đáp án đúng: D
Câu 365: Nội dung nào là không phù hợp quy định đối với yêu cầu về nhân sự chủ chốt của gói thầu mua sắm hàng hóa?
a. Không được yêu cầu về huy động nhân sự chủ chốt đối với phần công việc cung cấp hàng hóa
b. Chỉ được yêu cầu về huy động nhân sự chủ chốt đối với các dịch vụ liên quan có yếu tố đặc thù, phức tạp cần thiết phải có nhân sự có hiểu biết, nhiều kinh nghiệm đảm nhận
c. Được yêu cầu về huy động nhân sự chủ chốt đối với phần công việc cung cấp hàng hóa mà hàng hóa đó có tính đặc thù cần sự khẳng định của nhà sản xuất, nhà cung cấp để đảm bảo tính khả thi trong việc cung cấp hàng hóa
d. Không được nêu yêu cầu huy động về nhân sự chủ chốt đối với hàng hóa thông dụng, sẵn có trên thị trường, không đòi hỏi nhân sự thực hiện các dịch vụ liên quan phải có trình độ cao
Đáp án đúng: C
Câu 366: Quy định nào dưới đây không đúng về kế hoạch lựa chọn nhà thầu?
a. Kế hoạch lựa chọn nhà thầu được lập cho toàn bộ dự án, dự toán mua sắm. Trường hợp chưa đủ điều kiện lập kế hoạch lựa chọn nhà thầu cho toàn bộ dự án, dự toán mua sắm thì lập kế hoạch lựa chọn nhà thầu cho một hoặc một số gói thầu để thực hiện trước
b. Kế hoạch lựa chọn nhà thầu có thể được lập đồng thời với quá trình lập dự án, dự toán mua sắm hoặc trước khi có quyết định phê duyệt dự án đối với gói thầu cần thực hiện trước khi có quyết định phê duyệt dự án
c. Trường hợp gói thầu có thời gian thực hiện dài hơn 01 năm, giá gói thầu trong kế hoạch lựa chọn nhà thầu được ghi rõ theo chu kỳ 01 năm hoặc trên cơ sở toàn bộ thời gian thực hiện gói thầu
d. Kế hoạch lựa chọn nhà thầu phải ghi rõ số lượng gói thầu và nội dung của từng gói thầu
Đáp án đúng: C
Câu 367: Trường hợp Hệ thống chưa trích xuất tự động thông tin về nghĩa vụ nộp thuế của nhà thầu thì nhà thầu nộp tài liệu nào để chứng minh nghĩa vụ nộp thuế?
a. Phải bao gồm Tờ khai thuế (thông báo nộp tiền của cơ quan thuế đối với hộ kinh doanh) và giấy nộp tiền có xác nhận của cơ quan thuế được in từ Hệ thống thuế điện tử
b. Phải bao gồm Tờ khai thuế (thông báo nộp tiền của cơ quan thuế đối với hộ kinh doanh) và xác nhận của cơ quan thuế về việc thực hiện nghĩa vụ thuế
c. Phải bao gồm Tờ khai thuế (thông báo nộp tiền của cơ quan thuế đối với hộ kinh doanh), giấy nộp tiền có xác nhận của cơ quan thuế được in từ Hệ thống thuế điện tử và xác nhận của cơ quan thuế về việc thực hiện nghĩa vụ thuế
d. Phương án A hoặc B đúng
Đáp án đúng: D
Câu 368: Việc phê duyệt dự toán đối với phần công việc tùy chọn mua thêm được áp dụng tại thời điểm nào?
a. Trước khi phê duyệt kế hoạch lựa chọn nhà thầu, chủ đầu tư phê duyệt dự toán đối với khối lượng mua thêm
b. Trước khi phê duyệt kế hoạch lựa chọn nhà thầu, chủ đầu tư trình cấp có thẩm quyền phê duyệt dự toán đối với khối lượng mua thêm
c. Trong quá trình thực hiện hợp đồng, trường hợp sử dụng khối lượng tùy chọn mua thêm, trước khi thực hiện chủ đầu tư phê duyệt dự toán cho khối lượng mua thêm
d. Không phải phê duyệt dự toán tùy chọn mua thêm
Đáp án đúng: C
Câu 369: Ban Quản lý dự án đầu tư xây dựng tỉnh tổ chức đấu thầu rộng rãi qua mạng đối với gói thầu xây lắp. Nhà thầu A được xếp hạng nhất tại gói thầu này, tuy nhiên, do trong E-HSDT, nhà thầu A đề xuất 01 nhân sự chủ chốt đã huy động cho hợp đồng khác có thời gian làm việc trùng với thời gian thực hiện gói thầu này. Trong trường hợp này, tổ chuyên gia đánh giá về nhân sự chủ chốt của nhà thầu A như thế nào?
a. Nhà thầu A bị loại và không được xem xét trúng thầu
b. Chủ đầu tư cho phép nhà thầu bổ sung, thay thế tối đa hai lần. Trường hợp nhà thầu không có nhân sự thay thế đáp ứng yêu cầu của E-HSMT thì nhà thầu A bị loại và bị đánh giá về uy tín khi tham dự thầu
c. Tiếp tục đánh giá theo cam kết của nhà thầu trong đơn dự thầu và xét duyệt trúng thầu đối với nhà thầu A
d. Nhà thầu A bị loại và bị đánh giá là gian lận trong kê khai về nhân sự chủ chốt
Đáp án đúng: B
Câu 370: Tại Mục 2.1 Chương III E-HSMT gói thầu xây lắp quy định nội dung sau: Trong thời gian từ 01/01/2022 đến thời điểm đóng thầu (năm 2025), nhà thầu đã hoàn thành toàn bộ hoặc hoàn thành phần lớn 01 công trình cấp II, có giá trị là 10 tỷ đồng với tư cách là nhà thầu chính (độc lập hoặc thành viên liên danh), nhà thầu quản lý hoặc nhà thầu phụ. Trường hợp nào sau đây nhà thầu được đánh giá là không đáp ứng yêu cầu về kinh nghiệm thực hiện hợp đồng tương tự?
a. Nhà thầu đã hoàn thành toàn bộ 02 công trình cấp III có giá trị lần lượt là 9 tỷ đồng và 11 tỷ đồng; các hợp đồng được ký kết năm 2022, hoàn thành năm 2025 (trước thời điểm đóng thầu)
b. Nhà thầu đã hoàn thành toàn bộ 01 công trình cấp II có giá trị là 10 tỷ đồng, hợp đồng được ký kết năm 2018, hoàn thành năm 2022
c. Nhà thầu đã hoàn thành toàn bộ 01 công trình cấp II có giá trị là 10 tỷ đồng, hợp đồng được ký kết năm 2022, hoàn thành năm 2025 (trước thời điểm đóng thầu)
d. Tất cả phương án trên đều đáp ứng yêu cầu về kinh nghiệm thực hiện hợp đồng tương tự
Đáp án đúng: A
Câu 371: Nhà thầu đã thực hiện công tác lập hồ sơ thiết kế kỹ thuật cho dự án đầu tư xây dựng công trình được phép thực hiện công việc nào?
a. Lập hồ sơ mời thầu cho các gói thầu xây lắp, mua sắm hàng hóa thuộc dự án
b. Lập kế hoạch lựa chọn nhà thầu
c. Cung cấp dịch vụ tư vấn giám sát thi công công trình của dự án
d. Tất cả các phương án trên đều đúng
Đáp án đúng: D
Câu 372: Nội dung nào sau đây không thuộc trách nhiệm của chủ đầu tư?
a. Lập báo cáo đánh giá hồ sơ dự thầu
b. Thương thảo hợp đồng
c. Phê duyệt hồ sơ mời thầu
d. Yêu cầu nhà thầu làm rõ hồ sơ dự thầu
Đáp án đúng: A
Câu 373: Nhà thầu tư vấn lập hồ sơ mời thầu gói thầu xây lắp được phép tham dự thầu gói thầu nào?
a. Tư vấn đánh giá hồ sơ dự thầu gói thầu xây lắp mà mình đã lập hồ sơ mời thầu

        // ================= BIẾN TOÀN CỤC =================
        let allQuestions = [];
        let currentQuiz = [];
        let timerInterval = null;
        let secondsElapsed = 0;
        let isSubmitted = false;
        let score = 0;
        
        // ================= 2. PARSER: XỬ LÝ DỮ LIỆU THÔ =================
        function parseQuestions(raw) {
            const questions = [];
            // Regex tìm các khối bắt đầu bằng "Câu <số>:"
            const regex = /(?:Câu\s+\d+\s*:|Câu\s+\d+\s*\.)([\s\S]*?)(?=Câu\s+\d+\s*:|Câu\s+\d+\s*\.|$)/gi;
            let match;
            let idCounter = 1;

            while ((match = regex.exec(raw)) !== null) {
                let block = match[1].trim();
                
                // Trích xuất đáp án đúng
                let correctMatch = block.match(/Đáp án đúng:\s*([a-dA-D])/i);
                if (!correctMatch) continue;
                let correctLetter = correctMatch[1].toUpperCase();
                
                // Loại bỏ dòng "Đáp án đúng:" khỏi khối để dễ parse
                block = block.replace(/Đáp án đúng:.*$/im, '').trim();
                
                // Tách câu hỏi và các lựa chọn (Dựa trên a., b., c., d.)
                const optionRegex = /(?:\n|^)\s*([a-dA-D])[\.\)]\s+/i;
                const parts = block.split(optionRegex);
                
                if (parts.length < 9) continue; // Phải có đủ câu hỏi và 4 đáp án
                
                const qText = parts[0].trim();
                const options = [];
                let correctOptionId = null;

                for (let i = 1; i < parts.length; i += 2) {
                    const optLetter = parts[i].toUpperCase();
                    const optText = parts[i+1].trim();
                    options.push({ id: optLetter, text: optText });
                    if (optLetter === correctLetter) {
                        correctOptionId = optLetter;
                    }
                }

                questions.push({
                    id: idCounter++,
                    originalTitle: match[0].split(':')[0].trim(), // Ví dụ: Câu 2
                    text: qText,
                    options: options,
                    correctId: correctOptionId
                });
            }
            return questions;
        }

        // ================= 3. UTILITIES =================
        // Thuật toán xáo trộn mảng (Fisher-Yates)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Loại bỏ dấu Tiếng Việt
        function removeDiacritics(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
        }

        // Tạo Regex thông minh để Highlight bỏ dấu
        const charMap = {
            'a': '[aAáÁàÀảẢãÃạẠăĂắẮằẰẳẲẵẴặẶâÂấẤầẦẩẨẫẪậẬ]',
            'e': '[eEéÉèÈẻẺẽẼẹẸêÊếẾềỀểỂễỄệỆ]',
            'i': '[iIíÍìÌỉỈĩĨịỊ]',
            'o': '[oOóÓòÒỏỎõÕọỌôÔốỐồỒổỔỗỖộỘơƠớỚờỜởỞỡỠợỢ]',
            'u': '[uUúÚùÙủỦũŨụỤưƯứỨừỪửỬữỮựỰ]',
            'y': '[yYýÝỳỲỷỶỹỸỵỴ]',
            'd': '[dDđĐ]'
        };
        function createHighlightRegex(query) {
            let regexStr = '';
            const normalized = removeDiacritics(query).toLowerCase();
            for (let char of normalized) {
                if (charMap[char]) {
                    regexStr += charMap[char];
                } else if (/[a-z0-9]/i.test(char)) {
                    regexStr += char;
                } else {
                    regexStr += '\\' + char; 
                }
            }
            return new RegExp(`(${regexStr})`, 'gi');
        }

        function highlightText(text, regex) {
            if (!regex) return text;
            return text.replace(regex, '<mark>$1</mark>');
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

                tabQuiz.classList.remove('hidden-tab');
                tabReview.classList.add('hidden-tab');
                
                btnQuiz.className = "flex-1 bg-white text-blue-700 font-bold py-1.5 px-3 rounded-t-md shadow-inner border-b-2 border-transparent";
                btnReview.className = "flex-1 bg-blue-800 text-blue-100 font-semibold py-1.5 px-3 rounded-t-md hover:bg-blue-600 border-b-2 border-transparent";
            } else {
                tabQuiz.classList.add('hidden-tab');
                tabReview.classList.remove('hidden-tab');
                
                btnReview.className = "flex-1 bg-white text-blue-700 font-bold py-1.5 px-3 rounded-t-md shadow-inner border-b-2 border-transparent";
                btnQuiz.className = "flex-1 bg-blue-800 text-blue-100 font-semibold py-1.5 px-3 rounded-t-md hover:bg-blue-600 border-b-2 border-transparent";
                
                renderReview(); // Render lại khi chuyển qua để đảm bảo DOM sẵn sàng
            }
        }

        // ================= 5. TÍNH NĂNG THI THỬ (QUIZ) =================
        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timerDisplay').textContent = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timerDisplay').textContent = formatTime(secondsElapsed);
            }, 1000);
        }

        function startQuiz() {
            isSubmitted = false;
            score = 0;
            
            // Xóa style và reset UI
            document.getElementById('scoreDisplay').classList.add('hidden');
            document.getElementById('btnShareTop').classList.add('hidden');
            document.getElementById('btnShareBottom').classList.add('hidden');
            document.getElementById('bottomControls').classList.add('hidden');
            
            // Random 40 câu hỏi
            const shuffledAll = shuffleArray(allQuestions);
            currentQuiz = shuffledAll.slice(0, 40);

            // Xáo trộn đáp án cho mỗi câu
            currentQuiz = currentQuiz.map(q => ({
                ...q,
                shuffledOptions: shuffleArray(q.options)
            }));

            renderQuiz();
            startTimer();
            loadHighScore();
            
            window.scrollTo(0, 0);
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            currentQuiz.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = "bg-white p-3 rounded shadow-sm border border-gray-200 text-sm";
                
                // Tiêu đề
                const qTitle = document.createElement('div');
                qTitle.className = "font-bold text-gray-900 mb-2";
                qTitle.innerHTML = `<span class="text-blue-700">Câu ${index + 1}:</span> ${q.text}`;
                qDiv.appendChild(qTitle);

                // Các lựa chọn
                const optList = document.createElement('div');
                optList.className = "space-y-1.5";
                
                q.shuffledOptions.forEach(opt => {
                    const label = document.createElement('label');
                    label.id = `label_q${index}_${opt.id}`;
                    label.className = "flex items-start p-2 rounded bg-gray-50 border border-gray-200 cursor-pointer transition-colors hover:bg-blue-50";
                    
                    const input = document.createElement('input');
                    input.type = "radio";
                    input.name = `quiz_q${index}`;
                    input.value = opt.id;
                    input.className = "mt-0.5 mr-2 w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 flex-shrink-0";
                    
                    const span = document.createElement('span');
                    span.className = "flex-1";
                    span.textContent = opt.text;

                    label.appendChild(input);
                    label.appendChild(span);
                    optList.appendChild(label);
                });

                qDiv.appendChild(optList);
                container.appendChild(qDiv);
            });
            
            document.getElementById('bottomControls').classList.remove('hidden');
        }

        function submitQuiz() {
            if (isSubmitted) return;
            clearInterval(timerInterval);
            isSubmitted = true;
            score = 0;

            currentQuiz.forEach((q, index) => {
                const selectedInput = document.querySelector(`input[name="quiz_q${index}"]:checked`);
                const selectedId = selectedInput ? selectedInput.value : null;

                // Disable tất cả input
                const allInputs = document.querySelectorAll(`input[name="quiz_q${index}"]`);
                allInputs.forEach(inp => inp.disabled = true);

                if (selectedId === q.correctId) {
                    score++;
                }

                // Đổi màu
                q.shuffledOptions.forEach(opt => {
                    const label = document.getElementById(`label_q${index}_${opt.id}`);
                    label.classList.remove('bg-gray-50', 'hover:bg-blue-50', 'border-gray-200');
                    
                    if (opt.id === q.correctId) {
                        // Đáp án đúng luôn xanh
                        label.classList.add('bg-green-100', 'border-green-500', 'text-green-900', 'font-semibold');
                        label.querySelector('span').innerHTML += ' <span class="text-green-600 ml-1">✔️</span>';
                    } else if (opt.id === selectedId) {
                        // Trả lời sai
                        label.classList.add('bg-red-100', 'border-red-500', 'text-red-900');
                        label.querySelector('span').innerHTML += ' <span class="text-red-600 ml-1">✖️</span>';
                    } else {
                        // Các đáp án khác
                        label.classList.add('opacity-60', 'bg-gray-100', 'border-gray-200');
                    }
                });
            });

            // Hiển thị điểm
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = `Điểm: ${score}/40`;
            scoreDisplay.classList.remove('hidden');
            
            // Nút chia sẻ
            document.getElementById('btnShareTop').classList.remove('hidden');
            document.getElementById('btnShareBottom').classList.remove('hidden');

            // Lưu điểm cao
            saveHighScore(score);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================= 6. LƯU ĐIỂM CAO & CHIA SẺ =================
        function loadHighScore() {
            const high = localStorage.getItem('quiz_dauthau_high');
            const hsDisplay = document.getElementById('highScoreDisplay');
            if (high) {
                hsDisplay.textContent = `⭐ Cao nhất: ${high}/40`;
                hsDisplay.classList.remove('hidden');
            }
        }

        function saveHighScore(currentScore) {
            const high = localStorage.getItem('quiz_dauthau_high') || 0;
            if (currentScore > parseInt(high)) {
                localStorage.setItem('quiz_dauthau_high', currentScore);
                loadHighScore();
            }
        }

        function shareResult() {
            const timeStr = document.getElementById('timerDisplay').textContent;
            const textToShare = `🎓 Trắc Nghiệm Luật Đấu Thầu\n📝 Điểm số: ${score}/40\n⏱ Thời gian: ${timeStr}\n#HuanLuyenDaotao #CangHKQTCTho`;
            
            // Create a temporary textarea for clipboard copying (Compatible with iframe)
            const el = document.createElement('textarea');
            el.value = textToShare;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            // Show toast
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }
