# 🏢 QĐ 4127/QĐ-TCTCHKVN<br/>Quy trình bảo trì công trình Hàng không dân dụng

## 🏢 PHẦN I: CÔNG TRÌNH NHÀ GA
- **1. Quy định chung**
  - 🎯 Mục đích: Duy trì cảnh quan, khả năng chịu lực, an toàn khai thác
  - 📂 Phân loại: Xử lý sự cố ngay (1-2 ngày) & Bảo dưỡng định kỳ
  - 👥 Trách nhiệm: Chủ sở hữu / Đơn vị quản lý / Đơn vị sử dụng
  - 📁 Hồ sơ: Hoàn công, lý lịch thiết bị, tiêu chuẩn kỹ thuật
- **2. Lưu đồ thực hiện**
  - 📥 Tiếp nhận thông tin & Khảo sát
  - 💰 Lập kinh phí & Kế hoạch
  - ✍️ Phê duyệt
  - 🛠️ Thực hiện bảo trì
  - ✅ Nghiệm thu & Thanh toán
  - 🗄️ Lưu trữ hồ sơ
- **3. Nội dung bảo trì chi tiết các hệ thống**
  - 🧱 **Kiến trúc:** Trần, tường, sàn, vách kính, cửa, vệ sinh công nghiệp
  - 🏗️ **Kết cấu:** Bê tông, thép, nền móng (Kiểm tra ban đầu, thường xuyên, định kỳ, đột xuất, quan trắc lún/võng)
  - 🚰 **Cấp thoát nước:** Đường ống, trạm bơm, bể chứa, bể tự hoại
  - 🚒 **PCCC:** Tủ trung tâm báo cháy, chuông đèn, bơm chữa cháy, bình bọt/CO2
  - ⚡ **Điện & Chống sét:** Tủ phân phối, trạm biến áp, máy phát dự phòng, tiếp địa
  - 🛗 **Thang máy:** Tủ điều khiển, máy kéo, cabin, cáp, giếng thang
  - 📡 **Thông tin liên lạc:** Phần cứng, phần mềm, xử lý lỗi hệ thống
  - ❄️ **Điều hòa không khí (HVAC):** Cục nóng/lạnh, màng lọc, hệ thống giải nhiệt nước (Chiller, tháp giải nhiệt)

## ✈️ PHẦN II: DUY TU BẢO DƯỠNG KHU BAY
- **1. Quản lý công tác**
  - 🗂️ Lưu trữ hồ sơ: Cục HK (Bản gốc), Cảng vụ (Bản sao), Doanh nghiệp CHK, Đơn vị trực tiếp DTBD
  - 👮 Trách nhiệm: Cục HK (Quản lý nhà nước) -> Cảng vụ -> Doanh nghiệp khai thác
- **2. Công tác kiểm tra (Theo dõi PCI & PCN)**
  - 🔍 Thường xuyên: Hàng ngày (Phát hiện vật ngoại lai - FOD, hư hỏng)
  - 📅 Định kỳ: Tháng, Quý, Trước/Sau mùa mưa (Đo ma sát, kiểm tra thoát nước)
  - 🚨 Đột xuất: Sau sự cố (bão lụt, động đất, va chạm)
  - 🔬 Đặc biệt: Đánh giá sức chịu tải (PCN), Chỉ số trạng thái bề mặt (PCI)
- **3. Phân loại & Xử lý hư hỏng mặt đường**
  - 🔲 **Mặt đường Bê tông xi măng (Cứng)**
    - *Nứt, gãy góc, dập tấm:* Trám khe, thay thế thanh truyền lực, vá bê tông
    - *Phủi bùn, cập kênh:* Bơm vữa kích nâng tấm, thay thế móng
    - *Mẻ mép, bong vảy, rạn chân chim:* Vá epoxy, trám vữa
    - *Đọng gôm cao su:* Phay mài, xịt nước áp lực cao
  - ⬛ **Mặt đường Bê tông nhựa (Mềm)**
    - *Biến dạng (Lún, hằn vệt bánh, phồng rộp):* Bóc lớp hỏng, thảm lại BTN
    - *Nứt (Da cá sấu, nứt khe, nứt phản ảnh):* Tưới nhựa, lấp khe, vá BTN nóng/nguội
    - *Bong bật (Ổ gà, rỗ):* Đục hố, tưới nhựa dính bám, đầm lu chặt
  - 🚧 **Công trình khác**
    - *Thoát nước:* Nạo vét bùn, sửa hố ga, thông cống rãnh
    - *Sơn tín hiệu:* Sơn lại nếu mờ (tỷ lệ 1kg/m2)
    - *Dải bảo hiểm & Hàng rào:* San lấp ổ gà, cắt cỏ, sửa hàng rào
- **4. Nghiệm thu & Thanh toán**
  - 🥇 Cấp Đội (Hàng ngày/Tuần)
  - 🥈 Cấp Cơ sở / Đơn vị trực tiếp (Hàng tháng)
  - 🥉 Cấp Đơn vị quản lý / Doanh nghiệp CHK (Hàng quý)
  - *Đánh giá:* Tốt / Khá / Trung bình / Kém
- **5. An toàn & Môi trường**
  - 🛡️ An toàn bay: Xin phép đóng cửa đường cất hạ cánh/đường lăn, biển báo, đèn chiếu sáng
  - 👷 An toàn lao động: Đồ bảo hộ, thiết bị PCCC, an toàn điện/cơ khí
  - 🌳 Môi trường: Xử lý phế thải, chống ồn, chống bụi, nấu nhựa đúng quy định
