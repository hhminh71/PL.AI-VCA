<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz & Ôn Tập Luật Đấu Thầu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tối ưu Line-height và loại bỏ viền outline mặc định */
        body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.25; background-color: #f3f4f6; }
        input[type="radio"]:focus { outline: none; box-shadow: none; }
        /* Tối ưu Scrollbar cho gọn gàng */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Class ẩn hiện các Tab */
        .hidden-tab { display: none !important; }
        /* Đánh dấu highlight */
        mark { background-color: #fde047; color: #111827; padding: 0 2px; border-radius: 2px; font-weight: 500;}
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-blue-700 text-white p-3 shadow-md sticky top-0 z-20">
        <div class="max-w-4xl mx-auto text-center">
            <p class="text-xs italic text-blue-200 mb-1">Huấn luyện Đào tạo Cảng HKQT Cần Thơ</p>
            <h1 class="text-xl font-bold uppercase tracking-wide">Trắc Nghiệm Luật Đấu Thầu</h1>
        </div>
        
        <!-- Tab Navigation -->
        <div class="max-w-4xl mx-auto mt-3 flex justify-center gap-2">
            <button id="btnTabQuiz" class="flex-1 bg-white text-blue-700 font-bold py-1.5 px-3 rounded-t-md shadow-inner transition-colors border-b-2 border-transparent" onclick="switchTab('quiz')">
                📝 Thi Thử (40)
            </button>
            <button id="btnTabReview" class="flex-1 bg-blue-800 text-blue-100 font-semibold py-1.5 px-3 rounded-t-md transition-colors border-b-2 border-transparent hover:bg-blue-600" onclick="switchTab('review')">
                📖 Ôn Tập (Full)
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-2">
        
        <!-- ================= TAB 1: THI THỬ ================= -->
        <div id="tabQuiz" class="">
            <!-- Quiz Controls Top -->
            <div class="bg-white p-2 rounded shadow-sm mb-3 flex flex-wrap items-center justify-between gap-2 border border-gray-200 sticky top-[90px] z-10">
                <div class="flex items-center gap-3">
                    <span class="text-lg font-bold text-red-600 flex items-center gap-1">
                        ⏱ <span id="timerDisplay">00:00</span>
                    </span>
                    <span id="scoreDisplay" class="text-sm font-semibold bg-blue-100 text-blue-800 px-2 py-0.5 rounded hidden">
                        Điểm: 0/40
                    </span>
                    <span id="highScoreDisplay" class="text-xs text-gray-500 font-medium hidden sm:inline-block"></span>
                </div>
                <div class="flex gap-2">
                    <button id="btnSubmitTop" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-1.5 px-3 rounded" onclick="submitQuiz()">Nộp Bài</button>
                    <button id="btnRetryTop" class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-1.5 px-3 rounded" onclick="startQuiz()">Làm Lại</button>
                    <button id="btnShareTop" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-1.5 px-3 rounded hidden" onclick="shareResult()">Chia Sẻ</button>
                </div>
            </div>

            <!-- Quiz Container -->
            <div id="quizContainer" class="space-y-3">
                <!-- Javascript render câu hỏi tại đây -->
            </div>

            <!-- Quiz Controls Bottom -->
            <div id="bottomControls" class="bg-white p-2 rounded shadow-sm mt-3 flex justify-center gap-3 border border-gray-200 hidden">
                <button id="btnSubmitBottom" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-1.5 px-4 rounded" onclick="submitQuiz()">Nộp Bài</button>
                <button id="btnRetryBottom" class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-1.5 px-4 rounded" onclick="startQuiz()">Làm Lại</button>
                <button id="btnShareBottom" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-1.5 px-4 rounded hidden" onclick="shareResult()">Chia Sẻ</button>
            </div>
        </div>

        <!-- ================= TAB 2: ÔN TẬP ================= -->
        <div id="tabReview" class="hidden-tab">
            <!-- Search Bar (Sticky) -->
            <div class="sticky top-[90px] z-10 bg-white p-2 rounded shadow-sm border border-gray-200 mb-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-2 text-gray-500">🔍</span>
                    <input type="text" id="searchInput" class="w-full bg-gray-50 border border-gray-300 text-sm rounded focus:ring-blue-500 focus:border-blue-500 block pl-8 p-1.5" placeholder="Gõ từ khóa tìm kiếm (không cần dấu)..." oninput="handleSearch()">
                </div>
                <p id="searchCount" class="text-xs text-gray-500 mt-1 italic hidden"></p>
            </div>

            <!-- Review Container -->
            <div id="reviewContainer" class="space-y-2">
                <!-- Javascript render danh sách tại đây -->
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded shadow-lg text-sm transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        Đã copy kết quả!
    </div>

    <!-- KHỐI DỮ LIỆU THÔ VÀ JAVASCRIPT -->
    <script>
        // 1. Raw Text Data (Đã gộp từ file Word do người dùng cung cấp)
        // Thêm một tiêu đề giả cho câu 2 bị khuyết để Parser hoạt động hoàn hảo
        const rawTextData = `Câu 2: Nội dung bị khuyết phần đầu
c. Quy định về hoạt động lựa chọn nhà thầu thực hiện gói thầu, hoạt động lựa chọn nhà đầu tư thực hiện dự án đầu tư kinh doanh
d. Tất cả phương án trên đều đúng
Đáp án đúng: D
Câu 3: Trường hợp nào sau đây không thuộc đối tượng áp dụng của Luật Đấu thầu?
a. Gói thầu mua thuốc, hoá chất, vật tư xét nghiệm sử dụng nguồn ngân sách nhà nước của bệnh viện công lập A
b. Gói thầu xây dựng đường giao thông sử dụng vốn đầu tư công do Ban Quản lý dự án đầu tư xây dựng công trình tỉnh A làm chủ đầu tư
c. Gói thầu mua sắm trang thiết bị làm việc sử dụng vốn nhà nước của Văn phòng UBND tỉnh A
d. Hoạt động mua phần mềm kế toán của hộ kinh doanh cá thể
Đáp án đúng: D
Câu 4: Theo quy định pháp luật về đấu thầu, gói thầu nào là gói thầu cung cấp dịch vụ tư vấn?
a. Thiết kế và cung cấp hệ thống xử lý nước thải
b. Gói thầu lập nhiệm vụ quy hoạch vùng
c. Gói thầu quảng cáo trên nền tảng xã hội và phát sóng trên VTV
d. Gói thầu mua phần mềm kế toán MISA
Đáp án đúng: B
Câu 5: Theo quy định pháp luật về đấu thầu, gói thầu nào là gói thầu cung cấp dịch vụ phi tư vấn?
a. Gói thầu in sổ công tác của tỉnh A
b. Gói thầu thuê kiểm toán dự án
c. Gói thầu mua phần mềm kế toán hỗ trợ doanh nghiệp khởi nghiệp sáng tạo, doanh nghiệp nhỏ do phụ nữ làm chủ
d. Gói thầu xây dựng trụ sở làm việc của tỉnh A.
Đáp án đúng: A
Câu 6: Theo quy định pháp luật về đấu thầu, đấu thầu là gì?
a. Là quá trình lựa chọn nhà thầu để ký kết, thực hiện hợp đồng cung cấp dịch vụ tư vấn, dịch vụ phi tư vấn, mua sắm hàng hóa, xây lắp trên cơ sở bảo đảm cạnh tranh, công bằng, minh bạch, hiệu quả kinh tế và trách nhiệm giải trình
b. Là quá trình lựa chọn nhà đầu tư để ký kết, thực hiện hợp đồng dự án đầu tư kinh doanh trên cơ sở bảo đảm cạnh tranh, công bằng, minh bạch, hiệu quả kinh tế và trách nhiệm giải trình
c. Là quá trình lựa chọn đơn vị để thực hiện hợp đồng thông qua các quy trình, thủ tục do pháp luật đấu thầu quy định.
d. Phương án A và B đều đúng
Đáp án đúng: D
Câu 7: Đấu thầu quốc tế là gì?
a. Là hoạt động đấu thầu mà nhà thầu trong nước, nhà thầu nước ngoài được tham dự thầu
b. Là hoạt động đấu thầu mà nhà thầu trong nước, nhà thầu nước ngoài được tham dự thầu, trong đó nhà thầu trong nước bắt buộc phải liên danh với nhà thầu nước ngoài
c. Là hoạt động đấu thầu chỉ nhà thầu quốc tế được phép tham dự thầu
d. Là hoạt động đấu thầu chỉ nhà thầu trong nước được phép tham dự thầu
Đáp án đúng: A
Câu 8: Giá đề nghị trúng thầu là gì?
a. Là giá dự thầu của nhà thầu ghi trong quyết định phê duyệt kết quả lựa chọn nhà thầu.
b. Là giá dự thầu của nhà thầu được đề nghị trúng thầu sau khi đã được sửa lỗi, hiệu chỉnh sai lệch theo yêu cầu của hồ sơ mời thầu, hồ sơ yêu cầu, trừ đi giá trị giảm giá (nếu có)
c. Là giá dự thầu của nhà thầu chưa tính sửa lỗi, hiệu chỉnh sai lệch và giá trị giảm giá (nếu có)
d. Là giá trị ghi trong hợp đồng giữa chủ đầu tư và nhà thầu
Đáp án đúng: B
Câu 9: Theo quy định pháp luật về đấu thầu, hàng hóa gồm?
a. Máy móc, thiết bị, nguyên liệu, nhiên liệu, vật liệu, vật tư, phụ tùng; sản phẩm; phương tiện; hàng tiêu dùng, phần mềm thương mại
b. Thuốc, hóa chất, vật tư xét nghiệm, thiết bị y tế
c. Phương án A và B đều đúng
d. Logistics, bảo hiểm, quảng cáo, nghiệm thu chạy thử, chụp ảnh vệ tinh
Đáp án đúng: C
Câu 10: Đối tượng nào sau đây được hưởng ưu đãi trong lựa chọn nhà thầu?
a. Hàng hóa có xuất xứ Việt Nam
b. Nhà thầu trong nước sản xuất hàng hóa có xuất xứ Việt Nam phù hợp với hồ sơ mời thầu
c. Sản phẩm, dịch vụ thân thiện môi trường theo quy định của pháp luật về bảo vệ môi trường
d. Tất cả các phương án trên đều đúng
Đáp án đúng: D
Câu 11: Nhà thầu trong nước nào được hưởng ưu đãi trong lựa chọn nhà thầu?
a. Nhà thầu trong nước sản xuất hàng hóa có xuất xứ Việt Nam phù hợp với hồ sơ mời thầu
b. Nhà thầu trong nước tham dự thầu với tư cách độc lập hoặc liên danh với nhà thầu trong nước khác khi tham dự đấu thầu quốc tế
c. Nhà thầu trong nước có sử dụng lao động nữ, thương binh, người khuyết tật hoặc người dân tộc thiểu số
d. Tất cả các phương án trên đều đúng
Đáp án đúng: D
Câu 12: Trường hợp nào sau đây cơ quan, tổ chức, doanh nghiệp được tự quyết định việc lựa chọn nhà thầu trên cơ sở bảo đảm công khai, minh bạch, hiệu quả và trách nhiệm giải trình?
a. Thực hiện gói thầu thuộc dự án sử dụng vốn đầu tư công của cơ quan nhà nước
b. Thực hiện gói thầu thuộc dự án sử dụng vốn đầu tư công của đơn vị sự nghiệp công lập bảo đảm một phần chi thường xuyên
c. Thực hiện gói thầu thuộc dự án sử dụng vốn ngân sách nhà nước của doanh nghiệp nhà nước
d. Lựa chọn nhà thầu của doanh nghiệp nhà nước không sử dụng vốn ngân sách nhà nước, đơn vị sự nghiệp công lập tự bảo đảm chi thường xuyên và chi đầu tư, đơn vị sự nghiệp công lập tự bảo đảm chi thường xuyên không sử dụng ngân sách nhà nước
Đáp án đúng: D
Câu 13: Ngôn ngữ sử dụng đối với đấu thầu quốc tế là gì?
a. Tiếng Việt
b. Tiếng Đức
c. Tiếng Anh hoặc tiếng Việt và tiếng Anh
d. Tiếng Đức hoặc tiếng Anh
Đáp án đúng: C
Câu 14: Đối với đấu thầu quốc tế, trường hợp ngôn ngữ sử dụng trong hồ sơ mời thầu là tiếng Việt và tiếng Anh thì khi tham dự thầu, nhà thầu được sử dụng ngôn ngữ gì?
a. Chỉ tiếng Việt
b. Chỉ tiếng Anh
c. Tiếng Việt hoặc tiếng Anh
d. Bắt buộc cả tiếng Việt và tiếng Anh
Đáp án đúng: C
Câu 15: Điều kiện để tổ chức đấu thầu quốc tế lựa chọn nhà thầu thực hiện gói thầu mua sắm hàng hóa là gì?
a. Gói thầu mua sắm hàng hóa thông dụng, đơn giản, có sẵn trên thị trường
b. Gói thầu mua sắm hàng hóa mà hàng hóa đó trong nước sản xuất được và đáp ứng các yêu cầu về kỹ thuật, chất lượng, giá nhưng chủ đầu tư yêu cầu phải mua hàng hóa nhập khẩu
c. Gói thầu mua sắm hàng hóa mà hàng hóa đó trong nước không sản xuất được hoặc sản xuất được nhưng không đáp ứng một trong các yêu cầu về kỹ thuật, chất lượng, giá
d. Gói thầu mua sắm hàng hóa thông dụng đã được nhập khẩu và chào bán tại Việt Nam nhưng hàng hóa đó trong nước không sản xuất được
Đáp án đúng: C
Câu 16: Trong trường hợp hủy thầu, toàn bộ hồ sơ liên quan đến quá trình lựa chọn nhà thầu của gói thầu đó có cần phải lưu trữ không?
a. Không cần lưu trữ, hủy hồ sơ ngay sau khi quyết định hủy thầu được ban hành nhưng phải đảm bảo thông tin không bị tiết lộ
b. Không cần lưu trữ, trả lại hồ sơ cho nhà thầu theo nguyên trạng ngay sau khi quyết định hủy thầu được ban hành
c. Có cần lưu trữ, trong thời hạn 05 năm kể từ ngày quyết định hủy thầu được ban hành
d. Có cần lưu trữ, trong thời hạn 03 năm kể từ ngày quyết định hủy thầu được ban hành
Đáp án đúng: C
Câu 17: Đối với đấu thầu rộng rãi quốc tế, trường hợp hồ sơ đề xuất về tài chính của nhà thầu không vượt qua bước đánh giá về kỹ thuật, nhà thầu từ chối nhận lại hồ sơ đề xuất của mình thì Chủ đầu tư phải xử lý như thế nào?
a. Chủ đầu tư xem xét, quyết định việc hủy hồ sơ nhưng phải đảm bảo thông tin không bị tiết lộ
b. Chủ đầu tư phải lưu trữ theo quy định của pháp luật về lưu trữ
c. Chủ đầu tư lưu trữ tối thiểu 05 năm
d. Tất cả các phương án trên đều sai
Đáp án đúng: A
Câu 18: Hồ sơ hoàn công và quyết toán của gói thầu được lưu trữ theo quy định nào?
a. Quy định nội bộ của nhà thầu
b. Quy định của tư vấn giám sát
c. Quy định của pháp luật về lưu trữ
d. Tất cả phương án trên đều sai
Đáp án đúng: C
Câu 19: Đối với gói thầu xây lắp đấu thầu không qua mạng, hồ sơ đề xuất tài chính của nhà thầu không vượt qua bước đánh giá về kỹ thuật sẽ được trả lại khi nào?
a. Khi gửi thư mời thương thảo
b. Khi kết thúc giai đoạn đánh giá kỹ thuật
c. Khi hoàn trả bảo đảm dự thầu của nhà thầu không được lựa chọn hoặc đăng tải kết quả lựa chọn nhà thầu
d. Khi ký hợp đồng
Đáp án đúng: C
Câu 20: Đối với đấu thầu quốc tế, hồ sơ mời thầu được phát hành như thế nào?
a. Hồ sơ mời thầu được phát hành trên Hệ thống mạng đấu thầu quốc gia; Nhà thầu nộp tiền mua bản điện tử hồ sơ mời thầu khi nộp hồ sơ dự thầu
b. Hồ sơ mời thầu được bán vào giờ hành chính từ thứ 2 tới thứ 6 tại địa chỉ do Chủ đầu tư quy định
c. Phương án A và B đều đúng
d. Phương án A và B đều sai
Đáp án đúng: A
Câu 21: Đối với gói thầu sử dụng vốn ngân sách nhà nước, tiền bán bản điện tử hồ sơ mời thầu, hồ sơ yêu cầu sẽ được xử lý như thế nào?
a. Sử dụng theo quy chế tài chính của chủ đầu tư
b. Nộp vào ngân sách nhà nước theo quy định của Luật Ngân sách nhà nước
c. Sử dụng theo cơ chế khoán chi
d. Tất cả các phương án trên đều sai
Đáp án đúng: B
Câu 22: Chi phí đăng tải quyết định phê duyệt kế hoạch lựa chọn nhà thầu và quyết định phê duyệt kết quả lựa chọn nhà thầu trên Hệ thống mạng đấu thầu quốc gia đối với gói thầu chỉ định thầu là bao nhiêu?
a. 220.000 đồng/1 gói thầu (đã bao gồm thuế giá trị gia tăng)
b. 330.000 đồng/1 gói thầu (đã bao gồm thuế giá trị gia tăng)
c. Miễn phí
d. 110.000 đồng/1 gói thầu (đã bao gồm thuế giá trị gia tăng)
Đáp án đúng: C
Câu 23: Thành viên tổ chuyên gia thuộc tổ chức tư vấn đấu thầu cần có tối thiểu bao nhiêu năm kinh nghiệm trong lĩnh vực liên quan?
a. 01 năm công tác thuộc một trong các lĩnh vực liên quan đến nội dung pháp lý, kỹ thuật, tài chính của gói thầu
b. 02 năm công tác thuộc một trong các lĩnh vực liên quan đến nội dung pháp lý, kỹ thuật, tài chính của gói thầu
c. 03 năm công tác thuộc một trong các lĩnh vực liên quan đến nội dung pháp lý, kỹ thuật, tài chính của gói thầu
d. Không có quy định về số năm kinh nghiệm
Đáp án đúng: C
Câu 24: Đơn vị sự nghiệp công lập A đã trúng thầu gói thầu tổ chức lớp đào tạo cán bộ cho UBND tỉnh X sử dụng vốn ngân sách địa phương. Đơn vị sự nghiệp công lập A có phải tổ chức lựa chọn nhà thầu theo Luật Đấu thầu để thuê dịch vụ hậu cần (như địa điểm ăn nghỉ, photo tài liệu, hội trường tổ chức) hay không?
a. Phải lựa chọn nhà thầu theo quy định của Luật Đấu thầu
b. Căn cứ vào hợp đồng quy định giữa đơn vị A và UBND tỉnh X
c. Đơn vị A được tự quyết định việc mua sắm trên cơ sở bảo đảm công khai, minh bạch, hiệu quả và trách nhiệm giải trình
d. Căn cứ theo phân cấp quyết định mua sắm của UBND tỉnh X
Đáp án đúng: C
Câu 25: Sở Y tế tỉnh A được doanh nghiệp trong nước tài trợ 5 tỷ đồng để mua sắm thuốc phục vụ khám chữa bệnh cho người nghèo, hỏi Sở Y tế có phải tổ chức đấu thầu thuốc theo quy định của Luật Đấu thầu không?
a. Sở Y tế A được tự quyết định việc mua sắm trên cơ sở bảo đảm công khai, minh bạch, hiệu quả và trách nhiệm giải trình trong trường hợp nhà tài trợ yêu cầu không lựa chọn nhà thầu theo quy định của Luật Đấu thầu
b. Sở Y tế A phải tổ chức lựa chọn nhà thầu theo quy định của Luật Đấu thầu
c. Trong mọi trường hợp Sở Y tế A không phải thực hiện theo Luật Đấu thầu do đây là nguồn doanh nghiệp trong nước tài trợ
d. Phải xin ý kiến của UBND tỉnh A để có cơ sở xác định có phải tổ chức lựa chọn nhà thầu theo Luật Đấu thầu hay không
Đáp án đúng: A
Câu 26: Đối với gói thầu cung cấp dịch vụ tư vấn không qua mạng, trường hợp hồ sơ đề xuất về tài chính của nhà thầu không vượt qua bước đánh giá về kỹ thuật sẽ được xử lý như thế nào theo quy định của pháp luật về đấu thầu?
a. Trả lại nguyên trạng cho nhà thầu trong thời hạn 10 ngày kể từ ngày ký hợp đồng với nhà thầu được lựa chọn
b. Trả lại nguyên trạng cho nhà thầu trong thời hạn 05 ngày kể từ ngày ký hợp đồng với nhà thầu được lựa chọn
c. Trả lại nguyên trạng cho nhà thầu trong thời hạn 15 ngày kể từ ngày ký hợp đồng với nhà thầu được lựa chọn
d. Hồ sơ được lưu trữ theo quy định của Pháp luật về lưu trữ
Đáp án đúng: A
Câu 27: Việc giữ lại hồ sơ tài chính của nhà thầu không đạt kỹ thuật sau thời hạn quy định sẽ…?
a. Là cơ sở để tiếp tục đánh giá trong trường hợp phải đánh giá lại
b. Bảo đảm trách nhiệm của chủ đầu tư theo quy định của pháp luật về đấu thầu
c. Có thể dẫn tới khiếu nại từ nhà thầu
d. Phương án A và B đều đúng
Đáp án đúng: C
Câu 28: Trường hợp nào sau đây Công ty B khi tham dự gói thầu xây lắp X thuộc Dự án Y được kết luận là đáp ứng về bảo đảm cạnh tranh trong đấu thầu?
a. Công ty B sử dụng nhà thầu phụ là công ty A, công ty A là nhà thầu tư vấn lập Chương V yêu cầu kỹ thuật cho E-HSMT của gói thầu xây lắp X
b. Công ty B tham dự gói thầu xây lắp X đồng thời là nhà thầu tư vấn lập Chương V yêu cầu kỹ thuật của E-HSMT của gói thầu xây lắp X.
c. Công ty B sử dụng nhà thầu phụ là công ty tư vấn C, công ty tư vấn C sở hữu 30% cổ phần của công ty A và công ty A là nhà thầu tư vấn thiết kế kỹ thuật cho dự án Y
d. Công ty A là nhà thầu tư vấn lập hồ sơ mời thầu gói thầu xây lắp X có sở hữu 30% vốn góp của Công ty B
Đáp án đúng: C
Câu 29: Chọn phương án đúng đối với nhà thầu phụ đặc biệt?
a. Đối với đấu thầu trong nước, khi tham gia gói thầu của dự án thuộc lĩnh vực khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số thì nhà thầu trong nước được sử dụng nhà thầu phụ đặc biệt là nhà thầu nước ngoài đối với phần công việc đặc thù mà nhà thầu trong nước chưa thực hiện được hoặc cần chuyển giao công nghệ
b. Trong mọi trường hợp, đối với đấu thầu trong nước, nhà thầu không được phép sử dụng nhà thầu phụ đặc biệt là nhà thầu nước ngoài
c. Giá trị công việc tối đa dành cho nhà thầu phụ trong hợp đồng phải bao gồm khối lượng công việc dành cho nhà thầu phụ đặc biệt
d. Phương án A và C đều đúng
Đáp án đúng: A
Câu 30: Đối với đấu thầu không qua mạng, việc phê duyệt và phát hành hồ sơ mời thầu được thực hiện theo phương án nào sau đây?
a. Phê duyệt và phát hành hồ sơ mời thầu trên Hệ thống mạng đấu thầu quốc gia
b. Phê duyệt trên Hệ thống mạng đấu thầu quốc gia và phát hành hồ sơ mời thầu bản giấy
c. Phê duyệt và phát hành hồ sơ mời thầu bản giấy
d. Các phương án trên đều đúng
Đáp án đúng: A
Câu 31: Gói thầu nào sau đây thuộc trường hợp được áp dụng chào hàng cạnh tranh?
a. Tất cả gói thầu mua sắm hàng hoá có giá không quá 10 tỷ đồng
b. Gói thầu dịch vụ phi tư vấn thông dụng, đơn giản có giá không quá 10 tỷ đồng
c. Gói thầu dịch vụ tư vấn thông dụng, đơn giản có giá không quá 10 tỷ đồng
d. Gói thầu xây lắp công trình đơn giản đã có dự toán được phê duyệt có giá không quá 15 tỷ đồng
Đáp án đúng: B
Câu 32: Đối với gói thầu mua sắm hàng hóa thông dụng, sẵn có trên thị trường có giá gói thầu 05 tỷ đồng thì kế hoạch lựa chọn nhà thầu phê duyệt áp dụng hình thức lựa chọn nhà thầu nào sau đây?
a. Chỉ được áp dụng hình thức chào hàng cạnh tranh
b. Được áp dụng hình thức chào hàng cạnh tranh hoặc đấu thầu rộng rãi
c. Bắt buộc áp dụng hình thức chỉ định thầu
d. Được áp dụng hình thức chỉ định thầu hoặc chào hàng cạnh tranh hoặc đấu thầu rộng rãi
Đáp án đúng: B
Câu 33: Hạn mức chỉ định thầu đối với gói thầu không hình thành dự án thuộc dự toán mua sắm thường xuyên là?
a. 500 triệu đồng
b. 800 triệu đồng
c. 01 tỷ đồng
d. 300 triệu đồng
Đáp án đúng: A
Câu 34: Hạn mức chỉ định thầu đối với gói thầu mua sắm hàng hóa thuộc dự án đầu tư là?
a. 800 triệu đồng
b. 500 triệu đồng
c. 01 tỷ đồng
d. 02 tỷ đồng
Đáp án đúng: D
Câu 35: Phương án nào không phải là một trong các hình thức lựa chọn nhà thầu được phê duyệt trong kế hoạch lựa chọn nhà thầu?
a. Đấu thầu rộng rãi
b. Đấu thầu hạn chế
c. Mua sắm trực tiếp
d. Đấu thầu qua mạng
Đáp án đúng: D
Câu 36: Gói thầu lựa chọn tư vấn là tổ chức có giá gói thầu là 500 triệu đồng áp dụng hình thức lựa chọn nhà thầu nào?
a. Bắt buộc áp dụng hình thức chỉ định thầu
b. Được áp dụng hình thức chỉ định thầu hoặc đấu thầu rộng rãi
c. Được áp dụng hình thức chào hàng cạnh tranh hoặc đấu thầu rộng rãi
d. Được áp dụng hình thức chỉ định thầu hoặc đấu thầu rộng rãi hoặc chào hàng cạnh tranh
Đáp án đúng: B
Câu 37: Chọn phương án đúng về hạn mức đối với đấu thầu rộng rãi?
a. Không quy định hạn mức áp dụng
b. Giá gói thầu trên 20 tỷ đồng
c. Giá gói thầu trên 10 tỷ đồng
d. Giá gói thầu trên 20 tỷ đồng đối với xây lắp, hàng hoá; trên 10 tỷ đồng đối với gói thầu dịch vụ tư vấn, phi tư vấn
Đáp án đúng: A
Câu 38: Chọn phương án đúng về loại gói thầu đối với hình thức mua sắm trực tiếp?
a. Chỉ gói thầu mua sắm hàng hoá
b. Chỉ gói thầu xây lắp
c. Chỉ gói thầu dịch vụ phi tư vấn
d. Gói thầu mua sắm hàng hóa và dịch vụ phi tư vấn
Đáp án đúng: A
Câu 39: Phương án nào không phải là điều kiện để được áp dụng hình thức mua sắm trực tiếp?
a. Nhà thầu đã trúng thầu thông qua đấu thầu rộng rãi, đấu thầu hạn chế và đã ký hợp đồng gói thầu thực hiện gói thầu trước đó
b. Thời gian từ khi ký hợp đồng gói thầu trước đến ngày phê duyệt kết quả mua sắm trực tiếp không quá 12 tháng
c. Đơn giá các phần việc thuộc gói thầu mua sắm trực tiếp không vượt đơn giá phần việc tương ứng của gói thầu đã ký trước đó thuộc gói thầu tương tự đã ký hợp đồng trước đó, đồng thời, phù hợp với giá thị trường tại thời điểm hoàn thiện hợp đồng
d. Chủ đầu tư được áp dụng mua sắm trực tiếp nhiều lần đối với các loại hàng hóa thuộc gói thầu
Đáp án đúng: D
Câu 40: Hãy chọn phương án đúng về hình thức đặt hàng?
a. Là một trong các hình thức lựa chọn nhà thầu
b. Pháp luật quản lý ngành, lĩnh vực quy định về quy trình, thủ tục đặt hàng khác với quy trình, thủ tục của pháp luật về đấu thầu thì áp dụng quy định của pháp luật về đấu thầu.
c. Đặt hàng chỉ được áp dụng cho sản phẩm, dịch vụ công
d. Đặt hàng chỉ áp dụng đối với nguồn chi thường xuyên ngân sách nhà nước, không được áp dụng đối với nguồn vốn khác
Đáp án đúng: A
Câu 41: Kế hoạch lựa chọn nhà thầu của dự án thuộc đối tượng áp dụng của Luật Đấu thầu bắt buộc phải đăng tải ở đâu?
a. Hệ thống mạng đấu thầu quốc gia
b. Báo Tài chính-Đầu tư
c. Cổng Thông tin điện tử của Bộ, ngành
d. Phương án A và B đều đúng
Đáp án đúng: A
Câu 42: Chậm nhất là bao nhiêu ngày thì kế hoạch lựa chọn nhà thầu phải được đăng tải trên Hệ thống mạng đấu thầu quốc gia?
a. 05 ngày làm việc kể từ ngày kế hoạch lựa chọn nhà thầu được ban hành
b. 07 ngày kể từ ngày kế hoạch lựa chọn nhà thầu được ban hành
c. 07 ngày làm việc kể từ ngày kế hoạch lựa chọn nhà thầu được ban hành
d. 10 ngày kể từ ngày kế hoạch lựa chọn nhà thầu được ban hành
Đáp án đúng: A
Câu 43: Kế hoạch lựa chọn nhà thầu bao gồm nội dung nào sau đây?
a. Giá gói thầu
b. Thời gian thực hiện hợp đồng
c. Giám sát hoạt động đấu thầu
d. Cả 3 phương án trên đều đúng
Đáp án đúng: A
Câu 44: Đối với nội dung mua sắm hàng hóa có giá không quá 50 triệu đồng thì được thực hiện như thế nào?
a. Không phải lập kế hoạch lựa chọn nhà thầu
b. Bắt buộc phải lập kế hoạch lựa chọn nhà thầu trình Thủ trưởng cơ quan để phê duyệt
c. Tùy thuộc vào quy chế tài chính của cơ quan để quyết định việc có lập kế hoạch lựa chọn nhà thầu hay không
d. Bắt buộc phải lập kế hoạch tổng thể lựa chọn nhà thầu trình Thủ trưởng cơ quan để phê duyệt
Đáp án đúng: A
Câu 45: Lập kế hoạch lựa chọn nhà thầu là bắt buộc đối với tất cả các gói thầu trừ trường hợp nào sau đây?
a. Gói thầu mua sắm hàng hóa có giá gói thầu 60 triệu đồng
b. Việc mua sắm vật tư y tế thông thường có giá dưới 50 triệu đồng
c. Gói thầu dịch vụ tư vấn có giá gói thầu 30 triệu đồng
d. Tất cả các phương án trên
Đáp án đúng: B
Câu 46: Chọn phương án đúng đối với thời gian tổ chức lựa chọn nhà thầu trong kế hoạch lựa chọn nhà thầu?
a. Ghi ngày, tháng, năm thực hiện đăng tải thông báo mời thầu, thông báo mời chào hàng đối với đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh
b. Ghi số ngày, tháng, năm
c. Ghi quý, năm
d. Cả phương án A và C đều đúng
Đáp án đúng: D
Câu 47: Nội dung nào sau đây không thuộc thành phần của giá gói thầu?
a. Lợi nhuận của nhà thầu (nếu có)
b. Thuế, phí, lệ phí theo quy định của pháp luật
c. Thuế thu nhập cá nhân của giám đốc công ty
d. Chi phí dự phòng
Đáp án đúng: C
Câu 48: Loại hợp đồng nào sau đây được xác định khi phê duyệt Kế hoạch lựa chọn nhà thầu?
a. Hợp đồng trọn gói
b. Hợp đồng theo đơn giá cố định
c. Hợp đồng theo đơn giá điều chỉnh
d. Một trong các loại hợp đồng hoặc kết hợp các loại hợp đồng trên
Đáp án đúng: D
Câu 49: Chủ đầu tư là người phê duyệt văn bản nào trong quá trình đấu thầu?
a. Kế hoạch lựa chọn nhà thầu đối với dự án
b. Hồ sơ mời thầu
c. Kế hoạch lựa chọn nhà thầu đối với dự toán mua sắm
d. Phương án B và C đều đúng
Đáp án đúng: B
Câu 50: Theo Luật Đấu thầu, người có thẩm quyền có trách nhiệm nào sau đây?
a. Phê duyệt kế hoạch tổng thể lựa chọn nhà thầu
b. Phê duyệt hồ sơ mời quan tâm, hồ sơ mời sơ tuyển, hồ sơ mời thầu, hồ sơ yêu cầu
c. Phê duyệt kết quả lựa chọn nhà thầu
d. Phê duyệt kết quả đánh giá hồ sơ đề xuất về kỹ thuật đối với trường hợp áp dụng phương thức một giai đoạn hai túi hồ sơ
Đáp án đúng: A
Câu 51: Người có thẩm quyền quyết định xử lý tình huống trong đấu thầu đối với trường hợp nào?
a. Trường hợp phát sinh ngoài quy định của pháp luật về đấu thầu đối với các gói thầu, dự án đầu tư kinh doanh do mình quyết định
b. Mọi trường hợp phát sinh trong đấu thầu
c. Quyết định xử lý tình huống trong trường hợp Chủ đầu tư chưa đủ năng lực giải quyết
d. Người có thẩm quyền không có thẩm quyền quyết định xử lý tình huống trong đấu thầu
Đáp án đúng: A
Câu 52: Thời gian đánh giá E-HSDT được quy định như thế nào?
a. Đối với đấu thầu trong nước: tối đa 45 ngày; đấu thầu quốc tế: tối đa 60 ngày
b. Đối với đấu thầu trong nước: tối đa 60 ngày; đấu thầu quốc tế: tối đa 90 ngày
c. Đối với đấu thầu trong nước: tối đa 30 ngày; đấu thầu quốc tế: tối đa 45 ngày
d. Không có quy định cụ thể về thời gian đánh giá E-HSDT
Đáp án đúng: A
Câu 53: Theo Luật Đấu thầu, khi nhận được hồ sơ dự thầu có bất thường về giá nhà thầu chào (thấp hơn nhiều so với giá gói thầu), bên mời thầu cần thực hiện hành động nào?
a. Loại bỏ hồ sơ dự thầu ngay lập tức do lo ngại chất lượng công trình hoặc hàng hóa
b. Tiến hành trao đổi, yêu cầu nhà thầu giải thích và làm rõ về tính khả thi của hồ sơ dự thầu
c. Chấp nhận hồ sơ dự thầu mà không cần kiểm tra thêm, vì giá thấp sẽ mang lại lợi ích về kinh tế
d. Báo cáo ngay lên cơ quan có thẩm quyền cao hơn để xin ý kiến chỉ đạo
Đáp án đúng: B
Câu 54: Nội dung nào sau đây không thuộc quy trình đánh giá E-HSDT áp dụng đối với phương thức một giai đoạn một túi hồ sơ?
a. Đánh giá tính hợp lệ của E-HSDT
b. Đánh giá về năng lực và kinh nghiệm
c. Đánh giá về kỹ thuật
d. Đánh giá năng lực của Tổ chuyên gia
Đáp án đúng: D
Câu 55: Cơ quan có thẩm quyền thành lập hội đồng tư vấn giải quyết kiến nghị là cơ quan nào sau đây?
a. Cục Quản lý đấu thầu - Bộ Kế hoạch và Đầu tư
b. Cơ quan thanh tra tỉnh/thành phố trực thuộc trung ương
c. Người có thẩm quyền, người đứng đầu cơ quan quản lý nhà nước về đấu thầu
d. Tòa án nhân dân cấp tỉnh/thành phố trực thuộc trung ương
Đáp án đúng: C
Câu 56: Trong thời gian có hiệu lực của hợp đồng, nhà thầu xây lắp đang gặp khó khăn về tài chính, chủ đầu tư muốn thanh toán cho nhà thầu phụ (đã có tên trong danh sách nhà thầu phụ của hợp đồng) trực tiếp không qua nhà thầu chính. Việc này có được phép không?
a. Được phép, chủ đầu tư có quyền thanh toán trực tiếp cho nhà thầu phụ
b. Được phép, nếu được sự đồng ý của nhà thầu chính (nhà thầu chính ký ủy quyền cho chủ đầu tư thanh toán trực tiếp cho nhà thầu phụ)
c. Không được phép, thanh toán phải được thực hiện thông qua nhà thầu chính
d. Cần có sự đồng ý của cơ quan quản lý nhà nước
Đáp án đúng: B
Câu 57: Trong quy trình đấu thầu, việc thương thảo hợp đồng với nhà thầu được lựa chọn là bắt buộc đối với loại gói thầu nào?
a. Gói thầu xây lắp, gói thầu hỗn hợp
b. Gói thầu mua sắm hàng hóa
c. Gói thầu cung cấp dịch vụ phi tư vấn
d. Gói thầu cung cấp dịch vụ tư vấn
Đáp án đúng: D
Câu 58: Yêu cầu về doanh thu bình quân hằng năm áp dụng cho tất cả các loại gói thầu ngoại trừ trường hợp nào sau đây?
a. Gói thầu xây lắp
b. Gói thầu dịch vụ phi tư vấn
c. Gói thầu mua sắm hàng hóa đối với nhà thầu là nhà sản xuất
d. Gói thầu hỗn hợp
Đáp án đúng: C
Câu 59: Nhà thầu tham gia đấu thầu cần cung cấp bảo đảm dự thầu trong trường hợp nào?
a. Khi nộp hồ sơ dự thầu
b. Trước khi ký kết hợp đồng
c. Trong vòng 5 ngày sau khi nhận được thông báo trúng thầu
d. Chỉ khi được yêu cầu bổ sung
Đáp án đúng: A
Câu 60: Quy định nào sau đây là đúng về sửa đổi hồ sơ mời thầu theo pháp luật về đấu thầu?
a. Chủ đầu tư không được phép sửa đổi hồ sơ mời thầu sau khi đã phát hành
b. Chủ đầu tư có thể tự ý sửa đổi hồ sơ mời thầu mà không cần thông báo cho nhà thầu
c. Trường hợp cần sửa đổi hồ sơ mời thầu sau khi đã phát hành, Chủ đầu tư phải đăng tải quyết định sửa đổi hồ sơ mời thầu lên Hệ thống mạng đấu thầu quốc gia
d. Chủ đầu tư phải đăng tải văn bản sửa đổi hồ sơ mời thầu trên một tờ báo trung ương
Đáp án đúng: C
Câu 61: Đâu là lý do chính để chủ đầu tư quyết định hủy thầu?
a. Chỉ có một nhà thầu tham dự thầu
b. Tất cả các hồ sơ dự thầu, hồ sơ đề xuất đều không đáp ứng được các yêu cầu của hồ sơ mời thầu, hồ sơ yêu cầu
c. Giá đề nghị trúng thầu vượt giá gói thầu và không thể xử lý tình huống
d. Cả B và C
Đáp án đúng: D
Câu 62: Kế hoạch lựa chọn nhà thầu dự án X áp dụng hình thức đấu thầu rộng rãi qua mạng. Một nhà thầu Y có trụ sở chính tại nước ngoài muốn tham gia đấu thầu tại Việt Nam nhưng chưa có chứng thư số, nhà thầu Y phải làm gì?
a. Bắt buộc liên danh với nhà thầu Việt Nam có chứng thư số để tham dự
b. Nộp hồ sơ dự thầu bản giấy trực tiếp cho Chủ đầu tư
c. Xin miễn trừ sử dụng chứng thư số từ Chủ đầu tư
d. Thực hiện thủ tục đăng ký tham gia Hệ thống mạng đấu thầu quốc gia theo quy định để được cấp chứng thư số tham dự thầu
Đáp án đúng: D
Câu 63: Hạn mức chỉ định thầu đối với gói thầu dịch vụ tư vấn thuộc dự án đầu tư xây dựng là?
a. Không quá 500 triệu đồng
b. Không quá 01 tỷ đồng
c. Không quá 100 triệu đồng
d. Không có hạn mức tối đa, tùy thuộc vào nhu cầu dự án
Đáp án đúng: A
Câu 64: Tiêu chuẩn đánh giá năng lực và kinh nghiệm của nhà thầu bao gồm các yếu tố nào sau đây?
a. Chỉ bao gồm kinh nghiệm thực hiện các hợp đồng tương tự
b. Kinh nghiệm thực hiện các hợp đồng tương tự và quy mô công ty (số lượng nhân viên)
c. Năng lực tài chính, kinh nghiệm thực hiện hợp đồng tương tự và nguồn lực (thiết bị, nhân sự)
d. Doanh thu của năm gần nhất và mối quan hệ với chính quyền địa phương
Đáp án đúng: C
Câu 65: Theo Luật Đấu thầu, thời hạn tối đa để giải quyết khiếu nại tại Hội đồng Tư vấn giải quyết kiến nghị là bao lâu?
a. 15 ngày làm việc
b. 30 ngày làm việc
c. 45 ngày làm việc
d. 60 ngày làm việc
Đáp án đúng: B
Câu 66: Hợp đồng trọn gói thường được áp dụng cho loại gói thầu nào sau đây?
a. Gói thầu mua sắm vật tư tiêu hao hàng ngày
b. Gói thầu xây lắp công trình quy mô lớn với nhiều rủi ro không thể lường trước
c. Gói thầu có tính chất lặp lại và có thể xác định rõ số lượng, khối lượng công việc
d. Gói thầu mà ngay tại thời điểm lựa chọn nhà thầu, khối lượng công việc chưa xác định được rõ ràng
Đáp án đúng: C
Câu 67: Đối với gói thầu mua sắm hàng hóa trong nước, nếu nhà thầu A chào bán hàng hóa có tỷ lệ chi phí sản xuất trong nước từ 25% trở lên thì nhà thầu A được hưởng ưu đãi gì?
a. Được giảm thuế thu nhập doanh nghiệp
b. Được cộng thêm điểm hoặc trừ vào giá dự thầu khi đánh giá về tài chính
c. Được miễn bảo đảm dự thầu
d. Không được hưởng ưu đãi nào
Đáp án đúng: B
Câu 68: Trong quy trình đấu thầu, bước "Mở thầu" được thực hiện khi nào?
a. Ngay sau khi kết thúc thời điểm đóng thầu (hoặc tối đa trong vòng 02 giờ đối với đấu thầu qua mạng)
b. Trước thời điểm đóng thầu 01 ngày
c. 03 ngày sau khi đóng thầu
d. Bất cứ lúc nào theo quyết định của Tổ chuyên gia
Đáp án đúng: A
Câu 69: Trách nhiệm của "Tổ chuyên gia đấu thầu" bao gồm những công việc gì?
a. Phê duyệt kết quả lựa chọn nhà thầu
b. Lập hồ sơ mời thầu, đánh giá hồ sơ dự thầu và báo cáo kết quả đánh giá cho Bên mời thầu
c. Ký kết hợp đồng với nhà thầu trúng thầu
d. Quyết định hủy thầu
Đáp án đúng: B
Câu 70: Bảo đảm thực hiện hợp đồng có giá trị từ bao nhiêu phần trăm (%) giá hợp đồng?
a. Từ 2% đến 10%
b. Từ 5% đến 15%
c. Từ 10% đến 20%
d. Cố định 5% cho mọi gói thầu
Đáp án đúng: A
Câu 71: Khi nào thì nhà thầu được hoàn trả hoặc giải tỏa bảo đảm thực hiện hợp đồng?
a. Ngay sau khi ký kết hợp đồng
b. Khi công trình thi công được 50% khối lượng
c. Sau khi nhà thầu đã hoàn thành các nghĩa vụ theo hợp đồng và chuyển sang thời gian bảo hành (nếu có)
d. Ngay sau khi mở thầu
Đáp án đúng: C
Câu 72: Phương thức lựa chọn nhà thầu một giai đoạn một túi hồ sơ được áp dụng cho trường hợp nào?
a. Gói thầu cung cấp dịch vụ tư vấn phức tạp
b. Gói thầu quy mô nhỏ, gói thầu dịch vụ phi tư vấn, mua sắm hàng hóa, xây lắp, hỗn hợp không đòi hỏi kỹ thuật cao
c. Đấu thầu quốc tế tất cả các loại gói thầu
d. Chỉ định thầu
Đáp án đúng: B
Câu 73: Phương thức lựa chọn nhà thầu một giai đoạn hai túi hồ sơ yêu cầu nhà thầu nộp những gì?
a. Hai bộ hồ sơ giống hệt nhau về cả kỹ thuật và tài chính
b. Đồng thời nộp hồ sơ đề xuất về kỹ thuật và hồ sơ đề xuất về tài chính riêng biệt
c. Chỉ nộp hồ sơ đề xuất về kỹ thuật trước, nếu trúng thầu mới nộp hồ sơ tài chính
d. Nộp hồ sơ dự thầu qua mạng và một bản cứng dự phòng
Đáp án đúng: B
Câu 74: Trong phương thức một giai đoạn hai túi hồ sơ, khi nào thì hồ sơ đề xuất về tài chính được mở?
a. Cùng lúc với hồ sơ đề xuất về kỹ thuật
b. Chỉ mở đối với những nhà thầu đáp ứng yêu cầu về kỹ thuật
c. Chỉ mở của nhà thầu có điểm kỹ thuật cao nhất
d. Mở ngẫu nhiên bất cứ lúc nào
Đáp án đúng: B
Câu 75: Hình thức "Chào hàng cạnh tranh" không áp dụng đối với gói thầu nào?
a. Gói thầu mua sắm hàng hóa thông dụng, có sẵn trên thị trường với đặc tính kỹ thuật đã được tiêu chuẩn hóa
b. Gói thầu dịch vụ phi tư vấn thông dụng, đơn giản
c. Gói thầu xây lắp công trình đơn giản đã có thiết kế bản vẽ thi công
d. Gói thầu cung cấp dịch vụ tư vấn quốc tế
Đáp án đúng: D
Câu 76: Trường hợp có sự khác biệt giữa hồ sơ mời thầu bằng tiếng Việt và tiếng Anh (đối với đấu thầu quốc tế), văn bản nào có giá trị pháp lý cao hơn?
a. Bản tiếng Anh
b. Bản tiếng Việt (trừ trường hợp quy định khác trong HSMT)
c. Do Tổ chuyên gia quyết định tại thời điểm đánh giá
d. Cả hai có giá trị ngang nhau, bắt buộc nhà thầu phải làm rõ
Đáp án đúng: B
Câu 77: Nếu thời điểm mở thầu theo thông báo mời thầu rơi vào ngày nghỉ lễ, bên mời thầu cần làm gì?
a. Vẫn tiến hành mở thầu bình thường theo thông báo
b. Lùi thời điểm mở thầu sang ngày làm việc tiếp theo và phải thông báo trên Hệ thống mạng đấu thầu quốc gia
c. Tiến hành mở thầu sớm hơn 01 ngày
d. Hủy thông báo mời thầu và phát hành lại
Đáp án đúng: B
Câu 78: Nhà thầu liên danh bị giải thể trong quá trình đánh giá hồ sơ dự thầu. Tổ chuyên gia cần xử lý như thế nào?
a. Tiếp tục đánh giá hồ sơ dự thầu của liên danh dựa trên năng lực của các thành viên còn lại
b. Loại hồ sơ dự thầu của nhà thầu liên danh đó
c. Yêu cầu thành viên còn lại bổ sung một đối tác liên danh mới thay thế
d. Cho phép thành viên đứng đầu liên danh tự thực hiện toàn bộ khối lượng công việc
Đáp án đúng: B
Câu 79: Trong đánh giá hồ sơ dự thầu mua sắm hàng hóa, "Giá đánh giá" được hiểu là gì?
a. Là giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch
b. Là giá dự thầu sau khi đã trừ đi giá trị giảm giá (nếu có)
c. Là giá dự thầu sau khi sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có), cộng các chi phí để đưa về cùng một mặt bằng đánh giá, tính ưu đãi
d. Là giá trị ghi trong hợp đồng cuối cùng
Đáp án đúng: C
Câu 80: Hình thức lựa chọn nhà đầu tư dự án đầu tư kinh doanh có sử dụng đất (đấu thầu dự án) chủ yếu dựa trên tiêu chí nào?
a. Chỉ dựa trên năng lực tài chính của nhà đầu tư
b. Chỉ dựa trên giá trị nộp ngân sách nhà nước do nhà đầu tư đề xuất
c. Đánh giá tổng hợp về năng lực, kinh nghiệm của nhà đầu tư, phương án đầu tư, hiệu quả sử dụng đất, hiệu quả kinh tế - xã hội và bảo vệ môi trường
d. Dựa vào thời gian hoàn thành dự án nhanh nhất
Đáp án đúng: C
Câu 81: Một tổ chức bị cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm đối với hành vi nào sau đây?
a. Chuyển nhượng thầu trái quy định
b. Đưa hối lộ, nhận hối lộ
c. Vi phạm về thời gian đăng tải thông tin trong đấu thầu
d. Nộp hồ sơ dự thầu muộn
Đáp án đúng: A
Câu 82: Cơ quan nhà nước nào chịu trách nhiệm quản lý nhà nước về đấu thầu trên phạm vi cả nước?
a. Bộ Tài chính
b. Bộ Kế hoạch và Đầu tư
c. Thanh tra Chính phủ
d. Văn phòng Chính phủ
Đáp án đúng: B
Câu 83: Có bao nhiêu hình thức lựa chọn nhà thầu được quy định trong Luật Đấu thầu?
a. 5 hình thức
b. 7 hình thức
c. 8 hình thức
d. 9 hình thức
Đáp án đúng: D
Câu 84: Trường hợp gói thầu tư vấn được chia thành nhiều phần độc lập, hồ sơ mời thầu có được yêu cầu nhà thầu chào giá cho toàn bộ gói thầu không?
a. Có, để bảo đảm tính thống nhất
b. Không, nhà thầu có thể chọn chào cho một hoặc nhiều phần của gói thầu
c. Có, nếu được Chủ đầu tư phê duyệt
d. Tuỳ thuộc vào quyết định của Tổ chuyên gia
Đáp án đúng: B
Câu 85: Kế hoạch lựa chọn nhà thầu được lập căn cứ vào văn bản nào?
a. Quy hoạch sử dụng đất
b. Quyết định phê duyệt dự án, dự toán mua sắm, hoặc các văn bản tương đương có giá trị pháp lý
c. Nghị quyết của Hội đồng nhân dân cấp xã
d. Báo cáo tình hình tài chính của Chủ đầu tư
Đáp án đúng: B
Câu 86: Khi nào thì được phép chỉ định thầu rút gọn?
a. Đối với mọi gói thầu mua sắm hàng hóa dưới 2 tỷ đồng
b. Khi gói thầu cần thực hiện để khắc phục ngay hậu quả do thiên tai, dịch bệnh gây ra
c. Đối với gói thầu tư vấn thiết kế công trình trọng điểm quốc gia
d. Chỉ khi có sự đồng ý bằng văn bản của Bộ Kế hoạch và Đầu tư
Đáp án đúng: B
Câu 87: Hồ sơ mời thầu không được có các điều kiện nhằm mục đích gì?
a. Yêu cầu về chất lượng và tiến độ công việc
b. Bảo đảm tính cạnh tranh, công bằng
c. Hạn chế sự tham dự của một số nhà thầu hoặc tạo lợi thế cho một hoặc một số nhà thầu
d. Đưa ra các tiêu chuẩn kỹ thuật quốc tế
Đáp án đúng: C
Câu 88: Nếu nhà thầu cung cấp thông tin không trung thực trong E-HSDT làm sai lệch kết quả lựa chọn nhà thầu, nhà thầu sẽ bị xử lý như thế nào?
a. Bị cảnh cáo và yêu cầu nộp lại hồ sơ
b. Bị phạt tiền và cho phép tiếp tục tham gia
c. Bị loại bỏ E-HSDT và có thể bị cấm tham gia hoạt động đấu thầu
d. Chỉ bị tịch thu bảo đảm dự thầu
Đáp án đúng: C
Câu 89: Một gói thầu xây lắp đấu thầu rộng rãi qua mạng có giá gói thầu 15 tỷ đồng. Biện pháp bảo đảm dự thầu tối thiểu và tối đa là bao nhiêu?
a. Từ 1% đến 3% giá gói thầu
b. Từ 1% đến 1,5% giá gói thầu
c. Từ 2% đến 3% giá gói thầu
d. Từ 1% đến 2% giá gói thầu
Đáp án đúng: B
Câu 90: Đối với đấu thầu qua mạng, nhà thầu nộp bảo đảm dự thầu dưới hình thức nào?
a. Nộp tiền mặt trực tiếp cho bên mời thầu
b. Gửi thư bảo lãnh bản giấy đến trụ sở chủ đầu tư trước thời điểm đóng thầu
c. Nộp bảo lãnh ngân hàng điện tử qua Hệ thống mạng đấu thầu quốc gia hoặc nộp thư bảo lãnh bằng văn bản giấy nếu HSMT cho phép đính kèm bản scan (theo quy định cụ thể của HSMT)
d. Chuyển khoản vào tài khoản cá nhân của tổ trưởng tổ chuyên gia
Đáp án đúng: C
Câu 91: Hợp đồng theo đơn giá cố định được thanh toán như thế nào?
a. Thanh toán theo một mức giá duy nhất đã chốt từ đầu, không kể khối lượng thực tế
b. Thanh toán theo đơn giá cố định ghi trong hợp đồng nhân với khối lượng thực tế thực hiện được nghiệm thu
c. Thanh toán theo đơn giá cố định nhân với khối lượng ước tính trong thiết kế
d. Thanh toán theo đơn giá thay đổi theo chỉ số giá tiêu dùng hàng tháng
Đáp án đúng: B
Câu 92: Gói thầu mua sắm hàng hóa áp dụng phương pháp giá đánh giá. Nhà thầu A có giá dự thầu sau sửa lỗi hiệu chỉnh sai lệch là 10 tỷ, chi phí quy đổi để đưa về cùng mặt bằng là 0.5 tỷ. Giá đánh giá của nhà thầu A là?
a. 9.5 tỷ
b. 10 tỷ
c. 10.5 tỷ
d. 10.05 tỷ
Đáp án đúng: C
Câu 93: Nhà thầu phụ có được uỷ quyền cho nhà thầu chính thay mặt ký kết hợp đồng với chủ đầu tư không?
a. Được, nếu có giấy uỷ quyền hợp lệ
b. Không, nhà thầu phụ chỉ ký hợp đồng với nhà thầu chính, không ký trực tiếp với chủ đầu tư
c. Được, nếu chủ đầu tư đồng ý
d. Bắt buộc phải ký hợp đồng tay ba (Chủ đầu tư - Nhà thầu chính - Nhà thầu phụ)
Đáp án đúng: B
Câu 94: Trong đấu thầu qua mạng, biên bản mở thầu sẽ được tự động trích xuất và công khai trên Hệ thống trong thời gian bao lâu kể từ thời điểm đóng thầu?
a. Tối đa 02 giờ
b. Tối đa 12 giờ
c. Tối đa 24 giờ
d. Ngay lập tức
Đáp án đúng: A
Câu 95: Nếu có kiến nghị về kết quả lựa chọn nhà thầu, nhà thầu phải gửi văn bản kiến nghị đến cơ quan nào đầu tiên?
a. Hội đồng tư vấn cấp tỉnh
b. Bộ Kế hoạch và Đầu tư
c. Chủ đầu tư/Bên mời thầu
d. Tòa án nhân dân
Đáp án đúng: C
Câu 96: Tiêu chí nào KHÔNG phải là căn cứ để xét duyệt trúng thầu đối với gói thầu xây lắp áp dụng phương pháp giá thấp nhất?
a. Có hồ sơ dự thầu hợp lệ
b. Có năng lực, kinh nghiệm đáp ứng yêu cầu
c. Có đề xuất kỹ thuật đáp ứng yêu cầu
d. Có doanh thu cao nhất trong số các nhà thầu tham dự
Đáp án đúng: D
Câu 97: Việc thanh toán tạm ứng cho nhà thầu được thực hiện khi nào?
a. Ngay sau khi công bố kết quả trúng thầu
b. Sau khi hợp đồng có hiệu lực, nhà thầu đã nộp bảo đảm thực hiện hợp đồng (nếu có yêu cầu) và có bảo lãnh tạm ứng (đối với mức tạm ứng lớn hơn giá trị bảo đảm THHĐ hoặc theo quy định của HĐ)
c. Sau khi nhà thầu thi công được 10% khối lượng
d. Trước khi phát hành hồ sơ mời thầu
Đáp án đúng: B
Câu 98: Trong đấu thầu tư vấn, phương pháp đánh giá nào chú trọng tuyệt đối vào chất lượng kỹ thuật mà không xem xét giá dự thầu ở bước đánh giá đầu tiên?
a. Phương pháp giá thấp nhất
b. Phương pháp giá đánh giá
c. Phương pháp kết hợp kỹ thuật và giá
d. Phương pháp dựa trên kỹ thuật
Đáp án đúng: D
Câu 99: Trường hợp nhà thầu trúng thầu từ chối ký kết hợp đồng, bên mời thầu sẽ xử lý như thế nào?
a. Tịch thu bảo đảm dự thầu của nhà thầu đó và mời nhà thầu xếp hạng tiếp theo đến thương thảo, hoàn thiện hợp đồng
b. Hủy thầu và tiến hành đấu thầu lại từ đầu
c. Cho phép nhà thầu đó lùi thời hạn ký hợp đồng thêm 30 ngày
d. Yêu cầu nhà thầu nộp phạt gấp đôi giá trị bảo đảm dự thầu
Đáp án đúng: A
Câu 100: "Luật Đấu thầu số 22/2023/QH15" chính thức có hiệu lực thi hành từ ngày tháng năm nào?
a. 01/01/2023
b. 01/07/2023
c. 01/01/2024
d. 23/06/2023
Đáp án đúng: C
Câu 101: Đối với đấu thầu qua mạng, trường hợp nhà thầu rút E-HSDT sau thời điểm đóng thầu và trong thời gian có hiệu lực của E-HSDT thì nhà thầu bị xử lý theo phương án nào sau đây?
a. Không được hoàn trả bảo đảm dự thầu
b. Bị đánh giá là không đảm bảo uy tín khi tham dự thầu
c. Không được tiếp tục đánh giá E-HSDT
d. Các phương án trên đều đúng
Đáp án đúng: D
Câu 102: Trường hợp nào sau đây, nhà thầu được đánh giá là không đáp ứng quy định về bảo đảm cạnh tranh khi tham dự thầu gói thầu tổ chức đấu thầu rộng rãi?
a. Đơn vị sự nghiệp công lập A thuộc Sở Tài chính tỉnh X tham gia gói thầu do Sở Tài chính tỉnh X là chủ đầu tư mà chức năng, nhiệm vụ của đơn vị sự nghiệp công lập A phù hợp với gói thầu
b. Đơn vị sự nghiệp công lập A tham gia gói thầu do Chi cục B là chủ đầu tư. Chức năng nhiệm vụ của đơn vị sự nghiệp công lập A phù hợp với tính chất gói thầu. Đơn vị sự nghiệp công lập A và Chi cục B lần lượt là đơn vị sự nghiệp công lập và đơn vị hành chính do Sở Tài Chính tỉnh X trực tiếp quản lý
c. Đơn vị sự nghiệp công lập A tham gia gói thầu do đơn vị sự nghiệp công lập B là chủ đầu tư và cả hai đơn vị đều là đơn vị sự nghiệp do Sở Tài chính tỉnh X trực tiếp quản lý
d. Doanh nghiệp C tham gia gói thầu có sử dụng vốn ngân sách nhà nước do đơn vị sự nghiệp công lập A là chủ đầu tư. Đơn vị sự nghiệp công lập A và Doanh nghiệp C đều là đơn vị do Sở X trực tiếp quản lý
Đáp án đúng: C
Câu 103: Nhà thầu có được tham dự thầu với tư cách nhà thầu liên danh trong trường hợp phạm vi công việc của gói thầu mua sắm hàng hóa chỉ gồm 01 hạng mục là hệ thống máy chủ không?
a. Được liên danh nếu nhà thầu phân chia công việc trong liên danh theo các công việc thuộc quá trình sản xuất hạng mục trong bảng giá dự thầu
b. Không được liên danh, nhà thầu chỉ được tham dự với tư cách độc lập do phạm vi công việc chỉ gồm 01 hạng mục
c. Được liên danh trong trường hợp 01 thành viên thực hiện toàn bộ hạng mục hệ thống máy chủ, thành viên còn lại thực hiện thu xếp tài chính cho gói thầu
d. Phương án A và C đều đúng
Đáp án đúng: A
Câu 104: Có 4 nhà thầu tham dự thầu gói thầu mua sắm hàng hóa áp dụng phương pháp giá thấp nhất, trong đó: - Nhà thầu A, B, D là doanh nghiệp nhỏ và vừa do phụ nữ làm chủ. - Nhà thầu A, B, C và D có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá lần lượt là: 95 tỷ đồng, 100 tỷ đồng, 100 tỷ đồng và 105 tỷ đồng. - Nhà thầu A, B, C và D chứng minh được hàng hóa mình tham dự có tỷ lệ chi phí sản xuất trong nước lần lượt là: 20%, 40%, 45% và 60%. Trong trường hợp tất cả nhà thầu đều đáp ứng về kỹ thuật thì nhà thầu nào được xét duyệt trúng thầu?
a. Nhà thầu A được xét duyệt trúng thầu
b. Nhà thầu B được xét duyệt trúng thầu
c. Nhà thầu C được xét duyệt trúng thầu
d. Nhà thầu D được xét duyệt trúng thầu
Đáp án đúng: A
Câu 105: Trong lễ mở thầu đối với gói thầu đấu thầu quốc tế không qua mạng, chủ đầu tư xử lý như thế nào khi nhà thầu đề nghị bổ sung thư giảm giá do bị thất lạc trong quá trình nộp hồ sơ dự thầu theo đường bưu điện?
a. Chủ đầu tư chấp nhận do đây là lỗi vận chuyển theo bưu điện
b. Chủ đầu tư không chấp nhận vì thư giảm giá của nhà thầu nộp sau thời điểm đóng thầu
c. Chủ đầu tư tạm thời ghi nhận nội dung trong thư giảm giá của nhà thầu và trình Người có thẩm quyền quyết định
d. Chủ đầu tư coi là tình huống trong đấu thầu và xử lý trên cơ sở bảo đảm cạnh tranh, công bằng, minh bạch, hiệu quả kinh tế và trách nhiệm giải trình
Đáp án đúng: B
Câu 106: Nhận định nào sau đây là đúng ?
a. Gói thầu xây lắp, hàng hóa và dịch vụ phi tư vấn áp dụng hình thức chào hàng cạnh tranh và sử dụng phương pháp dựa trên kỹ thuật để đánh giá về tài chính và có giá đề nghị trúng thầu vượt giá gói thầu được phép thương thảo về chi phí
b. Gói thầu mua thuốc áp dụng phương thức một giai đoạn hai túi hồ sơ và sử dụng phương pháp kết hợp giữa kỹ thuật và giá được phép thương thảo về chi phí trong quá trình thương thảo hợp đồng
c. Gói thầu dịch vụ tư vấn áp dụng hình thức đấu thầu rộng rãi được phép thương thảo về chi phí trong quá trình thương thảo hợp đồng
d. Không được phép thương thảo về chi phí trong quá trình thương thảo hợp đồng đối với tất cả các gói thầu, trừ trường hợp nhà thầu tự nguyện giảm giá
Đáp án đúng: A
Câu 107: Hợp đồng nào được phép sử dụng để chứng minh hợp đồng tương tự khi tham dự gói thầu cung cấp thuốc có sử dụng ngân sách nhà nước của Bệnh viện?
a. Hợp đồng thuốc đã cung cấp thuốc cho cơ sở khám chữa bệnh tư nhân
b. Hợp đồng thuốc đã cung cấp thuốc cho các cơ sở kinh doanh thuốc
c. Phương án A và B đều đúng
d. Phương án A và B đều sai
Đáp án đúng: C
Câu 108: Khi thương thảo hợp đồng đối với gói thầu tư vấn áp dụng đấu thầu rộng rãi qua mạng, trường hợp nào nhà thầu được phép thay đổi nhân sự đã đề xuất trong E-HSDT?
a. Không được thay đổi nhân sự đã đề xuất trong E-HSDT trong mọi trường hợp
b. Được thay đổi nhân sự đã đề xuất trong E-HSDT 01 lần trong trường hợp nhân sự không đáp ứng yêu cầu hoặc không chứng minh được khả năng huy động
c. Được thay đổi nhân sự đã đề xuất trong E-HSDT trong trường hợp do thời gian đánh giá E-HSDT kéo dài hơn so với dự kiến trong kế hoạch lựa chọn nhà thầu hoặc vì lý do bất khả kháng mà các vị trí nhân sự chủ chốt do nhà thầu đã đề xuất không thể tham gia thực hiện hợp đồng
d. Phương án B và C đều đúng
Đáp án đúng: B
Câu 109: Đối với gói thầu xây lắp, áp dụng đấu thầu rộng rãi qua mạng, trường hợp hợp đồng tương tự mà nhà thầu cung cấp trong E- HSDT không đáp ứng theo yêu cầu của E- HSMT, chủ đầu tư xử lý như thế nào?
a. Đánh giá nhà thầu không đáp ứng về năng lực, kinh nghiệm. Nhà thầu không được bổ sung, thay thế hợp đồng tương tự khác
b. Yêu cầu nhà thầu bổ sung, thay thế hợp đồng tương tự khác (được cập nhật từ hồ sơ năng lực của nhà thầu trên Hệ thống). Trường hợp nhà thầu không có hợp đồng đáp ứng yêu cầu của E- HSMT thì nhà thầu bị loại
c. Tiếp tục đánh giá E-HSDT của nhà thầu, trường hợp nhà thầu xếp thứ nhất, cho phép nhà thầu bổ sung, thay thế hợp đồng tương tự khác.
d. Đồng thời với việc yêu cầu nhà thầu bổ sung hợp đồng thay thế khác thì chủ đầu tư xem xét, điều chỉnh lại yêu cầu về hợp đồng tương tự trong hồ sơ mời thầu
Đáp án đúng: B
Câu 110: Đối với với gói thầu hàng hóa áp dụng đấu thầu rộng rãi không qua mạng, trường hợp nào sau đây thư bảo lãnh hoặc giấy chứng nhận bảo hiểm bảo lãnh dự thầu bị đánh giá là không hợp lệ?
a. Thời gian có hiệu lực dài hơn so với yêu cầu của hồ sơ mời thầu
b. Có giá trị cao hơn so với yêu cầu của hồ sơ mời thầu
c. Ký trước khi phát hành hồ sơ mời thầu
d. Tất cả phương án trên đều đúng
Đáp án đúng: A
Câu 111: Gói thầu xây lắp tổ chức đấu thầu qua mạng có thời điểm đóng thầu là ngày 20/3/2025, năm tài chính của nhà thầu là 01/01 – 31/12, nhà thầu là công ty cổ phần được thành lập vào năm 2018 và E-HSMT yêu cầu nhà thầu nộp báo cáo tài chính của 03 năm gần nhất thì nhà thầu phải nộp báo cáo tài chính của các năm nào sau đây?
a. 2020, 2021, 2022
b. 2021, 2022, 2023
c. 2021, 2022, 2024
d. 2019, 2020, 2021
Đáp án đúng: B
Câu 112: Đối với công trình đang xét là công trình xây dựng có loại kết cấu dạng nhà cấp II với giá trị công trình là 60 tỷ đồng, E-HSMT có yêu cầu về kinh nghiệm thực hiện hợp đồng xây lắp tương tự, trường hợp nào sau đây được đánh giá là một công trình xây lắp tương tự?
a. Nhà thầu có 2 công trình xây dựng có loại kết cấu dạng nhà cấp III với giá trị đã hoàn thành toàn bộ lần lượt là 30 tỷ đồng, 50 tỷ đồng
b. Nhà thầu có 2 công trình xây dựng có loại kết cấu dạng nhà cấp III với giá trị đã hoàn thành toàn bộ lần lượt là 30 tỷ đồng, 20 tỷ đồng
c. Nhà thầu có 3 công trình xây dựng có loại kết cấu dạng nhà cấp III với giá trị đã hoàn thành toàn bộ lần lượt là 30 tỷ đồng, 20 tỷ đồng, 10 tỷ đồng
d. Nhà thầu có 1 công trình xây dựng có loại kết cấu dạng nhà cấp III với giá trị đã hoàn thành toàn bộ là 60 tỷ đồng
Đáp án đúng: A
Câu 113: Gói thầu cung cấp dịch vụ vệ sinh tòa nhà do Sở Tài chính tỉnh X làm chủ đầu tư có giá gói thầu 01 tỷ đồng, thời gian thực hiện là 12 tháng, hợp đồng tương tự yêu cầu 30% giá gói thầu. Trường hợp nào sau đây nhà thầu được coi là đáp ứng về giá trị của hợp đồng tương tự?
a. Nhà thầu cung cấp hợp đồng A (chưa hoàn thành, chưa được thanh lý) có giá trị công việc dịch vụ vệ sinh tòa nhà (đã được nghiệm thu) là 100 triệu đồng; hợp đồng B (chưa hoàn thành, chưa được thanh lý) có giá trị công việc dịch vụ vệ sinh tòa nhà (đã được nghiệm thu) là 250 triệu đồng
b. Nhà thầu cung cấp hợp đồng A (đã nghiệm thu, đã được thanh lý) có giá trị công việc dịch vụ vệ sinh tòa nhà là 300 triệu đồng
c. Nhà thầu cung cấp hợp đồng A (chưa hoàn thành, chưa được thanh lý) có giá trị công việc dịch vụ vệ sinh tòa nhà (chưa được nghiệm thu) là 100 triệu đồng; hợp đồng B (chưa hoàn thành, chưa được thanh lý) có giá trị công việc dịch vụ vệ sinh tòa nhà (đã được nghiệm thu) là 400 triệu đồng
d. Tất cả đáp án trên đều đúng
Đáp án đúng: D
Câu 114: Gói thầu mua sắm trang thiết bị do Sở Tư pháp tỉnh X làm chủ đầu tư có giá gói thầu 03 tỷ đồng, thời gian thực hiện là 12 tháng, trong đó có 02 hạng mục: máy điều hòa (mã HS 8415) giá dự toán 01 tỷ đồng, máy tính xách tay (mã HS 8507) giá dự toán 02 tỷ đồng, hợp đồng tương tự yêu cầu 50% giá gói thầu. Trường hợp nào sau đây nhà thầu được coi là không đáp ứng về giá trị của hợp đồng tương tự?
a. Nhà thầu cung cấp 02 hợp đồng, trong đó: 01 hợp đồng đã thực hiện việc cung cấp mã hàng hóa 8415 với giá trị 400 triệu đồng, 01 hợp đồng đã thực hiện việc cung cấp mã hàng hóa 8415 với giá trị 100 triệu đồng và mã hàng hóa 8507 với giá trị 01 tỷ đồng
b. Nhà thầu cung cấp 01 hợp đồng có đầy đủ các mã hàng hóa 8415 và 8507 và tổng giá trị của mã hàng hóa 8415, 8507 trong hợp đồng đã hoàn thành với giá trị 1,6 tỷ đồng
c. Nhà thầu cung cấp 02 hợp đồng, trong đó: 01 hợp đồng đã thực hiện việc cung cấp mã hàng hóa 8415 với giá trị 600 triệu đồng và 01 hợp đồng đã thực hiện việc cung cấp mã hàng hóa 8507 với giá trị 01 tỷ đồng
d. Phương án A và B đều không đáp ứng về giá trị hợp đồng tương tự
Đáp án đúng: C
Câu 115: Gói thầu cung cấp dịch vụ giặt là thực hiện đấu thầu qua mạng, E-HSMT có quy định cho phép sử dụng nhà thầu phụ tối đa 20% trên giá dự thầu của nhà thầu. Nhà thầu liên danh A-B, trong đó nhà thầu Công ty A đảm nhận 30% giá trị công việc, Công ty B đảm nhận 70% giá trị công việc. Việc sử dụng nhà thầu phụ đối với từng thành viên liên danh được thực hiện như thế nào?
a. Công ty A được sử dụng nhà thầu phụ tối đa 20% trên 30% giá trị công việc mà công ty A đảm nhận, Công ty B được sử dụng nhà thầu phụ tối đa 20% trên 70% giá trị công việc mà công ty B đảm nhận
b. Công ty A được sử dụng nhà thầu phụ tối đa 20% trên tổng giá trị (100%) công việc và Công ty B được sử dụng nhà thầu phụ tối đa 20% trên tổng giá trị (100%) công việc mà Công ty A và Công ty B đảm nhận
c. Thực hiện theo thỏa thuận giữa Công ty A và Công ty B, Công ty A hoặc Công ty B được sử dụng nhà thầu phụ tối đa 20% trên tổng giá trị (100%) công việc nhưng phải bảo đảm tổng khối lượng công việc của nhà thầu phụ của liên danh A-B tối đa 20% trên tổng giá trị (100%) công việc mà Công ty A và Công ty B đảm nhận
d. Tất cả đáp án trên đều đúng
Đáp án đúng: A
Câu 116: Nhà thầu liên danh A-B tham dự thầu và nộp bảo đảm dự thầu riêng rẽ, trong quá trình đánh giá hồ sơ dự thầu tổ chuyên gia có bằng chứng cho thấy nhà thầu A có hành vi gian lận, thuộc hành vi bị cấm trong đấu thầu, trong trường hợp này bảo đảm dự thầu của nhà thầu liên danh xử lý như thế nào?
a. Không hoàn trả bảo đảm dự thầu của cả nhà thầu liên danh A-B
b. Không hoàn trả bảo đảm dự thầu của nhà thầu A
c. Không hoàn trả bảo đảm dự thầu của nhà thầu B
d. Nhà thầu A và nhà thầu B vẫn được hoàn trả bảo đảm dự thầu
Đáp án đúng: A
Câu 117: Gói thầu đang xét là gói thầu giặt cho bệnh viện công lập (có tính chất công việc lặp lại theo chu kỳ qua các năm), có thời gian thực hiện gói thầu trong 3 năm với giá gói thầu là 12 tỷ đồng. Nhà thầu nào được xác định đáp ứng yêu cầu về giá trị hợp đồng tương tự khi tham dự gói thầu này?
a. Nhà thầu A có 01 hợp đồng giặt là X cho bệnh viện công lập có thời gian thực hiện gói thầu là 48 tháng (đang trong quá trình thực hiện, chưa hoàn thành, chưa được thanh lý), nhưng tính đến thời điểm tham dự thầu, nhà thầu A đã thực hiện được 24 tháng, trong đó giá trị công việc đã được nghiệm thu 12 tháng đầu là 1,2 tỷ đồng;
b. Nhà thầu B cung cấp 02 hợp đồng, trong đó có hợp đồng giặt X cho khách sạn tư nhân, thời gian thực hiện hợp đồng trong 06 tháng với giá trị là 300 triệu đồng; Hợp đồng giặt là Y cho bệnh viện công lập, thời gian thực hiện hợp đồng trong 24 tháng với giá trị là 3 tỷ đồng, trong đó giá trị công việc đã được nghiệm thu 12 tháng đầu là 1 tỷ đồng.
c. Nhà thầu A và B đều đáp ứng
d. Nhà thầu A và B đều không đáp ứng
Đáp án đúng: D
Câu 118: Trường hợp E-HSMT gói thầu xây lắp yêu cầu về cam kết cung cấp tín dụng, nhà thầu được chứng minh bằng cách nào?
a. Bằng số dư tài khoản hoặc tiền gửi tiết kiệm từ ngân hàng
b. Bằng cam kết cung cấp tín dụng của ngân hàng
c. Bằng xác nhận số dư hạn mức tín dụng khả dụng từ ngân hàng
d. Tất cả các phương án trên đều đúng
Đáp án đúng: B
Câu 119: Hợp đồng theo tỷ lệ phần trăm có thể được áp dụng đối với gói thầu nào sau đây?
a. Mua sắm thiết bị y tế
b. Xây dựng công trình
c. Bảo hiểm công trình mà giá trị hợp đồng được xác định chính xác trên cơ sở giá trị công trình thực tế được nghiệm thu
d. Tư vấn giám sát
Đáp án đúng: C
Câu 120: Cơ sở để thanh toán hợp đồng cho nhà thầu là gì?
a. Giá hợp đồng và các điều khoản cụ thể về thanh toán được ghi trong hợp đồng
b. Dự toán gói thầu và các điều khoản cụ thể về thanh toán được ghi trong hợp đồng
c. Dự toán gói thầu
d. Phương án A và C đều sai
Đáp án đúng: A
Câu 121: Nhà thầu không được hoàn trả bảo đảm thực hiện hợp đồng trong trường hợp nào?
a. Từ chối thực hiện hợp đồng khi hợp đồng đã có hiệu lực
b. Thực hiện hợp đồng chậm tiến độ nhưng vẫn hoàn thành hợp đồng
c. Nhà thầu đề nghị điều chỉnh tiến độ do bất khả kháng
d. Nhà thầu đề xuất thay đổi nhà thầu phụ
Đáp án đúng: A
Câu 122: Trường hợp nào sau đây phải áp dụng bảo đảm thực hiện hợp đồng?
a. Nhà thầu cung dịch vụ phi tư vấn
b. Nhà thầu thực hiện gói thầu có giá gói thầu thuộc hạn mức chỉ định thầu
c. Nhà thầu cung cấp dịch vụ tư vấn
d. Nhà thầu được lựa chọn theo hình thức tự thực hiện
Đáp án đúng: A
Câu 123: Hồ sơ hợp đồng bao gồm các tài liệu nào sau đây?
a. Văn bản hợp đồng
b. Phụ lục hợp đồng gồm danh mục chi tiết về phạm vi công việc, biểu giá, tiến độ thực hiện (nếu có)
c. Quyết định phê duyệt kết quả lựa chọn nhà thầu
d. Tất cả các phương án trên.
Đáp án đúng: D
Câu 124: Đối với đấu thầu không qua mạng, quy định về việc công khai biên bản mở thầu trên Hệ thống mạng đấu thầu quốc gia nào sau đây là đúng?
a. Được đăng tải trên Hệ thống mạng đấu thầu quốc gia trong thời hạn 24 giờ kể từ thời điểm mở thầu
b. Được đăng tải trên Hệ thống mạng đấu thầu quốc gia trong thời hạn 02 giờ kể từ thời điểm mở thầu
c. Được đăng tải trên Hệ thống mạng đấu thầu quốc gia trong thời hạn 04 giờ kể từ thời điểm mở thầu
d. Được đăng tải trên Hệ thống mạng đấu thầu quốc gia trong thời hạn 03 ngày làm việc kể từ thời điểm mở thầu
Đáp án đúng: A
Câu 125: Chủ đầu tư A và nhà thầu B đã ký kết hợp đồng cung cấp 11000 đơn vị hàng hóa, loại hợp đồng theo đơn giá cố định. Trong quá trình thực hiện hợp đồng, nhu cầu sử dụng thực tế mà nhà thầu phải cung cấp cho chủ đầu tư chỉ là 10500 đơn vị hàng hóa. Hãy lựa chọn phương án đúng về sửa đổi hợp đồng trong trường hợp này?
a. Chủ đầu tư A và nhà thầu B bắt buộc phải thực hiện thủ tục sửa đổi hợp đồng, phải ký kết văn bản sửa đổi hợp đồng
b. Chủ đầu tư A và nhà thầu B không cần thực hiện thủ tục sửa đổi hợp đồng, không phải ký kết văn bản sửa đổi hợp đồng
c. Chủ đầu tư A và nhà thầu B bắt buộc phải thực hiện thủ tục ký phụ lục hợp đồng để điều chỉnh khối lượng
d. Phương án A và C đều đúng
Đáp án đúng: A
Câu 126: Trường hợp nào sau đây các bên không phải thỏa thuận trong hợp đồng về quy trình, thủ tục sửa đổi hợp đồng?
a. Khi có sự thay đổi về chính sách, pháp luật làm ảnh hưởng trực tiếp đến việc thực hiện hợp đồng
b. Khi có sự kiện bất khả kháng
c. Khi thay đổi phương thức vận chuyển, địa điểm giao hàng, dịch vụ liên quan đối với gói thầu mua sắm hàng hóa
d. Tăng, giảm thời gian đối với hợp đồng theo thời gian; tăng, giảm chi phí trực tiếp thực hiện đối với hợp đồng chi phí cộng phí; tăng, giảm giá trị cơ sở để tính phần trăm chi phí đối với hợp đồng theo tỷ lệ phần trăm; tăng, giảm mức giảm trừ thanh toán, mức tăng giá trị thanh toán đối với hợp đồng theo kết quả đầu ra
Đáp án đúng: B
Câu 127: Phát hành hồ sơ mời quan tâm, hồ sơ mời sơ tuyển, hồ sơ mời thầu được thực hiện như thế nào?
a. Hồ sơ mời quan tâm, hồ sơ mời sơ tuyển, hồ sơ mời thầu được phát hành sau 01 ngày kể từ khi thông báo mời quan tâm, thông báo mời sơ tuyển, thông báo mời thầu được đăng tải thành công trên Hệ thống mạng đấu thầu quốc gia
b. Hồ sơ mời quan tâm, hồ sơ mời sơ tuyển, hồ sơ mời thầu được phát hành trước khi đăng tải thông báo mời quan tâm, thông báo mời sơ tuyển, thông báo mời thầu
c. Hồ sơ mời quan tâm, hồ sơ mời sơ tuyển, hồ sơ mời thầu được phát hành sau 03 ngày kể từ khi thông báo mời quan tâm, thông báo mời sơ tuyển, thông báo mời thầu được đăng tải thành công trên Hệ thống mạng đấu thầu quốc gia
d. Hồ sơ mời quan tâm, hồ sơ mời sơ tuyển, hồ sơ mời thầu được phát hành ngay sau khi đăng tải thành công thông báo mời quan tâm, thông báo mời sơ tuyển, thông báo mời thầu
Đáp án đúng: B
Câu 128: Hãy chọn phương án đúng về đấu thầu trước?
a. Đấu thầu trước là việc thực hiện trước một số thủ tục trước khi dự án được phê duyệt đầu tư nhằm mục đích đẩy nhanh tiến độ thực hiện dự án, trừ gói thầu cần thực hiện trước khi phê duyệt dự án
b. Đấu thầu trước là việc thực hiện các gói thầu thuộc giai đoạn chuẩn bị đầu tư
c. Đấu thầu trước là việc lựa chọn nhà thầu không cần phê duyệt kế hoạch lựa chọn nhà thầu để đẩy nhanh tiến độ thực hiện
d. Đấu thầu trước là việc thực hiện trước một số thủ tục trước khi dự án, dự toán mua sắm được phê duyệt nhằm mục đích đẩy nhanh tiến độ thực hiện dự án, dự toán mua sắm, trừ gói thầu cần thực hiện trước khi phê duyệt dự án
Đáp án đúng: A
Câu 129: Quy trình, thủ tục lựa chọn nhà thầu đối với mua sắm trực tiếp không bao gồm bước nào sau đây?
a. Thẩm định hồ sơ yêu cầu
b. Đánh giá hồ sơ đề xuất và thương thảo về các đề xuất của nhà thầu
c. Phát hành hồ sơ yêu cầu
d. Phê duyệt và công khai kết quả mua sắm trực tiếp
Đáp án đúng: A
Câu 130: Quy trình, thủ tục lựa chọn nhà thầu đối với chào hàng cạnh tranh không bao gồm bước nào sau đây?
a. Phê duyệt kết quả lựa chọn nhà thầu
b. Công khai kết quả lựa chọn nhà thầu
c. Thẩm định kết quả lựa chọn nhà thầu
d. Hoàn thiện, ký kết và quản lý thực hiện hợp đồng
Đáp án đúng: C
Câu 131: Thời gian phê duyệt hồ sơ mời thầu được quy định như thế nào?
a. Do chủ đầu tư quyết định trên cơ sở bảo đảm tiến độ của dự án, gói thầu
b. Tối đa là 05 ngày làm việc kể từ ngày tổ chuyên gia trình dự thảo hồ sơ mời thầu trong trường hợp không thẩm định hồ sơ mời thầu
c. Tối đa là 05 ngày làm việc kể từ ngày tổ thẩm định gửi báo cáo thẩm định hồ sơ mời thầu
d. Phương án B và C đều đúng
Đáp án đúng: A
Câu 132: Thời gian phê duyệt kết quả lựa chọn nhà thầu được quy định như thế nào?
a. Do chủ đầu tư quyết định trên cơ sở bảo đảm tiến độ của dự án, gói thầu
b. Tối đa là 05 ngày làm việc kể từ ngày tổ chuyên gia trình báo cáo đánh giá hồ sơ dự thầu trong trường hợp không thẩm định kết quả lựa chọn nhà thầu
c. Tối đa là 05 ngày làm việc kể từ ngày tổ thẩm định trình báo cáo thẩm định kết quả lựa chọn nhà thầu
d. Phương án B và C đều đúng
Đáp án đúng: A
Câu 133: Thời gian đánh giá hồ sơ dự thầu được quy định như thế nào?
a. Tối đa không quá 45 ngày đối với đấu thầu trong nước và không quá 60 ngày đối với đấu thầu quốc tế
b. Tối đa không quá 30 ngày đối với đấu thầu trong nước và không quá 60 ngày đối với đấu thầu quốc tế
c. Do người có thẩm quyền, chủ đầu tư có trách nhiệm quyết định
d. Do chủ đầu tư quyết định trên cơ sở bảo đảm tiến độ của dự án, gói thầu
Đáp án đúng: D
Câu 134: Quy trình, thủ tục lựa chọn nhà thầu đối với chỉ định thầu theo quy trình rút gọn bao gồm các bước nào sau đây?
a. Chuẩn bị và gửi dự thảo hợp đồng cho nhà thầu; thương thảo, hoàn thiện hợp đồng; trình, thẩm định, phê duyệt và công khai kết quả lựa chọn nhà thầu; ký kết hợp đồng
b. Chuẩn bị và gửi dự thảo hợp đồng cho nhà thầu; thương thảo hợp đồng; trình, thẩm định, phê duyệt kết quả lựa chọn nhà thầu; ký kết và quản lý thực hiện hợp đồng
c. Chuẩn bị và gửi dự thảo hợp đồng cho nhà thầu; hoàn thiện hợp đồng, phê duyệt và công khai kết quả lựa chọn nhà thầu; ký kết và quản lý thực hiện hợp đồng
d. Lập, phê duyệt hồ sơ yêu cầu; xác định nhà thầu dự kiến được mời nhận hồ sơ yêu cầu; đánh giá hồ sơ đề xuất và thương thảo về các đề xuất của nhà thầu; phê duyệt và công khai kết quả lựa chọn nhà thầu; hoàn thiện, ký kết và quản lý thực hiện hợp đồng
Đáp án đúng: C
Câu 135: Đối với gói thầu áp dụng một giai đoạn một túi hồ sơ, trường hợp nào được thực hiện bước thương thảo hợp đồng?
a. Gói thầu hỗn hợp
b. Gói thầu mua sắm hàng hóa áp dụng đấu thầu quốc tế
c. Gói thầu áp dụng đấu thầu hạn chế do có yêu cầu đặc thù về kỹ thuật mà chỉ có một hoặc một số nhà thầu đáp ứng yêu cầu của gói thầu
d. Tất cả phương án trên đều đúng
Đáp án đúng: C
Câu 136: Danh mục hàng hóa, dịch vụ áp dụng mua sắm tập trung do Bộ trưởng Bộ Y tế ban hành:
a. Danh mục mua sắm tập trung cấp quốc gia đối với ô tô trong trường hợp cần thiết
b. Danh mục mua sắm tập trung cấp quốc gia đối với thuốc; danh mục mua sắm tập trung cấp quốc gia đối với thiết bị công nghệ thông tin trong trường hợp cần thiết
c. Danh mục mua sắm tập trung cấp quốc gia đối với thuốc; danh mục mua sắm tập trung cấp quốc gia đối với dịch vụ đơn giản trong trường hợp cần thiết
d. Danh mục mua sắm tập trung cấp quốc gia đối với thuốc; danh mục mua sắm tập trung cấp quốc gia đối với thiết bị y tế, vật tư xét nghiệm trong trường hợp cần thiết
Đáp án đúng: D
Câu 137: Hình thức lựa chọn nhà thầu khi áp dụng mua sắm tập trung bảo hiểm tài sản cho các cơ quan thuộc tỉnh Y
a. Đấu thầu rộng rãi.
b. Đấu thầu hạn chế.
c. Đàm phán giá.
d. Đấu thầu rộng rãi và đàm phán giá.
Đáp án đúng: A
Câu 138: Đơn vị mua sắm tập trung:
a. Thực hiện việc lựa chọn nhà thầu trên cơ sở nhiệm vụ được giao
b. Thực hiện việc lựa chọn nhà thầu trên cơ sở hợp đồng ký với các đơn vị có nhu cầu
c. Không được thực hiện việc lựa chọn nhà thầu
d. Phương án A và B đều đúng
Đáp án đúng: B
Câu 139: Thời hạn của thỏa thuận khung:
a. Thời hạn áp dụng thỏa thuận khung được quy định là 40 tháng
b. Thời hạn áp dụng thỏa thuận khung được quy định trong kế hoạch lựa chọn nhà thầu nhưng không quá 36 tháng
c. Thời hạn áp dụng thỏa thuận khung do người có thẩm quyền quyết định trong kế hoạch lựa chọn nhà thầu
d. Phương án B và C đều đúng
Đáp án đúng: B
Câu 140: Tại bước hoàn thiện, ký kết và thực hiện hợp đồng với nhà thầu đối với gói thầu mua sắm tập trung:
a. Nhà thầu đã ký kết thỏa thuận khung phải thực hiện biện pháp bảo đảm thực hiện hợp đồng trước hoặc cùng thời điểm hợp đồng có hiệu lực cho đơn vị mua sắm tập trung
b. Nhà thầu đã ký kết thỏa thuận khung phải thực hiện biện pháp bảo đảm thực hiện hợp đồng trước hoặc cùng thời điểm hợp đồng có hiệu lực cho đơn vị có nhu cầu mua sắm
c. Nhà thầu đã ký kết thỏa thuận khung không phải thực hiện biện pháp bảo đảm thực hiện hợp đồng trước thời điểm hợp đồng có hiệu lực cho đơn vị có nhu cầu mua sắm
d. Nhà thầu đã ký kết thỏa thuận khung phải thực hiện biện pháp bảo đảm thực hiện hợp đồng sau thời điểm hợp đồng có hiệu lực cho đơn vị mua sắm tập trung
Đáp án đúng: B
Câu 141: Đối với các gói thầu mua sắm tập trung, trách nhiệm cung cấp thông tin về kết quả thực hiện hợp đồng của nhà thầu do ai thực hiện?
a. Đơn vị có nhu cầu mua sắm
b. Bên mời thầu
c. Đơn vị tư vấn được thuê làm bên mời thầu
d. Không phải đăng tải thông tin
Đáp án đúng: A
Câu 142: Áp dụng hình thức lựa chọn nhà thầu nào khi mua sắm tập trung đối với gói thầu điều hòa không khí thông dụng, sẵn có trên thị trường, có giá gói thầu là 03 tỷ đồng cho các cơ quan thuộc tỉnh X?
a. Đấu thầu rộng rãi hoặc mua sắm trực tiếp
b. Đấu thầu rộng rãi hoặc chỉ định thầu theo hạn mức
c. Đấu thầu rộng rãi hoặc chào hàng cạnh tranh
d. Đấu thầu rộng rãi hoặc chỉ định thầu hoặc đám phán giá
Đáp án đúng: C
Câu 143: Trách nhiệm trong mua sắm tập trung?
a. Đơn vị mua sắm tập trung thực hiện trách nhiệm của người có thẩm quyền theo quy định của Luật Đấu thầu
b. Đơn vị mua sắm tập trung thực hiện trách nhiệm của chủ đầu tư theo quy định của Luật Đấu thầu
c. Đơn vị mua sắm tập trung thực hiện trách nhiệm của bên mời thầu theo quy định của Luật Đấu thầu
d. Đơn vị mua sắm tập trung thực hiện trách nhiệm của tổ chuyên gia theo quy định của Luật Đấu thầu
Đáp án đúng: B
Câu 144: Nhà thầu đã ký thỏa thuận khung và được đơn vị có nhu cầu mua sắm yêu cầu ký hợp đồng nhưng không ký hợp đồng, không thực hiện biện pháp bảo đảm thực hiện hợp đồng sẽ bị xử lý như thế nào?
a. Nhà thầu sẽ bị khóa tài khoản trên Hệ thống mạng đấu thầu quốc gia trong thời hạn 06 tháng kể từ ngày đơn vị có nhu cầu mua sắm công khai tên nhà thầu trên Hệ thống mạng đấu thầu quốc gia
b. Nhà thầu sẽ bị khóa tài khoản trên Hệ thống mạng đấu thầu quốc gia trong thời hạn 06 tháng kể từ ngày đơn vị mua sắm tập trung công khai tên nhà thầu trên Hệ thống mạng đấu thầu quốc gia, trừ trường hợp bất khả kháng
c. Nhà thầu sẽ bị khóa tài khoản trên Hệ thống mạng đấu thầu quốc gia trong thời hạn trong thời hạn 03 tháng kể từ ngày Bộ Tài chính nhận được văn bản đề nghị của đơn vị có nhu cầu mua sắm, trừ trường hợp bất khả kháng
d. Nhà thầu sẽ bị khóa tài khoản trên Hệ thống mạng đấu thầu quốc gia trong thời hạn trong thời hạn 06 tháng kể từ ngày Bộ Tài chính nhận được văn bản đề nghị của đơn vị có nhu cầu mua sắm, trừ trường hợp bất khả kháng
Đáp án đúng: B
Câu 145: Đối với gói thầu mua sắm tập trung áp dụng lựa chọn nhà thầu căn cứ theo khả năng cung cấp và áp dụng phương pháp giá thấp nhất, việc lựa chọn danh sách nhà thầu trúng thầu được thực hiện như thế nào?
a. Phải đảm bảo tổng số lượng hàng hóa mà các nhà thầu trúng thầu chào thầu tối thiểu bằng số lượng hàng hóa nêu trong hồ sơ mời thầu, đồng thời bảo đảm điểm tổng hợp của gói thầu cao nhất
b. Phải đảm bảo tổng số lượng hàng hóa mà các nhà thầu trúng thầu chào thầu bằng số lượng hàng hóa nêu trong hồ sơ mời thầu, đồng thời bảo đảm tổng giá đề nghị trúng thầu của gói thầu cao nhất
c. Phải đảm bảo tổng số lượng hàng hóa mà các nhà thầu trúng thầu chào thầu bằng số lượng hàng hóa nêu trong hồ sơ mời thầu, đồng thời bảo đảm tổng giá đề nghị trúng thầu của gói thầu thấp nhất
d. Phải đảm bảo tổng số lượng hàng hóa mà các nhà thầu trúng thầu chào thầu bằng số lượng hàng hóa nêu trong hồ sơ mời thầu, đồng thời bảo đảm tổng giá đánh giá của gói thầu là thấp nhất
Đáp án đúng: D
Câu 146: Đối với gói thầu mua sắm tập trung áp dụng lựa chọn nhà thầu căn cứ khối lượng mời thầu, danh sách phê duyệt nhà thầu trúng thầu bao gồm:
a. Danh sách chính (nhà thầu xếp thứ nhất) và danh sách dự bị (nhà thầu xếp thứ 2 trở đi)
b. Danh sách chính (nhà thầu xếp thứ nhất) và danh sách nhà thầu không đáp ứng yêu cầu của hồ sơ mời thầu
c. Danh sách các nhà thầu đáp ứng yêu cầu về năng lực và kinh nghiệm theo yêu cầu của hồ sơ mời thầu
d. Danh sách chính (nhà thầu xếp thứ nhất và nhà thầu xếp thứ 2) và danh sách dự bị (nhà thầu xếp thứ 3 trở đi)
Đáp án đúng: A
Câu 147: Đối với hàng hóa, dịch vụ không thuộc danh mục mua sắm tập trung do Chủ tịch UBND tỉnh X ban hành nhưng nhiều cơ quan, tổ chức, đơn vị trong tỉnh X có nhu cầu mua sắm hàng hóa, dịch vụ cùng loại thì thực hiện như thế nào?
a. Từng cơ quan, tổ chức, đơn vị trong tỉnh X căn cứ vào thỏa thuận khung do UBND tỉnh X đã ký kết trước đó để mua sắm tập trung đối với các hàng hóa, dịch vụ này
b. Có thể gộp thành một gói thầu để một trong các cơ quan, tổ chức, đơn vị mua sắm hoặc để đơn vị có chức năng mua sắm tập trung thực hiện việc mua sắm đối với các hàng hóa, dịch vụ này
c. Sở Tài chính thuộc tỉnh X có trách nhiệm thực hiện mua sắm tập trung đối với các hàng hóa, dịch vụ này
d. Các cơ quan, tổ chức, đơn vị báo cáo lên người có thẩm quyền để phê duyệt kế hoạch chọn nhà thầu theo hình thức mua sắm tập trung đối với các hàng hóa, dịch vụ này
Đáp án đúng: B
Câu 148: Phương án nào sau đây được xác định là một bước trong quá trình lựa chọn nhà thầu theo quy trình chỉ định thầu thông thường được pháp luật về đấu thầu quy định?
a. Xác định tối thiểu 03 nhà thầu có đủ năng lực, kinh nghiệm để mời nhận hồ sơ yêu cầu
b. Chuẩn bị và gửi dự thảo hợp đồng cho tối thiểu 03 nhà thầu có đủ năng lực, kinh nghiệm để đàm phán hợp đồng
c. Đánh giá hồ sơ đề xuất và thương thảo về các đề xuất của nhà thầu
d. Phương án A và C đều đúng
Đáp án đúng: C
Câu 149: Trường hợp đơn vị được giao nhiệm vụ mua sắm tập trung không đủ năng lực, kinh nghiệm tổ chức lựa chọn nhà thầu thì thực hiện như thế nào?
a. Vẫn thực hiện nhiệm vụ được giao, tổ chuyên gia không cần phải đáp ứng yêu cầu về năng lực, kinh nghiệm
b. Phải thực hiện theo nhiệm vụ được giao, không được đi thuê đơn vị tư vấn để thực hiện việc lựa chọn nhà thầu
c. Được phép thuê đơn vị tư vấn đấu thầu có kinh nghiệm để thực hiện việc lựa chọn nhà thầu
d. Phương án A và C đều đúng
Đáp án đúng: C
Câu 150: Phương án nào xác định quy mô của hợp đồng tương tự đối với gói thầu áp dụng mua sắm tập trung là phù hợp?
a. Trong mọi trường hợp có thể điều chỉnh giảm yêu cầu về quy mô của hợp đồng tương tự xuống còn Y/1,5 (Y thông thường khoảng 50% giá trị của gói thầu đang xét)
b. Trường hợp mua sắm tập trung hoặc mua sắm hàng hóa có số lượng, khối lượng mời thầu lớn thì có thể điều chỉnh giảm yêu cầu về quy mô của hợp đồng tương tự xuống còn Y/1,25 (Y thông thường khoảng 50% giá trị của gói thầu đang xét) và/hoặc chia gói thầu thành các phần (lô) để tăng tính cạnh tranh cho gói thầu
c. Trường hợp mua sắm tập trung hoặc mua sắm hàng hóa có số lượng, khối lượng mời thầu lớn thì có thể điều chỉnh giảm yêu cầu về quy mô của hợp đồng tương tự xuống còn Y/1,5 (Y thông thường khoảng 50% giá trị của gói thầu đang xét) và/hoặc chia gói thầu thành các phần (lô) để tăng tính cạnh tranh cho gói thầu
d. Trường hợp mua sắm tập trung hoặc mua sắm hàng hóa có số lượng, khối lượng mời thầu lớn, chủ đầu tư báo cáo người có thẩm quyền để điều chỉnh giảm yêu cầu về quy mô của hợp đồng tương tự xuống còn Y/1,25 (Y thông thường khoảng 50% giá trị của gói thầu đang xét) và/hoặc chia gói thầu thành các phần (lô) để tăng tính cạnh tranh cho gói thầu
Đáp án đúng: B
Câu 151: Thẩm quyền phê duyệt kế hoạch tổng thể lựa chọn nhà thầu thuộc chủ thể nào?
a. Người có thẩm quyền
b. Chủ đầu tư (trường hợp xác định được chủ đầu tư)
c. Người đứng đầu cơ quan được giao chuẩn bị dự án
d. Bên mời thầu
Đáp án đúng: A
Câu 152: Trường hợp thuê đơn vị tư vấn lập hồ sơ mời quan tâm, hồ sơ mời sơ tuyển, hồ sơ mời thầu, hồ sơ yêu cầu; đánh giá hồ sơ quan tâm, hồ sơ dự sơ tuyển, hồ sơ dự thầu, hồ sơ đề xuất, tổ chuyên gia được thành lập bởi?
a. Người có thẩm quyền
b. Chủ đầu tư
c. Bên mời thầu
d. Đơn vị tư vấn được chủ đầu tư lựa chọn
Đáp án đúng: D
Câu 153: Nhiệm vụ nào sau đây không thuộc trách nhiệm của người có thẩm quyền?
a. Phê duyệt kế hoạch lựa chọn nhà thầu
b. Giải quyết kiến nghị và xử lý các vi phạm pháp luật về đấu thầu
c. Quyết định việc hủy thầu khi thay đổi mục tiêu đầu tư trong quyết định đầu tư
d. Quyết định việc hủy thầu, đình chỉ cuộc đấu thầu, không công nhận kết quả lựa chọn nhà thầu khi phát hiện có hành vi vi phạm pháp luật về đấu thầu
Đáp án đúng: A
Câu 154: Trường hợp nào sau đây việc phê duyệt kế hoạch lựa chọn nhà thầu thuộc trách nhiệm của chủ đầu tư?
a. Chủ đầu tư không có trách nhiệm phê duyệt kế hoạch lựa chọn nhà thầu
b. Chủ đầu tư có trách nhiệm phê duyệt kế hoạch lựa chọn nhà thầu, trừ trường hợp chưa xác định được chủ đầu tư theo quy định của pháp luật
c. Trường hợp gói thầu được thực hiện trước khi có quyết định phê duyệt dự án và chưa xác định được chủ đầu tư
d. Chủ đầu tư chỉ được phê duyệt kế hoạch lựa chọn nhà thầu trong trường hợp được người có thẩm quyền ủy quyền
Đáp án đúng: A
Câu 155: Việc chấp thuận hoặc không chấp thuận việc điều chuyển khối lượng, phạm vi công việc của nhà thầu phụ cho tổ chức, đơn vị khác khi cần đáp ứng yêu cầu về tiến độ, chất lượng gói thầu do nhà thầu đề xuất thuộc trách nhiệm của ai?
a. Tổ chuyên gia
b. Chủ đầu tư
c. Người có thẩm quyền
d. Tổ thẩm định
Đáp án đúng: B
Câu 156: Nội dung nào không thuộc nội dung quản lý nhà nước đối với hoạt động đấu thầu?
a. Quản lý hệ thống thông tin và cơ sở dữ liệu về đấu thầu trên phạm vi cả nước.
b. Lập hồ sơ mời quan tâm, hồ sơ mời sơ tuyển, hồ sơ mời thầu, hồ sơ yêu cầu.
c. Đào tạo, bồi dưỡng kiến thức, nghiệp vụ chuyên môn về đấu thầu.
d. Hợp tác quốc tế về đấu thầu
Đáp án đúng: B
Câu 157: Theo quy định pháp luật về đấu thầu, kiểm tra hoạt động đấu thầu được tiến hành theo hình thức nào?
a. Kiểm tra trực tiếp
b. Báo cáo bằng văn bản
c. Kết hợp giữa kiểm tra trực tiếp và báo cáo bằng văn bản
d. Kiểm tra định kỳ hoặc đột xuất
Đáp án đúng: D
Câu 158: Thời hiệu áp dụng biện pháp cấm tham gia hoạt động đấu thầu là bao lâu?
a. 10 năm tính từ ngày xảy ra hành vi vi phạm
b. 10 năm tính từ ngày phát hiện ra hành vi vi phạm
c. 05 năm tính từ ngày phát hiện ra hành vi vi phạm
d. 05 năm tính từ ngày xảy ra hành vi vi phạm
Đáp án đúng: A
Câu 159: Chủ thể nào không có quyền cấm tham gia hoạt động đấu thầu?
a. Người có thẩm quyền
b. Chủ đầu tư
c. Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, cơ quan thuộc Chính phủ, cơ quan khác ở Trung ương
d. Chủ tịch Ủy ban nhân dân cấp tỉnh
Đáp án đúng: B
Câu 160: Người có thẩm quyền ban hành quyết định cấm tham gia hoạt động đấu thầu với thời gian cấm bao lâu đối với trường hợp tổ chức, cá nhân có từ 02 hành vi vi phạm trở lên thuộc cùng phạm vi quản lý của người có thẩm quyền và các hành vi này chưa bị cấm tham gia hoạt động đấu thầu?
a. Bằng tổng thời gian cấm của các hành vi vi phạm nhưng tối thiểu trên 05 năm
b. Bằng tổng thời gian cấm của các hành vi vi phạm nhưng tối đa không quá 03 năm
c. Bằng tổng thời gian cấm của các hành vi vi phạm nhưng tối đa không quá 05 năm
d. Bằng thời gian cấm của hành vi vi phạm có thời gian bị cấm cao nhất
Đáp án đúng: C
Câu 161: Hành vi gian lận trong hoạt động đấu thầu sẽ bị cấm tham gia hoạt động đấu thầu trong thời gian bao lâu?
a. Từ 06 tháng đến 01 năm
b. 02 năm
c. Từ 01 năm đến 02 năm
d. Từ 03 năm đến 05 năm
Đáp án đúng: D
Câu 162: Hành vi cản trở trong hoạt động đấu thầu sẽ bị cấm tham gia hoạt động đấu thầu trong thời gian bao lâu?
a. 06 tháng
b. Từ 06 tháng đến dưới 1 năm
c. Từ 01 năm đến 03 năm
d. 05 năm
Đáp án đúng: C
Câu 163: Thành viên A trong nhà thầu liên danh A-B thực hiện hành vi "làm giả hoặc làm sai lệch thông tin, hồ sơ, tài liệu trong đấu thầu" thì việc cấm tham gia hoạt động đấu thầu được xử lý như thế nào?
a. Cấm tham gia hoạt động đấu thầu từ 03 năm đến 05 năm đối với thành viên A
b. Cấm tham gia hoạt động đấu thầu từ 01 năm đến dưới 03 năm đối với thành viên A
c. Cấm tham gia hoạt động đấu thầu từ 03 năm đến 05 năm đối với tất cả thành viên trong nhà thầu liên danh A-B
d. Cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm đối với tất cả thành viên trong nhà thầu liên danh A-B
Đáp án đúng: A
Câu 164: Đình chỉ cuộc thầu được thực hiện trong thời gian nào?
a. Từ ngày phát hành hồ sơ mời sơ tuyển, hồ sơ mời quan tâm, hồ sơ mời thầu, hồ sơ yêu cầu đến trước khi ký kết hợp đồng, thỏa thuận khung đối với mua sắm tập trung
b. Trong quá trình tổ chức lựa chọn nhà thầu cho đến trước khi phê duyệt kết quả lựa chọn nhà thầu
c. Sau khi phê duyệt kết quả lựa chọn nhà thầu đến khi ký kết hợp đồng, thỏa thuận khung đối với mua sắm tập trung
d. Trong quá trình thực hiện hợp đồng
Đáp án đúng: B
Câu 165: Biện pháp nào sau đây được thực hiện trong quá trình thực hiện hợp đồng?
a. Hủy thầu
b. Đình chỉ cuộc thầu
c. Không công nhận kết quả lựa chọn nhà thầu
d. Phương án A và B đều đúng
Đáp án đúng: C
Câu 166: Nhà thầu tư vấn giám sát đồng thời thực hiện tư vấn kiểm định đối với gói thầu do nhà thầu đó giám sát thì nhà thầu đó sẽ bị xử lý như thế nào?
a. Bị cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm và khi tham dự thầu phải thực hiện biện pháp bảo đảm dự thầu với giá trị gấp 03 lần giá trị yêu cầu trong thời hạn 02 năm
b. Khi tham dự thầu phải thực hiện biện pháp bảo đảm dự thầu với giá trị gấp 03 lần giá trị yêu cầu trong thời hạn 02 năm
c. Bị cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm
d. Không bị xử lý vi phạm
Đáp án đúng: C
Câu 167: Tham gia lập, đồng thời tham gia thẩm định hồ sơ mời thầu đối với cùng một gói thầu sẽ bị cấm tham gia hoạt động đấu thầu trong thời gian bao lâu?
a. 02 năm
b. Từ trên 02 năm đến 03 năm
c. Từ trên 01 năm đến 02 năm
d. Từ 06 tháng đến 01 năm
Đáp án đúng: D
Câu 168: Nhà thầu liên danh A-B gồm 2 thành viên là nhà thầu A và nhà thầu B. Trong đó nhà thầu A có hành vi vi phạm dẫn đến bị cấm tham gia hoạt động đấu thầu thì việc cấm tham gia hoạt động đấu thầu được xử lý như thế nào?
