# 🏛️ Hướng dẫn Luật Xây dựng 2025 <br/>(VB 174/TB-PCKTNB - Ngày 07/07/2026)

## 📑 Phần 1: Nghị định 210/2026/NĐ-CP <br/>(Hợp đồng xây dựng)
### 🕒 Hiệu lực
- **Từ 01/07/2026**
- Thay thế: NĐ 37/2015, NĐ 50/2021, Điều 9 NĐ 35/2023
### 💰 Hình thức giá hợp đồng (Điều 6 - Bổ sung mới)
- **Theo tỷ lệ phần trăm:** Giá HĐ bằng % của chi phí/giá trị công việc
- **Theo kết quả đầu ra:** Dựa trên số lượng, chất lượng sản phẩm (nghiệm thu đầu ra)
- **Hỗn hợp:** Kết hợp nhiều loại giá cho các phần việc khác nhau
### 💵 Quản lý Tạm ứng hợp đồng (Điều 12)
#### Mức tạm ứng tối đa
- **30%** giá HĐ tại thời điểm giao kết
- Vượt **30%**: Phải được Người quyết định đầu tư cho phép
#### Mức tạm ứng tối thiểu
- **Hợp đồng tư vấn:**
  - **15%** (giá HĐ > 10 tỷ đồng)
  - **20%** (giá HĐ ≤ 10 tỷ đồng)
- **Hợp đồng thi công xây dựng:**
  - **10%** (giá HĐ > 50 tỷ đồng)
  - **15%** (giá HĐ từ 10 - 50 tỷ đồng)
  - **20%** (giá HĐ < 10 tỷ đồng)
- **Vật tư, thiết bị, EPC, EC, EP, PC, Chìa khóa trao tay:** **10%** giá HĐ
#### Quy định ràng buộc
- **Bảo lãnh tạm ứng:** Bắt buộc với giá trị > **01 tỷ đồng**
- **Điều chỉnh giá:** Phần vượt mức tối thiểu KHÔNG được điều chỉnh giá từ lúc tạm ứng
### 🛡️ Trách nhiệm Chủ đầu tư & Bảo đảm HĐ
#### Quyền & Trách nhiệm CĐT
- Kiểm tra chất lượng/tiến độ không gây cản trở
- Trả lời kiến nghị nhà thầu: Trong **07 ngày làm việc** (Dự án công/PPP)
- Hợp đồng EPC/EP/EC: Nhà thầu báo giao thiết bị trước **21 ngày**
#### Bảo đảm & Bảo hành (Điều 13)
- **Mức bảo đảm:** Thông thường **2% - 10%**
- **Ngoại lệ:** CĐT có quyền yêu cầu tối đa **30%** để phòng rủi ro (Tự quyết định, không cần xin phép)
- **Bảo hành:** CĐT được dùng tiền bảo hành thuê đơn vị khác nếu nhà thầu làm không đạt
### 🔄 Biến động Hợp đồng & Chuyển đổi số
- **Hợp đồng điện tử:** Chính thức công nhận, tuân thủ Luật Giao dịch điện tử
- **Thay đổi hoàn cảnh/Biến động giá lớn:**
  - Phải thông báo bằng văn bản & đề xuất phương án xử lý
  - CĐT quyết định: Đảm bảo không đổi mục tiêu/quy mô, không vượt TMĐT
- **Sửa đổi Hợp đồng (Điều 22):**
  - Được chỉnh khối lượng, đơn giá, thời gian nếu không vượt TMĐT
  - Phải chỉnh thủ tục pháp lý trước (nếu ảnh hưởng đến dự án/dự toán)
  - Bên nhận đề nghị trả lời trong **07 ngày làm việc**

## 📑 Phần 2: Nghị định 217/2026/NĐ-CP <br/>(Quản lý hoạt động xây dựng)
### 🕒 Hiệu lực
- **Từ 01/07/2026**
- Thay thế: NĐ 175/2024/NĐ-CP
### 📊 Lập Báo cáo KT-KT (Hạn mức mới - Điều 27)
- **Dự án xây dựng:** TMĐT **≤ 40 tỷ đồng** (Tăng 20 tỷ; Không gồm GPMB/tiền đất)
- **Dự án Mua sắm/Thiết bị:** Chi phí xây dựng **< 10%** TMĐT và **≤ 20 tỷ đồng** (Tăng 10 tỷ)
- **Công tác Bảo trì:** Không cần lập dự án (dựa trên TK hiện hữu)
### 💻 Ứng dụng BIM (Điều 8)
- **Bắt buộc:** Công trình xây mới cấp II trở lên (từ bước BCNCKT)
- **Trách nhiệm CĐT:** Lập Môi trường dữ liệu chung (CDE) cho công trình cấp I/Đặc biệt (vốn công)
- **Định dạng chuẩn:** Nộp file dạng chuẩn mở (IFC)
### 🔍 Thẩm định Dự án & Thiết kế
- **Lĩnh vực Hàng không (Điều 33):** Bộ Xây dựng trực tiếp thẩm định BCNCKT
- **PCCC (Điều 74):** Tích hợp, lồng ghép vào thẩm định BCNCKT tại cơ quan chuyên môn
- **Thẩm định TK sau dự án:**
  - CĐT thẩm định bước thiết kế ngay trước khi chọn nhà thầu EPC/EC/EP/Thi công
  - Bắt buộc Thẩm tra: Công trình ảnh hưởng an toàn cộng đồng, quy mô lớn, phức tạp, PCCC
### 🏢 Cấp phép & Trật tự Xây dựng
- **Phân cấp:**
  - UBND cấp Xã: Công trình cấp III, IV
  - Sở Xây dựng: Các công trình khác
- **Thủ tục:** 100% Trực tuyến (Dịch vụ công QG), bản vẽ phải có Chữ ký số
### 🚨 Dự án cấp bách & Đặc biệt
- CĐT được làm song song chuẩn bị - thực hiện - kết thúc để đẩy nhanh tiến độ

## 📑 Phần 3 & 4: NĐ 207 & Thông tư 32/2026 <br/>(Chất lượng, Thi công & Bảo trì)
### 🕒 Hiệu lực
- **Từ 01/07/2026**
- TT32/2026 bãi bỏ Điều 2-9 & 19 của TT10/2021
### 🏗️ Điều kiện & Quản lý Công trường
- **Khởi công:** Đủ hồ sơ, mặt bằng, vốn, biện pháp an toàn
- **Công trường:** Đảm bảo ATLĐ, PCCC, Môi trường, biển báo, rào chắn
### 🔬 Quản lý Chất lượng & Thí nghiệm
- **CĐT:** Quản lý toàn bộ vòng đời; CĐT được thuê quan trắc độc lập
- **Nhà thầu:** - Thiết lập hệ thống, bố trí chỉ huy trưởng/nhân sự
  - Lập Kế hoạch thí nghiệm (Đối tượng, phương pháp, thời điểm, phòng thí nghiệm)
  - Lập Đề cương quan trắc
- Khuyến khích: CNTT, BIM, Chuyển đổi số
### 🛡️ Giám định, Kiểm định & Sự cố
- **Kiểm định:** Phục vụ nghiệm thu, sửa chữa, gia cường (CĐT/Cơ quan NN yêu cầu)
- **Giám định:** Tìm nguyên nhân, mức độ hư hỏng để xử lý
- **Sự cố:** Bảo vệ hiện trường ➔ Báo cáo ➔ Phối hợp điều tra ➔ Khắc phục
### 🔧 Nghiệm thu & Bảo trì
- **Nghiệm thu:** Công trình lớn/phức tạp do cơ quan NN kiểm tra
- **Hồ sơ:** Được phép lập/lưu trữ điện tử
- **Bảo trì:** CĐT/Người sử dụng tổ chức quan trắc, bảo dưỡng
- **Công trình hết Hạn sử dụng:** Đánh giá hiện trạng để quyết định Tiếp tục / Sửa chữa / Hủy bỏ

## 📑 Phần 5: Nghị định 206/2026/NĐ-CP <br/>(Quản lý Chi phí đầu tư)
### 🕒 Hiệu lực & Phạm vi
- **Từ 01/07/2026** (Thay thế NĐ 10/2021)
- Tách phần Thanh toán (sang NĐ 210) và Quyết toán (sang NĐ 193)
- Chỉ tập trung từ sơ bộ TMĐT ➔ Dự toán ➔ Định mức
### 🧮 Quản lý Tổng mức đầu tư (TMĐT)
- **Sơ bộ TMĐT:** Được dùng giá/định mức nước ngoài (DA lớn/phức tạp)
- **Chi phí GPMB mở rộng:** Gồm tư vấn GPMB, phí đổi đất/rừng/nước, di dời hạ tầng
- **Thiết kế FEED & TK Kỹ thuật:** Được dùng làm căn cứ lập TMĐT
- **Dữ liệu:** Được dùng dữ liệu quốc tế / Thuê thẩm định giá
- **Thẩm định TMĐT:** CĐT tự thẩm định chi tiết nếu là đơn vị trực thuộc có chuyên môn (Khi dùng FEED/TK kỹ thuật)
- **Dự án thành phần:** CĐT tự chỉnh TMĐT DA thành phần nếu không vượt Tổng TMĐT
### 🧾 Dự toán Xây dựng
- **Khi dùng TK FEED:** Được tính chi phí trực tiếp theo khối lượng nhóm công tác, không cần chi tiết
- **Dự toán công việc XD (Mới):** Dùng cho việc chưa có định mức (Lập từ đề cương, phạm vi)
- **Miễn thẩm định Dự toán:** Khi dự án có nhà thầu EPC/EC/EP (đã dùng FEED/TK KT)
- **Điều chỉnh:** CĐT tự điều chỉnh cơ cấu chi phí (kể cả dự phòng) nếu không vượt TMĐT
### 📏 Hệ thống Định mức & Giá
- **Cấu trúc mới:** Định mức KT-KT (Gồm Định mức dự toán + Định mức cơ sở mới) & Định mức chi phí
- **Chu kỳ rà soát:** Thường xuyên (Bỏ quy định cứng 3 năm/lần)
- **Định mức Nước ngoài:** CĐT tự thu thập, biên dịch, quyết định áp dụng
- **Suất chi phí (Mới):** Tính chi phí theo m2, m3, công suất, chiều dài...
- **Ban Đơn giá đặc thù:** Thành lập cho DA quốc gia, quy mô lớn
### 👑 Quyền & Trách nhiệm CĐT
- Nộp phạt vi phạm hành chính từ **Chi phí quản lý dự án**
- Cập nhật dữ liệu chi phí vào CSDL Quốc gia
- Được quyết định dùng BIM để quản lý chi phí
### 🔄 Xử lý Chuyển tiếp
- **Dự án/Dự toán đã duyệt trước 01/07/2026:** KHÔNG làm lại
- **Dự toán đang thẩm định:** Cơ quan NN trả hồ sơ ➔ CĐT tự cập nhật, duyệt theo NĐ mới

## 📑 Phần 6: Nghị định 193/2026/NĐ-CP <br/>(Quyết toán Vốn đầu tư)
### 🕒 Hiệu lực
- **Từ 01/07/2026** (Thay phần quyết toán NĐ 254/2025 và Điều 35 NĐ 10/2021)
### 📋 Nguyên tắc Quyết toán
- Chỉ quyết toán chi phí hợp pháp trong giới hạn TMĐT
- **DA Thành phần/Tiểu dự án:** Quyết toán như DA độc lập
- **Chuẩn bị đầu tư:** Nếu bố trí vốn riêng thì quyết toán như tiểu dự án
- **GPMB:** UBND duyệt, gửi QĐ cho CĐT tổng hợp (không thẩm tra lại)
- **Đã khai thác nhưng chưa xong GPMB:** CĐT xin phép duyệt quyết toán phần đã thi công
### ⏳ Xử lý Nhà thầu chây ỳ
- **Bước 1:** CĐT gửi 3 văn bản đôn đốc (cách nhau ≥ **10 ngày**)
- **Bước 2:** Sau **15 ngày** từ VB 3, CĐT tự lập quyết toán không cần chữ ký nhà thầu
- **Bước 3:** Nhà thầu chịu tổn thất & phải chấp hành quyết định
### ⚖️ Thẩm quyền & Hồ sơ
- **Thẩm quyền:** - DA Quan trọng QG: Người đại diện pháp luật ACV phê duyệt
  - DA khác: Người quyết định đầu tư
- **Hồ sơ:** Nộp 01 bộ cho cơ quan thẩm tra + 01 bộ cho người duyệt (hoặc 01 bộ nếu trùng)
### 🕵️ Kiểm toán & Thẩm tra
- **Bắt buộc Kiểm toán độc lập:** DA Quan trọng QG, Nhóm A
- **Miễn KT độc lập:** Nếu Kiểm toán Nhà nước/Thanh tra đã làm đủ nội dung
- **Định mức chi phí:**
  - Kiểm toán độc lập: **0.069% - 0.96%**
  - Thẩm tra phê duyệt: **0.048% - 0.57%**
- **Giảm trừ chi phí:** Giảm **30%** (nếu thiết bị ≥50%); Giảm **50%** (phần GPMB hoặc đã có KTNN)
### ⏱️ Thời hạn hoàn thành (Ví dụ Dự án Nhóm A)
- **CĐT lập hồ sơ:** Tối đa **09 tháng**
- **Thẩm tra:** Tối đa **04 tháng**
- **Phê duyệt:** Tối đa **15 ngày**
### 💼 Nhiệm vụ ACV & CĐT
- **ACV:** Báo cáo quyết toán năm cho Bộ TC trước **28/02** hàng năm
- **CĐT:** Tất toán tài khoản, thu hồi nộp NSNN trong vòng **06 tháng** sau duyệt
### 🔄 Chuyển tiếp
- **Đã nộp hồ sơ/Ký hợp đồng kiểm toán trước 01/07/2026:** Áp dụng NĐ 254/2025
- **Quyết toán A-B đã ký trước 01/07/2026:** KHÔNG phải lập/ký lại

    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
