# NGHỊ ĐỊNH 287/2025/NĐ-CP
## THÔNG TIN CHUNG
### Ngày ban hành: 05/11/2025
### Hiệu lực thi hành: 01/01/2026 (Thay thế NĐ 44/2018/NĐ-CP)
## CHƯƠNG I: QUY ĐỊNH CHUNG
### Điều 1. Phạm vi điều chỉnh
#### Quản lý, sử dụng, khai thác TS KCHT HK do Nhà nước đầu tư, quản lý
#### KHÔNG điều chỉnh đối với:
- Tài sản do đơn vị lực lượng vũ trang nhân dân quản lý.
- Trụ sở làm việc, cơ sở hoạt động sự nghiệp tại CHK, sân bay.
- Công trình/đất gắn với công trình dịch vụ HK, phi HK (kỹ thuật, sửa chữa, suất ăn, xăng dầu...).
- Tài sản do đối tượng khác quản lý; tài sản đã bán, chuyển nhượng, cổ phần hóa.
### Điều 2. Đối tượng áp dụng
#### Cơ quan QLNN về HKDD (Chính phủ)
#### Cơ quan tham mưu, thực thi pháp luật chuyên ngành (Cơ quan QLHK)
#### Doanh nghiệp được giao quản lý tài sản (Doanh nghiệp quản lý tài sản):
- Doanh nghiệp bảo đảm hoạt động bay (100% vốn NN thuộc Bộ Xây dựng).
- Doanh nghiệp kinh doanh, khai thác cảng (Thực tiếp khai thác hạ tầng sân bay).
### Điều 3. Danh mục tài sản KCHT HK
#### Công trình bảo đảm hoạt động bay
#### Công trình thuộc kết cấu hạ tầng sân bay
- Đường cất hạ cánh, đường lăn, sân đỗ, khu phụ trợ.
- Công trình khẩn nguy, PCCC.
- Hàng rào vành đai, đường nội cảng, hạ tầng BVMT trong sân bay.
- Bãi tập kết thiết bị, tra nạp nhiên liệu mặt đất.
#### Công trình khẩn nguy ngoài sân bay
#### Hàng rào CHK, đường nội cảng ngoài sân bay, hạ tầng kỹ thuật (điện, nước, viễn thông...)
#### Công trình hạ tầng BVMT ngoài sân bay
#### Nhà ga hành khách, nhà khách ngoại giao, logistics, nhà ga hàng hóa
#### Trách nhiệm đối với TS liên quan QP-AN:
- Quốc phòng: Theo quy định bảo vệ công trình quốc phòng & khu quân sự.
- An ninh: Theo quy định bảo vệ công trình quan trọng về ANQG.
### Điều 4. Nguyên tắc quản lý, sử dụng, khai thác
#### Phải thống kê, kế toán, tính hao mòn, khấu hao, bảo trì.
#### Căn cứ giao tài sản: Quy hoạch, kế hoạch đầu tư, chức năng nhiệm vụ.
#### Lấy ý kiến khi giao/khai thác/xử lý:
- Bộ Quốc phòng (TS liên quan QP hoặc lưỡng dụng).
- Bộ Công an (TS liên quan ANQG).
- Bộ Xây dựng, CQQLHK, DNQLTS tự xác định nếu không liên quan QP-AN.
#### Xử lý đất đai:
- Tuân thủ Luật Đất đai, Luật HKDD. Thu hồi đất thực hiện theo Luật Đất đai (không theo NĐ này).
## CHƯƠNG II: GIAO QUẢN LÝ TÀI SẢN
### Điều 5. Đối tượng & Hình thức
#### Tính thành phần vốn NN tại DN:
- Giao cho DN bảo đảm hoạt động bay (TS đảm bảo HĐ bay).
- Giao cho DN kinh doanh, khai thác cảng (TS khẩn nguy ngoài SB, hàng rào ngoài SB, BVMT ngoài SB, nhà ga...).
#### Không tính thành phần vốn NN tại DN:
- Giao cho DN kinh doanh, khai thác cảng (Hạ tầng sân bay: đường băng, đường lăn, sân đỗ...).
- Lưu ý: Sau khi giao không tính vốn, DN có thể lập phương án đầu tư bổ sung vốn NN bằng giá trị tài sản này.
#### TS là kết quả dự án vốn NN:
- Có xác định thụ hưởng là DNQLTS: Tự động bàn giao sau hoàn thành, không lập lại thủ tục.
- Đối tượng thụ hưởng là CQNN/Đảng/Đoàn thể: Điều chuyển về Bộ Xây dựng -> Giao DNQLTS.
### Điều 6. Thẩm quyền, trình tự, thủ tục giao
#### Thẩm quyền quyết định: Bộ trưởng Bộ Xây dựng
#### Quy trình & Thời hạn:
- B1: CQQLHK lập 01 bộ hồ sơ trình Bộ Xây dựng.
- B2: Trông 15 NGÀY, Bộ trưởng Bộ Xây dựng ra Quyết định giao tài sản (hoặc phản hồi từ chối).
#### Xác định giá trị (để tính vốn NN):
- TS hoàn thành trong 03 năm: Giá trị còn lại trên sổ kế toán.
- Các trường hợp khác (>3 năm): CQQLHK thuê thẩm định giá (dùng kinh phí chi thường xuyên của CQQLHK).
#### Tổ chức thực hiện: Lập biên bản bàn giao (Mẫu 01).
### Điều 7. Chuyển hình thức giao (Từ Không tính vốn -> Tính vốn NN)
#### Thẩm quyền: Bộ trưởng Bộ Xây dựng
#### Trình tự:
- DN kinh doanh, khai thác cảng lập hồ sơ -> Gửi CQQLHK.
- Xác định giá trị: TS hoàn thành <=03 năm lấy giá trị sổ sách; Khác: Thuê thẩm định giá (chi phí do DN trả).
- Trong 30 NGÀY từ khi đủ hồ sơ: CQQLHK báo cáo Bộ Xây dựng, lấy ý kiến các cơ quan, trình Bộ trưởng QĐ.
### Điều 8. Giao tài sản điều chuyển về Bộ Xây dựng
#### Thẩm quyền: Bộ trưởng Bộ Xây dựng
#### Thời hạn: 15 NGÀY (Từ khi nhận đủ hồ sơ, Bộ trưởng ra QĐ giao tài sản).
## CHƯƠNG III: QUẢN LÝ, SỬ DỤNG, KHAI THÁC (Áp dụng TS giao Không tính vốn NN)
### Mục 1: Hồ sơ & Kế toán
#### Điều 9. Hồ sơ:
- Quản lý hiện trạng, báo cáo kê khai, lưu trữ dữ liệu CSDL.
#### Điều 10. Kế toán:
- TS có kết cấu độc lập/hệ thống là 1 đối tượng ghi sổ.
- Nguyên giá: Lấy giá trị mua sắm/quyết toán. Nếu chưa quyết toán -> dùng nguyên giá tạm tính (ưu tiên: Thẩm tra QT > Đề nghị QT > Hợp đồng A-B > Dự toán > Tổng mức đầu tư).
- TS không có thông tin: Thuê Thẩm định giá.
- Điều chỉnh nguyên giá khi: Đánh giá lại, nâng cấp mở rộng, tháo dỡ/lắp đặt bộ phận, hư hỏng do thiên tai.
### Mục 2: Bảo trì & Vận hành khi nâng cấp
#### Điều 11. Bảo trì:
- Kinh phí: Do Ngân sách Nhà nước (NSNN) đảm bảo.
- Quy trình: DN lập dự toán -> CQQLHK/Bộ XD tổng hợp -> Bộ XD giao dự toán.
- TRƯỜNG HỢP KHẨN CẤP: DN được ứng kinh phí từ nguồn thu khai thác tài sản, lập hồ sơ giao bổ sung dự toán NSNN để hoàn trả khoản ứng.
- Vật tư thu hồi từ bảo trì -> Xử lý theo quy định thanh lý tài sản.
#### Điều 12. Quản lý trong thời gian nâng cấp (Dự án NSNN):
- Bàn giao mặt bằng (Mẫu 02) cho Chủ đầu tư.
- Chủ đầu tư chịu trách nhiệm bảo quản, bảo trì; không cấp kinh phí bảo trì cho DN khai thác cảng giai đoạn này.
### Mục 3: Khai thác tài sản
#### Điều 13-14. Phương thức khai thác:
- DN kinh doanh khai thác cảng TRỰC TIẾP tổ chức khai thác, cung cấp dịch vụ chuyên ngành.
- HĐQT của DN ban hành Quy chế cung cấp dịch vụ.
#### Điều 15. Quản lý tiền thu từ khai thác:
- Bản chất: Là nguồn thu của Ngân sách Trung ương (sau khi trừ chi phí).
- Thời hạn nộp (Hàng quý): Chậm nhất ngày thứ 15 của tháng đầu tiên trong quý sau.
- Thời hạn nộp (Hàng năm): Chậm nhất 90 ngày kể từ ngày kết thúc năm tài chính.
- Chi phí được trừ: Phí thẩm định giá, chi phí trực tiếp, chi phí gián tiếp (phân bổ). Giao Bộ Xây dựng quy định định mức phân bổ trong 06 THÁNG từ khi NĐ có hiệu lực.
- Ưu tiên: Tiền nộp NSNN được ưu tiên bố trí vốn ĐTC/Dự toán để đầu tư/phát triển lại KCHT HK.
### Mục 4: Xử lý tài sản
#### Điều 16. Các hình thức xử lý (5 hình thức chính)
- Thu hồi / Điều chuyển / Chuyển giao về địa phương / Thanh lý / Bị mất, hủy hoại.
#### Điều 17. Thu hồi:
- Lý do: Thay đổi quy hoạch, không còn nhu cầu sử dụng.
- Thẩm quyền: Bộ trưởng Bộ Xây dựng.
- Xử lý sau thu hồi: Điều chuyển (Nếu trên đất QP -> Điều chuyển cho Bộ QP) hoặc Chuyển giao về địa phương.
- Thời gian: CQQLHK báo cáo Bộ XD trong 30 NGÀY kể từ khi nhận đủ hồ sơ.
#### Điều 18. Điều chuyển:
- Thẩm quyền:
  + Bộ trưởng Bộ XD (Điều chuyển nội bộ hoặc sang Bộ/Ngành/Tỉnh khác).
  + Chủ tịch UBND Tỉnh / Bộ trưởng khác (Điều chuyển từ địa phương/Bộ khác sang Bộ XD).
- Thời hạn thẩm định: 30 NGÀY (CQQLHK báo cáo).
- Thời hạn Quyết định: 15 NGÀY (Từ khi các Bộ/Tỉnh nhận đủ hồ sơ).
- Thời hạn Bàn giao: 30 NGÀY kể từ ngày có QĐ. Nếu chậm, bên chậm chịu chi phí bảo quản và bồi thường rủi ro. KHÔNG hạch toán chi phí chậm vào chi phí hợp lý tính thuế TNDN.
#### Điều 19. Chuyển giao về địa phương:
- Thẩm quyền: Bộ trưởng Bộ Xây dựng.
- Thời hạn CQQLHK báo cáo: 30 NGÀY.
- Thời hạn Bộ trưởng ra QĐ: 15 NGÀY.
- Thời hạn UBND tỉnh QĐ tiếp nhận: 15 NGÀY (kể từ khi có QĐ của Bộ XD).
- Thời hạn Bàn giao: 15 NGÀY (kể từ khi có QĐ của UBND tỉnh).
- Phương thức xử lý tài sản trên đất của địa phương: Giao tài sản có hoàn trả giá trị cho NN HOẶC Phá dỡ/hủy bỏ trước khi giao đất.
#### Điều 20. Thanh lý (Phá dỡ, Hủy bỏ):
- Thẩm quyền: Bộ trưởng Bộ Xây dựng.
- Thời hạn Quyết định: 15 NGÀY.
- Xử lý vật tư thu hồi: Giao lại DN bảo trì (giảm trừ dự toán NSNN) / Điều chuyển / Bán (Theo NĐ 151/2017 & 114/2024) / Hủy bỏ.
- Nếu điều chuyển vật tư thu hồi: Bộ XD quyết định trong 15 NGÀY, bàn giao trong 30 NGÀY.
#### Điều 21. Bị mất, bị hủy hoại (Thiên tai, Hỏa hoạn...):
- Thẩm quyền QĐ: Bộ trưởng Bộ Xây dựng.
- Thời hạn lập hồ sơ: 30 NGÀY từ khi phát hiện.
- Thời hạn Quyết định: 15 NGÀY.
- Khắc phục hậu quả: Kế toán giảm tài sản trong 30 NGÀY. Ngân sách NN đảm bảo kinh phí khôi phục. Tiền bảo hiểm/bồi thường (nếu có) phải nộp vào NSNN.
#### Điều 22. Tiền thu từ xử lý tài sản:
- Nộp TOÀN BỘ vào NSNN (sau khi trừ chi phí).
- Chi phí được trừ: Kiểm kê, tháo dỡ, thẩm định giá, bảo vệ chờ xử lý...
- Thời hạn lập hồ sơ thanh toán chi phí: 30 NGÀY từ khi hoàn thành xử lý.
### Mục 5: Phương thức đối tác công tư (PPP)
#### Điều 23. Quản lý TS tham gia PPP
- Thẩm quyền sử dụng TS hiện có để PPP: Bộ trưởng Bộ Xây dựng (TS thuộc Bộ), UBND Cấp tỉnh (TS đã chuyển giao địa phương).
- Thời hạn xem xét QĐ: 15 NGÀY.
- Phối hợp: CQQLHK, DN kinh doanh khai thác cảng theo dõi, kiểm tra suốt vòng đời PPP cho đến khi nhà đầu tư chuyển giao lại cho NN.
## CHƯƠNG IV: BÁO CÁO & CƠ SỞ DỮ LIỆU
### Điều 24. Chế độ Báo cáo
#### Báo cáo kê khai:
- Thời hạn: 30 NGÀY kể từ ngày đưa vào sử dụng, tiếp nhận, hoặc có thay đổi thông tin.
#### Báo cáo hàng năm (Chốt số liệu hết năm tài chính):
- DN nộp cho Bộ Xây dựng: TRƯỚC 28/02 hàng năm.
- Bộ Xây dựng tổng hợp nộp Bộ Tài chính: TRƯỚC 15/03 hàng năm.
### Điều 25. Cơ sở dữ liệu (CSDL)
#### Trách nhiệm: Bộ Xây dựng, Bộ Tài chính phối hợp.
#### Tính chất: Là một bộ phận của CSDL Quốc gia về tài sản công.
## CHƯƠNG V: TỔ CHỨC THỰC HIỆN
### Điều 26. Trách nhiệm thi hành
#### Bộ Xây dựng:
- Ban hành định mức kỹ thuật bảo trì, chi phí trực tiếp/gián tiếp trong vòng 06 THÁNG.
- Phê duyệt kế hoạch bảo trì.
#### Bộ Tài chính:
- Hướng dẫn kế toán, hao mòn, tích hợp CSDL.
### Điều 27. Xử lý chuyển tiếp
#### Đối với TS theo Quyết định 2007/QĐ-TTg:
- Tiếp tục thực hiện quản lý, khai thác theo QĐ 2007 ĐẾN HẾT NĂM 2026 (Không phải làm lại thủ tục).
- Hết hạn, Bộ XD ra QĐ giao lại theo NĐ này.
#### TS chưa xác định giá trị:
- Phải hoàn thành định giá trong vòng 06 THÁNG kể từ ngày NĐ có hiệu lực (01/01/2026).

    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
