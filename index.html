        // --- LOGIC ---
        document.addEventListener('DOMContentLoaded', function() {
            const quizContainer = document.getElementById('quizContainer');
            const searchInput = document.getElementById('searchInput');
            const backToTopBtn = document.getElementById('backToTopBtn');

            let questions = [];

            // Function to parse the raw data into a structured format
            function parseQuestions(data) {
                const lines = data.trim().split('\n').filter(line => line.trim() !== '');
                const parsedQuestions = [];
                let i = 0;
                while (i < lines.length) {
                    const lineText = lines[i].trim();
                    // Heuristic: A line is considered a question if it ends with '?' or ':'
                    if (lineText.endsWith('?') || lineText.endsWith(':')) {
                        const currentQuestion = {
                            question: lineText,
                            options: [],
                            answer: ''
                        };
                        i++;
                        // Collect options until the next question or end of file
                        while (i < lines.length && !lines[i].trim().endsWith('?') && !lines[i].trim().endsWith(':')) {
                            let option = lines[i].trim();
                            if (option.includes('(ĐÚNG)')) {
                                option = option.replace(/\s*\(ĐÚNG\)\s*/, '').trim();
                                currentQuestion.answer = option;
                            }
                            currentQuestion.options.push(option);
                            i++;
                        }
                        // Only add if it's a valid question with options and an answer
                        if (currentQuestion.options.length > 0 && currentQuestion.answer) {
                            parsedQuestions.push(currentQuestion);
                        }
                    } else {
                        // If the line is not identified as a question, skip it.
                        i++;
                    }
                }
                return parsedQuestions;
            }

            // Function to render the quiz questions as a review sheet
            function renderReview(questionsToRender) {
                quizContainer.innerHTML = '';
                questionsToRender.forEach((q, index) => {
                    const questionBlock = document.createElement('div');
                    questionBlock.className = 'bg-white p-6 rounded-lg shadow-md question-block';

                    const questionText = document.createElement('p');
                    questionText.className = 'font-semibold text-lg mb-4';
                    // Use innerHTML to correctly render the question text
                    questionText.innerHTML = `<span class="text-blue-600">${quizContainer.children.length + 1}.</span> ${q.question}`;
                    
                    const optionsContainer = document.createElement('ul');
                    optionsContainer.className = 'space-y-2 pl-5';

                    q.options.forEach(option => {
                        const optionItem = document.createElement('li');
                        optionItem.className = 'text-gray-700';
                        
                        // Highlight the correct answer in red
                        if (option === q.answer) {
                            optionItem.classList.add('correct-answer');
                        }
                        
                        optionItem.textContent = option;
                        optionsContainer.appendChild(optionItem);
                    });

                    questionBlock.appendChild(questionText);
                    questionBlock.appendChild(optionsContainer);
                    quizContainer.appendChild(questionBlock);
                });
            }

            // Function to handle search/filtering
            function filterQuestions() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                const filteredQuestions = questions.filter(q => 
                    q.question.toLowerCase().includes(searchTerm) || 
                    q.options.some(opt => opt.toLowerCase().includes(searchTerm))
                );
                renderReview(filteredQuestions);
            }
            
            // Event Listeners
            searchInput.addEventListener('input', filterQuestions);

            // Back to Top button logic
            window.addEventListener('scroll', () => {
                if (window.scrollY > 200) {
                    backToTopBtn.style.display = 'block';
                } else {
                    backToTopBtn.style.display = 'none';
                }
            });

            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Initial Load
            questions = parseQuestions(rawData);
            renderReview(questions);
        });
    </script>
