<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Khẩn Nguy Sân Bay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tối ưu typography cho đọc lướt */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .leading-tightest { line-height: 1.2; }
        
        /* Ẩn scrollbar nhưng vẫn cho cuộn */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Radio Button cho gọn */
        input[type="radio"] { width: 1.1rem; height: 1.1rem; margin-top: 0.1rem; flex-shrink: 0; cursor: pointer; }
        
        /* Hiệu ứng mượt mà */
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Toast Notification */
        #toast { transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
        .toast-show { opacity: 1 !important; transform: translate(-50%, 0) !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Header Cố định -->
    <header class="bg-blue-700 text-white pt-3 pb-2 px-4 shadow-md z-20 flex-shrink-0">
        <p class="text-xs italic text-blue-100 opacity-90 mb-0.5">Huấn luyện Đào tạo Cảng HKQT Cần Thơ</p>
        <h1 class="text-xl font-bold leading-tightest">Ôn tập: Kế Hoạch Khẩn Nguy Sân Bay 2026</h1>
        
        <!-- Tabs -->
        <div class="flex mt-3 bg-blue-800 p-1 rounded-lg">
            <button onclick="switchTab('quiz')" id="tab-quiz" class="flex-1 py-1.5 text-sm font-semibold rounded-md bg-white text-blue-700 shadow transition-colors">Thi Thử (40)</button>
            <button onclick="switchTab('review')" id="tab-review" class="flex-1 py-1.5 text-sm font-semibold rounded-md text-blue-100 hover:text-white transition-colors">Ôn Tập (Full)</button>
        </div>
    </header>

    <!-- Main Content Area (Scrollable) -->
    <main class="flex-1 overflow-y-auto relative no-scrollbar" id="main-scroll">
        
        <!-- TAB 1: THI THỬ -->
        <div id="content-quiz" class="tab-content active pb-20">
            <!-- Sticky Top Bar -->
            <div class="sticky top-0 bg-white/95 backdrop-blur shadow-sm border-b px-3 py-2 z-10 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-xl font-mono font-bold text-slate-700 w-16" id="timer">00:00</span>
                    <span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded font-bold border border-yellow-300" id="high-score">Điểm cao: 0/40</span>
                </div>
                <div class="flex gap-2" id="quiz-top-actions">
                    <button onclick="submitQuiz()" class="bg-green-600 active:bg-green-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow-sm">Nộp Bài</button>
                    <button onclick="startQuiz()" class="bg-blue-100 active:bg-blue-200 text-blue-700 px-3 py-1.5 rounded text-sm font-bold shadow-sm border border-blue-200">🔄 Làm Lại</button>
                </div>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container" class="p-3 space-y-4"></div>

            <!-- Sticky Bottom Bar -->
            <div class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_15px_rgba(0,0,0,0.05)] border-t p-3 z-10 flex justify-between items-center transition-transform" id="quiz-bottom-bar">
                <div id="score-display" class="font-bold text-lg text-slate-700">Chưa nộp bài</div>
                <div class="flex gap-2">
                    <button onclick="shareResult()" id="btn-share" class="hidden bg-indigo-100 text-indigo-700 px-3 py-2 rounded text-sm font-bold shadow-sm border border-indigo-200">📤 Chia sẻ</button>
                    <button onclick="submitQuiz()" id="btn-submit-bottom" class="bg-green-600 active:bg-green-700 text-white px-4 py-2 rounded text-sm font-bold shadow-sm">Nộp Bài</button>
                    <button onclick="startQuiz()" id="btn-retry-bottom" class="hidden bg-blue-600 active:bg-blue-700 text-white px-4 py-2 rounded text-sm font-bold shadow-sm">Làm Lại</button>
                </div>
            </div>
        </div>

        <!-- TAB 2: ÔN TẬP -->
        <div id="content-review" class="tab-content pb-10">
            <!-- Sticky Search Bar -->
            <div class="sticky top-0 bg-white/95 backdrop-blur shadow-sm border-b px-3 py-2.5 z-10">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-2 text-slate-400">🔍</span>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="Nhập từ khóa tìm kiếm..." class="w-full pl-8 pr-3 py-1.5 bg-slate-100 border border-slate-300 rounded text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-colors">
                </div>
                <div class="text-xs text-slate-500 mt-1" id="search-stats">Đang hiển thị 55/55 câu hỏi</div>
            </div>

            <!-- Review Container -->
            <div id="review-container" class="p-3 space-y-3 bg-slate-100"></div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 translate-y-4 opacity-0 bg-gray-800 text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg z-50">
        Đã copy kết quả!
    </div>

let allQuestions = [];
let quizQuestions = [];
let userAnswers = {};
let isSubmitted = false;
let timerInterval = null;
let secondsElapsed = 0;
let isReviewRendered = false; // Biến cờ hiệu chống lỗi tab trắng

// Hàm Parse chuỗi text thành mảng Object
function parseData() {
    const lines = rawDataString.trim().split('\n');
    allQuestions = lines.map((line, index) => {
        const parts = line.split('|');
        const qText = parts[0].trim();
        
        // Cấu trúc options thô
        const rawOpts = [
            { id: 'A', text: parts[1]?.trim() },
            { id: 'B', text: parts[2]?.trim() },
            { id: 'C', text: parts[3]?.trim() },
            { id: 'D', text: parts[4]?.trim() },
            { id: 'E', text: parts[5]?.trim() }
        ].filter(opt => opt.text !== ''); // Lọc bỏ các đáp án trống

        const ansId = parts[6]?.trim(); // A, B, C, D, E

        // Trích xuất text của đáp án đúng để dùng khi xáo trộn
        const correctOpt = rawOpts.find(o => o.id === ansId);
        const correctText = correctOpt ? correctOpt.text : '';

        return {
            originalId: index + 1,
            question: qText,
            options: rawOpts,
            correctText: correctText
        };
    });
}

// Hàm xáo trộn mảng (Fisher-Yates)
function shuffleArray(array) {
    let curId = array.length;
    while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = array[curId];
        array[curId] = array[randId];
        array[randId] = tmp;
    }
    return array;
}

function switchTab(tab) {
    const btnQuiz = document.getElementById('tab-quiz');
    const btnReview = document.getElementById('tab-review');
    const contentQuiz = document.getElementById('content-quiz');
    const contentReview = document.getElementById('content-review');

    if (tab === 'quiz') {
        btnQuiz.className = "flex-1 py-1.5 text-sm font-semibold rounded-md bg-white text-blue-700 shadow transition-colors";
        btnReview.className = "flex-1 py-1.5 text-sm font-semibold rounded-md text-blue-100 hover:text-white transition-colors";
        contentQuiz.classList.add('active');
        contentReview.classList.remove('active');
    } else {
        btnReview.className = "flex-1 py-1.5 text-sm font-semibold rounded-md bg-white text-blue-700 shadow transition-colors";
        btnQuiz.className = "flex-1 py-1.5 text-sm font-semibold rounded-md text-blue-100 hover:text-white transition-colors";
        contentReview.classList.add('active');
        contentQuiz.classList.remove('active');
        
        // QUAN TRỌNG: Render lần đầu (dùng cờ hiệu để an toàn tuyệt đối)
        if (!isReviewRendered) {
            renderReviewData();

        }

    document.getElementById('main-scroll').scrollTop = 0;
}

   4. CHỨC NĂNG THI THỬ (QUIZ)
   ========================================================================== */
function startTimer() {
    clearInterval(timerInterval);
    secondsElapsed = 0;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
    }, 1000);
}

function updateTimerDisplay() {
    const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
    const s = (secondsElapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
}

function startQuiz() {
    isSubmitted = false;
    userAnswers = {};
    
    // Giao diện
    document.getElementById('btn-submit-bottom').classList.remove('hidden');
    document.getElementById('btn-retry-bottom').classList.add('hidden');
    document.getElementById('btn-share').classList.add('hidden');
    document.getElementById('score-display').textContent = 'Chưa nộp bài';
    document.getElementById('score-display').className = 'font-bold text-lg text-slate-700';
    document.getElementById('quiz-top-actions').children[0].classList.remove('hidden'); // Hiện nút Nộp trên

    // Bốc 40 câu ngẫu nhiên và xáo trộn đáp án
    const shuffledAll = shuffleArray([...allQuestions]);
    quizQuestions = shuffledAll.slice(0, 40).map(q => {
        // Xáo trộn đáp án của câu này
        const shuffledOpts = shuffleArray([...q.options]);
        return {
            ...q,
            options: shuffledOpts
        };
    });

    renderQuizHTML();
    startTimer();
    document.getElementById('main-scroll').scrollTop = 0;
}

function renderQuizHTML() {
    const container = document.getElementById('quiz-container');
    const labels = ['A', 'B', 'C', 'D', 'E'];
    
    let html = '';
    quizQuestions.forEach((q, index) => {
        html += `
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-3" id="q-card-${index}">
            <div class="font-bold text-[15px] mb-2 leading-tightest"><span class="text-blue-700">Câu ${index + 1}:</span> ${q.question}</div>
            <div class="flex flex-col gap-1.5 pl-1">
        `;
        
        q.options.forEach((opt, optIndex) => {
            const letter = labels[optIndex];
            html += `
                <label class="flex items-start gap-2 p-1.5 rounded bg-slate-50 border border-transparent cursor-pointer transition-colors hover:bg-slate-100" id="label-${index}-${optIndex}">
                    <input type="radio" name="q${index}" value="${optIndex}" onchange="selectAnswer(${index}, ${optIndex})" class="accent-blue-600 mt-0.5">
                    <span class="text-sm font-semibold text-slate-600 w-5">${letter}.</span>
                    <span class="text-[14px] leading-tightest text-slate-800 flex-1">${opt.text}</span>
                    <span id="icon-${index}-${optIndex}" class="w-5 text-center text-sm font-bold"></span>
                </label>
            `;
        });
        
        html += `</div></div>`;
    });
    
    container.innerHTML = html;
}

function selectAnswer(qIndex, optIndex) {
    if (isSubmitted) return;
    userAnswers[qIndex] = optIndex;
    
    // Xóa active class các label khác
    const labels = document.querySelectorAll(`[id^="label-${qIndex}-"]`);
    labels.forEach(l => l.classList.remove('border-blue-300', 'bg-blue-50'));
    
    // Thêm active class cho label được chọn
    const activeLabel = document.getElementById(`label-${qIndex}-${optIndex}`);
    activeLabel.classList.add('border-blue-300', 'bg-blue-50');
}

function submitQuiz() {
    if (isSubmitted) return;
    
    // Cảnh báo nếu chưa làm hết
    const answeredCount = Object.keys(userAnswers).length;
    if (answeredCount < 40) {
        if (!confirm(`Bạn mới làm ${answeredCount}/40 câu. Bạn có chắc chắn muốn nộp bài?`)) return;
    }

    isSubmitted = true;
    clearInterval(timerInterval);

    let score = 0;
    
    quizQuestions.forEach((q, qIndex) => {
        const userOptIndex = userAnswers[qIndex];
        let correctOptIndex = -1;
        
        // Tìm index của đáp án đúng trong mảng đã xáo trộn
        q.options.forEach((opt, idx) => {
            if (opt.text === q.correctText) correctOptIndex = idx;
        });

        // Disable tất cả input
        const inputs = document.getElementsByName(`q${qIndex}`);
        inputs.forEach(input => input.disabled = true);

        // Chấm điểm & Tô màu
        if (userOptIndex !== undefined) {
            if (userOptIndex === correctOptIndex) {
                // Làm đúng
                score++;
                const lbl = document.getElementById(`label-${qIndex}-${userOptIndex}`);
                lbl.className = "flex items-start gap-2 p-1.5 rounded border bg-green-100 border-green-300 transition-colors";
                lbl.querySelector('span.flex-1').classList.add('text-green-800', 'font-medium');
                document.getElementById(`icon-${qIndex}-${userOptIndex}`).textContent = "✔️";
                document.getElementById(`icon-${qIndex}-${userOptIndex}`).classList.add("text-green-600");
            } else {
                // Làm sai
                const lbl = document.getElementById(`label-${qIndex}-${userOptIndex}`);
                lbl.className = "flex items-start gap-2 p-1.5 rounded border bg-red-50 border-red-200 transition-colors opacity-80";
                lbl.querySelector('span.flex-1').classList.add('text-red-700', 'line-through');
                document.getElementById(`icon-${qIndex}-${userOptIndex}`).textContent = "✖️";
                document.getElementById(`icon-${qIndex}-${userOptIndex}`).classList.add("text-red-600");
                
                // Tô lại màu xanh cho đáp án đúng bị bỏ lỡ
                const correctLbl = document.getElementById(`label-${qIndex}-${correctOptIndex}`);
                correctLbl.className = "flex items-start gap-2 p-1.5 rounded border bg-green-50 border-green-200 transition-colors";
                correctLbl.querySelector('span.flex-1').classList.add('text-green-800', 'font-medium');
                document.getElementById(`icon-${qIndex}-${correctOptIndex}`).textContent = "✔️";
                document.getElementById(`icon-${qIndex}-${correctOptIndex}`).classList.add("text-green-600");
            }
        } else {
            // Không chọn gì, chỉ show đáp án đúng
            const correctLbl = document.getElementById(`label-${qIndex}-${correctOptIndex}`);
            correctLbl.className = "flex items-start gap-2 p-1.5 rounded border bg-green-50 border-green-200 transition-colors";
            correctLbl.querySelector('span.flex-1').classList.add('text-green-800', 'font-medium');
            document.getElementById(`icon-${qIndex}-${correctOptIndex}`).textContent = "✔️";
            document.getElementById(`icon-${qIndex}-${correctOptIndex}`).classList.add("text-green-600");
        }
    });

    // Cập nhật HighScore
    const currentHigh = parseInt(localStorage.getItem('knsb_highscore') || 0);
    if (score > currentHigh) {
        localStorage.setItem('knsb_highscore', score);
        updateHighScoreDisplay();
    }

    // Cập nhật UI Dưới
    const scoreDisplay = document.getElementById('score-display');
    scoreDisplay.innerHTML = `Điểm: <span class="${score >= 32 ? 'text-green-600' : 'text-red-600'} text-xl">${score}/40</span>`;
    
    document.getElementById('btn-submit-bottom').classList.add('hidden');
    document.getElementById('btn-retry-bottom').classList.remove('hidden');
    document.getElementById('btn-share').classList.remove('hidden');
    
    document.getElementById('quiz-top-actions').children[0].classList.add('hidden'); // Ẩn nút nộp ở trên
}

function shareResult() {
    const timeStr = document.getElementById('timer').textContent;
    const scoreText = document.getElementById('score-display').innerText; // Lấy "Điểm: X/40"
    const text = `🏆 Kết quả sát hạch Khẩn Nguy Sân Bay:\n🎯 ${scoreText}\n⏱️ Thời gian: ${timeStr}\n🌐 App by Gemini.`;
    
    navigator.clipboard.writeText(text).then(() => {
        showToast();
    });
}

function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('toast-show');
    setTimeout(() => {
        toast.classList.remove('toast-show');
    }, 2000);
}

function removeAccents(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
}

function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
}

function renderReviewData(keyword = '') {
    const container = document.getElementById('review-container');
    const labels = ['A', 'B', 'C', 'D', 'E'];
    const safeKeyword = keyword.trim();
    const searchUnaccented = removeAccents(safeKeyword);
    
    let html = '';
    let count = 0;

    allQuestions.forEach(q => {
        // Thuật toán kiểm tra điều kiện lọc
        const qTextUnaccented = removeAccents(q.question);
        const isMatchQ = qTextUnaccented.includes(searchUnaccented);
        const isMatchOpts = q.options.some(opt => removeAccents(opt.text).includes(searchUnaccented));
        
        if (safeKeyword === '' || isMatchQ || isMatchOpts) {
            count++;
            
            // Highlight logic (Tô màu chính xác từ khóa không phân biệt hoa thường)
            let displayQ = q.question;
            if (safeKeyword !== '' && isMatchQ) {
                const regex = new RegExp('(' + escapeRegExp(safeKeyword) + ')', 'gi');
                displayQ = displayQ.replace(regex, '<mark class="bg-yellow-300 rounded px-1">$1</mark>');
            }

            html += `
            <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-3">
                <div class="font-bold text-[15px] mb-2 leading-tightest"><span class="text-indigo-700">Câu ${q.originalId}:</span> ${displayQ}</div>
                <div class="flex flex-col gap-1.5 pl-1">
            `;
            
            q.options.forEach((opt, optIndex) => {
                const letter = labels[optIndex];
                const isCorrect = opt.text === q.correctText;
                
                let displayOpt = opt.text;
                if (safeKeyword !== '' && removeAccents(opt.text).includes(searchUnaccented)) {
                    const regex = new RegExp('(' + escapeRegExp(safeKeyword) + ')', 'gi');
                    displayOpt = displayOpt.replace(regex, '<mark class="bg-yellow-300 rounded px-1">$1</mark>');
                }

                if (isCorrect) {
                    html += `
                        <div class="flex items-start gap-2 p-1.5 rounded bg-blue-50 border border-blue-200">
                            <span class="text-sm font-bold text-blue-700 w-5">${letter}.</span>
                            <span class="text-[14px] leading-tightest text-blue-900 font-medium flex-1">${displayOpt}</span>
                            <span class="w-5 text-center text-sm font-bold text-blue-600">✔️</span>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex items-start gap-2 p-1.5 rounded bg-transparent">
                            <span class="text-sm font-semibold text-slate-400 w-5">${letter}.</span>
                            <span class="text-[14px] leading-tightest text-slate-500 flex-1">${displayOpt}</span>
                            <span class="w-5"></span>
                        </div>
                    `;
                }
            });
            html += `</div></div>`;
        }
    });

    if (count === 0) {
        html = `<div class="text-center p-8 text-slate-500">Không tìm thấy kết quả nào phù hợp với "<span class="font-bold text-slate-700">${safeKeyword}</span>"</div>`;
    }

    container.innerHTML = html;
    document.getElementById('search-stats').textContent = `Đang hiển thị ${count}/${allQuestions.length} câu hỏi`;
}

// Tối ưu search realtime với debounce nhẹ để ko lag nếu data lớn (dù 55 câu ko lag)
let searchTimeout;
function handleSearch() {
    clearTimeout(searchTimeout);
    const val = document.getElementById('search-input').value;
    searchTimeout = setTimeout(() => {
        renderReviewData(val);
    }, 200); // 200ms debounce
}

/* ==========================================================================
   6. KHỞI CHẠY APP
   ========================================================================== */
window.onload = function() {
    parseData();
    updateHighScoreDisplay();
    startQuiz();
};

</script>
