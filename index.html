<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCA Visualizer - Phòng TC-KH</title>
<style>
    /* --- CẤU HÌNH GIAO DIỆN VCA (ACV STYLE) --- */
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; display: flex; flex-direction: column;}
    
    /* Header */
    .vca-header {
        background: #0056b3; /* Xanh ACV */
        color: white;
        padding: 12px 20px;
        border-bottom: 4px solid #d4af37; /* Vàng Gold */
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        flex-shrink: 0;
    }
    .vca-top { font-size: 11px; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }
    .vca-title { font-size: 13px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .vca-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}

    /* Main Container */
    .main-area { flex-grow: 1; position: relative; overflow: hidden; }
    
    /* Mindmap container - Full Size */
    .markmap { width: 100%; height: 100vh; }

    /* Footer */
    .vca-footer { 
        background: #e9ecef; color: #555; text-align: center; 
        padding: 5px; font-size: 11px; flex-shrink: 0; border-top: 1px solid #ddd;
    }
</style>
<style>.markmap-node-text { font-family: 'Segoe UI'; font-size: 14px; fill: #333; }</style>
</head>

            <script type="text/template">
# 📑 VB Pháp luật mới (Hiệu lực từ T1/2026)
## 💰 Tài chính, Kế toán & Quản lý Tài sản (Trọng tâm TC-KH)
### 🏦 NĐ 57/2026/NĐ-CP: Cơ cấu lại vốn NN
- Cổ phần hóa, chuyển nhượng vốn gắn với tăng hiệu quả kinh doanh.
- Đấu giá công khai hoặc thỏa thuận trực tiếp.
- **Lưu ý:** ACV thuộc Phụ lục III (Thủ tướng QĐ cơ cấu lại vốn).
### ✈️ TT 137/2025/TT-BTC: Hao mòn TS hạ tầng HK
- Áp dụng (14/02/2026): Đường cất hạ cánh, đường lăn, sân đỗ, đường công vụ...
- Tiêu chuẩn TSCĐ: Sử dụng > 1 năm & Nguyên giá > 30 triệu VNĐ.
### 🗺️ NĐ 49 & 50/2026/NĐ-CP: Quản lý Đất đai
- Hướng dẫn định giá đất, hệ số điều chỉnh, tiền thuê/sử dụng đất.
- Cơ chế tháo gỡ vướng mắc thu hồi, giao/thuê đất dự án.
- Ưu đãi: Quy định miễn/giảm tiền sử dụng, tiền thuê đất.
### 💸 TT 14/2026/TT-BTC: Kinh phí chuyến bay chuyên cơ
- Lập dự toán, quản lý & quyết toán kinh phí chuyến bay chuyên cơ.
- Áp dụng giá thuê theo quy định của cơ quan nhà nước.
### 📈 TT 08/2026/TT-BTC: Công bố thông tin TTCK
- Người nội bộ & liên quan: Công bố thông tin trước khi GD ít nhất 3 ngày làm việc.

## 🏗️ Đầu tư, Xây dựng & Đấu thầu
### 🏢 NĐ 14/2026/NĐ-CP: Quản lý & Cấp phép XD
- Quy định quản lý chất lượng, thi công và bảo trì công trình.
- Đơn giản hóa TTHC: Dùng dữ liệu QG thay thế mẫu đơn giấy.
### 📊 NĐ 19 & 22/2026/NĐ-CP: Thẩm định & Giám sát dự án
- Quy định Hội đồng thẩm định dự án quan trọng Quốc gia.
- Chi phí giám sát, đánh giá đầu tư được tính vào chi phí QLDA.
### 📐 TT 60/2025/TT-BXD: Chi phí & Định mức XD
- Hướng dẫn xác định/quản lý chi phí đầu tư XD (nhân công, ca máy).
- Cập nhật định mức bảo trì, bảo dưỡng công trình.

## 🌿 Môi trường, Năng lượng & An toàn
### ♻️ NĐ 48/2026 & TT 09/2026: Bảo vệ Môi trường
- Phân loại dự án phải Đánh giá tác động MT (ĐTM).
- Yêu cầu quan trắc tự động, liên tục nước thải tại khu vực SXKD.
- Cấp Giấy phép MT cấp tỉnh/Quốc gia.
### ⚡ NĐ 30/2026/NĐ-CP: Tiết kiệm năng lượng
- Quản lý cơ sở sử dụng năng lượng trọng điểm (> 1000 TOE).
### 🌪️ NĐ 53/2026/NĐ-CP: Tình huống thiên tai khẩn cấp
- Sân bay là công trình hạ tầng quan trọng cần bảo vệ khẩn cấp khi có rủi ro thiên tai.
### 🧪 NĐ 24 & 25/2026/NĐ-CP: Luật Hóa chất
- Danh mục hóa chất phải có kế hoạch phòng ngừa, ứng phó sự cố (Phụ lục IV).
- Áp dụng nguyên tắc "hóa học xanh" giảm chất thải.

## 👨‍💼 Nhân sự, Hành chính & An ninh
### 🛡️ TT 14/2026/TT-BCA: An ninh Hàng không
- Kiểm soát khu vực hạn chế, kiểm tra an ninh hành khách/hành lý/tàu bay.
- Trách nhiệm: DN tự bảo đảm kinh phí cho công tác ANHK.
### 🗂️ NĐ 31/2026/NĐ-CP: Xử phạt HC Lưu trữ
- Phạt cá nhân tới 30tr, tổ chức 60tr.
- Vi phạm: Không số hóa tài liệu, sao chép trái phép, làm sai lệch hồ sơ.
### 🏥 Y tế & Bảo hiểm (TT 56, 60/BYT & 09/BTC)
- Chuyển đổi hoàn toàn sổ BHXH, thẻ BHYT sang bản điện tử (VssID, VNeID).
- Khám, thống kê và hưởng chế độ bệnh nghề nghiệp.
### 🏅 TT 55/2025/TT-BXD: Thi đua khen thưởng
- Xét danh hiệu Cờ thi đua, Bằng khen, Kỷ niệm chương ngành.
