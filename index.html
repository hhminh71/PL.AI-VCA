# ĐIỂM MỚI LUẬT XÂY DỰNG NĂM 2025 (Cục Kinh tế - Quản lý Đầu tư Xây dựng)

## 1. ĐỔI MỚI PHƯƠNG THỨC & NÂNG CAO HIỆU QUẢ QUẢN LÝ
### 1.1. Phạm vi điều chỉnh
#### Luật Xây dựng năm 2014
- Quy định quyền, nghĩa vụ, trách nhiệm của cơ quan, tổ chức, cá nhân và quản lý nhà nước (QLNN) trong HĐXD.
- Bao gồm các hoạt động: Lập QH đô thị/nông thôn, lập DA ĐTXD, khảo sát, thiết kế, thi công, giám sát, QLDA, lựa chọn nhà thầu, nghiệm thu, bàn giao, bảo hành, bảo trì và các hoạt động khác.
#### Luật Xây dựng năm 2025 (Bổ sung & Làm rõ)
- Bổ sung rõ "Quy định về hoạt động xây dựng" và "Quản lý nhà nước về xây dựng".
- Chỉ đích danh các hoạt động cụ thể: Lập, thẩm tra, thẩm định, phê duyệt DA và thiết kế; Quản lý cấp phép XD; Quản lý năng lực hoạt động XD; Quản lý chi phí ĐTXD; Quản lý hợp đồng XD; Quyết toán vốn đầu tư.
### 1.2. Phân loại dự án theo hình thức đầu tư
#### Theo Luật 2014 (Khoản 4 Điều 49) - 04 Loại
- (a) Dự án sử dụng vốn đầu tư công.
- (b) Dự án sử dụng vốn nhà nước ngoài đầu tư công.
- (c) Dự án PPP.
- (d) Dự án sử dụng vốn khác.
#### Theo Luật 2025 (Điều 17) - 03 Loại
- (1) Dự án đầu tư công: Bao gồm cả DA sử dụng chi thường xuyên, vốn ngân sách nhà nước khác.
- (2) Dự án PPP.
- (3) Dự án đầu tư kinh doanh: Gồm dự án thuộc phạm vi điều chỉnh của PL về đầu tư, và các DA ĐTXD còn lại.
### 1.3. Chủ đầu tư & Hình thức quản lý dự án (Điều 32)
#### Theo Luật 2014
- (1) Ban QLDA chuyên ngành / khu vực.
- (2) Ban QLDA 1 dự án.
- (3) Chủ đầu tư sử dụng bộ máy chuyên môn trực thuộc.
- (4) Tổ chức tư vấn QLDA.
#### Theo Luật 2025 (Thay đổi lớn)
- Đối với DA Đầu tư công: Chủ đầu tư KHÔNG bắt buộc phải là Ban QLDA ĐTXD (có điều kiện áp dụng).
- Căn cứ vào quy mô, tính chất, hình thức đầu tư và điều kiện, áp dụng 1 trong các hình thức:
  - (1) Ban quản lý dự án ĐTXD.
  - (2) Chủ đầu tư tổ chức QLDA thông qua: Thuê tư vấn QLDA HOẶC Thành lập Ban QLDA trực thuộc HOẶC Tự thực hiện quản lý.
### 1.4. Xác định & Quản lý chi phí
#### Nguyên tắc quản lý (Điều 73)
- Đối với dự án ĐTC, PPP: Việc quản lý phải bảo đảm chi tiết, cụ thể hơn theo từng bước thiết kế tương ứng với từng giai đoạn của DA.
#### Sơ bộ Tổng mức đầu tư (TMĐT) & TMĐT
- Sơ bộ TMĐT: Là toàn bộ chi phí dự tính trước tại BC NCKT; là dự kiến TMĐT đối với DA lập Báo cáo đề xuất chủ trương đầu tư.
- TMĐT (Mức trần): Được phê duyệt là mức chi phí TỐI ĐA chủ đầu tư được phép sử dụng để thực hiện dự án.
- Tham khảo dữ liệu quốc tế (Điểm mới Điều 75, 76): ĐƯỢC PHÉP tham khảo, sử dụng giá, dữ liệu chi phí của các công trình/dự án đã hoặc đang thực hiện ở NƯỚC NGOÀI để xác định chi phí, dự toán.
### 1.5. Quản lý hợp đồng (Điều 13, 83, 86)
#### Khung pháp lý & Tự nguyện (Điều 13)
- Đồng bộ tính thống nhất với Luật Đấu thầu. Tôn trọng Bộ Luật Dân sự 2015 về nguyên tắc tự do, tự nguyện thỏa thuận.
- Bổ sung quy định rõ ràng về "Sự kiện bất khả kháng" và "Hoàn cảnh thay đổi cơ bản".
#### Bảo đảm thực hiện nghĩa vụ (Điều 83)
- Bên Giao thầu: Có quyền yêu cầu bên nhận thầu có biện pháp bảo đảm; Quyền xử lý tài sản bảo đảm / yêu cầu bảo lãnh / yêu cầu tổ chức tín dụng (TCTD) nơi ký quỹ thanh toán.
- Bên Nhận thầu: Có quyền yêu cầu giao thầu chứng minh đủ năng lực tài chính hoặc bảo đảm thanh toán (TRỪ hợp đồng thuộc dự án Đầu tư công); Quyền xử lý tài sản / yêu cầu bảo lãnh / yêu cầu TCTD thanh toán.
#### Giải quyết tranh chấp (Điều 86)
- Áp dụng các mô hình xử lý theo thông lệ quốc tế, thông qua Trọng tài hoặc Tòa án.
- Ưu tiên: DA Đầu tư công và PPP ưu tiên sử dụng Trọng tài TRONG NƯỚC.
- Nguồn chi trả: Chi phí giải quyết tranh chấp của Chủ đầu tư (nếu có) được tính vào Tổng mức đầu tư.
### 1.6. KHCN, Chuyển đổi số & CSDL Quốc gia
#### Ứng dụng & Chính sách khuyến khích
- Ứng dụng: Công nghệ tiên tiến, bảo vệ môi trường, CNTT, Chuyển đổi số, Đổi mới sáng tạo, Mô hình thông tin công trình (BIM).
- Khuyến khích sử dụng vật liệu: Vật liệu mới, tái chế, xanh, nhẹ, thông minh, thân thiện môi trường, phù hợp vùng ven biển/hải đảo.
- Định hướng phát triển: Công trình xanh, công trình thông minh, sử dụng hiệu quả tài nguyên, đô thị tăng trưởng xanh, thích ứng BĐKH.
#### Cơ sở dữ liệu quốc gia về HĐXD (Điều 14)
- Vai trò: Là nền tảng chuyển đổi số, tham chiếu gốc phục vụ tra cứu thủ tục, định mức, giá, chỉ số giá, quy chuẩn kỹ thuật.
- Yêu cầu kỹ thuật: Phải được triển khai trong quá trình thực hiện TTHC; cập nhật thường xuyên; kết nối đồng bộ với CSDL đất đai, quy hoạch.
- Vận hành: Chính phủ quy định chi tiết việc xây dựng, quản lý, vận hành và khai thác.

## 2. CẮT GIẢM & ĐƠN GIẢN HÓA TTHC, ĐIỀU KIỆN KINH DOANH
### 2.1. Lập, Thẩm định dự án ĐTXD
#### Đơn giản hóa Thiết kế cơ sở (TKCS)
- Luật 2014: Bắt buộc lập TKCS trong BC NCKT.
- Luật 2025: Theo yêu cầu DA, Người quyết định đầu tư được quyền sử dụng thiết kế FEED hoặc Thiết kế kỹ thuật THAY THẾ cho TKCS.
#### Thẩm định của Người quyết định đầu tư
- DA Đầu tư công: Bổ sung nội dung đánh giá sự phù hợp của BC NCKT/BC KT-KT với Chủ trương đầu tư và Thực hiện thủ tục môi trường.
- DA Đầu tư kinh doanh: Tự quyết định nội dung, nhưng PHẢI đảm bảo 3 yếu tố phù hợp: (1) Chủ trương đầu tư; (2) Nhiệm vụ thiết kế; (3) Thiết kế công nghệ (nếu có).
#### Thẩm định của Cơ quan chuyên môn về XD (CQCM)
- Đánh giá sự phù hợp của TKXD với quy hoạch làm căn cứ lập DA.
- Sự tuân thủ quy chuẩn kỹ thuật.
- Đánh giá giải pháp thiết kế về PCCC (theo pháp luật PCCC).
### 2.2. Lập, Thẩm tra, Thẩm định thiết kế triển khai sau DA
#### Thẩm định Thiết kế
- Luật 2014: CQCM xây dựng thẩm định DA vốn ĐTC, NN ngoài ĐTC (nhóm B+), PPP, ảnh hưởng lớn an toàn cộng đồng.
- Phân quyền Luật 2025: CHỦ ĐẦU TƯ tự thực hiện thẩm định, kiểm soát và phê duyệt thiết kế sau khi DA được phê duyệt.
#### Thẩm tra Thiết kế
- Luật 2014: Áp dụng diện rộng cho công trình ảnh hưởng lớn đến an toàn cộng đồng.
- Luật 2025: Chỉ áp dụng thẩm tra cho các công trình thuộc dự án bắt buộc phải thẩm tra thiết kế tại bước lập Báo cáo NCKT.
### 2.3. Cấp Giấy phép xây dựng (Hiệu lực: 01/01/2026)
#### Nguyên tắc 1 TTHC & Quản lý Trật tự XD
- "Mỗi công trình từ chuẩn bị DA đến khởi công chỉ phải thực hiện 1 TTHC".
- Bổ sung: Các công trình miễn GPXD phải thông báo khởi công kèm hồ sơ tương đương cấp GPXD để quản lý trật tự.
#### 08 Trường hợp MIỄN GPXD
- (1) Công trình bí mật nhà nước, khẩn cấp, ĐTC đặc biệt, ĐT thủ tục đặc biệt, CT tạm, CT tại đất sử dụng vào mục đích QPAN.
- (2) Công trình DA ĐTC do Thủ tướng CP, Thủ trưởng cơ quan TW, Chủ tịch UBND các cấp QĐ đầu tư.
- (3) Công trình theo tuyến qua từ 2 tỉnh trở lên; Tuyến ngoài khu vực định hướng phát triển đô thị.
- (4) Công trình trên biển ngoài khơi đã giao khu vực biển; Cảng HK, CT tại cảng HK, CT bảo đảm hoạt động bay.
- (5) Công trình quảng cáo (theo Luật QC); Hạ tầng kỹ thuật viễn thông thụ động.
- (6) Công trình thuộc DA đã được CQCM về XD thẩm định BCNCKT, BCNCKT điều chỉnh và duyệt theo quy định.
- (7) Công trình Cấp IV, Nhà ở riêng lẻ dưới 07 tầng (Tổng diện tích sàn <500m2) VÀ KHÔNG THUỘC các khu: chức năng, đô thị có quy hoạch, khu đã có quy chế QLKT.
- (8) Sửa chữa, cải tạo bên trong/mặt ngoài không tiếp giáp đường đô thị (có QLKT); Không thay đổi công năng; Không ảnh hưởng kết cấu chịu lực; Đảm bảo PCCC, BVMT.
### 2.4. Khởi công & Kiểm tra Nghiệm thu
#### Điều kiện khởi công
- Thông báo: Bắt buộc gửi thông báo khởi công bằng văn bản hoặc TRỰC TUYẾN (trừ nhà ở riêng lẻ).
- Ngoại lệ mặt bằng (Chỉ cần bàn giao một phần/toàn bộ là được khởi công): Công trình khẩn cấp, cấp bách, ĐTC đặc biệt; CT cần khởi công sớm do Thủ tướng quyết định.
#### Kiểm tra công tác nghiệm thu
- Thẩm quyền: Cơ quan có thẩm quyền kiểm tra (trong quá trình thi công & khi hoàn thành).
- Đối tượng kiểm tra: Dự án quan trọng quốc gia, quy mô lớn, kỹ thuật phức tạp, ảnh hưởng lớn an toàn cộng đồng.
### 2.5. Quản lý Năng lực HĐXD (Bỏ nhiều thủ tục)
#### Tổ chức / Doanh nghiệp
- Cải cách đột phá: BÃI BỎ hoàn toàn yêu cầu về Điều kiện năng lực và Chứng chỉ năng lực (CCNL) của tổ chức/DN.
#### Cá nhân (Chứng chỉ hành nghề - CCHN)
- Bỏ thủ tục: Xóa bỏ yêu cầu Sát hạch. Chỉ yêu cầu 2 yếu tố: (1) Chuyên môn phù hợp và (2) Thời gian/Kinh nghiệm phù hợp.
- BẮT BUỘC có CCHN (Hạng I, II, III): Chủ nhiệm/Chủ trì thiết kế quy hoạch; Chủ nhiệm Khảo sát; Chủ nhiệm/Chủ trì thiết kế, thẩm tra; Giám sát thi công; Chủ trì xác định, thẩm tra, quản lý chi phí.
- KHÔNG CẦN CCHN (Chỉ cần đủ NL, Kinh nghiệm): Chỉ huy trưởng; Giám đốc QLDA; Chủ trì kiểm định.
- Hành nghề độc lập: Bắt buộc cá nhân phải có CCHN và năng lực phù hợp chuyên môn.
### 2.6. Bảo đảm Quốc phòng, An ninh
- Điều 26 & 28: Các dự án thuộc "Danh mục dự án trọng yếu" bắt buộc phải được Bộ Quốc phòng, Bộ Công an cho ý kiến trước khi phê duyệt.
- Thẩm quyền: Bộ trưởng BQP, BCA quy định Danh mục DA trọng yếu và cơ chế thẩm định đặc thù.

## 3. PHÂN ĐỊNH RÕ TRÁCH NHIỆM CHỦ THỂ
- Điều 92 (Trách nhiệm quản lý): Phân định rõ ràng, rạch ròi trách nhiệm của các cơ quan quản lý nhà nước cấp Trung ương và Địa phương.
- Mục tiêu: Gắn trách nhiệm chặt chẽ, rõ ràng hơn cho từng chủ thể tham gia, nhằm bảo đảm tuyệt đối tính minh bạch, hiệu quả, và trách nhiệm giải trình.

## 4. QUY ĐỊNH CHUYỂN TIẾP (10 TÌNH HUỐNG THỰC TẾ)
- (1) DA, thiết kế duyệt trước 01/7/2026: Các hoạt động tiếp theo được thực hiện theo Luật 2025.
- (2) Thiết kế sau TKCS đã được CQCM thẩm định theo luật cũ: Nếu phát sinh điều chỉnh -> Chủ đầu tư TỰ thẩm định.
- (3) CT đã cấp GPXD nhưng thuộc diện MIỄN theo luật mới: Không cần làm thủ tục điều chỉnh GPXD.
- (4) CT thuộc diện miễn GPXD theo luật cũ, đủ ĐK khởi công trước 01/01/2026: Vẫn tiếp tục được MIỄN GPXD.
- (5) CT đã được CQCM thẩm định TKXD sau TKCS, đủ ĐK phê duyệt và cấp GPXD theo luật cũ: Được MIỄN GPXD.
- (6) CT thuộc DA đã có GPXD trước 01/01/2026, được CQCM thẩm định BCNCKT điều chỉnh và duyệt: Không phải đi điều chỉnh GPXD.
- (7) CT thuộc DA đã được CQCM thẩm định BCNCKT điều chỉnh theo luật cũ và đã phê duyệt: Được MIỄN GPXD.
- (8) Ban QLDA được thành lập trước 01/7/2026: KHÔNG BẮT BUỘC phải chuyển đổi hình thức tổ chức QLDA.
- (9) Hợp đồng Xây dựng:
  - Đã ký trước 01/7/2026: Thực hiện theo Luật cũ (Nhưng được dùng Luật mới nếu rơi vào Bất khả kháng hoặc Hoàn cảnh thay đổi cơ bản).
  - Đang đàm phán, chưa giao kết từ 01/7/2026: Được tự do thỏa thuận áp dụng Luật 2025 (phù hợp quá trình đấu thầu, không trái PL khác).

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.4"></script>
    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
