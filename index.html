    <script>
        // ================= 1. DỮ LIỆU RAW TEXT =================
        const rawDataString = `
SMS-NC: HUẤN LUYỆN BAN ĐẦU HỆ THỐNG QUẢN LÝ AN TOÀN, MỨC ĐỘ NÂNG CAO(cập nhật ngày 25/6/2026)
Câu 1: Quy định nhà cung cấp dịch vụ phải xây dựng Hệ thống quản lý an toàn được quy định trong:
a. Annex 1
b. Annex 19
c. Annex 2
d. Tất cả tài liệu trên
Đáp án: b. Annex 19
Câu 2: Chương trình an toàn quốc gia do ai ban hành
a. Bộ Xây dựng
b. ICAO
c. Cảng vụ hàng không
d. Đơn vị cung cấp dịch vụ
Đáp án: a. Bộ Xây dựng
Câu 3: Phương pháp nhận diện mối nguy có mấy phương pháp?
a. Phân tích các bước của quá trình để nhận diện mối nguy (bottom up)
b. Phân tích các nguyên nhân gây ra các hậu quả trong quá trình hoạt động để nhận diện mối nguy (top down)
c. Cả a và b
d. Tất cả đều sai
Đáp án: c. Cả a và b
Câu 4: Cấu trúc Chương trình an toàn quốc gia theo yêu cầu của ICAO gồm
a. Chính sách và mục tiêu an toàn quốc gia
b. Chương trình quản lý rủi ro an toàn
c. Bảo đảm an toàn quốc gia, Thúc đẩy an toàn quốc gia
d. Tất cả yếu tố trên
Đáp án: d. Tất cả yếu tố trên
Câu 5: Theo yêu cầu của ICAO, Thành phần đảm bảo an toàn gồm những yếu tố nào:
a. Giám sát và đo lường an toàn, Quản lý sự thay đổi, Liên tục cải tiến hệ thống
b. Nhận diện và đánh giá rủi ro, Cam kết của lãnh đạo, Quyền hạn và trách nhiệm an toàn
c. Huấn luyện đào tạo và Phổ biến an toàn
d. Tất cả các câu trên
Đáp án: a. Giám sát và đo lường an toàn, Quản lý sự thay đổi, Liên tục cải tiến hệ thống
Câu 6: Định nghĩa hành động khắc phục
a. Xử lý điểm không phù hợp ngay lúc phát hiện
b. Xử lý nguyên nhân gốc rễ
c. Xử lý điểm không phù hợp, tìm nguyên nhân gốc rễ và đề xuất biện pháp khắc phục
d. Tất cả các câu đều đúng
Đáp án: c. Xử lý điểm không phù hợp, tìm nguyên nhân gốc rễ và đề xuất biện pháp khắc phục
Câu 7: Định nghĩa nào đúng
a. Quá trình là tập hợp các hoạt động để biến đổi đầu vào thành đầu ra
b. Quá trình là một hoạt động không có đầu ra
c. Quy trình là mô tả các hoạt động của một quá trình
d. Cả a và c đều đúng
Đáp án: d. Cả a và c đều đúng
Câu 8: Các yêu cầu về việc triển khai Hệ thống quản lý an toàn trong Annex 19 áp dụng trong lĩnh vực nào:
a. Đảm bảo chất lượng dịch vụ
b. Đảm bảo an toàn trong lĩnh vực hàng không
c. Đảm bảo an toàn trong lĩnh vực hàng hải
d. Tất cả lĩnh vực trên
Đáp án: b. Đảm bảo an toàn trong lĩnh vực hàng không
Câu 9: Trách nhiệm an toàn của Ban giám đốc cảng thể hiện ở tài liệu nào:
a. Tài liệu Hệ thống quản lý an toàn được Cục hàng không Việt Nam phê duyệt
b. Bảng mô tả công việc của từng chức danh
c. Quyết định phân công nhiệm vụ của Ban giám đốc.
d. Tất cả các yếu tố trên
Đáp án: d. Tất cả các yếu tố trên
Câu 10: Chi số an toàn được xác định như thế nào
a. Dựa vào các rủi ro an toàn của cảng đang muốn kiểm soát
b. Theo chương trình an toàn quốc gia
c. Cả a và b đều đúng
d. Tất cả đều sai
Đáp án: c. Cả a và b đều đúng
Câu 11: Mục đích của việc xây dựng Hệ thống SMS là:
a. Nhận diện các mối nguy trong quá trình hoạt động cung cấp dịch vụ của cảng để đảm bảo đạt mức độ an toàn chấp nhận được và chuyển việc quản lý an toàn từ bị động sang chủ động
b. Phục vụ cho việc lưu trữ hồ sơ hệ thống của tổ chức
c. Thỏa mãn nhu cầu khách hàng, luật định
d. Thỏa mãn yêu cầu của các hãng hàng không
Đáp án: a. Nhận diện các mối nguy trong quá trình hoạt động cung cấp dịch vụ của cảng để đảm bảo đạt mức độ an toàn chấp nhận được và chuyển việc quản lý an toàn từ bị động sang chủ động
Câu 12: Nguồn để xác định mối nguy, bao gồm:
a. Các báo cáo, thông báo sự cố cũng như quá trình điều tra
b. Hệ thống báo cáo tự nguyện
c. Khảo sát định kỳ các mối nguy đối với các trang thiết bị an toàn hàng không; đánh giá an toàn/chất lượng định kỳ; đánh giá hệ thống thu thập dữ liệu hoạt động định kỳ
d. Tất cả các câu trên
Đáp án: d. Tất cả các câu trên
Câu 13: Mối nguy là:
a. Hậu quả, thiệt hại về người và tài sản, giảm mức độ an toàn của Hệ thống
b. Điều kiện hoặc đối tượng có thể gây ra tổn thương cho con người, thiệt hại đến tài sản, giảm mức độ an toàn hệ thống
c. Các yêu cầu của Annex 19
d. Tất cả đều đúng
Đáp án: b. Điều kiện hoặc đối tượng có thể gây ra tổn thương cho con người, thiệt hại đến tài sản, giảm mức độ an toàn hệ thống
Câu 14: Khi đánh giá rủi ro hiện tại ở mức Trung bình tổ chức cần thực hiện các hành động gì?
a. Tiến hành nhận diện mối nguy, đánh giá rủi ro lại
b. Bổ sung các biện pháp kiểm soát rủi ro tăng cường
c. Chấm dứt hoạt động
d. Chấp nhận mối nguy trên tồn tại trong hoạt động của tổ chức.
Đáp án: b. Bổ sung các biện pháp kiểm soát rủi ro tăng cường
Câu 15: Sự cố tàu bay gặp hư hỏng do FOD trong năm 2024 là 0.8/10.000 lần CHC. Trong năm 2025, tổ chức muốn giảm 10% sự cố này. Vậy:
a. Mục tiêu an toàn: 0.72/10.000 lần CHC
b. Chỉ tiêu an toàn: 0.72/10.000 lần CHC
c. Chỉ số an toàn: 0.72/10.000 lần CHC
d. Tất cả đều sai
Đáp án: b. Chỉ tiêu an toàn: 0.72/10.000 lần CHC
Câu 16: Mục đích đánh giá nội bộ trong Hệ thống SMS - QMS
a. Nhận diện các mối nguy đang tồn tại hiện hữu/ tiềm ẩn trong Hệ thống
b. Xác định các khu vực cần cải tiến
c. Xác định kế hoạch phân bổ nguồn lực
d. Tất cả yếu tố trên
Đáp án: d. Tất cả yếu tố trên
Câu 17: Quá trình xem xét kỷ luật công bằng cần xem xét các yếu tố:
a. Hồ sơ ghi nhận các hành vi gây mất an toàn của cá nhân trước đây
b. Hồ sơ đào tạo về chuyên môn
c. Ý định của cá nhân liên quan đến hành vi không phù hợp
d. Tất cả yếu tố trên
Đáp án: d. Tất cả yếu tố trên
Câu 18: Quản lý sự thay đổi được triển khai thực hiện đối với các thay đổi nào
a. Thay đổi về luật định, chế định
b. Thay đổi quy trình, quá trình, phương án khai thác
c. Thay đổi cơ sở hạ tầng, trang thiết bị
d. Tất cả yếu tố trên.
Đáp án: d. Tất cả yếu tố trên.
Câu 19: Phải có hành động thực hiện hành động khắc phục khi đường biểu diễn các chỉ số an toàn trong năm hiện tại:
a. 3 điểm liên tiếp nằm trên cảnh báo mức 1
b. 2 điểm liên tiếp nằm trên cảnh báo mức 2
c. 1 điểm nằm trên đường cảnh báo mức 3
d. Tất cả yếu tố trên.
Đáp án: d. Tất cả yếu tố trên.
Câu 20: Theo yêu cầu của ICAO, yếu tố thúc đẩy an toàn gồm những thành phần nào:
a. Huấn luyện và đào tạo, phổ biến về an toàn
b. Nhận diện mối nguy, đánh giá rủi ro
c. Đánh giá nội bộ
d. Tất cả yếu tố trên.
Đáp án: a. Huấn luyện và đào tạo, phổ biến về an toàn
Câu 21: Các bộ phận chính cấu thành SSP gồm:
a. Hội đồng kiểm soát rủi ro an toàn hàng không (ASMRC)
b. Bộ phận thu thập và phân tích sự cố an toàn hàng không (ASICA)
c. Nhóm tiêu chuẩn hóa an toàn hàng không (ASST)
d. Tất cả bộ phận trên.
Đáp án: d. Tất cả bộ phận trên.
Câu 22: Đường cất hạ cánh bị hư hỏng một vị trí, Đội bảo trì Cảng hàng không X tiến hành trám vá và thông báo cho ATC là đường CHC đủ điều kiện đưa vào khai thác. Một lúc sau, tàu bay hạ cánh vào khu vực trám vá và làm bê tông tại khu vực trám vá bị bong tróc, va chạm gây hư hỏng động cơ tàu bay. Sau đó, tàu bay được kéo về xưởng để thay thế động cơ. Mối nguy cụ thể là:
a. Động cơ bị hư hỏng.
b. Chất lượng trám vá trên đường cất hạ cánh không đảm bảo, bong tróc tạo ra FOD trên đường cất hạ cánh.
c. Tất cả đều đúng
d. Tất cả đều sai.
Đáp án: b. Chất lượng trám vá trên đường cất hạ cánh không đảm bảo, bong tróc tạo ra FOD trên đường cất hạ cánh.
Câu 23: Đường cất hạ cánh bị hư hỏng một vị trí, Đội bảo trì Cảng hàng không X tiến hành trám vá và thông báo cho ATC là đường CHC đủ điều kiện đưa vào khai thác. Một lúc sau, tàu bay hạ cánh vào khu vực trám vá và làm bê tông tại khu vực trám vá bị bong tróc, va chạm gây hư hỏng động cơ tàu bay. Sau đó, tàu bay được kéo về xưởng để thay thế động cơ. Rủi ro an toàn hiện tại là:
a. Động cơ bị hư hỏng.
b. Chất lượng trám vá trên đường cất hạ cánh không đảm bảo, bong tróc tạo ra FOD trên đường cất hạ cánh.
c. Tất cả đều đúng
d. Tất cả đều sai.
Đáp án: a. Động cơ bị hư hỏng.
Câu 24: Đánh giá rủi ro an toàn dựa trên các yếu tố nào.
a. Tần xuất xảy ra.
b. Mức độ nghiêm trọng
c. Cả a và b
d. Tất cả đều sai.
Đáp án: c. Cả a và b
Câu 25: Hệ thống báo cáo an toàn bao gồm:
a. Hệ thống báo cáo bắt buộc
b. Hệ thống báo cáo không bắt buộc (báo cáo an toàn tự nguyện)
c. Cả a và b
d. Tất cả đều sai
Đáp án: c. Cả a và b
Câu 26: Giám sát đo lường hệ thống quản lý an toàn thông qua các thông số nào?
a. Mục tiêu an toàn
b. Chỉ số an toàn
c. Chỉ tiêu an toàn
d. Tất cả đều đúng
Đáp án: d. Tất cả đều đúng
Câu 27: Báo cáo tự nguyện từ cán bộ nhân viên phục vụ cho mục đích gì:
a. Cung cấp thông tin an toàn để phục vụ công tác nhận diện mối nguy, đánh giá rủi ro và đưa các biện pháp kiểm soát rủi ro an toàn.
b. Để trừng phạt, xử lý, kỷ luật
c. Tất cả đều sai

        // ================= 2. PARSE DATA TỰ ĐỘNG =================
        function parseRawData(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let questions = [];
            let currentQ = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.match(/^Câu\s+\d+:/i)) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = { 
                        question: line.replace(/^Câu\s+\d+:\s*/i, '').trim(), 
                        options: [],
                        originalText: line // Save to render search properly
                    };
                } else if (line.match(/^[a-d]\./i) && currentQ) {
                    currentQ.options.push({ 
                        text: line.replace(/^[a-d]\.\s*/i, '').trim(), 
                        isCorrect: false 
                    });
                } else if (line.match(/^Đáp án:/i) && currentQ) {
                    const ansMatch = line.match(/^Đáp án:\s*([a-d])/i);
                    if (ansMatch) {
                        const correctIndex = ansMatch[1].toLowerCase().charCodeAt(0) - 97;
                        if (currentQ.options[correctIndex]) {
                            currentQ.options[correctIndex].isCorrect = true;
                        }
                    }
                } else if (currentQ && currentQ.options.length === 0 && !line.match(/^---/)) {
                    // Nối thêm text nếu câu hỏi nhiều dòng
                    currentQ.question += " " + line;
                    currentQ.originalText += " " + line;
                }
            }
            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
            return questions;
        }

        const fullQuestionsData = parseRawData(rawDataString);

        // ================= 3. TRẠNG THÁI APP & TIỆN ÍCH =================
        let currentQuizQuestions = [];
        let timerInterval;
        let secondsElapsed = 0;
        let isSubmitted = false;
        let isStudyRendered = false; // FLAG QUAN TRỌNG: Sửa lỗi màn hình trắng

        // Lấy High Score
        let highScore = localStorage.getItem('sms_quiz_highscore') || 0;
        document.getElementById('highScoreDisplay').innerText = `Điểm cao: ${highScore}/40`;

        // Hàm xáo trộn mảng (Fisher-Yates)
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // Bỏ dấu tiếng Việt (Hỗ trợ tìm kiếm)
        function removeAccents(str) {
            return str.normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .replace(/đ/g, 'd').replace(/Đ/g, 'D');
        }

        // ================= 4. LOGIC CHUYỂN TAB =================
        function switchTab(tabId) {
            const quizTab = document.getElementById('tab-quiz');
            const studyTab = document.getElementById('tab-study');
            const btnQuiz = document.getElementById('btn-tab-quiz');
            const btnStudy = document.getElementById('btn-tab-study');

            if (tabId === 'quiz') {
                quizTab.classList.remove('hidden');
                studyTab.classList.add('hidden');
                
                btnQuiz.classList.replace('text-gray-500', 'text-blue-600');
                btnQuiz.classList.replace('border-transparent', 'border-blue-600');
                btnStudy.classList.replace('text-blue-600', 'text-gray-500');
                btnStudy.classList.replace('border-blue-600', 'border-transparent');
            } else {
                quizTab.classList.add('hidden');
                studyTab.classList.remove('hidden');
                
                btnStudy.classList.replace('text-gray-500', 'text-blue-600');
                btnStudy.classList.replace('border-transparent', 'border-blue-600');
                btnQuiz.classList.replace('text-blue-600', 'text-gray-500');
                btnQuiz.classList.replace('border-blue-600', 'border-transparent');

                // RENDER NGAY LẦN ĐẦU TIÊN BẤM VÀO TAB (Chống lỗi trống trơn)
                if (!isStudyRendered) {
                    renderStudyData(fullQuestionsData);
                    isStudyRendered = true;
                }
            }
        }

        // ================= 5. LOGIC TAB 1: THI THỬ =================
        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timerDisplay').innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timerDisplay').innerText = formatTime(secondsElapsed);
            }, 1000);
        }

        function initQuiz() {
            isSubmitted = false;
            document.getElementById('btn-share').classList.add('hidden');
            document.getElementById('btn-submit-top').classList.remove('hidden');
            document.getElementById('btn-submit-bottom').classList.remove('hidden');
            document.getElementById('score-result').classList.add('hidden');
            
            // Random bốc 40 câu và xáo trộn mảng
            const shuffledFull = shuffleArray([...fullQuestionsData]);
            currentQuizQuestions = shuffledFull.slice(0, 40).map(q => {
                // Giữ nguyên thứ tự đáp án (không xáo trộn options)
                return {
                    ...q,
                    options: [...q.options]
                }
            });

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            currentQuizQuestions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                // Tối giản padding và margin của khung câu hỏi cho điện thoại
                qDiv.className = 'bg-white rounded-lg p-2.5 sm:p-4 mb-2 shadow-sm border border-gray-200';
                qDiv.id = `qbox-${index}`;
                
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    const prefix = String.fromCharCode(65 + optIndex) + '.'; // A. B. C. D.
                    // Tối giản padding bên trong các thẻ đáp án
                    optionsHtml += `
                        <label id="label-${index}-${optIndex}" class="flex items-start p-2 sm:p-3 rounded-lg border border-gray-200 cursor-pointer hover:bg-gray-50 transition-all mb-1.5 w-full">
                            <input type="radio" name="question_${index}" value="${optIndex}" class="hidden" onchange="markAnswered(${index})">
                            <span class="font-bold text-gray-500 shrink-0 w-6 sm:w-7 text-left">${prefix}</span>
                            <span class="text-sm sm:text-base leading-snug break-words w-full text-gray-700" id="text-${index}-${optIndex}">${opt.text}</span>
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <div class="font-bold text-sm sm:text-base mb-2 text-gray-800 flex gap-1">
                        <span class="whitespace-nowrap text-blue-700">Câu ${index + 1}:</span>
                        <span>${q.question}</span>
                    </div>
                    <div class="flex flex-col">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(qDiv);
            });

            startTimer();
            // Cuộn lên đầu
            document.getElementById('tab-quiz').scrollTop = 0;
        }

        function markAnswered(qIndex) {
            if(isSubmitted) return;
            // Gỡ highlight của các lựa chọn khác trong cùng 1 câu
            const qData = currentQuizQuestions[qIndex];
            qData.options.forEach((_, optIndex) => {
                const label = document.getElementById(`label-${qIndex}-${optIndex}`);
                label.classList.remove('bg-blue-50', 'border-blue-400');
                label.classList.add('border-gray-200');
            });

            // Highlight đáp án đang được chọn
            const selectedInput = document.querySelector(`input[name="question_${qIndex}"]:checked`);
            if (selectedInput) {
                const selectedVal = selectedInput.value;
                const selectedLabel = document.getElementById(`label-${qIndex}-${selectedVal}`);
                selectedLabel.classList.remove('border-gray-200');
                selectedLabel.classList.add('bg-blue-50', 'border-blue-400');
            }
        }

        function submitQuiz() {
            if (isSubmitted) return;
            if (!confirm("Bạn chắc chắn muốn nộp bài?")) return;
            
            clearInterval(timerInterval);
            isSubmitted = true;
            let score = 0;

            currentQuizQuestions.forEach((q, qIndex) => {
                const selectedInput = document.querySelector(`input[name="question_${qIndex}"]:checked`);
                const selectedVal = selectedInput ? parseInt(selectedInput.value) : -1;
                
                q.options.forEach((opt, optIndex) => {
                    const label = document.getElementById(`label-${qIndex}-${optIndex}`);
                    const textSpan = document.getElementById(`text-${qIndex}-${optIndex}`);
                    const radio = document.querySelector(`input[name="question_${qIndex}"][value="${optIndex}"]`);
                    
                    radio.disabled = true; // Khóa lựa chọn

                    // Khôi phục lại trạng thái mặc định không có hiệu ứng trỏ chuột
                    label.classList.remove('bg-blue-50', 'border-blue-400', 'cursor-pointer', 'hover:bg-gray-50');

                    if (opt.isCorrect) {
                        // Highlight đáp án ĐÚNG (màu xanh, có tick)
                        label.classList.add('bg-green-50', 'border-green-400');
                        label.classList.remove('border-gray-200');
                        textSpan.classList.add('text-green-800', 'font-medium');
                        
                        // Chèn icon checkmark vào cuối label
                        label.innerHTML += `<span class="text-green-600 ml-2 font-bold shrink-0">✓</span>`;
                        
                        if (selectedVal === optIndex) {
                            score++; // Cộng điểm nếu chọn đúng
                        }
                    } else if (selectedVal === optIndex) {
                        // Highlight đáp án SAI mà user ĐÃ CHỌN (màu đỏ, có X)
                        label.classList.add('bg-red-50', 'border-red-300');
                        label.classList.remove('border-gray-200');
                        textSpan.classList.add('text-red-800');
                        
                        label.innerHTML += `<span class="text-red-500 ml-2 font-bold shrink-0">✗</span>`;
                    } else {
                        // Các đáp án sai khác không được chọn
                        label.classList.add('bg-gray-50', 'opacity-70');
                    }
                });
            });

            // Lưu điểm cao
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('sms_quiz_highscore', highScore);
                document.getElementById('highScoreDisplay').innerText = `Điểm cao: ${highScore}/40`;
            }

            // Hiển thị kết quả
            const scoreText = document.getElementById('score-text');
            scoreText.innerText = `${score} / 40`;
            scoreText.className = `text-3xl font-black ${score >= 32 ? 'text-green-600' : (score >= 20 ? 'text-yellow-600' : 'text-red-600')}`;
            
            document.getElementById('time-text').innerText = `Thời gian hoàn thành: ${formatTime(secondsElapsed)}`;
            document.getElementById('score-result').classList.remove('hidden');
            
            // Đổi nút bấm
            document.getElementById('btn-submit-top').classList.add('hidden');
            document.getElementById('btn-submit-bottom').classList.add('hidden');
            document.getElementById('btn-share').classList.remove('hidden');

            // Cuộn lên xem kết quả
            document.getElementById('tab-quiz').scrollTo({top: 0, behavior: 'smooth'});
        }

        function shareResult() {
            const score = document.getElementById('score-text').innerText;
            const time = formatTime(secondsElapsed);
            const textToShare = `📝 Kết quả sát hạch SMS (Nâng cao)\nĐiểm: ${score}\nThời gian: ${time}\nCảng HKQT Cần Thơ`;
            
            navigator.clipboard.writeText(textToShare).then(() => {
                showToast("Đã copy kết quả vào khay nhớ tạm!");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('toast-show');
            setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 2500);
        }

        // ================= 6. LOGIC TAB 2: ÔN TẬP =================
        function renderStudyData(dataToRender, highlightKeyword = '') {
            const container = document.getElementById('study-container');
            container.innerHTML = '';
            
            document.getElementById('search-count').innerText = `(${dataToRender.length} câu)`;

            if (dataToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-10">Không tìm thấy kết quả phù hợp.</div>`;
                return;
            }

            // Hàm bôi vàng từ khóa
            const markText = (text, keyword) => {
                if (!keyword) return text;
                const kwUnaccent = removeAccents(keyword).toLowerCase();
                const textUnaccent = removeAccents(text).toLowerCase();
                
                let result = '';
                let currentIndex = 0;
                let index = textUnaccent.indexOf(kwUnaccent, currentIndex);

                while (index !== -1) {
                    result += text.substring(currentIndex, index);
                    result += `<mark class="bg-yellow-300 text-black px-0.5 rounded">${text.substring(index, index + keyword.length)}</mark>`;
                    currentIndex = index + keyword.length;
                    index = textUnaccent.indexOf(kwUnaccent, currentIndex);
                }
                result += text.substring(currentIndex);
                return result;
            };

            let htmlString = '';
            dataToRender.forEach((q, index) => {
                const hlQuestion = markText(q.question, highlightKeyword);
                
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    const hlOption = markText(opt.text, highlightKeyword);
                    const prefix = String.fromCharCode(65 + optIndex) + '.'; // A. B. C. D.
                    
                    // Tối giản padding bên trong các đáp án hiển thị (từ p-3 xuống p-2/p-3)
                    if (opt.isCorrect) {
                        optionsHtml += `
                            <div class="border border-green-400 bg-green-50 rounded-lg p-2 sm:p-3 mb-1.5 flex justify-between items-start w-full">
                                <div class="flex items-start">
                                    <span class="font-bold text-gray-600 mr-2 shrink-0 w-5 sm:w-6">${prefix}</span>
                                    <span class="text-green-900 leading-snug text-sm sm:text-base">${hlOption}</span>
                                </div>
                                <span class="text-green-600 ml-2 font-bold shrink-0">✓</span>
                            </div>`;
                    } else {
                        optionsHtml += `
                            <div class="border border-gray-200 bg-white rounded-lg p-2 sm:p-3 mb-1.5 flex justify-between items-start w-full">
                                <div class="flex items-start">
                                    <span class="font-bold text-gray-500 mr-2 shrink-0 w-5 sm:w-6">${prefix}</span>
                                    <span class="text-gray-700 leading-snug text-sm sm:text-base">${hlOption}</span>
                                </div>
                            </div>`;
                    }
                });

                htmlString += `
                    <div class="bg-white rounded-lg border border-gray-200 p-2.5 sm:p-4 mb-2 shadow-sm">
                        <div class="font-bold text-gray-800 text-sm sm:text-base mb-2.5 flex gap-1">
                            <span class="whitespace-nowrap text-blue-700">Câu ${q.originalIndex || index + 1}:</span>
                            <span>${hlQuestion}</span>
                        </div>
                        <div class="flex flex-col">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = htmlString;
        }

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                // Khôi phục mảng ban đầu, gắn thêm index gốc để hiển thị số câu chính xác
                const restored = fullQuestionsData.map((q, i) => ({...q, originalIndex: i + 1}));
                renderStudyData(restored, '');
                return;
            }

            const searchKey = removeAccents(keyword).toLowerCase();
            const filtered = [];

            fullQuestionsData.forEach((q, i) => {
                const qTextUnaccent = removeAccents(q.question).toLowerCase();
                let matchFound = qTextUnaccent.includes(searchKey);
                
                if (!matchFound) {
                    for (let opt of q.options) {
                        if (removeAccents(opt.text).toLowerCase().includes(searchKey)) {
                            matchFound = true;
                            break;
                        }
                    }
                }

                if (matchFound) {
                    filtered.push({...q, originalIndex: i + 1});
                }
            });

            renderStudyData(filtered, keyword);
        }

        // ================= 7. KHỞI CHẠY =================
        window.onload = () => {
            initQuiz();
        };

    </script>
</body>
</html>
