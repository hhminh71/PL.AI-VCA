<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Tạo Sơ đồ Thư mục Google Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Tùy chỉnh thanh cuộn cho đẹp hơn */
        #file-tree::-webkit-scrollbar {
            width: 8px;
        }
        #file-tree::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #file-tree::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        #file-tree::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* CSS cho cây thư mục */
        .tree ul {
            padding-left: 20px;
            margin-left: 10px;
            border-left: 1px dashed #ccc;
        }
        .tree li {
            list-style-type: none;
            margin: 10px 0;
            position: relative;
        }
        .tree li::before {
            content: '';
            position: absolute;
            top: 0;
            left: -20px;
            width: 20px;
            height: 1em;
            border-bottom: 1px dashed #ccc;
        }
        .tree li:last-child::before {
             height: 1em; /* Điều chỉnh cho mục cuối cùng */
        }
        .tree li span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 2px 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-lg">
            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Tạo Sơ đồ Thư mục Google Drive</h1>
                <p class="text-gray-600 mt-2">Trực quan hóa toàn bộ cấu trúc thư mục và tệp tin của bạn một cách tự động.</p>
            </div>

            <!-- Khu vực điều khiển -->
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-6">
                <button id="authorize_button" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 shadow-md">
                    1. Ủy quyền Truy cập Google Drive
                </button>
                <button id="scan_button" class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 shadow-md" disabled>
                    2. Bắt đầu Quét & Tạo Sơ đồ
                </button>
            </div>

            <!-- Trạng thái -->
            <div id="status" class="text-center text-gray-500 mb-6 h-6"></div>

            <!-- Kết quả sơ đồ cây -->
            <div class="bg-gray-100 p-4 rounded-lg shadow-inner min-h-[300px] max-h-[60vh] overflow-auto">
                <div id="file-tree" class="tree">
                    <p class="text-gray-500 text-center pt-20">Sơ đồ nhánh sẽ xuất hiện ở đây sau khi quét...</p>
                </div>
            </div>
        </div>
        <footer class="text-center text-sm text-gray-500 mt-6">
            <p>Phát triển bởi Gemini. Cần có Client ID và API Key để hoạt động.</p>
        </footer>
    </div>

    <!-- Scripts của Google -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

    <script>
        // =========================================================================
        // THAY THẾ BẰNG THÔNG TIN CỦA BẠN TỪ GOOGLE CLOUD CONSOLE
        // Hướng dẫn lấy key: https://developers.google.com/drive/api/quickstart/js
        // =========================================================================
        const API_KEY = 'THAY_THẾ_BẰNG_API_KEY_CỦA_BẠN';
        const CLIENT_ID = 'THAY_THẾ_BẰNG_CLIENT_ID_CỦA_BẠN';
        
        // Phạm vi truy cập - chỉ đọc dữ liệu từ Drive
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

        // Lấy các phần tử DOM
        const authorizeButton = document.getElementById('authorize_button');
        const scanButton = document.getElementById('scan_button');
        const statusDiv = document.getElementById('status');
        const fileTreeDiv = document.getElementById('file-tree');

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        authorizeButton.onclick = handleAuthClick;
        scanButton.onclick = handleScanClick;

        /**
         * Được gọi khi thư viện GAPI client tải xong.
         */
        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        /**
         * Khởi tạo GAPI client cho Google Drive API.
         */
        async function initializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
            });
            gapiInited = true;
            maybeEnableButtons();
        }

        /**
         * Được gọi khi thư viện Google Identity Services (GIS) tải xong.
         */
        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // Sẽ được đặt lại khi gọi requestAccessToken
            });
            gisInited = true;
            maybeEnableButtons();
        }

        /**
         * Kích hoạt nút nếu cả hai thư viện đã sẵn sàng.
         */
        function maybeEnableButtons() {
            if (gapiInited && gisInited) {
                authorizeButton.disabled = false;
            }
        }

        /**
         * Xử lý khi nhấn nút ủy quyền.
         */
        function handleAuthClick() {
            statusDiv.innerText = 'Đang chờ ủy quyền...';
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    statusDiv.innerText = 'Lỗi ủy quyền. Vui lòng thử lại.';
                    throw (resp);
                }
                statusDiv.innerText = 'Ủy quyền thành công!';
                scanButton.disabled = false;
                authorizeButton.innerText = 'Đã Ủy quyền';
                authorizeButton.disabled = true;
                authorizeButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                authorizeButton.classList.add('bg-gray-400', 'cursor-not-allowed');
            };
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        /**
         * Xử lý khi nhấn nút quét.
         */
        async function handleScanClick() {
            scanButton.disabled = true;
            scanButton.innerText = 'Đang quét...';
            statusDiv.innerText = 'Bắt đầu quét Drive. Quá trình này có thể mất vài phút...';
            fileTreeDiv.innerHTML = '<p class="text-gray-500 text-center pt-20">Đang tải danh sách thư mục và tệp tin...</p>';

            try {
                const allFiles = await fetchAllFiles();
                statusDiv.innerText = `Đã tìm thấy ${allFiles.length} mục. Đang xây dựng sơ đồ...`;
                const tree = buildTree(allFiles);
                statusDiv.innerText = 'Hoàn thành! Hiển thị sơ đồ nhánh.';
                renderTree(tree, fileTreeDiv);
                scanButton.innerText = 'Quét Lại';
                scanButton.disabled = false;
            } catch (err) {
                console.error("Lỗi khi quét:", err);
                statusDiv.innerText = `Đã xảy ra lỗi: ${err.message}. Vui lòng xem console.`;
                fileTreeDiv.innerHTML = `<p class="text-red-500 text-center pt-20">Không thể tạo sơ đồ. Vui lòng kiểm tra lại API Key, Client ID và đảm bảo bạn đã cấp quyền truy cập.</p>`;
                scanButton.disabled = false;
                scanButton.innerText = 'Thử Lại';
            }
        }

        /**
         * Lấy tất cả các tệp và thư mục từ Google Drive, xử lý phân trang.
         */
        async function fetchAllFiles() {
            let allFiles = [];
            let pageToken = null;
            let pageCount = 0;
            const MAX_PAGES = 100; // Giới hạn để tránh vòng lặp vô tận

            do {
                pageCount++;
                if (pageCount > MAX_PAGES) {
                    console.warn("Đã đạt đến giới hạn số trang tối đa.");
                    break;
                }
                
                statusDiv.innerText = `Đang quét trang ${pageCount}...`;

                const response = await gapi.client.drive.files.list({
                    'pageSize': 1000,
                    'fields': 'nextPageToken, files(id, name, mimeType, parents)',
                    'q': "'me' in owners and trashed=false",
                    'pageToken': pageToken
                });

                if (response.result.files) {
                    allFiles = allFiles.concat(response.result.files);
                }
                pageToken = response.result.nextPageToken;
            } while (pageToken);

            return allFiles;
        }

        /**
         * Xây dựng cấu trúc cây từ danh sách phẳng các tệp và thư mục.
         */
        function buildTree(files) {
            const nodeMap = new Map();
            const tree = [];

            // Bước 1: Tạo một map cho tất cả các node và thêm mảng children
            files.forEach(file => {
                nodeMap.set(file.id, { ...file, children: [] });
            });

            // Bước 2: Liên kết các node con vào node cha
            files.forEach(file => {
                if (file.parents && file.parents.length > 0) {
                    const parentId = file.parents[0];
                    const parentNode = nodeMap.get(parentId);
                    const currentNode = nodeMap.get(file.id);
                    if (parentNode) {
                        parentNode.children.push(currentNode);
                    } else {
                        // Nếu không tìm thấy cha (có thể là thư mục được chia sẻ), coi nó là node gốc
                        tree.push(currentNode);
                    }
                } else {
                    // Node không có cha, đây là node gốc
                    tree.push(nodeMap.get(file.id));
                }
            });
            
            // Lọc ra các node gốc thực sự (những node không phải là con của bất kỳ node nào khác trong danh sách)
            const allChildIds = new Set();
            nodeMap.forEach(node => {
                 node.children.forEach(child => allChildIds.add(child.id));
            });

            return tree.filter(node => !allChildIds.has(node.id));
        }

        /**
         * Hiển thị cấu trúc cây ra HTML.
         */
        function renderTree(nodes, container) {
            container.innerHTML = ''; // Xóa nội dung cũ
            if (nodes.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center pt-20">Không tìm thấy tệp hoặc thư mục nào ở cấp gốc.</p>';
                return;
            }
            
            const ul = document.createElement('ul');
            container.appendChild(ul);

            // Sắp xếp: thư mục trước, tệp sau, cả hai đều theo thứ tự ABC
            nodes.sort((a, b) => {
                const aIsFolder = a.mimeType === 'application/vnd.google-apps.folder';
                const bIsFolder = b.mimeType === 'application/vnd.google-apps.folder';
                if (aIsFolder && !bIsFolder) return -1;
                if (!aIsFolder && bIsFolder) return 1;
                return a.name.localeCompare(b.name);
            });

            nodes.forEach(node => {
                const li = document.createElement('li');
                
                const icon = getIconForMimeType(node.mimeType);
                const nodeName = document.createElement('span');
                nodeName.innerHTML = `${icon} ${node.name}`;
                li.appendChild(nodeName);

                if (node.children && node.children.length > 0) {
                    renderTree(node.children, li); // Đệ quy
                }
                
                ul.appendChild(li);
            });
        }

        /**
         * Lấy icon emoji dựa trên loại MIME.
         */
        function getIconForMimeType(mimeType) {
            if (mimeType === 'application/vnd.google-apps.folder') {
                return '📁';
            }
            if (mimeType.startsWith('image/')) {
                return '🖼️';
            }
            if (mimeType.startsWith('video/')) {
                return '🎬';
            }
            if (mimeType.startsWith('audio/')) {
                return '🎵';
            }
            if (mimeType === 'application/pdf') {
                return '📄'; // Icon cho PDF
            }
            if (mimeType === 'application/vnd.google-apps.document') {
                return '📝'; // Google Docs
            }
            if (mimeType === 'application/vnd.google-apps.spreadsheet') {
                return '📊'; // Google Sheets
            }
            if (mimeType === 'application/vnd.google-apps.presentation') {
                return '💻'; // Google Slides
            }
            if (mimeType.includes('zip') || mimeType.includes('rar')) {
                return '🗜️';
            }
            return '📎'; // Tệp tin chung
        }
    </script>

</body>
</html>
