# THÔNG TƯ SỐ 34/2026/TT-BXD: QUY ĐỊNH CHI TIẾT VỀ CẤP CÔNG TRÌNH XÂY DỰNG
## 1. Tổng quát về Hệ thống Pháp lý
### Khung Pháp lý (Luật Xây dựng số 135/2025/QH15)
#### Hệ thống 06 Nghị định chi tiết (Chính phủ)
- Nghị định 206/2026/NĐ-CP: Quản lý chi phí đầu tư xây dựng
- Nghị định 207/2026/NĐ-CP: Quản lý chất lượng, thi công và bảo trì
- Nghị định 209/2026/NĐ-CP: Quản lý vật liệu xây dựng
- Nghị định 210/2026/NĐ-CP: Hợp đồng xây dựng
- Nghị định 212/2026/NĐ-CP: Điều kiện năng lực, Hệ thống thông tin, CSDL
- Nghị định 217/2026/NĐ-CP: Quản lý hoạt động xây dựng
#### Hệ thống 01 Thông tư (Bộ Xây dựng)
- Thông tư 34/2026/TT-BXD: Cấp công trình xây dựng (theo điểm a khoản 2 Điều 6)
### Cơ sở xây dựng Thông tư 34/2026/TT-BXD
#### Nền tảng kế thừa
- Kế thừa Thông tư số 06/2021/TT-BXD
- Kế thừa Thông tư số 02/2025/TT-BXD
#### Mục tiêu sửa đổi, bổ sung
- Thống nhất với Luật Xây dựng và 06 Nghị định mới
- Phù hợp với các Luật chuyên ngành: Hóa chất, Năng lượng nguyên tử, Đường sắt, Hàng không dân dụng, Giáo dục...
- Giải quyết vướng mắc thực tiễn quản lý
- Cập nhật các ví dụ hướng dẫn chi tiết
### Cấu trúc Thông tư 34/2026/TT-BXD
- Điều 1: Phạm vi điều chỉnh và đối tượng áp dụng
- Điều 2: Nguyên tắc xác định cấp công trình
- Điều 3: Áp dụng cấp công trình trong quản lý
- Điều 4: Hiệu lực thi hành
- Điều 5: Điều khoản chuyển tiếp
- Phụ lục I: Phân cấp theo mức độ quan trọng / quy mô công suất
- Phụ lục II: Phân cấp theo quy mô kết cấu
- Phụ lục III: 16 Ví dụ xác định và áp dụng thực tế

## 2. Chi tiết Nội dung & Các Điểm mới
### Phạm vi & Đối tượng (Điều 1)
- Áp dụng cho: Cơ quan, tổ chức, cá nhân trong nước và nước ngoài có hoạt động xây dựng tại Việt Nam
### Nguyên tắc xác định cấp công trình (Điều 2)
#### Tiêu chí cốt lõi (Khoản 1)
- Mức độ quan trọng & Quy mô công suất (Theo Phụ lục I)
- Quy mô kết cấu (Theo Phụ lục II)
#### Áp dụng cho Công trình & Tổ hợp (Khoản 2 & 3)
- Công trình độc lập: Xác định theo Phụ lục I và/hoặc II
- Tổ hợp/Dây chuyền: Áp dụng theo loại công trình quy định tại Phụ lục I
#### Trường hợp Cải tạo, Mở rộng (Khoản 4 - ĐIỂM MỚI)
- Có làm thay đổi tiêu chí (Quy mô/Công suất/Kết cấu): Xác định lại cấp công trình mới
- Không làm thay đổi tiêu chí: Giữ nguyên cấp công trình hiện hữu
- Phân biệt rõ: Mở rộng công trình hiện hữu KHÁC VỚI xây mới công trình độc lập trên cùng khu đất
- Chỉ cải tạo kiến trúc: Không thay đổi cấp công trình
#### Trường hợp Xây mới có kết cấu độc lập (Khoản 5 - ĐIỂM MỚI)
- Điều kiện: Nằm ngoài phân kỳ đầu tư của dự án hiện hữu
- Xác định: Chỉ tính theo tiêu chí của công trình xây mới
#### Trường hợp Phân kỳ đầu tư / Dự án thành phần (Khoản 6)
- Điều kiện: Không phải dự án thành phần độc lập
- Xác định: Áp dụng mức của "Giai đoạn kết thúc xây dựng" toàn dự án
### Ứng dụng trong Quản lý HĐXD (Điều 3)
#### Quản lý chung (Khoản 1)
- Thẩm quyền: Thẩm định NCKT, Nghiệm thu thi công, Cấp phép (MỚI), Cho ý kiến công nghệ mới (MỚI)
- Yêu cầu bắt buộc: Miễn GPXD, Thi tuyển kiến trúc, Lập chỉ dẫn kỹ thuật, Bảo hiểm trách nhiệm, Quy trình bảo trì
- Áp dụng công nghệ: Yêu cầu áp dụng BIM và Công nghệ số cho công trình xây mới (MỚI)
- Điều kiện nhân sự (SỬA ĐỔI): Mức kinh nghiệm cho KS, Thiết kế, Giám sát, QLDA, Chỉ huy trưởng
- Xử lý hết hạn: Xử lý công trình hết hạn sử dụng (MỚI)
#### Xử lý theo Dự án (Khoản 2 & 3)
- Dự án 1 công trình độc lập: Theo cấp công trình đó
- Dự án nhiều công trình/tuyến: Theo công trình chính có cấp cao nhất
- ĐIỂM MỚI về Thẩm quyền cấp GPXD: Bỏ áp dụng "công trình chính cấp cao nhất" khi xác định thẩm quyền cấp phép (tuân thủ Điều 53 NĐ 217/2026/NĐ-CP)
#### Ngoại trừ (Khoản 5 - ĐIỂM MỚI)
- Không áp dụng tính cấp công trình cho: Sửa chữa, thay thế thiết bị, bảo dưỡng KHÔNG làm thay đổi kết cấu chịu lực
### Hiệu lực & Chuyển tiếp (Điều 4 & 5)
#### Thời gian áp dụng
- Hiệu lực chính thức: Từ ngày 01/07/2026
- Bãi bỏ: TT 06/2021, TT 02/2025, Điều 10 TT 09/2025
#### Xử lý chuyển tiếp
- Quyết định đầu tư trước 01/07/2026: Dùng luật thời điểm đó
- Đã trình thẩm định (đủ điều kiện) trước 01/07/2026: Dùng luật thời điểm trình
- Không đủ điều kiện thẩm định/phê duyệt: Bắt buộc dùng TT 34/2026
- Điều chỉnh thiết kế sau 01/07/2026: Đổi tiêu chí -> Dùng TT 34/2026; Không đổi tiêu chí -> Dùng luật cũ

## 3. Cập nhật Phụ lục I & II (Mức độ, Công suất & Kết cấu)
### Cập nhật đồng bộ các Luật (2025-2026)
- Tương thích với Luật số: 69 (Hóa chất), 94 (NL Nguyên tử), 95 (Đường sắt), 130 (Hàng không), 123/124/125 (Giáo dục)
- Phù hợp Nghị định 53/2026/NĐ-CP (Đê điều & Thiên tai)
### Phụ lục I - Điểm mới Mức độ/Công suất
- Công nghiệp: Cập nhật đường hầm thủy điện Lai Châu (1.2.6.2), Tinh dầu hồ tiêu (1.2.4.7)
- Năng lượng: Bổ sung cơ sở hạt nhân (1.1.8 & 1.2.8)
- Hạ tầng: Bổ sung công trình cấp nước, xử lý nước thải quy mô lớn (1.3)
- Giao thông: Cập nhật phân cấp công trình đường sắt (1.4.2)
- Nông nghiệp/Môi trường: Sửa tên mục 1.5.1.6.2, bãi bỏ 1.5.1.7
### Phụ lục II - Điểm mới Quy mô kết cấu
- Yêu cầu PCCC: Bổ sung tiêu chí chiều cao PCCC cho nhóm F1.2, F1.3, F4.2, F4.3 và nhà hỗn hợp > 150m (Theo QCVN 06:2022/BXD)
- Cầu đường bộ: Điều chỉnh tiêu chí chiều cao trụ cầu (Mục 2.5.1) và cách xác định chiều cao (điểm đ mục 3 Ghi chú)

## 4. Phụ lục III - 16 Ví dụ Thực tế
### Nhóm Dân dụng
- Trường THPT
- Bệnh viện Đa khoa
- Khu phức hợp
### Nhóm Công nghiệp
- Nhà máy xi măng
- Công trình Thủy điện
- Nhà máy Cơ khí
### Nhóm Hạ tầng - Giao thông
- Tháp truyền hình, Nhà máy nước, Nhà/Bãi đỗ xe
- Tuyến cao tốc (có ví dụ phân kỳ 2 giai đoạn)
- Ga đường sắt, Hàng không, Hải đăng
### Nhóm Nông nghiệp & Mở rộng
- Trang trại
- Xây mới độc lập: Khoa khám bệnh/điều trị yêu cầu trong BV Đa khoa hiện hữu

    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
