<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCA Visualizer - Phòng TC-KH</title>
<style>
    /* --- CẤU HÌNH GIAO DIỆN VCA (ACV STYLE) --- */
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; display: flex; flex-direction: column;}
    
    /* Header */
    .vca-header {
        background: #0056b3; /* Xanh ACV */
        color: white;
        padding: 12px 20px;
        border-bottom: 4px solid #d4af37; /* Vàng Gold */
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        flex-shrink: 0;
    }
    .vca-top { font-size: 11px; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }
    .vca-title { font-size: 18px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .vca-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}

    /* Main Container */
    .main-area { flex-grow: 1; position: relative; overflow: hidden; }
    
    /* Mindmap container - Full Size */
    .markmap { width: 100%; height: 100vh; }

    /* Footer */
    .vca-footer { 
        background: #e9ecef; color: #555; text-align: center; 
        padding: 5px; font-size: 11px; flex-shrink: 0; border-top: 1px solid #ddd;
    }
</style>
<style>.markmap-node-text { font-family: 'Segoe UI'; font-size: 14px; fill: #333; }</style>
</head>
<body>

    <div class="vca-header">
        <div class="vca-top">Tổng công ty Cảng hàng không Việt Nam - CTCP</div>
        <div class="vca-title">Cảng hàng không quốc tế Cần Thơ</div>
        <div class="vca-badge">Phòng Tài chính - Kế hoạch | Triển khai văn bản</div>
    </div>

    <div class="main-area">
        <div class="markmap">
            <script type="text/template">
# NGHỊ ĐỊNH 287/2025/NĐ-CP<br>Quản lý tài sản KCHT Hàng không
## 1. Quy định chung
### Phạm vi điều chỉnh
- Quản lý, khai thác TS KCHT do Nhà nước đầu tư
- *(Không bao gồm: TS Quốc phòng, Trụ sở CQNN...)*
### Danh mục tài sản (Điều 3)
- Công trình bảo đảm bay
- Kết cấu hạ tầng sân bay (Khu bay: đường băng, sân đỗ...)
- Nhà ga hành khách, hàng hóa, logistics...
### Nguyên tắc (Điều 4)
- Thống kê, kế toán đầy đủ (Hiện vật & Giá trị)
- Tính hao mòn, khấu hao, bảo trì theo luật định

## 2. Giao quản lý tài sản (ACV/VATM)
### Các hình thức giao
- **Tính thành vốn Nhà nước:** Công trình bảo đảm bay (VATM); Nhà ga, hạ tầng ngoài khu bay (ACV)
- **Không tính thành vốn Nhà nước:** Hạ tầng khu bay (ACV)
### Thẩm quyền & Chuyển đổi
- Bộ trưởng Bộ Xây dựng quyết định giao
- Có quy trình chuyển đổi từ "Không tính vốn" sang "Tính vốn"

## 3. Kế toán & Khai thác (Trọng tâm TC-KH)
### Kế toán tài sản (Điều 10)
- Mở sổ kế toán, báo cáo tăng/giảm, hao mòn
- **Nguyên giá:** Lấy theo giá quyết toán, hoặc thuê thẩm định giá nếu chưa có
### Bảo trì (Điều 11)
- Kinh phí do Ngân sách Nhà nước (NSNN) đảm bảo
- *Sự cố khẩn cấp:* ACV ứng trước kinh phí từ nguồn thu khai thác, sau đó hoàn trả từ NSNN
### Khai thác & Doanh thu (Điều 13-15)
- ACV trực tiếp tổ chức cung cấp dịch vụ
- **Nộp NSNN:** Nguồn thu sau khi trừ chi phí trực tiếp & gián tiếp
- **Thời hạn nộp:** Hàng quý (ngày 15 tháng đầu quý sau) & Quyết toán năm (trong vòng 90 ngày)

## 4. Xử lý tài sản
### Các hình thức (Điều 16)
- Thu hồi / Điều chuyển / Chuyển giao địa phương
- Thanh lý (Phá dỡ, hủy bỏ, xử lý vật tư)
- Xử lý tài sản mất/hủy hoại do thiên tai, sự cố
### Tài chính khi xử lý (Điều 22)
- Toàn bộ tiền thu (bán vật tư, bảo hiểm bồi thường...) nộp NSNN
- Được trừ các chi phí: Kiểm kê, tháo dỡ, thẩm định giá...

## 5. Báo cáo & CSDL
### Chế độ báo cáo (Điều 24)
- **Báo cáo kê khai:** Trong 30 ngày kể từ khi có biến động/nhận tài sản
- **Báo cáo định kỳ hằng năm:** Gửi Bộ Xây dựng trước ngày 28/02 năm sau
### Cơ sở dữ liệu (Điều 25)
- ACV có trách nhiệm nhập, duyệt dữ liệu vào CSDL về TS KCHT Hàng không
            </script>
