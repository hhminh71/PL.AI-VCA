<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCA Visualizer - Phòng TC-KH</title>
<style>
    /* --- CẤU HÌNH GIAO DIỆN VCA (ACV STYLE) --- */
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; display: flex; flex-direction: column;}
    
    /* Header */
    .vca-header {
        background: #0056b3; /* Xanh ACV */
        color: white;
        padding: 12px 20px;
        border-bottom: 4px solid #d4af37; /* Vàng Gold */
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        flex-shrink: 0;
    }
    .vca-top { font-size: 11px; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }
    .vca-title { font-size: 18px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .vca-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}

    /* Main Container */
    .main-area { flex-grow: 1; position: relative; overflow: hidden; }
    
    /* Mindmap container - Full Size */
    .markmap { width: 100%; height: 100vh; }

    /* Footer */
    .vca-footer { 
        background: #e9ecef; color: #555; text-align: center; 
        padding: 5px; font-size: 11px; flex-shrink: 0; border-top: 1px solid #ddd;
    }
</style>
<style>.markmap-node-text { font-family: 'Segoe UI'; font-size: 14px; fill: #333; }</style>
</head>
<body>

    <div class="vca-header">
        <div class="vca-top">Tổng công ty Cảng hàng không Việt Nam - CTCP</div>
        <div class="vca-title">Cảng hàng không quốc tế Cần Thơ</div>
        <div class="vca-badge">Phòng Tài chính - Kế hoạch | Triển khai văn bản</div>
    </div>

    <div class="main-area">
        <div class="markmap">
            <script type="text/template">
# <b>VB 251/PCKTNB</b><br>Phổ biến NĐ 287/2025/NĐ-CP
## 1. Tổng quan Pháp lý
- <b>Văn bản gốc:</b> Nghị định 287/2025/NĐ-CP (Chính phủ)
- <b>Ngày ban hành:</b> 05/11/2025
- <b>Hiệu lực:</b> 01/01/2026
- <b>Thay thế:</b> Nghị định 44/2018/NĐ-CP
- <b>Nội dung:</b> 5 Chương, 29 Điều về QL, SD & Khai thác KCHT Hàng không
## 2. Phân loại Tài sản (Điều 3)
- <b>Nhóm Khu bay (Zone B):</b> Đường băng, đường lăn, sân đỗ, PCCC
- <b>Nhóm Thương mại (Zone E):</b> Nhà ga (khách/hàng hóa), kho bãi, logistics
- <b>Hạ tầng kỹ thuật:</b> Điện, nước, chiếu sáng, giao thông nội cảng
- <b>Đặc thù:</b> TS liên quan Quốc phòng & An ninh quốc gia
## 3. Cơ chế Tài chính & Giao vốn (Điều 5)
- <b>KHÔNG tính thành phần vốn NN</b>
    - <i>Đối tượng:</i> Tài sản Khu bay, An ninh hàng không
    - <i>Sở hữu:</i> Nhà nước nắm giữ -> Giao DN quản lý/khai thác
    - <i>Bảo trì:</i> Ngân sách Nhà nước đảm bảo
    - <i>Quy định cấm:</i> Không cho thuê, thế chấp, góp vốn
- <b>TÍNH thành phần vốn NN tại DN</b>
    - <i>Đối tượng:</i> Nhà ga, kho hàng, khu logistics
    - <i>Sở hữu:</i> Hạch toán tăng vốn chủ sở hữu NN tại DN
    - <i>Bảo trì:</i> Doanh nghiệp tự chịu trách nhiệm
    - <i>Quyền khai thác:</i> Được kinh doanh, cho thuê, liên doanh
## 4. Quản lý & Điều chuyển (Điều 18, 19)
- <b>Thẩm quyền quyết định:</b> Bộ Xây dựng
- <b>Điều chuyển nội bộ/Bộ ngành:</b> Khi thay đổi đối tượng quản lý hoặc mục đích QP-AN
- <b>Chuyển về Địa phương:</b>
    - DN không còn nhu cầu sử dụng
    - TS bị loại khỏi quy hoạch Cảng HK, sân bay
## 5. Điều khoản chuyển tiếp (Điều 27)
- <b>Với TS theo QĐ 2007/QĐ-TTg:</b>
    - Tiếp tục cơ chế cũ đến hết năm **2026**
    - Không phải làm lại thủ tục giao trong giai đoạn này
- <b>Định giá tài sản:</b>
    - Phải hoàn thành trong **06 tháng** (nếu chưa có giá trị kế toán)
    - Thực hiện hạch toán theo pháp luật kế toán
            </script>
        </div>
    </div>

    <div class="vca-footer">
        Hệ thống hỗ trợ triển khai văn bản nội bộ - VCA
    </div>

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.4"></script>

</body>
</html>
