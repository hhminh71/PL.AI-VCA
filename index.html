    <style>
        /* Tối ưu vùng nhìn: line-height nhỏ, font gọn */
        body {

            line-height: 1.2;
            background-color: #f1f5f9; /* slate-100 */
        }
        
        /* Ẩn thanh cuộn nhưng vẫn cho phép cuộn */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Custom Radio Button ẩn đi, style trên label */
        .quiz-radio { display: none; }
        .quiz-label {
            display: flex;
            align-items: flex-start;
            padding: 8px 10px;
            margin-bottom: 4px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .quiz-radio:checked + .quiz-label {
            background-color: #eff6ff; /* blue-50 */
            border-color: #3b82f6; /* blue-500 */
            font-weight: 500;
        }
        .quiz-radio:disabled + .quiz-label {
            cursor: not-allowed;
        }

        /* Highlight tìm kiếm */
        mark {
            background-color: #fde047; /* yellow-300 */
            font-weight: bold;
            color: #000;
            padding: 0 2px;
            border-radius: 2px;
        }

        /* SVG Icons Inline */
        .icon-check { color: #16a34a; margin-left: 6px; flex-shrink: 0; }
        .icon-cross { color: #dc2626; margin-left: 6px; flex-shrink: 0; }

        const rawData = `ĐỊNH KỲ HỆ THỐNG QUẢN LÝ AN TOÀN SMS-003 – NĂM 2025 (50 câu)
Câu 1: Quy định nhà cung cấp dịch vụ phải xây dựng Hệ thống quản lý an toàn được quy định trong:
a. Annex 1
b. Annex 19
c. Annex 2
d. Tất cả tài liệu trên

Câu 2: Chương trình an toàn quốc gia do ai ban hành
a. Bộ Xây dựng
b. ICAO
c. Cảng vụ hàng không
d. Đơn vị cung cấp dịch vụ
Đáp án: a. Bộ Xây dựng
Câu 3: Nhận diện mối nguy có mấy phương pháp?
a. Phân tích các bước của quá trình để nhận diện mối nguy (bottom up)
b. Phân tích các nguyên nhân gây ra các hậu quả trong quá trình hoạt động để nhận diện mối nguy (top down)
c. Cả a và b
d. Tất cả đều sai
Đáp án: c. Cả a và b
Câu 4: Cấu trúc Chương trình an toàn quốc gia theo yêu cầu của ICAO gồm
a. Chính sách và mục tiêu an toàn quốc gia
b. Chương trình quản lý rủi ro an toàn
c. Bảo đảm an toàn quốc gia, Thúc đẩy an toàn quốc gia
d. Tất cả yếu tố trên
Đáp án: d. Tất cả yếu tố trên
Câu 5: Theo yêu cầu của ICAO, Thành phần đảm bảo an toàn gồm những yếu tố nào:
a. Giám sát và đo lường an toàn, Quản lý sự thay đổi, Liên tục cải tiến hệ thống
b. Nhận diện và đánh giá rủi ro, Cam kết của lãnh đạo, Quyền hạn và trách nhiệm an toàn

Đáp án: a. Giám sát và đo lường an toàn, Quản lý sự thay đổi, Liên tục cải tiến hệ thống

a. Xử lý điểm không phù hợp ngay lúc phát hiện
b. Xử lý nguyên nhân gốc rễ
c. Xử lý điểm không phù hợp, tìm nguyên nhân gốc rễ và đề xuất biện pháp khắc phục

Câu 7: Định nghĩa nào đúng
a. Quá trình là một hoạt động biến đổi đầu vào thành đầu ra
b. Quá trình là một hoạt động không có đầu ra
c. Quy trình là mô tả các hoạt động của một quá trình
d. Cả a và c đều đúng
Đáp án: d. Cả a và c đều đúng
Câu 8: Các yêu cầu về việc triển khai Hệ thống quản lý an toàn trong Annex 19 áp dụng trong lĩnh vực nào:
a. Đảm bảo chất lượng dịch vụ
b. Đảm bảo an toàn trong lĩnh vực hàng không
c. Đảm bảo an toàn trong lĩnh vực hàng hải
d. Tất cả lĩnh vực trên
Đáp án: b. Đảm bảo an toàn trong lĩnh vực hàng không
Câu 9: Trách nhiệm an toàn của Ban giám đốc cảng thể hiện ở tài liệu nào:
a. Tài liệu Hệ thống quản lý an toàn được Cục hàng không Việt Nam phê duyệt

c. Quyết định phân công nhiệm vụ của Ban giám đốc.
d. Tất cả các yếu tố trên
Đáp án: d. Tất cả các yếu tố trên
Câu 10: Chi số an toàn được xác định như thế nào
a. Dựa vào các rủi ro an toàn của cảng đang muốn kiểm soát
b. Theo chương trình an toàn quốc gia
c. Cả a và b đều đúng
d. Tất cả đều sai
Đáp án: c. Cả a và b đều đúng
Câu 11: Mục đích của việc xây dựng Hệ thống SMS là:
a. Nhận diện các mối nguy trong quá trình hoạt động cung cấp dịch vụ của cảng để đảm bảo đạt mức độ an toàn chấp nhận được và chuyển viêc quản lý an toàn từ bị động sang chủ động
b. Phục vụ cho việc lưu trữ hồ sơ hệ thống của tổ chức
c. Thỏa mãn nhu cầu khách hàng, luật định
d. Thỏa mãn yêu cầu của các hãng hàng không
Đáp án: a. Nhận diện các mối nguy trong quá trình hoạt động cung cấp dịch vụ của cảng để đảm bảo đạt mức độ an toàn chấp nhận được và chuyển viêc quản lý an toàn từ bị động sang chủ động
Câu 12: Nguồn để xác định mối nguy hiểm, bao gồm:
a. Các báo cáo thông báo sự cố cũng như quá trình điều tra
b. Hệ thống báo cáo tự nguyện
c. Khảo sát định kỳ mối nguy hiểm đối với các trang thiết bị an toàn hàng không; đánh giá an toàn/chất lượng định kỳ; đánh giá hệ thống thu thập dữ liệu hoạt động định kỳ
d. Tất cả các câu trên
Đáp án: d. Tất cả các câu trên
Câu 13: Mối nguy là:
a. Hậu quả, thiệt hại về người và tài sản, giảm mức độ an toàn của Hệ thống
b. Điều kiện hoặc đối tượng có thể gây ra những thiệt hại người, tài sản, giảm mức độ an toàn hệ thống
c. Các yêu cầu của Annex 19
d. Tất cả đều đúng
Đáp án: b. Điều kiện hoặc đối tượng có thể gây ra những thiệt hại người, tài sản, giảm mức độ an toàn hệ thống
Câu 14: Khi đánh giá rủi ro hiện tại ở mức Trung bình tổ chức cần thực hiện các hành động gì?
a. Tiến hành nhận diện mối nguy, đánh giá rui ro lại
b. Bổ sung các biện pháp kiểm soát rủi ro tăng cường
c. Chấm dứt hoạt động
d. Chấp nhận mối nguy trên tồn tại trong hoạt động của tổ chức.
Đáp án: b. Bổ sung các biện pháp kiểm soát rủi ro tăng cường
Câu 15: Sự cố tàu bay gặp hư hỏng do FOD trong năm 2022 là 0.8/10000 lần chc. Trong năm 2023 tổ chức muốn giảm 10% giá trị thực hiện năm 2018. Vậy
a. Chỉ tiêu an toàn 0.8/10000 lần chc
b. Chỉ tiêu an toàn 0.72/10000 lần chc
c. Chỉ tiêu an toàn giảm 8.4/100000 lần chc
d. Tất cả đều sai
Đáp án: b. Chỉ tiêu an toàn 0.72/10000 lần chc
Câu 16: Mục đích đánh giá nội bộ trong Hệ thống SMS - QMS
a. Nhận diện các mối nguy đang tồn tại hiện hữu/ tiềm ẩn trong Hệ thống
b. Xác định các khu vực cần cải tiến
c. Xác định kế hoạch phân bổ nguồn lực
d. Tất cả yếu tố trên

Câu 17: Quá trình xem xét kỷ luật công bằng cần xem xét các yếu tố
a. Hồ sơ ghi nhận các hành vi gây mất an toàn của cá nhân trước đây

c. Ý định của cá nhân liên quan đến hành vi không phù hợp
d. Tất cả yếu tố trên

Câu 18: Quản lý sự thay đổi được triển khai thực hiện đối với các thay đổi nào
a. Thay đổi về luật định, quy định
b. Thay đổi quy trình, quá trình, phương án khai thác
c. Thay đổi cơ sở hạ tầng, trang thiết bị
d. Tất cả yếu tố trên.
Đáp án: d. Tất cả yếu tố trên.
Câu 19: Phải có hành động khắc phục khi đường biểu diễn các chỉ số an toàn trong năm hiện tại:

b. 2 điểm liên tiếp nằm trên cảnh báo mức 2
c. 1 điểm nằm trên đường cảnh báo mức 3
d. Tất cả yếu tố trên.
Đáp án: d. Tất cả yếu tố trên.
Câu 20: Theo yêu cầu của ICAO, Thành phần thúc đẩy an toàn gồm những yếu tố nào:
a. Huấn luyện và đào tạo, phổ biến về an toàn
b. Nhận diện mối nguy, đánh giá rủi ro
c. Đánh giá nội bộ
d. Tất cả yếu tố trên.
Đáp án: a. Huấn luyện và đào tạo, phổ biến về an toàn
Câu 21: Các bộ phận chính cấu thành SSP gồm:
a. Hội đồng kiểm soát rủi ro an toàn hàng không (ASMRC)
b. Bộ phận thu thập và phân tích sự cố an toàn hàng không (ASICA)

Câu 22: “Đường cất hạ cánh bị hư hỏng một vị trí, Đội bảo trì Cảng hàng không X tiến hành trám vá và thông báo cho ATC là đường CHC đủ điều kiện đưa vào khai thác. Một lúc sau, Tàu bay hạ cánh vào khu vực trám và một điểm trám vá và làm bê tông tại khu vực trám vá bị bong tróc va chạm gây hư hỏng động cơ tàu bay. Sau đó tàu bay được kéo về xưởng để thay thế động cơ” Mối nguy cụ thể trong tình huống trên được nhận diện.

c. Cả a và b

Câu 25: Hệ thống báo cáo an toàn bao gồm

        // ==========================================
        // 2. LOGIC XỬ LÝ CHUNG & PARSE DỮ LIỆU
        // ==========================================
        
        let questionBank = [];
        let isReviewRendered = false; // FLAG QUAN TRỌNG ĐỂ FIX BUG TAB TRẮNG
        
        // Hàm loại bỏ dấu tiếng Việt để tìm kiếm
        const removeAccents = (str) => {
            return str.normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .replace(/đ/g, 'd').replace(/Đ/g, 'D');
        };

        // Hàm xáo trộn mảng (Fisher-Yates)
        const shuffleArray = (array) => {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        };

        // Thuật toán parse Raw Text thành Array Objects
        const parseQuestions = () => {
            const lines = rawData.split('\n').map(l => l.trim()).filter(l => l !== '');
            let currentQ = null;
            let currentId = 1;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                if (line.includes('ĐỊNH KỲ HỆ THỐNG')) continue; // Bỏ qua tiêu đề file

                // Bắt đầu một câu hỏi mới
                if (/^Câu\s+\d+:/.test(line)) {
                    if (currentQ) questionBank.push(currentQ);
                    
                    let qText = line.replace(/^Câu\s+\d+:\s*/, '');
                    currentQ = {
                        id: currentId++,
                        originalQName: line.match(/^Câu\s+\d+:/)[0],
                        question: qText,
                        options: [],
                        answerText: ''
                    };
                } 
                // Bắt các lựa chọn a, b, c, d
                else if (/^[a-d]\./i.test(line)) {
                    if (currentQ) {
                        currentQ.options.push({
                            char: line.substring(0, 1).toLowerCase(), // a,b,c,d
                            text: line.substring(line.indexOf('.') + 1).trim(),
                            isCorrect: false
                        });
                    }
                } 
                // Bắt đáp án
                else if (/^Đáp án:/i.test(line)) {
                    if (currentQ) {
                        currentQ.answerText = line.replace(/^Đáp án:\s*/i, '').trim();
                        // Trích xuất ký tự đáp án đúng (a, b, c, d) từ chuỗi "a. Nội dung..."
                        let correctCharMatch = currentQ.answerText.match(/^[a-d]/i);
                        if (correctCharMatch) {
                            let correctChar = correctCharMatch[0].toLowerCase();
                            currentQ.options.forEach(opt => {
                                if (opt.char === correctChar) opt.isCorrect = true;
                            });
                        }
                    }
                } 
                // Nối chuỗi nếu câu hỏi bị rớt dòng (nhiều dòng)
                else {
                    if (currentQ && currentQ.options.length === 0) {
                        currentQ.question += ' ' + line;
                    }
                }
            }
            if (currentQ) questionBank.push(currentQ);
        };

        // SVG Icons

        const svgCross = `<svg class="w-5 h-5 icon-cross" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;

                let html = `
                    <div class="bg-white rounded-md p-3 mb-3 shadow-sm border border-slate-200" id="q-block-${index}">
                        <h3 class="font-bold text-slate-800 mb-2 text-[0.95rem]">
                            <span class="text-blue-600">Câu ${index + 1}:</span> ${q.question}
                        </h3>
                        <div class="flex flex-col">
                            ${qOptions.map((opt, optIdx) => `
                                <input type="radio" name="q_${index}" id="q_${index}_opt_${optIdx}" value="${opt.isCorrect}" class="quiz-radio">
                                <label for="q_${index}_opt_${optIdx}" class="quiz-label" id="label_q_${index}_opt_${optIdx}">
                                    <span class="font-bold mr-2 text-slate-500">${String.fromCharCode(65 + optIdx)}.</span> 
                                    <span class="flex-1">${opt.text}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });

            // Start timer
            quizTimerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        };

        const submitQuiz = () => {
            if (isQuizSubmitted) return;
            isQuizSubmitted = true;
            clearInterval(quizTimerInterval);

            finalScore = 0;

            currentQuizQuestions.forEach((q, index) => {
                const radios = document.getElementsByName(`q_${index}`);
                let answeredCorrectly = false;
                
                radios.forEach((radio) => {
                    const label = document.getElementById(`label_${radio.id}`);
                    const isCorrect = radio.value === "true";
                    
                    radio.disabled = true; // Khóa lựa chọn

                    if (radio.checked) {
                        if (isCorrect) {
                            answeredCorrectly = true;
                            label.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                            label.classList.remove('bg-f8fafc');
                            label.innerHTML += svgCheck;
                        } else {
                            label.classList.add('bg-red-50', 'border-red-400', 'text-red-800');
                            label.classList.remove('bg-f8fafc', 'peer-checked:bg-blue-100');
                            label.innerHTML += svgCross;
                        }
                    }

                    // Luôn hiển thị đáp án đúng nếu người dùng chọn sai hoặc không chọn
                    if (isCorrect && !radio.checked) {
                        label.classList.add('bg-green-50', 'border-green-300', 'text-green-700');
                        label.innerHTML += svgCheck;
                    }
                });

                if (answeredCorrectly) finalScore++;
            });

            // Update UI
            document.getElementById('result-text').textContent = `Kết quả: ${finalScore}/40`;
            document.getElementById('btn-submit-top').classList.add('hidden');
            document.getElementById('btn-submit-bottom').classList.add('hidden');
            document.getElementById('btn-share').classList.remove('hidden');
            
            saveHighScore(finalScore);
            
            // Cuộn xuống xem kết quả
            document.getElementById('tab-quiz').scrollTop = document.getElementById('tab-quiz').scrollHeight;
        };

        const shareResult = () => {
            const textToCopy = `✅ Sát hạch SMS-003\n🎯 Điểm số: ${finalScore}/40\n⏱️ Thời gian: ${timeStringForShare}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("Đã copy kết quả vào khay nhớ tạm!");
            }).catch(err => {
                showToast("Lỗi khi copy!");
            });
        };

        // ==========================================
        // 4. LOGIC ÔN TẬP (REVIEW)
        // ==========================================

        // Thuật toán highlight text (Bỏ qua dấu tiếng việt)
        const highlightHTML = (text, keyword) => {
            if (!keyword.trim()) return text;
            const textNorm = removeAccents(text).toLowerCase();
            const kwNorm = removeAccents(keyword.trim()).toLowerCase();
            
            if (!textNorm.includes(kwNorm)) return text;

            let result = '';
            let lastIndex = 0;
            let i = 0;

            while ((i = textNorm.indexOf(kwNorm, lastIndex)) !== -1) {
                result += text.substring(lastIndex, i);
                result += `<mark>` + text.substring(i, i + kwNorm.length) + `</mark>`;
                lastIndex = i + kwNorm.length;
            }
            result += text.substring(lastIndex);
            return result;
        };

        const renderReview = (filterText = '') => {
            const container = document.getElementById('review-container');
            const kwNorm = removeAccents(filterText).toLowerCase();
            
            // Filter dữ liệu
            const filteredData = questionBank.filter(q => {
                if (!filterText) return true;
                const matchQ = removeAccents(q.question).toLowerCase().includes(kwNorm);
                const matchOpts = q.options.some(o => removeAccents(o.text).toLowerCase().includes(kwNorm));
                return matchQ || matchOpts;
            });

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 italic">Không tìm thấy kết quả nào cho "${filterText}"</div>`;
                return;
            }

            // Sinh HTML
            let html = '';
            filteredData.forEach(q => {
                html += `
                <div class="bg-white rounded-md p-3 border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-800 mb-2 text-[0.95rem]">
                        <span class="text-blue-600">${q.originalQName}</span> ${highlightHTML(q.question, filterText)}
                    </h3>
                    <div class="flex flex-col space-y-1">
                        ${q.options.map(opt => {
                            // Style cho đáp án đúng
                            const isCorrectStyle = opt.isCorrect 
                                ? 'bg-green-100 border-green-400 text-green-900 font-medium border' 
                                : 'bg-slate-50 border-slate-100 text-slate-600 border';
                            
                            const icon = opt.isCorrect ? svgCheck : '';
                            
                            return `
                                <div class="flex items-start px-2 py-1.5 rounded-md ${isCorrectStyle} text-[0.95rem]">
                                    <span class="font-bold mr-2 w-4 inline-block">${opt.char.toUpperCase()}.</span>
                                    <span class="flex-1">${highlightHTML(opt.text, filterText)}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
        };

        const handleSearch = () => {
            const val = document.getElementById('search-input').value;
            renderReview(val);
        };

        // ==========================================
        // 5. KHỞI TẠO APP
        // ==========================================
        window.onload = () => {
            parseQuestions();
            loadHighScore();
            initQuiz(); // Render sẵn tab Thi Thử
            // Tab ôn tập sẽ được render khi click vào (Fix tab trắng)
        };

    </script>
</body>
</html>
