<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz & Ôn Tập CNTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tối ưu thanh cuộn và các hiệu ứng nhỏ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type="radio"] { accent-color: #3b82f6; width: 1.1rem; height: 1.1rem; flex-shrink: 0; margin-top: 2px; }
        mark { background-color: #fde047; color: #000; padding: 0 2px; border-radius: 2px; font-weight: 500; }
        .tab-btn.active { border-bottom-width: 2px; border-color: #2563eb; color: #2563eb; font-weight: 700; background-color: #eff6ff; }
        .toast-enter { animation: fade-in-up 0.3s ease-out forwards; }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased text-sm md:text-base leading-tight">

    <!-- HEADER -->
    <header class="bg-white shadow-sm pt-2 pb-1 px-3 sticky top-0 z-40">
        <div class="max-w-3xl mx-auto">
            <div class="text-xs italic text-gray-500 mb-0.5">Huấn luyện Đào tạo Cảng HKQT Cần Thơ</div>
            <div class="flex justify-between items-center mb-1">
                <h1 class="text-lg md:text-xl font-bold text-gray-900 truncate">TRẮC NGHIỆM TỔNG HỢP</h1>
                <div class="text-xs font-semibold text-blue-700 bg-blue-100 px-2 py-1 rounded shadow-inner whitespace-nowrap" id="highScoreDisplay">Điểm cao: 0/40</div>
            </div>
            <!-- TABS -->
            <div class="flex border-b border-gray-200 mt-2">
                <button onclick="switchTab('quiz')" id="tabQuiz" class="tab-btn active flex-1 py-1.5 text-center text-gray-600 font-medium transition-colors">Thi Thử (40)</button>
                <button onclick="switchTab('review')" id="tabReview" class="tab-btn flex-1 py-1.5 text-center text-gray-600 font-medium transition-colors">Ôn Tập (Full)</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto bg-white min-h-[85vh] shadow-md relative pb-16">
        
        <!-- TAB 1: THI THỬ -->
        <div id="quizContainer" class="block">
            <!-- Sticky Actions Top -->
            <div class="sticky top-[86px] md:top-[90px] bg-white z-30 border-b border-gray-200 p-2 flex justify-between items-center shadow-sm">
                <div class="font-mono text-lg font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-100 flex items-center gap-1">
                    ⏱ <span id="timer">00:00</span>
                </div>
                <div class="flex gap-2">
                    <button id="btnShareTop" onclick="shareScore()" class="hidden bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded font-semibold transition shadow-sm text-sm">Chia Sẻ</button>
                    <button id="btnSubmitTop" onclick="submitQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded font-semibold transition shadow-sm text-sm">Nộp Bài</button>
                    <button onclick="restartQuiz()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded font-semibold transition shadow-sm text-sm">Làm Lại</button>
                </div>
            </div>

            <!-- Quiz Questions -->
            <div id="quizQuestions" class="p-2 space-y-3">
                <!-- Nội dung câu hỏi thi sẽ render ở đây -->
            </div>

            <!-- Sticky Actions Bottom -->
            <div class="border-t border-gray-200 p-3 bg-gray-50 flex justify-center items-center gap-3">
                <button id="btnShareBottom" onclick="shareScore()" class="hidden bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded font-bold transition shadow text-base">Chia Sẻ Kết Quả</button>
                <button id="btnSubmitBottom" onclick="submitQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-bold transition shadow text-base">Nộp Bài</button>
                <button onclick="restartQuiz()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-2 rounded font-bold transition shadow text-base">Làm Lại Lần Nữa</button>
            </div>
        </div>

        <!-- TAB 2: ÔN TẬP -->
        <div id="reviewContainer" class="hidden">
            <!-- Sticky Search -->
            <div class="sticky top-[86px] md:top-[90px] bg-white z-30 border-b border-gray-200 p-2 shadow-sm">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="onSearchInput(event)" placeholder="🔍 Tìm kiếm câu hỏi hoặc đáp án (không dấu)..." 
                           class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2 pl-8 text-sm outline-none transition-colors">
                </div>
                <div class="text-xs text-gray-500 mt-1 italic" id="searchCount">Đang hiển thị toàn bộ câu hỏi.</div>
            </div>

            <!-- Review Questions -->
            <div id="reviewQuestions" class="p-2 space-y-2">
                <!-- Nội dung ôn tập sẽ render ở đây -->
            </div>
        </div>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded shadow-lg text-sm font-medium z-50 hidden">
        Đã copy kết quả!
    </div>

/** * LOGIC PARSE DỮ LIỆU BẰNG REGEX 
 * Cách này đảm bảo không phụ thuộc JSON, tránh lỗi cắt xén string khi quá dài.
 */
function parseRawData(raw) {
    const questions = [];
    // Tách riêng từng block dựa trên cụm từ "Câu [số]:"
    const blocks = raw.split(/(?=Câu \d+:)/);
    
    blocks.forEach(block => {
        if (!block.trim()) return;
        
        // Tách dòng
        const lines = block.split('\n').map(l => l.trim()).filter(l => l);
        let qText = "";
        let options = [];
        let correctIndex = 0; // Mặc định đáp án 0 (A)
        
        lines.forEach(line => {
            // Nhận diện dòng đáp án A. B. C. D. (Cũng bắt trường hợp có đánh dấu *A.)
            const optMatch = line.match(/^(\*?[A-D])\.\s*(.*)$/i);
            if (optMatch) {
                let optLetter = optMatch[1].toUpperCase();
                let isCorrect = optLetter.startsWith('*');
                if (isCorrect) correctIndex = options.length;
                options.push(optMatch[2]);
            } else {
                if (options.length === 0) {
                    qText += (qText ? " " : "") + line;
                } else {
                    options[options.length - 1] += " " + line; // Gộp nối dòng dài
                }
            }
        });
        
        if (qText && options.length > 0) {
            questions.push({
                question: qText.replace(/^Câu \d+:\s*/, ''), // Bỏ chữ Câu X:
                options: options,
                correctIndex: correctIndex
            });
        }
    });
    return questions;
}

// Bảng map bỏ dấu cực kỳ an toàn, bảo toàn length của chuỗi để highlight index không bị lệch
const charMap = {
    'á':'a','à':'a','ả':'a','ã':'a','ạ':'a','ă':'a','ắ':'a','ằ':'a','ẳ':'a','ẵ':'a','ặ':'a','â':'a','ấ':'a','ầ':'a','ẩ':'a','ẫ':'a','ậ':'a',
    'đ':'d',
    'é':'e','è':'e','ẻ':'e','ẽ':'e','ẹ':'e','ê':'e','ế':'e','ề':'e','ể':'e','ễ':'e','ệ':'e',
    'í':'i','ì':'i','ỉ':'i','ĩ':'i','ị':'i',
    'ó':'o','ò':'o','ỏ':'o','õ':'o','ọ':'o','ô':'o','ố':'o','ồ':'o','ổ':'o','ỗ':'o','ộ':'o','ơ':'o','ớ':'o','ờ':'o','ở':'o','ỡ':'o','ợ':'o',
    'ú':'u','ù':'u','ủ':'u','ũ':'u','ụ':'u','ư':'u','ứ':'u','ừ':'u','ử':'u','ữ':'u','ự':'u',
    'ý':'y','ỳ':'y','ỷ':'y','ỹ':'y','ỵ':'y'
};

function removeAccentsPreserveLength(str) {
    return str.split('').map(c => {
        const lower = c.toLowerCase();
        if (charMap[lower]) return (c === c.toUpperCase()) ? charMap[lower].toUpperCase() : charMap[lower];
        return c;
    }).join('');
}

function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightText(text, keyword) {
    if (!keyword.trim()) return escapeHTML(text);
    
    const safeText = escapeHTML(text);
    const normText = removeAccentsPreserveLength(safeText).toLowerCase();
    const normKey = removeAccentsPreserveLength(keyword).toLowerCase();
    
    let result = '';
    let lastIdx = 0;
    let idx = normText.indexOf(normKey);
    
    while (idx !== -1) {
        result += safeText.substring(lastIdx, idx);
        result += `<mark>` + safeText.substring(idx, idx + normKey.length) + `</mark>`;
        lastIdx = idx + normKey.length;
        idx = normText.indexOf(normKey, lastIdx);
    }
    result += safeText.substring(lastIdx);
    return result;
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

// Global States
const ALL_QUESTIONS = parseRawData(RAW_DATA);
let quizQuestions = [];
let userAnswers = [];
let timerInterval = null;
let secondsElapsed = 0;
let isQuizSubmitted = false;
let isReviewRendered = false; // Cờ hiệu Fix Bug Tab Trắng
let currentScore = 0;
let highScore = parseInt(localStorage.getItem('quizHighScore') || '0');

// Khởi tạo
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById('highScoreDisplay').innerText = `Điểm cao: ${highScore}/40`;
    initQuiz();
});

// Chuyển Tab
function switchTab(tab) {
    document.getElementById('tabQuiz').classList.toggle('active', tab === 'quiz');
    document.getElementById('tabReview').classList.toggle('active', tab === 'review');
    document.getElementById('quizContainer').style.display = tab === 'quiz' ? 'block' : 'none';
    document.getElementById('reviewContainer').style.display = tab === 'review' ? 'block' : 'none';
    
    // YÊU CẦU QUAN TRỌNG: Render Tab Ôn tập lần đầu
    if (tab === 'review') {
        const reviewContainer = document.getElementById('reviewQuestions');
        if (reviewContainer.children.length === 0 || !isReviewRendered) {
            renderReviewList("");
            isReviewRendered = true;
        }
    }
}

// LOGIC TAB 1: THI THỬ
function initQuiz() {
    clearInterval(timerInterval);
    secondsElapsed = 0;
    isQuizSubmitted = false;
    userAnswers = new Array(40).fill(null);
    updateTimerDisplay();
    
    // Pick 40 random
    const pool = [...ALL_QUESTIONS];
    shuffleArray(pool);
    quizQuestions = pool.slice(0, 40).map(q => {
        // Xáo trộn Option
        const opts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correctIndex }));
        shuffleArray(opts);
        return { question: q.question, options: opts };
    });

    renderQuiz();
    
    // Bắt đầu đếm giờ
    timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
    }, 1000);

    // Reset UI
    document.getElementById('btnShareTop').classList.add('hidden');
    document.getElementById('btnShareBottom').classList.add('hidden');
    document.getElementById('btnSubmitTop').classList.remove('hidden');
    document.getElementById('btnSubmitBottom').classList.remove('hidden');
}

function updateTimerDisplay() {
    const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
    const s = (secondsElapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
}

function renderQuiz() {
    const container = document.getElementById('quizQuestions');
    container.innerHTML = quizQuestions.map((q, qIndex) => `
        <div class="bg-white border border-gray-200 rounded p-3 shadow-sm mb-2" id="qBox_${qIndex}">
            <div class="font-bold text-blue-900 mb-2">Câu ${qIndex + 1}: ${escapeHTML(q.question)}</div>
            <div class="space-y-1.5 pl-1 md:pl-2">
                ${q.options.map((opt, oIndex) => `
                    <label class="flex items-start p-1.5 border border-transparent rounded hover:bg-gray-50 cursor-pointer transition-colors" id="label_${qIndex}_${oIndex}">
                        <input type="radio" name="q_${qIndex}" value="${oIndex}" onchange="selectAnswer(${qIndex}, ${oIndex})">
                        <span class="ml-2 text-gray-700">${escapeHTML(opt.text)}</span>
                    </label>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function selectAnswer(qIndex, oIndex) {
    if(isQuizSubmitted) return;
    userAnswers[qIndex] = oIndex;
}

function submitQuiz() {
    if (isQuizSubmitted) return;
    
    const unanswered = userAnswers.filter(a => a === null).length;
    if (unanswered > 0) {
        if (!confirm(`Bạn còn ${unanswered} câu chưa làm. Bạn có chắc chắn muốn nộp bài?`)) return;
    }

    isQuizSubmitted = true;
    clearInterval(timerInterval);
    currentScore = 0;

    quizQuestions.forEach((q, qIndex) => {
        const selectedOpt = userAnswers[qIndex];
        const correctOpt = q.options.findIndex(o => o.isCorrect);
        
        if (selectedOpt === correctOpt) currentScore++;

        // Render kết quả (Lock input, tô màu)
        const labels = document.querySelectorAll(`[id^="label_${qIndex}_"]`);
        labels.forEach((label, oIndex) => {
            const input = label.querySelector('input');
            input.disabled = true;
            const span = label.querySelector('span');

            if (oIndex === correctOpt) {
                label.classList.add('bg-green-100', 'border-green-400', 'font-semibold');
                span.classList.add('text-green-800');
                span.innerHTML = `✔️ ` + span.innerHTML;
            } else if (oIndex === selectedOpt && selectedOpt !== correctOpt) {
                label.classList.add('bg-red-50', 'border-red-300');
                span.classList.add('text-red-700', 'line-through');
                span.innerHTML = `✖️ ` + span.innerHTML;
            }
        });
    });

    // Update điểm
    if (currentScore > highScore) {
        highScore = currentScore;
        localStorage.setItem('quizHighScore', highScore);
        document.getElementById('highScoreDisplay').innerText = `Điểm cao: ${highScore}/40`;
    }

    // Cuộn lên đầu và đổi nút
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('timer').innerText = `Điểm: ${currentScore}/40`;
    document.getElementById('btnSubmitTop').classList.add('hidden');
    document.getElementById('btnSubmitBottom').classList.add('hidden');
    document.getElementById('btnShareTop').classList.remove('hidden');
    document.getElementById('btnShareBottom').classList.remove('hidden');
}

function restartQuiz() {
    if (!isQuizSubmitted && !confirm("Bài thi đang làm dở, bạn có chắc muốn tạo đề mới?")) return;
    initQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareScore() {
    const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
    const s = (secondsElapsed % 60).toString().padStart(2, '0');
    const text = `🏆 Huấn luyện CNTT - Cảng HKQT Cần Thơ\nĐiểm của tôi: ${currentScore}/40\nThời gian: ${m}:${s}\nThử sức ngay!`;
    
    // Copy to clipboard
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);

    // Toast
    const toast = document.getElementById('toast');
    toast.classList.remove('hidden');
    toast.classList.add('toast-enter');
    setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('toast-enter');
    }, 2500);
}


// LOGIC TAB 2: ÔN TẬP
let searchTimeout;
function onSearchInput(e) {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        renderReviewList(e.target.value);
    }, 250); // Debounce chống lag
}

function renderReviewList(keyword) {
    const container = document.getElementById('reviewQuestions');
    const countLabel = document.getElementById('searchCount');
    
    const normKey = removeAccentsPreserveLength(keyword).toLowerCase().trim();
    
    let html = '';
    let count = 0;

    ALL_QUESTIONS.forEach((q, index) => {
        const normQ = removeAccentsPreserveLength(q.question).toLowerCase();
        const normOpts = q.options.map(opt => removeAccentsPreserveLength(opt).toLowerCase());
        
        let isMatch = false;
        if (!normKey || normQ.includes(normKey) || normOpts.some(o => o.includes(normKey))) {
            isMatch = true;
        }

        if (isMatch) {
            count++;
            html += `
                <div class="bg-white border border-gray-200 rounded p-2.5 shadow-sm">
                    <div class="font-bold text-gray-800 mb-1.5">Câu ${index + 1}: ${highlightText(q.question, normKey)}</div>
                    <div class="space-y-1 pl-1">
                        ${q.options.map((opt, oIndex) => {
                            const isCorrect = (oIndex === q.correctIndex);
                            const cssClass = isCorrect ? 'bg-blue-50 border-blue-200 text-blue-800 font-semibold' : 'text-gray-500';
                            const icon = isCorrect ? '✔️ ' : '';
                            return `
                            <div class="p-1.5 border rounded ${cssClass} text-sm">
                                ${icon}${highlightText(opt, normKey)}
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }
    });

    container.innerHTML = html || `<div class="text-center text-gray-500 py-10">Không tìm thấy kết quả phù hợp.</div>`;
    countLabel.innerText = normKey ? `Tìm thấy ${count} câu hỏi.` : `Đang hiển thị toàn bộ ${ALL_QUESTIONS.length} câu hỏi.`;
}
