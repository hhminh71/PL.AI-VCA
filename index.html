# Hướng dẫn Xác định Lãng phí<br/>(Trong Tố tụng Hình sự)<br/>*TTLT 11/2025/TTLT*

## 1. Quy định chung (Chương I)
- **Mục đích:** Xác định lãng phí trong khởi tố, điều tra, truy tố, xét xử các tội phạm liên quan.
- **Nguyên tắc cốt lõi:**
  - Khách quan, chặt chẽ, bảo mật.
  - Phối hợp giữa cơ quan tố tụng và cơ quan chuyên môn.
  - Xem xét khoan hồng/miễn trách nhiệm dựa trên động cơ, nguyên nhân.
- **Nguồn tài liệu:** Chứng cứ tố tụng; Kết luận giám định/định giá; Kết luận thanh tra/kiểm toán.

## 2. Nhận diện Dấu hiệu Lãng phí (Điều 5-9)
### 2.1. Tài chính & Tài sản công (Đ.5)
- Chỉ đạo trái pháp luật.
- Buông lỏng quản lý, thiếu trách nhiệm.
- Bao che, chỉ xử lý nội bộ/hành chính đối với hành vi có dấu hiệu tội phạm.
### 2.2. Ngân sách nhà nước (Đ.6)
- Phân bổ, giao dự toán vượt định mức, sai mục đích.
- Chi sai mục đích; Trì hoãn chi khi đủ điều kiện.
- Chậm quyết toán; Vay/cho vay trái quy định.
### 2.3. Đầu tư công & Mua sắm (Đ.7)
- Quyết định chủ trương đầu tư sai thẩm quyền, sai quy hoạch.
- Thông đồng tư vấn/nhà thầu.
- Mua sắm vượt định mức; Giao tài sản sai đối tượng.
- Trì hoãn giải ngân, chậm quyết toán.
### 2.4. Đất đai & Tài nguyên (Đ.8)
- Quy hoạch sai; Gây ô nhiễm/hủy hoại tài nguyên.
- Giao đất/cho thuê sai đối tượng, trốn đấu giá.
- Bỏ hoang đất (12-24 tháng theo quy định).
- Khởi công trước khi duyệt; Đền bù sai.
### 2.5. Vốn PPP & Vốn tại Doanh nghiệp (Đ.9)
- Quyết định dự án PPP sai trình tự, chiến lược.
- Đầu tư vốn NN ra ngoài sai mục đích, kém hiệu quả.
- Lỏng lẻo trong quản lý nợ, tài sản và các Quỹ tại DN.

## 3. Cách tính Hậu quả Lãng phí (Điều 10-11)
### 3.1. Qua Giám định/Định giá (Đ.10)
- Áp dụng khi phức tạp, cần làm rõ phần vượt định mức/tiêu chuẩn.
- Đánh giá hiệu quả thực tế so với mục tiêu đề ra.
### 3.2. Tính trực tiếp không qua Giám định (Đ.11)
- **Vượt định mức tài chính:** Số tiền thực tế chi vượt mức cho phép.
- **Vượt định mức xây dựng:** Diện tích xây vượt (m2) × Suất vốn đầu tư.
- **Tài sản bỏ hoang (do cố ý):** Tính bằng số tiền Khấu hao/Hao mòn trong thời gian ngừng hoạt động.
- **Đình trệ thi công:** Vốn NN đã giải ngân × Lãi suất tiết kiệm (TB 4 Ngân hàng NN) trong thời gian đình trệ.
- **Công trình không đạt mục tiêu (phải đập bỏ):** Chi phí đã đầu tư xây dựng + Chi phí tháo dỡ.

## 4. Tổ chức thực hiện
- **Trách nhiệm phối hợp (Đ.12):** - Cơ quan tố tụng chủ trì tổ chức họp/trao đổi.
  - Thanh tra, Kiểm toán, Cơ quan quản lý phải cung cấp dữ liệu kịp thời.
- **Hiệu lực thi hành (Đ.13):** Từ ngày 25/01/2026.
