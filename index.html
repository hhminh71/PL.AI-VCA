# LUẬT HÀNG KHÔNG DÂN DỤNG VIỆT NAM NĂM 2025
## THÔNG TIN CHUNG
### Cơ quan trình bày
- Bộ Xây dựng
- Địa điểm: Thành phố Hồ Chí Minh
- Ngày trình bày: 06 tháng 8 năm 2026
### Thông tin cơ bản về Luật
- Số hiệu: 130/2025/QH15
- Cơ quan thông qua: Quốc hội khóa XV
- Ngày thông qua: 10/12/2025
- Ngày có hiệu lực: 01/7/2026
- Đặc điểm so với trước: Giảm 95 điều
### Mục tiêu & Định hướng
- Tinh gọn nội dung luật, nguyên tắc quy định khung.
- Nội dung thuộc thẩm quyền Quốc hội.
- Tăng tính tương thích với Công ước Chicago, ICAO và các điều ước quốc tế liên quan.
- Khơi thông điểm nghẽn đầu tư.
- Khai thác hạ tầng hàng không.
- Nâng cao quản lý an toàn, an ninh.
### Bố cục Luật (11 chương, 107 điều)
- Chương I: Quy định chung (12 điều)
- Chương II: Tàu bay (15 điều)
- Chương III: Cảng hàng không (11 điều)
- Chương IV: Hoạt động bay (10 điều)
- Chương V: Vận tải HK và HK chung (15 điều)
- Chương VI: Trách nhiệm dân sự (15 điều)
- Chương VII: An toàn HK và sự cố, tai nạn tàu bay (9 điều)
- Chương VIII: Nhân viên hàng không (3 điều)
- Chương IX: An ninh hàng không (8 điều)
- Chương X: Quản lý nhà nước về hàng không dân dụng (5 điều)
- Chương XI: Điều khoản thi hành (4 điều)

## CÁC NỘI DUNG KẾ THỪA
### Nguyên tắc kế thừa
- Luật kế thừa các quy định đã được thực tiễn kiểm nghiệm tốt.
- Giữ các nguyên tắc cần thiết để bảo đảm nghĩa vụ quốc gia thành viên trong điều ước quốc tế.
    - Công ước Geneva 1948 (về công nhận quốc tế các quyền đối với tàu bay).
    - Công ước Montreal 1999 (về thống nhất các quy tắc vận chuyển hàng không quốc tế).
- Thông điệp: Kế thừa chọn lọc các quy định ổn định và bổ sung để khơi thông điểm nghẽn.
### Các quy định cụ thể được kế thừa
- Cứu hộ, giữ gìn tàu bay
    - Thanh toán tiền công cứu hộ, giữ gìn tàu bay.
- Khoản nợ ưu tiên
    - Bảo đảm thứ tự ưu tiên trong xử lý nghĩa vụ liên quan tàu bay.
- Bắt giữ tàu bay
    - Kế thừa cơ chế áp dụng đã ổn định và phù hợp thông lệ.
- Bảo hiểm bắt buộc
    - Duy trì nền tảng bảo vệ quyền lợi của chủ thể bị thiệt hại.
- Nguyên tắc hoạt động
    - An toàn, an ninh, quốc phòng, môi trường và trách nhiệm xã hội.
- Quyền, nghĩa vụ doanh nghiệp cảng
    - Kế thừa, phát triển để phù hợp mô hình khai thác mới.

## CÁC NỘI DUNG BÃI BỎ
### Các quy định bị bãi bỏ
- Bãi bỏ nội dung quy hoạch vùng thông báo bay.
- Không quy định chi tiết điều kiện, quy trình, thủ tục hành chính và phân công trách nhiệm của cơ quan thuộc Chính phủ (đáp ứng yêu cầu của Bộ Chính trị).
- Bãi bỏ quy định về tạm giữ tàu bay, khám xét tàu bay (áp dụng theo pháp luật xử lý vi phạm hành chính).
- Bãi bỏ quy định về tổ chức, cá nhân Việt Nam phải đăng ký các quyền đối với tàu bay.
- Không coi kinh doanh dịch vụ bảo đảm hoạt động bay là ngành, nghề đầu tư kinh doanh có điều kiện.
### Thông điệp quản lý
- Giảm quy định chi tiết trong Luật.
- Tăng yêu cầu chuẩn hóa, hậu kiểm, an toàn, an ninh và minh bạch trách nhiệm.

## CÁC NỘI DUNG SỬA ĐỔI
### Sửa đổi tổng quan
- Nhà chức trách
    - Phân định rõ thẩm quyền của Nhà chức trách hàng không và Nhà chức trách an ninh hàng không.
- Tàu bay
    - Tạo điều kiện cho doanh nghiệp tiếp cận nguồn tín dụng, thuê mua, xuất khẩu tàu bay theo điều ước quốc tế.
- Nhân viên hàng không
    - Linh hoạt hơn theo thị trường lao động và Bộ luật Lao động.
    - Tối ưu hóa công tác tuyển chọn, sử dụng lao động.
- Vận chuyển, hành khách
    - Làm rõ nghĩa vụ của người vận chuyển.
    - Bảo vệ hành khách khi chậm chuyến, hủy chuyến.
- Hàng không chung
    - Phù hợp phân loại của Công ước Chicago.
    - Tạo cơ sở phát triển khai thác vùng trời tầm thấp.
- Vùng trời, hoạt động bay
    - Khai thác linh hoạt, an toàn, điều hòa, hiệu quả.
    - Gắn với quốc phòng, an ninh và an toàn thông tin, tuân thủ quy định Công ước Chicago.
### Sửa đổi trọng tâm đối với Cảng hàng không (Tác động trực tiếp năng lực hạ tầng, quỹ đất, quyền NĐT, chất lượng phục vụ)
- Quy hoạch cảng hàng không
    - Phù hợp thực tiễn quy hoạch, đồng bộ với pháp luật quy hoạch.
    - Bổ sung quy định chuyển tiếp đối với quy hoạch đã phê duyệt, đang triển khai.
- Đất cảng hàng không
    - Xác lập rõ hình thức sử dụng đất.
    - Cho phép nhà đầu tư cho thuê lại quyền sử dụng đất trả tiền hằng năm.
    - Quy định cụ thể sử dụng đất quốc phòng, an ninh phục vụ lưỡng dụng.
- Điều phối slot
    - Làm rõ trách nhiệm quản lý, điều phối giờ đi, đến.
    - Nhằm giảm chậm, hủy chuyến và điều hòa năng lực cảng với nhu cầu hãng hàng không.

## CÁC NỘI DUNG BỔ SUNG MỚI
### Quản lý Nhà nước và Giám sát
- (1) Nhà chức trách hàng không
    - Bổ sung vai trò người đứng đầu, giám sát viên hàng không, thẩm quyền miễn trừ.
    - Cơ chế công nhận quy trình, tiêu chuẩn quốc tế.
- (2) Quản lý đội tàu bay
    - Quy định đội tàu bay gắn với nhu cầu thị trường, quy hoạch, kết cấu hạ tầng.
    - Gắn với năng lực giám sát an toàn của Nhà chức trách.
- (5) Điều tra an toàn sự cố, tai nạn
    - Điều tra độc lập và tách biệt với hoạt động giám sát an toàn hàng không của Nhà chức trách (theo Annex 13).
    - Bảo đảm khách quan, duy trì hệ thống an toàn, đáng tin cậy.
- (6) Hệ thống quản lý an toàn hàng không
    - Đảm bảo yêu cầu Điều 28 Công ước Chicago và Phụ ước 19 ICAO.
    - Quốc gia thành viên cam kết bảo đảm phương tiện, trang thiết bị, tiêu chuẩn.
    - Giảm thiểu rủi ro mất an toàn.
- (7) Sức khỏe nhân viên hàng không
    - Thành viên tổ bay, kiểm soát viên không lưu phải được đánh giá sức khỏe tại cơ sở đủ điều kiện và cấp giấy chứng nhận.
- (8) Cơ sở dữ liệu ngành HKDD
    - Khai thác hiệu quả CSDL quốc gia, ứng dụng CNTT, nâng cao hiệu quả quản lý nhà nước.
- (9) Quyền lợi quốc tế đối với tàu, trang thiết bị
    - Đăng ký theo hệ thống đăng ký quốc tế (Công ước và Nghị định thư Cape Town).
    - Cụ thể hóa quyền lợi, làm rõ thẩm quyền, cơ chế phối hợp xử lý tranh chấp quốc tế.
    - Đảm bảo tuân thủ nghĩa vụ quốc gia thành viên.
- (10) Nghiên cứu – ứng dụng công nghệ
    - Đẩy mạnh chuyển đổi số, chuyển giao công nghệ.
    - Phát triển công nghiệp hàng không, nâng năng lực nội địa, chủ động công nghệ.
- (11) Cơ chế giữ lại phí
    - Cho phép Nhà chức trách, tổ chức cung cấp dịch vụ công giữ lại một phần/toàn bộ phí theo quy định Chính phủ.
    - Kế thừa hiệu quả thực tiễn từ cơ chế đặc thù năm 2012.
### Đầu tư, Hạ tầng và Hoạt động Khai thác
- (3) Đầu tư xây dựng, khai thác cảng hàng không (Điều 28 - Điều 38)
    - Cơ sở chính trị: Nghị quyết 12-NQ/TW (03/6/2017) của BCHTW Đảng khóa XII; Nghị quyết 68-NQ/TW (4/5/2025) của Bộ Chính trị.
    - Mục đích: Tạo điều kiện thành phần kinh tế tham gia bình đẳng.
    - Khắc phục vướng mắc đầu tư tại cảng dùng chung (lưỡng dụng quốc phòng, an ninh và dân dụng).
    - Thúc đẩy đầu tư kết cấu hạ tầng, phát triển mô hình tiên tiến.
    - Nguyên tắc: Nhà nước thống nhất sở hữu công trình hạ tầng quan trọng; nhà đầu tư quản lý, vận hành, khai thác.
    - Đáp ứng mục tiêu quốc phòng, an ninh, chủ quyền.
- (4) Quản lý, sử dụng tài sản kết cấu hạ tầng hàng không
    - Phát huy chức năng lưỡng dụng của cảng hàng không, sân bay.
    - Sân bay thuộc cảng hàng không được khai thác lưỡng dụng.
    - Hành lang pháp lý bổ sung nguồn lực đầu tư, nâng cấp cảng chuyên dùng, sân bay lưỡng dụng.
    - Khẳng định nguyên tắc tăng cường quốc phòng, an ninh là nhiệm vụ chiến lược.
- (12) Áp dụng pháp luật với hoạt động công vụ và tầm thấp
    - Làm rõ phạm vi áp dụng đối với lực lượng vũ trang, cơ quan nhà nước, vận tải tầm thấp.
    - Thiết lập khung pháp lý linh hoạt quản lý phương tiện và hoạt động bay đặc thù.
    - Đáp ứng yêu cầu tăng cường trang bị phương tiện hiện đại cho lực lượng vũ trang.
    - Chủ động đón đầu xu hướng vận tải hàng không tầm thấp.

## CẮT GIẢM, ĐƠN GIẢN HÓA THỦ TỤC HÀNH CHÍNH
### Mục tiêu
- Cải cách thủ tục hành chính, giảm chi phí tuân thủ.
- Tạo thuận lợi cho nhà đầu tư, doanh nghiệp cảng, hãng hàng không và hành khách.
### Các thủ tục bị cắt giảm/đơn giản hóa (09/24 thủ tục)

- 01 TTHC đăng ký điều lệ vận chuyển.
- 01 nhóm TTHC cấp/cấp lại Giấy phép lập VPDD, văn phòng bán vé của hãng HK nước ngoài.
- 01 nhóm TTHC cấp Giấy chứng nhận đăng ký xuất vận đơn hàng không thứ cấp.
- 01 nhóm TTHC đăng ký cảng hàng không, sân bay.
- 01 nhóm TTHC đăng ký cảng hàng không đang xây dựng.
- 03 thủ tục ở nhóm TTHC nhân viên hàng không.
### Các điều kiện kinh doanh bị bãi bỏ
- Bỏ điều kiện kinh doanh dịch vụ bảo đảm hoạt động bay (01 ĐKKD).

## QUY ĐỊNH CHUYỂN TIẾP
### Công trình trên đất quốc phòng, an ninh và tài sản công
- Đã được cấp phép đầu tư/xây dựng trước khi Luật có hiệu lực.
- Thực hiện theo điểm a khoản 3 Điều 30 của Luật (không phải chuyển quyền sử dụng đất, mục đích sử dụng đất).
### Doanh nghiệp sở hữu công trình
- Sở hữu trước ngày Luật có hiệu lực.
- Được đầu tư nâng cấp, cải tạo, mở rộng theo quy hoạch để quản lý, khai thác đến hết thời hạn thuê đất.
### Quy hoạch
- Quy hoạch tổng thể và quy hoạch cảng hàng không, sân bay đã được phê duyệt trước khi Luật có hiệu lực.
- Tiếp tục thực hiện cho đến khi được điều chỉnh hoặc thay thế.
### Các loại Giấy phép/Giấy chứng nhận
- GCN người khai thác cảng, GPKD cảng hàng không, GPKD vận chuyển, GPKD hàng không chung cấp trước khi Luật có hiệu lực.
- Tiếp tục có hiệu lực cho đến khi bị thu hồi, hủy bỏ hoặc thay thế.

    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
