        /* CSS được nhúng trực tiếp để đảm bảo hoạt động trong một tệp duy nhất */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        :root {
            --primary-color: #0056b3;
            --background-color: #f4f7f9;
            --card-background: #ffffff;
            --text-color: #333;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --border-color: #e0e0e0;
            --highlight-color: #d9534f;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-background);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
        }

        p.subtitle {
            margin: 5px 0 0;
            color: #666;
            font-size: 1.1em;
        }

        .search-container {
            margin-bottom: 25px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 12px 15px 12px 40px; /* Thêm padding trái cho icon */
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        #searchInput:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 86, 179, 0.2);
            outline: none;
        }

        .search-container::before {
            content: '🔍'; /* Biểu tượng kính lúp */
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #aaa;
        }

        .question-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px var(--shadow-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .question-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }
        
        .question-title {
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .options {
            padding-left: 20px;
        }

        .answer {
            color: var(--highlight-color);
            font-weight: 500;
        }
        
        #no-results {
            text-align: center;
            padding: 20px;
            color: #777;
            display: none; /* Ẩn mặc định */
        }
    </style>

            );

            // Hiển thị thông báo nếu không có kết quả
            if (filteredQuestions.length === 0) {
                noResultsMessage.style.display = 'block';
            } else {
                noResultsMessage.style.display = 'none';
            }

            // Tạo và chèn HTML cho từng câu hỏi
            filteredQuestions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';

                // Tách phần đáp án để tô màu
                const contentParts = q.content.split('Đáp án:');
                const questionBody = contentParts[0].replace(/\n/g, '<br>'); // Giữ nguyên các lựa chọn
                const answerText = contentParts[1] ? contentParts[1].trim() : '';

                let formattedContent = questionBody;
                if (answerText) {
                    formattedContent += `Đáp án: <span class="answer">${answerText}</span>`;
                }

                card.innerHTML = formattedContent;
                questionsContainer.appendChild(card);
            });
        }

        // 4. Gắn sự kiện 'input' vào ô tìm kiếm để lọc real-time
        searchInput.addEventListener('input', (event) => {
            displayQuestions(event.target.value);
        });

        // 5. Hiển thị tất cả câu hỏi khi trang được tải lần đầu
        window.onload = () => {
            displayQuestions();
        };

    </script>
</body>
</html>
