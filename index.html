    // Format Image placeholders
    function formatImagePlaceholder(text) {
        return text.replace(/\[Image \d+\]/g, `<span class="inline-flex items-center justify-center bg-gray-200 border border-gray-400 text-gray-600 text-xs px-2 py-0.5 rounded mx-1 shadow-sm"><i class="fas fa-image mr-1"></i>Hình ảnh</span>`);
    }

    // Parse text to JSON object array
    function parseRawData(rawStr) {
        const questions = [];
        const blocks = rawStr.trim().split(/\n\s*\n/);
        
        blocks.forEach((block, index) => {
            const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l);
            if(lines.length < 2) return;
            
            let qText = lines[0].replace(/^Q:\s*/, '');
            qText = formatImagePlaceholder(qText);
            
            const options = [];
            for(let i = 1; i < lines.length; i++) {
                let optText = lines[i];
                let isCorrect = false;
                if(optText.startsWith('*A:')) {
                    isCorrect = true;
                    optText = optText.replace(/^\*A:\s*/, '');
                } else {
                    optText = optText.replace(/^A:\s*/, '');
                }
                optText = formatImagePlaceholder(optText);
                options.push({ text: optText, isCorrect });
            }
            questions.push({ id: index, question: qText, options });
        });
        return questions;
    }

    // Shuffle Array
    function shuffleArray(array) {
        const newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
    }

    // Loại bỏ dấu tiếng Việt
    function removeAccents(str) {
        return str.normalize('NFD')
                  .replace(/[\u0300-\u036f]/g, '')
                  .replace(/đ/g, 'd').replace(/Đ/g, 'D');
    }

    // Tạo regex highlight thông minh (bỏ qua dấu)
    function createHighlightRegex(keyword) {
        if(!keyword) return null;
        const map = {
            'a': '[aáàảãạăắằẳẵặâấầẩẫậ]',
            'e': '[eéèẻẽẹêếềểễệ]',
            'i': '[iíìỉĩị]',
            'o': '[oóòỏõọôốồổỗộơớờởỡợ]',
            'u': '[uúùủũụưứừửữự]',
            'y': '[yýỳỷỹỵ]',
            'd': '[dđ]'
        };
        let regexStr = '';
        const safeKeyword = removeAccents(keyword).toLowerCase();
        for (let char of safeKeyword) {
            regexStr += map[char] || char.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        }
        return new RegExp(`(${regexStr})`, 'gi');
    }

    function startTimer() {
        clearInterval(timerInterval);
        secondsElapsed = 0;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            secondsElapsed++;
            updateTimerDisplay();
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const s = String(secondsElapsed % 60).padStart(2, '0');
        document.querySelectorAll('.timer-display').forEach(el => el.innerText = `${m}:${s}`);
    }

    function submitQuiz() {
        if(isSubmitted) return;
        clearInterval(timerInterval);
        isSubmitted = true;

        let score = 0;
        currentQuizQuestions.forEach((q, index) => {
            const qDiv = document.getElementById(`quiz-q-${index}`);
            const labels = qDiv.querySelectorAll('.quiz-label');
            const radios = qDiv.querySelectorAll('input[type="radio"]');
            
            radios.forEach((radio, i) => {
                radio.disabled = true; // Lock input
                const isCorrect = radio.value === "true";
                const isChecked = radio.checked;
                
                if (isCorrect) {
                    labels[i].classList.add('bg-green-100', 'border-green-400', 'text-green-800');
                    labels[i].querySelector('span').innerHTML = `<i class="fas fa-check-circle text-green-600 mr-1"></i>` + labels[i].querySelector('span').innerHTML;
                }
                
                if (isChecked) {
                    if (isCorrect) {
                        score++;
                    } else {
                        labels[i].classList.add('bg-red-100', 'border-red-400', 'text-red-800');
                        labels[i].querySelector('span').innerHTML = `<i class="fas fa-times-circle text-red-600 mr-1"></i>` + labels[i].querySelector('span').innerHTML;
                    }
                }
            });
        });

        // Update UI
        const resultDiv = document.getElementById('quiz-result');
        resultDiv.innerHTML = `Điểm của bạn: <span class="${score >= 32 ? 'text-green-600' : 'text-red-600'}">${score} / ${currentQuizQuestions.length}</span>`;
        resultDiv.classList.remove('hidden');
        
        document.getElementById('btn-submit-top').classList.add('hidden');
        document.getElementById('btn-submit-bottom').classList.add('hidden');
        document.getElementById('btn-share').classList.remove('hidden');

        // Save High Score
        const currentHighScore = localStorage.getItem('cat8_highscore') || 0;
        if(score > parseInt(currentHighScore)) {
            localStorage.setItem('cat8_highscore', score);
            updateHighScoreDisplay();
        }
    }

        allQuestions.forEach((q, index) => {
            let html = `
            <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 review-item" data-search="${removeAccents(q.question + ' ' + q.options.map(o=>o.text).join(' ')).toLowerCase()}">
                <h3 class="font-bold text-gray-800 mb-2 text-compact text-sm"><span class="text-blue-600 mr-1">${index + 1}.</span> <span class="q-content">${q.question}</span></h3>
                <div class="space-y-1 ml-1">`;
            
            q.options.forEach((opt) => {
                if(opt.isCorrect) {
                    html += `<div class="p-2 rounded bg-green-100 border border-green-300 text-green-800 font-semibold text-sm text-compact opt-content"><i class="fas fa-check-circle mr-1"></i>${opt.text}</div>`;
                } else {
                    html += `<div class="p-2 rounded bg-gray-50 text-gray-500 text-sm text-compact opt-content">${opt.text}</div>`;
                }
            });

            html += `</div></div>`;
            container.innerHTML += html;
        });

        document.getElementById('search-count').innerText = `${allQuestions.length} câu`;
        isReviewRendered = true; // ĐÁNH DẤU LÀ ĐÃ RENDER ĐỂ KHÔNG BỊ RENDER LẠI GÂY LAG
    }

    function handleSearch() {
        const input = document.getElementById('search-input').value;
        const keyword = removeAccents(input).toLowerCase();
        const items = document.querySelectorAll('.review-item');
        const regex = createHighlightRegex(input);
        let count = 0;

        items.forEach((item, index) => {
            const searchData = item.getAttribute('data-search');
            
            if (searchData.includes(keyword)) {
                item.style.display = 'block';
                count++;
                
                // Highlight logic
                const qContent = item.querySelector('.q-content');
                const optContents = item.querySelectorAll('.opt-content');
                
                // Khôi phục text gốc từ bộ nhớ để tránh bị lặp thẻ <mark>
                const qData = allQuestions[index];
                
                if(input.trim() !== '') {
                    qContent.innerHTML = qData.question.replace(regex, '<mark>$1</mark>');
                    optContents.forEach((optEl, i) => {
                        let text = qData.options[i].text;
                        if(qData.options[i].isCorrect) {
                            optEl.innerHTML = `<i class="fas fa-check-circle mr-1"></i>` + text.replace(regex, '<mark>$1</mark>');
                        } else {
                            optEl.innerHTML = text.replace(regex, '<mark>$1</mark>');
                        }
                    });
                } else {
                    // Xóa highlight nếu ô tìm kiếm rỗng
                    qContent.innerHTML = qData.question;
                    optContents.forEach((optEl, i) => {
                        if(qData.options[i].isCorrect) {
                            optEl.innerHTML = `<i class="fas fa-check-circle mr-1"></i>` + qData.options[i].text;
                        } else {
                            optEl.innerHTML = qData.options[i].text;
                        }
                    });
                }

            } else {
                item.style.display = 'none';
            }
        });

        document.getElementById('search-count').innerText = `${count} câu`;
    }

</script>
</body>
</html>
