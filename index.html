# TỔNG QUAN VỀ HỢP ĐỒNG XÂY DỰNG THEO LUẬT XD 2025 & NĐ 210/2026/NĐ-CP
## 01. QUY ĐỊNH MỚI VỀ HỢP ĐỒNG XÂY DỰNG TẠI LUẬT XÂY DỰNG 2025
### Nguyên tắc chung (Điều 80 - Điều 87)
- Luật Xây dựng 2025 chỉ quy định các nguyên tắc cơ bản, chung nhất về hợp đồng xây dựng.

## 02. QUY ĐỊNH MỚI VỀ HỢP ĐỒNG XÂY DỰNG TẠI NGHỊ ĐỊNH SỐ 210/2026/NĐ-CP
### 1. Mở rộng phạm vi áp dụng (Điều 1, 2)
#### Áp dụng cho tất cả các loại hợp đồng xây dựng
#### Mục tiêu hành lang pháp lý
- Đảm bảo công bằng, minh bạch trong công tác quản lý hợp đồng xây dựng.
- Nâng cao hiệu quả của dự án.
- Bảo đảm trật tự xây dựng, chống thất thoát, lãng phí trong đầu tư xây dựng.
#### Đảm bảo nguyên tắc tự do, tự nguyện
- Ngoài những quy định riêng về chuyên ngành, việc giao kết và quản lý thực hiện hợp đồng được thỏa thuận trên nguyên tắc tự do, tự nguyện theo pháp luật về dân sự.

### 2. Bổ sung cơ chế quản lý hợp đồng (Khoản 6&7 Điều 4, Chương II Mục 1)
#### Đối với công nghệ, vật liệu xây dựng mới (chưa có TCVN)
- Việc thực hiện hợp đồng và chi phí liên quan được áp dụng theo pháp luật về khoa học, công nghệ và đổi mới sáng tạo.
#### Đối với dự án đầu tư công đặc biệt; khẩn cấp, cấp bách
- Chủ đầu tư được quyết định việc giao kết và quản lý thực hiện hợp đồng xây dựng.
- Yêu cầu: Phù hợp yêu cầu dự án, bảo đảm tiến độ, chất lượng.
- Trách nhiệm: Chủ đầu tư tự chịu trách nhiệm về quyết định của mình.

### 3. Bổ sung quy định về hợp đồng giao dịch điện tử (Khoản 8 Điều 4)
#### Mục đích
- Phù hợp với Luật Giao dịch điện tử.
- Đẩy mạnh chuyển đổi số trong quản lý dự án.
#### Yêu cầu tuân thủ
- Việc giao kết và quản lý thực hiện hợp đồng giao dịch điện tử trong xây dựng bằng phương tiện điện tử PHẢI tuân thủ quy định pháp luật về giao dịch điện tử.

### 4. Phân loại, nội dung, phạm vi áp dụng các hình thức giá hợp đồng (Điều 6, 8, 11)
#### Sửa đổi phù hợp thực tiễn ngành xây dựng
- Hợp đồng thi công xây dựng: Có thể bao gồm cả công tác thiết kế bản vẽ thi công, cung cấp cả thiết bị công trình.
- Hợp đồng cung cấp vật tư, vật liệu, thiết bị: Trước hết phải gắn thiết kế công nghệ, có thể bao gồm cả thiết bị công trình.
- Hợp đồng EPC, EC, EP: Áp dụng trong trường hợp mới triển khai đến thiết kế cơ sở hoặc thiết kế FEED, có thể bao gồm cả khảo sát xây dựng.
#### Bổ sung hình thức giá hợp đồng
- Hợp đồng theo kết quả đầu ra.
- Hợp đồng theo tỷ lệ %.
#### Bổ sung, quy định rõ phạm vi áp dụng (Điều 11)
- Bổ sung quy định áp dụng hợp đồng trọn gói đối với hợp đồng EC, EP.

### 5. Sửa đổi quy định về thời gian, tiến độ và hiệu lực hợp đồng (Điều 10)
#### Thời gian có hiệu lực & chấm dứt
- Sửa đổi, bổ sung thời gian có hiệu lực phù hợp với thực tiễn sản xuất xây dựng.
- Bổ sung thời điểm hợp đồng bị chấm dứt (phù hợp với khoản 2 Điều 85 Luật Xây dựng).
#### Thời gian thực hiện công việc
- Bổ sung quy định rõ về thời gian thực hiện các công việc để tránh vướng mắc.
- Gói thầu thuộc dự án đầu tư công: Thời gian thực hiện công việc hợp đồng LÀ thời gian thực hiện gói thầu (theo pháp luật về đấu thầu).
#### Trách nhiệm của bên nhận thầu
- Bắt buộc phải lập tiến độ thực hiện hợp đồng (cụ thể các nội dung cần đảm bảo).
- Tiến độ thi công có thể được lập cho từng giai đoạn (đối với hợp đồng yêu cầu thực hiện theo giai đoạn).

### 6. Bổ sung quy định về tạm ứng hợp đồng (Dự án đầu tư công, PPP) (Khoản 3 Điều 12)
#### Tạm ứng vượt mức tối đa (30%)
- Cho phép trong trường hợp để đặt cọc hoặc thanh toán cho nhà sản xuất, cung ứng vật tư, thiết bị theo thiết kế công nghệ.
#### Không tính vào mức tạm ứng hợp đồng
- Các khoản tạm ứng để sản xuất cấu kiện, bán thành phẩm có giá trị lớn.
- Các khoản tạm ứng phải dự trữ vật liệu.

### 7. Bổ sung quy định về bảo đảm thực hiện nghĩa vụ hợp đồng (Dự án đầu tư công, PPP) (Điều 13)
#### Chứng minh năng lực/Bảo đảm thanh toán
- Dự án PPP: Bên nhận thầu phải chứng minh năng lực tài chính HOẶC các bên thỏa thuận biện pháp bảo đảm thanh toán.
- Dự án đầu tư công: KHÔNG phải chứng minh hay bảo đảm thanh toán.
#### Quyền lợi về tiền lãi
- Nếu áp dụng biện pháp "ký quỹ hoặc giữ lại tiền", bên nhận thầu được hưởng tiền lãi phát sinh.
#### Trường hợp liên danh
- Cho phép thành viên đứng đầu nộp bảo đảm thực hiện hợp đồng.

### 8. Bổ sung quy định về giải quyết tranh chấp hợp đồng (Điều 170)
#### Nghĩa vụ khi xảy ra tranh chấp
- Quá trình xử lý tranh chấp, các bên phải thực hiện các nghĩa vụ KHÔNG bị ảnh hưởng bởi nội dung tranh chấp.
- Tuyệt đối KHÔNG được làm gián đoạn công việc.
#### Ban xử lý tranh chấp (DAB)
- Thời điểm thành lập: Do các bên thỏa thuận (thường trực/standing hoặc vụ việc/adhoc).
- Yêu cầu đối với DAB: Số lượng, tiêu chuẩn, trình độ kinh nghiệm phải phù hợp; phải độc lập, khách quan, không xung đột lợi ích.
#### Thỏa thuận về Quyết định/Khuyến nghị phân xử
- Các bên phải thỏa thuận về tính ràng buộc của Quyết định/Khuyến nghị phân xử.
- Quy định rõ các bước tiếp theo khi 1 bên KHÔNG đồng ý.

### 9. Rủi ro, sự kiện bất khả kháng và hoàn cảnh thay đổi cơ bản (Điều 18)
#### Quản lý & Phân bổ rủi ro
- Các bên thỏa thuận trách nhiệm quản lý, phân bổ và xử lý rủi ro (lường trước & không lường trước).
#### Sự kiện bất khả kháng & Hoàn cảnh thay đổi cơ bản
- Thực hiện theo Điều 13 Luật Xây dựng 2025.
- Hợp đồng CẦN quy định trình tự, thủ tục và trách nhiệm xử lý khi xảy ra sự kiện.
- BAO GỒM CẢ trường hợp biến động bất thường về giá vật liệu.
#### Trách nhiệm của bên bị ảnh hưởng
- PHẢI thông báo bằng văn bản cho bên còn lại.
- PHẢI đề xuất phương án xử lý để hạn chế, khắc phục rủi ro.
#### ĐỊNH NGHĨA: THẾ NÀO LÀ BẤT KHẢ KHÁNG?
- 01. Là sự kiện xảy ra một cách khách quan.
- 02. Không thể lường trước được.
- 03. Không thể khắc phục được (mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép).
#### ĐỊNH NGHĨA: HOÀN CẢNH THAY ĐỔI CƠ BẢN?
- 01. Sự thay đổi hoàn cảnh do nguyên nhân khách quan xảy ra SAU khi giao kết hợp đồng.
- 02. Tại thời điểm giao kết, các bên KHÔNG THỂ lường trước được về sự thay đổi hoàn cảnh.
- 03. Hoàn cảnh thay đổi lớn đến mức nếu biết trước thì hợp đồng ĐÃ KHÔNG được giao kết hoặc giao kết với nội dung HOÀN TOÀN KHÁC.
- 04. Việc tiếp tục thực hiện (không thay đổi nội dung) sẽ gây thiệt hại nghiêm trọng cho một bên.
- 05. Bên bị ảnh hưởng đã áp dụng mọi biện pháp cần thiết (phù hợp tính chất hợp đồng) mà KHÔNG THỂ ngăn chặn, giảm thiểu mức độ ảnh hưởng đến lợi ích.

### 10. Sửa đổi hợp đồng xây dựng (Điều 22)
- Bổ sung nội dung, phương pháp và thủ tục sửa đổi hợp đồng.

### 12. Phương pháp điều chỉnh đơn giá và giá hợp đồng (Điều 24)
- (1) Bổ sung quy định về phương pháp điều chỉnh (tại Phụ lục kèm theo) dựa trên Thông tư số 02/2023/TT-BXD.
- (2) Bổ sung nguồn dữ liệu, thông tin giá: Bộ Tài chính, cơ quan/đơn vị có thẩm quyền; Nguồn dữ liệu nước ngoài (cho chi phí phát sinh tại nước ngoài).
- (3) Làm rõ: Một hợp đồng có thể sử dụng KẾT HỢP các phương pháp điều chỉnh đơn giá và giá hợp đồng.

### 13. Phương pháp bù trừ trực tiếp để điều chỉnh giá hợp đồng (Điều 24)
#### Phân định trách nhiệm
- Chủ đầu tư chịu trách nhiệm tổ chức xác định giá, chỉ số giá.
#### Quy định cụ thể
- Nguồn thông tin về giá hoặc chỉ số giá.
- Phương pháp điều chỉnh giá.
- Bổ sung, làm rõ các chi phí gián tiếp (CPC, lợi nhuận, VAT) trong công thức bù trừ trực tiếp.

### 14. Đơn phương chấm dứt, quyết toán, thanh lý hợp đồng (Điều 27, 30, 31)
#### Quyết toán & Thanh lý đơn phương
- Quy định thành phần hồ sơ đối với trường hợp đơn phương quyết toán, thanh lý (theo khoản 5 Điều 85 Luật XD 2025).
#### Quyền hủy bỏ/chấm dứt hợp đồng
- Bên vi phạm hợp đồng tạo quyền cho bên kia hủy bỏ hoặc đơn phương chấm dứt hợp đồng (đảm bảo thống nhất, tránh vướng mắc).
#### Thanh lý hợp đồng
- KHÔNG quy định BẮT BUỘC phải thanh lý hợp đồng.
- Các bên CÓ THỂ thỏa thuận hợp đồng tự động hết hiệu lực khi hoàn thành nghĩa vụ.

### 15. Thanh toán hợp đồng (Điều 28, 29)
#### Bổ sung thành phần hồ sơ & quy định thanh toán đối với:
- Hợp đồng theo chi phí cộng phí.
- Hợp đồng theo kết quả đầu ra.
- Hợp đồng theo tỷ lệ %.

### 16. Nội dung lược bỏ (so với NĐ 37/2015/NĐ-CP)
#### Lược bỏ do đã có trong Luật Xây dựng 2025
- Bỏ các Điều: 4, 6, 11, 17, 21, 35, 36, 42, 43.
#### Lược bỏ do đã quy định tại văn bản khác / cơ cấu chưa phù hợp
- Điều 48: An toàn lao động, bảo vệ môi trường và PCCC.
- Điều 49: Điện, nước và an ninh công trường.
- Điều 50: Vận chuyển thiết bị công nghệ.

    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
