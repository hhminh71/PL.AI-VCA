# ⚖️ VBPL ACV (T11/2025 - T01/2026)
## 💰 Tài chính & Kế toán (Trọng tâm)
### Thuế TNDN (NĐ 320/2025)
- **Hiệu lực:** 15/12/2025
- **Điều kiện chi phí được trừ:**
  - Khoản chi thực tế liên quan SXKD.
  - Có đủ hóa đơn, chứng từ.
  - ⚠️ **Thanh toán không dùng tiền mặt:** Với hóa đơn > **05 triệu đồng**.
- **Không được trừ:** Tiền phạt VPHC (thuế, giao thông...).
### Thuế GTGT (NĐ 359/2025)
- **Hàng Nông/Lâm/Thủy sản sơ chế:**
  - DN bán thương mại cho DN khác: **Không kê khai, tính nộp thuế**.
  - Vẫn được khấu trừ thuế đầu vào.
  - Bán cho hộ cá nhân/khác: Thuế suất 5%.
### Thuế TTĐB (NĐ 360/2025)
- **Đối tượng chịu thuế:** Máy bay, Ô tô <24 chỗ, Điều hòa, Nước giải khát (đường cao).
- **Giá tính thuế:** Giá bán chưa VAT - Thuế BVMT.
- **Quy đổi:** Thuốc lá, Xì gà (trọng lượng khác chuẩn).
### Phí Môi trường Nước thải (NĐ 346/2025)
- **Cách tính mới:** Lượng xả thải thực tế x Mức độ ô nhiễm (thay vì bình quân).
- **Tăng mức phí:** Hg (55tr/kg), COD, TSS.
- **Hạn nộp:** Ngày 20 tháng đầu tiên của quý sau.
### Quản lý Thuế (NĐ 373/2025)
- **TNCN:** Khai theo quý (nếu đủ điều kiện GTGT quý).
- **Quyết toán:** Nộp tại cơ quan thuế quản lý nơi trả thu nhập lớn nhất.

## 🏗️ Đầu tư & Xây dựng
### Luật Xây dựng (135/2025/QH15)
- **Hiệu lực:** 01/07/2026
- **Miễn Giấy phép xây dựng:**
  - Công trình tại Cảng hàng không, khu bay.
  - Công trình cấp bách/Đầu tư công đặc biệt.
- **Thẩm định:** Bãi bỏ thẩm định TK triển khai sau TKCS (khi điều chỉnh).
- **Thẩm tra:** Bắt buộc với công trình ảnh hưởng lớn/PCCC.
### PPP & Đầu tư (NĐ 312/2025)
- **Vốn Nhà nước:** Không tính vào phương án thu hồi vốn của NĐT.
- **Chia sẻ doanh thu:** Cơ chế chia sẻ phần tăng/giảm.
- **Dự án BT:** Thanh toán lãi vay sau thời gian xây dựng.
### Vay ODA (NĐ 317/2025)
- **ĐVSN Công lập:** Không yêu cầu tài sản bảo đảm (nếu được Bộ TC báo cáo TTg).

## 👥 Lao động & Tiền lương
### Bảo hiểm thất nghiệp (NĐ 374/2025)
- **Hiệu lực:** 01/01/2026
- **Mức hưởng:** Tối đa **05 lần** lương tối thiểu vùng.
- **Lương đóng BHTN:**
  - Part-time: Theo thỏa thuận HĐLĐ.
  - Quản lý DN: Theo tiền lương được hưởng.
- **Báo cáo biến động:** Chỉ khi tăng/giảm từ **50 lao động** trở lên.
- **Hoàn trả phí đào tạo:** NLĐ phải hoàn tiền nếu nghỉ việc trái luật/không làm việc sau đào tạo.

## ✈️ Hàng không & Pháp lý khác
### Xử phạt VPHC (NĐ 17/2026)
- **Hiệu lực:** 01/03/2026
- **Phân định thẩm quyền:**
  - **Vi phạm ANTT:** Giao An ninh hàng không.
  - **Vi phạm Kỹ thuật/Quy trình:** Giao Cảng vụ HK.
- **Mức phạt (Cảng vụ):**
  - Trưởng đại diện: Đến 25tr.
  - Giám đốc: Đến 50tr + Tước GP/Đình chỉ.
### Sở hữu trí tuệ (Luật 131/2025)
- Quyền SHTT là tài sản (dùng góp vốn, thế chấp, giao dịch).
### PCCC (TT 63/2025)
- UBND Tỉnh cấp phép lưu thông vật liệu ngăn cháy.
### Thi đua khen thưởng (TT 118 & 143)
- Trích 20% quỹ thi đua cho công tác tuyên truyền/tổ chức.
