<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCA Visualizer - Phòng TC-KH</title>
<style>
    /* --- CẤU HÌNH GIAO DIỆN VCA (ACV STYLE) --- */
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; display: flex; flex-direction: column;}
    
    /* Header */
    .vca-header {
        background: #0056b3; /* Xanh ACV */
        color: white;
        padding: 12px 20px;
        border-bottom: 4px solid #d4af37; /* Vàng Gold */
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        flex-shrink: 0;
    }
    .vca-top { font-size: 11px; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }
    .vca-title { font-size: 18px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .vca-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}

    /* Main Container */
    .main-area { flex-grow: 1; position: relative; overflow: hidden; }
    
    /* Mindmap container - Full Size */
    .markmap { width: 100%; height: 100vh; }

    /* Footer */
    .vca-footer { 
        background: #e9ecef; color: #555; text-align: center; 
        padding: 5px; font-size: 11px; flex-shrink: 0; border-top: 1px solid #ddd;
    }
</style>
<style>.markmap-node-text { font-family: 'Segoe UI'; font-size: 14px; fill: #333; }</style>
</head>
<body>

    <div class="vca-header">
        <div class="vca-top">Tổng công ty Cảng hàng không Việt Nam - CTCP</div>
        <div class="vca-title">Cảng hàng không quốc tế Cần Thơ</div>
        <div class="vca-badge">Phòng Tài chính - Kế hoạch | Triển khai văn bản</div>
    </div>

    <div class="main-area">
        <div class="markmap">
            <script type="text/template">
# TB 301/PCKTNB <br> Quy chế GS & KT Nội bộ
## I. Mục tiêu
- Đánh giá thực trạng
  - Khắc phục tồn tại
  - Nâng cao hiệu quả QL, SXKD
- Đánh giá tuân thủ
  - Quy định pháp luật & nội bộ
  - Tính hiệu lực hệ thống KSNB
- Phát hiện bất cập
  - Kiến nghị sửa đổi quy chế
- Nâng cao trách nhiệm
## II. Chủ thể
- Thực hiện GS/KT
  - Văn phòng TCT
  - Ban chuyên môn nghiệp vụ
- Được GS/KT
  - Các Chi nhánh (Cảng HK)
## III. Kế hoạch GS/KT
- 1. Xây dựng Kế hoạch
  - Thời hạn: Trước 15/12 hàng năm
  - Căn cứ
    - Yêu cầu thực tiễn
    - Chỉ đạo HĐQT, Ban TGĐ
  - Quy trình
    - Xin ý kiến P.TGĐ phụ trách
    - Gửi Ban PCKTNB
  - Lưu ý
    - Phối hợp: Thống nhất cơ quan chủ trì
    - Quá hạn: Ban PCKTNB tự lập trình TGĐ
- 2. Kiểm tra Đột xuất
  - Thủ tục rút gọn
  - Theo chỉ đạo HĐQT/TGĐ: Không cần lập KH
- 3. Điều chỉnh Kế hoạch
  - Quy trình
    - Nêu lý do -> P.TGĐ duyệt -> Gửi PCKTNB
    - Ban PCKTNB rà soát (02 ngày) -> Trình TGĐ
  - Tần suất: Tối đa 02 lần/năm
## IV. Quy trình Giám sát
- 1. Gián tiếp
  - B1: Xây dựng Chương trình/Đề cương
    - Thường xuyên: Chương trình GS
    - Định kỳ: Đề cương báo cáo
  - B2: Lập Báo cáo KQ
    - Trình TGĐ ký
    - Gửi Ban PCKTNB (tổng hợp)
    - *Phát hiện vi phạm: Chuyển sang Kiểm tra*
  - B3: Xử lý kết quả
    - TGĐ giải quyết/kiến nghị
- 2. Trực tiếp
  - Vận dụng Quy trình Kiểm tra
## V. Quy trình Kiểm tra (9 Bước)
- B1: Quyết định KT
  - Căn cứ: Kế hoạch/Đột xuất/Sau giám sát
  - Gửi trước: 20 ngày (trừ đột xuất)
- B2: Thu thập thông tin
  - Gửi đề cương yêu cầu báo cáo
  - Đơn vị gửi trước: 10 ngày
  - *Đột xuất: Bỏ qua bước này*
- B3: Công bố QĐ
  - Họp vào ngày đầu tiên
  - Thông báo KH, cách làm việc
- B4: Tiến hành KT
  - Kiểm tra hồ sơ/hiện trường
  - Xử lý phát sinh: Báo cáo Trưởng đoàn
- B5: Báo cáo công việc
  - Thành viên báo cáo Trưởng đoàn
  - Nội dung: Hiện trạng, Sai sót, Kiến nghị
- B6: Họp kết thúc
  - Thống nhất danh mục hồ sơ đã KT
  - Thông báo vấn đề phát hiện
  - Lập Biên bản làm việc (Phụ lục 3)
- B7: Dự thảo Kết luận
  - Trưởng đoàn hoàn thiện
  - Lấy ý kiến: Trong 07 ngày
- B8: Ban hành Kết luận
  - Thời hạn: 30 ngày sau kết thúc
  - Trình TGĐ ký ban hành
  - Gửi HĐQT, Đơn vị, PCKTNB (trong 5 ngày)
- B9: Xử lý kết quả
## VI. Chế độ Báo cáo
- Loại báo cáo
  - 6 tháng: Trước 30/6
  - Năm: Trước 31/12
- Nơi gửi
  - Ban PCKTNB (đầu mối)
  - Đồng gửi: HĐQT, Ban KS
- Hồ sơ đính kèm
  - Báo cáo KQ Giám sát
  - Kết luận Kiểm tra
  - Tình hình thực hiện kiến nghị
            </script>
        </div>
    </div>

    <div class="vca-footer">
        Hệ thống hỗ trợ triển khai văn bản nội bộ - VCA
    </div>

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.4"></script>

</body>
</html>
