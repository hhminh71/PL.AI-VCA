/* =====================================================================

// --- 1. HÀM PARSE DỮ LIỆU TỪ RAW TEXT ---
function parseData(rawText) {
    const questions = [];
    // Tách theo "Câu hỏi XX:"
    const blocks = rawText.split(/Câu hỏi\s+\d+:/i).filter(b => b.trim() !== '');
    
    blocks.forEach(block => {
        const lines = block.split('\n').map(l => l.trim()).filter(l => l !== '');
        if (lines.length < 3) return;

        let qText = "";
        let options = [];
        let correctText = "";
        let inOptions = false;

        for (let line of lines) {
            if (line.startsWith('Đáp án đúng là:')) {
                correctText = line.replace('Đáp án đúng là:', '').trim();
            } else if (/^[A-D1-4][\.\)]\s/.test(line)) {
                // Đây là một đáp án (Bắt đầu bằng A. B. C. D. hoặc 1. 2. 3. 4.)
                options.push(line.substring(2).trim());
                inOptions = true;
            } else if (!correctText) {
                // Chưa đến phần đáp án đúng
                if (!inOptions) {
                    qText += (qText ? " " : "") + line;
                } else {
                    // Dòng phụ của đáp án trước đó (ít gặp nhưng vẫn phòng hờ)
                    if (options.length > 0) {
                        options[options.length - 1] += " " + line;
                    }
                }
            }
        }

        // Nếu hợp lệ
        if (options.length > 0 && correctText) {
            // Chuẩn hóa để so sánh tìm vị trí đáp án đúng
            const clean = (str) => str.toLowerCase().replace(/\.$/, '').replace(/\s+/g, ' ').trim();
            const cleanCorrect = clean(correctText);
            
            let correctIdx = options.findIndex(opt => {
                let cleanOpt = clean(opt);
                return cleanOpt === cleanCorrect || cleanOpt.includes(cleanCorrect) || cleanCorrect.includes(cleanOpt);
            });
            
            if (correctIdx === -1) correctIdx = 0; // Mặc định nếu không map được

            questions.push({
                question: qText.replace(/^:/, '').trim(), // Xóa dấu : thừa ở đầu nếu có
                options: options,
                correctIndex: correctIdx
            });
        }
    });
    
    return questions;
}

function startExam() {

    // Bốc ngẫu nhiên 40 câu
    const shuffledPool = [...allQuestions].sort(() => 0.5 - Math.random());

    // Xáo trộn đáp án cho từng câu
    examQuestions = examQuestions.map((q, idx) => {
        // Tạo mảng option giữ nguyên tính đúng/sai
        let opts = q.options.map((optText, optIdx) => ({

    renderExam();

function submitExam() {

    // Stop Timer

    isSubmitted = true;
    
    let score = 0;

    examQuestions.forEach((q) => {
        const selectedIdx = userAnswers[q.id];
        
        q.options.forEach((opt, oIndex) => {
            const lbl = document.getElementById(`label_${q.id}_${oIndex}`);
            const radio = lbl.querySelector('input');

            // Xóa highlight màu chọn cũ (xanh biển) của CSS :checked bằng cách chèn class đè lên
            if (radio.checked) {
                lbl.style.backgroundColor = 'transparent';

            }

            // Logic tô màu
            if (opt.isCorrect) {
                lbl.classList.add('bg-green-100', 'border-green-400');
                lbl.innerHTML += `<span class="ml-auto text-green-600">✔️</span>`;
                if (selectedIdx === oIndex) score++;
            } else if (selectedIdx === oIndex && !opt.isCorrect) {
                // Chọn sai
                lbl.classList.add('bg-red-100', 'border-red-400');
                lbl.innerHTML += `<span class="ml-auto text-red-500">✖️</span>`;
            }
        });
    });

    // Update High Score
    if (score > highScore) {

        localStorage.setItem('quiz_highscore_283', highScore);
        document.getElementById('high-score').innerText = `Điểm cao: ${highScore}/40`;
    }

    // Toggle Buttons
    document.getElementById('btn-submit-top').classList.add('hidden');
    document.getElementById('btn-submit-bottom').classList.add('hidden');
    document.getElementById('btn-share-top').classList.remove('hidden');

    // Cuộn lên đầu & Thông báo
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    setTimeout(() => {
        alert(`Bạn đã đạt: ${score}/40 điểm!\nThời gian: ${document.getElementById('timer').innerText}`);

}

function retryExam() {
    if(!isSubmitted && Object.keys(userAnswers).length > 0) {

function shareResult() {

// Bỏ dấu tiếng Việt
function removeAccents(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
}

// Chống HTML injection
function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag] || tag));
}

// Highlight text
function highlightText(text, keyword) {
    if (!keyword) return escapeHTML(text);
    const normalizedText = removeAccents(text).toLowerCase();
    const normalizedKeyword = removeAccents(keyword).toLowerCase();

    let result = '';
    let lastIdx = 0;
    let idx = normalizedText.indexOf(normalizedKeyword);

    if (idx === -1) return escapeHTML(text);

    while (idx !== -1) {
        result += escapeHTML(text.substring(lastIdx, idx));
        result += `<mark>` + escapeHTML(text.substring(idx, idx + keyword.length)) + `</mark>`;
        lastIdx = idx + keyword.length;
        idx = normalizedText.indexOf(normalizedKeyword, lastIdx);
    }
    result += escapeHTML(text.substring(lastIdx));
    return result;
}

function renderReview(questionsToRender, keyword = "") {

    const fragment = document.createDocumentFragment();

    questionsToRender.forEach((q, qIndex) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'bg-white border rounded shadow-sm p-3 mb-3';
        
        const title = document.createElement('div');
        title.className = 'font-bold text-gray-800 mb-2 compact-text';
        title.innerHTML = `<span class="text-blue-600 mr-1">Câu ${qIndex + 1}:</span> ${highlightText(q.question, keyword)}`;
        qDiv.appendChild(title);

        const optContainer = document.createElement('div');
        optContainer.className = 'space-y-1.5 pl-1';

        const labels = ['A', 'B', 'C', 'D'];

        q.options.forEach((optText, oIndex) => {
            const div = document.createElement('div');
            const isCorrect = oIndex === q.correctIndex;
            
            // Xanh nhạt cho đúng, xám cho sai
            div.className = `flex items-start p-2 border rounded ${isCorrect ? 'bg-green-50 border-green-300' : 'bg-gray-50 border-gray-100'}`;
            
            const prefix = document.createElement('span');
            prefix.className = `font-semibold w-6 flex-shrink-0 ${isCorrect ? 'text-green-700' : 'text-gray-400'}`;
            prefix.innerText = `${labels[oIndex]}.`;

            const text = document.createElement('span');
            text.className = `compact-text pt-0.5 ${isCorrect ? 'text-green-800 font-medium' : 'text-gray-500'}`;
            text.innerHTML = highlightText(optText, keyword);

            div.appendChild(prefix);
            div.appendChild(text);

            if (isCorrect) {
                const icon = document.createElement('span');
                icon.className = 'ml-auto text-green-600 text-sm pl-2';
                icon.innerText = '✔️';
                div.appendChild(icon);
            }

            optContainer.appendChild(div);
        });

        qDiv.appendChild(optContainer);
        fragment.appendChild(qDiv);
    });

    container.appendChild(fragment);
}

        renderReview(allQuestions);

        if (removeAccents(q.question).toLowerCase().includes(normKey)) return true;
        for (let opt of q.options) {
            if (removeAccents(opt).toLowerCase().includes(normKey)) return true;
        }
        return false;
    });

    renderReview(filtered, keyword);
});
