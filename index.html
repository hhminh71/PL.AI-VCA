<!DOCTYPE html>

<head>

    <style>
        /* Sử dụng font chữ dễ đọc và hiện đại */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        /* Thiết lập các biến màu sắc và font chữ chung */
        :root {
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-color: #212529;
            --primary-color: #007bff;
            --border-color: #dee2e6;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --answer-color: #d9534f; /* Màu đỏ cho đáp án */
            --font-family: 'Inter', sans-serif;
        }

        /* Reset và thiết lập cơ bản cho body */
        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
        }

        /* Container chính của ứng dụng */
        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Tiêu đề trang */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #6c757d;
            font-size: 1rem;
        }

        /* Thanh tìm kiếm */
        .search-container {
            margin-bottom: 30px;
            position: sticky;
            top: 20px;
            background: var(--background-color);
            padding: 10px 0;
            z-index: 10;
        }

        #searchInput {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box; /* Đảm bảo padding không làm thay đổi width */
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        /* Danh sách câu hỏi */
        #question-container {
            display: grid;
            gap: 20px;
        }

        /* Thẻ chứa từng câu hỏi */
        .question-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .question-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        /* Phần câu hỏi trong thẻ */
        .question-card .question {
            font-weight: 600;
            margin-bottom: 15px;
            color: #343a40;
        }

        /* Phần các lựa chọn a, b, c, d */
        .question-card .options {
            padding-left: 20px;
            margin-bottom: 15px;
        }
        
        .question-card .options div {
             margin-bottom: 5px;
        }

        /* Phần đáp án được tô đỏ */
        .answer {
            color: var(--answer-color);
            font-weight: 600;
            background-color: rgba(217, 83, 79, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        /* Thông báo khi không tìm thấy kết quả */
        #no-results {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            display: none; /* Ẩn mặc định */
        }

        /* Responsive design cho thiết bị di động */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            header h1 {
                font-size: 1.8rem;
            }
            .search-container {
                top: 10px;
            }
        }
    </style>
</head>

        // --- LOGIC CỦA ỨNG DỤNG ---
        document.addEventListener('DOMContentLoaded', () => {
            const questionContainer = document.getElementById('question-container');
            const searchInput = document.getElementById('searchInput');
            const noResults = document.getElementById('no-results');

            // Hàm hiển thị danh sách câu hỏi
            const displayQuestions = (questions) => {
                questionContainer.innerHTML = ''; // Xóa nội dung cũ
                if (questions.length === 0) {
                    noResults.style.display = 'block';
                    return;
                }
                
                noResults.style.display = 'none';

                questions.forEach(q => {
                    const card = document.createElement('div');
                    card.className = 'question-card';

                    // Tạo phần các lựa chọn
                    let optionsHTML = '';
                    q.options.forEach(opt => {
                        // Kiểm tra nếu lựa chọn này là đáp án đúng
                        if (opt === q.answer) {
                            optionsHTML += `<div><span class="answer">${opt}</span></div>`;
                        } else {
                            optionsHTML += `<div>${opt}</div>`;
                        }
                    });

                    card.innerHTML = `
                        <div class="question">${q.question}</div>
                        <div class="options">
                            ${optionsHTML}
                        </div>
                    `;
                    questionContainer.appendChild(card);
                });
            };

            // Hàm lọc câu hỏi dựa trên từ khóa tìm kiếm
            const filterQuestions = () => {
                const searchTerm = searchInput.value.toLowerCase().trim();
                
                const filteredQuestions = questionData.filter(q => {
                    const questionText = q.question.toLowerCase();
                    const answerText = q.answer.toLowerCase();
                    const optionsText = q.options.join(' ').toLowerCase();
                    
                    return questionText.includes(searchTerm) || 
                           answerText.includes(searchTerm) || 
                           optionsText.includes(searchTerm);
                });

                displayQuestions(filteredQuestions);
            };

            // Gắn sự kiện 'input' để tìm kiếm real-time
            searchInput.addEventListener('input', filterQuestions);

            // Hiển thị tất cả câu hỏi khi trang được tải lần đầu
            displayQuestions(questionData);
        });
    </script>
