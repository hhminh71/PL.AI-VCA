# Thông tư 66/2026/TT-BXD
## THÔNG TIN CHUNG
### Ngày ban hành: 24/08/2026
### Ngày có hiệu lực: 08/10/2026
### Cơ quan ban hành: Bộ Xây dựng
### Phạm vi điều chỉnh
- Quản lý, bảo trì công trình hàng không.
- Áp dụng đối với cá nhân, cơ quan, tổ chức có liên quan.
### Văn bản thay thế
- Thông tư 24/2021/TT-BGTVT ngày 22/11/2021 (Bộ GTVT).
- Thông tư 56/2019/TT-BGTVT ngày 31/12/2019 (Bộ GTVT).
## GIẢI THÍCH TỪ NGỮ (Điều 2)
### Bảo dưỡng
- Hoạt động thường xuyên, định kỳ.
- Mục đích: duy trì trạng thái khai thác bình thường, hạn chế hư hỏng.
### Chủ quản lý, sử dụng
- Theo khoản 16 Điều 2 NĐ 207/2026/NĐ-CP.
- Trừ: doanh nghiệp kinh doanh, khai thác cảng.
### Công trình hàng không (CTHK)
#### CTHK do Nhà nước đầu tư, quản lý
- Tài sản kết cấu hạ tầng hàng không (điểm a khoản 2 Điều 5 NĐ 287/2025/NĐ-CP).
- Tài sản quốc phòng, an ninh sử dụng lưỡng dụng (điểm a khoản 6 Điều 42 NĐ 205/2026/NĐ-CP).
#### CTHK khác
- Các công trình còn lại theo khoản 1 Điều 3 NĐ 205/2026/NĐ-CP.
### Công tác khác
- Kiểm tra, quan trắc, kiểm định, đánh giá an toàn.
- Lập kế hoạch bảo trì hàng năm.
- Lập, thẩm tra, điều chỉnh quy trình bảo trì.
- Xây dựng định mức dự toán chưa có.
- Mua sắm vật tư dự phòng.
- Xử lý công trình, tài sản đảm bảo an toàn, an ninh.
### Cơ sở dữ liệu về bảo trì
- Thông tin, lịch sử bảo trì trên hệ thống.
- Thuộc CSDL hàng không dân dụng (Điều 19 NĐ 221/2026/NĐ-CP).
### Doanh nghiệp kinh doanh, khai thác cảng
- Quản lý tài sản kết cấu hạ tầng HK do Nhà nước đầu tư, quản lý.
- Quản lý tài sản QP, AN khai thác lưỡng dụng.
### Kiểm tra công trình
- Trực quan hoặc thiết bị chuyên dùng.
- Mục đích: phát hiện xuống cấp, hư hỏng.
- Phân loại: Thường xuyên, định kỳ, đột xuất.
### Sửa chữa công trình
#### Định kỳ
- Sửa chữa, thay thế, bổ sung theo quy trình và kế hoạch được duyệt.
#### Đột xuất
- Khi chịu tác động đột xuất (gió, bão, lũ, động đất, cháy, sự cố tàu bay...).
- Khi biểu hiện xuống cấp ảnh hưởng an toàn.
## QUẢN LÝ, BẢO TRÌ (Chương II)
### Yêu cầu chung (Điều 3)
#### Cơ sở pháp lý
- Theo NĐ 207/2026/NĐ-CP, Thông tư này, pháp luật liên quan.
- Riêng CT hạ tầng do NN đầu tư, quản lý: tuân thủ thêm NĐ 287/2025/NĐ-CP.
#### Yêu cầu với CT hạ tầng do NN đầu tư, quản lý
- Lập sổ theo dõi tình trạng kỹ thuật (Phụ lục I) HOẶC hồ sơ/CSDL số hóa.
- Lập biên bản xác nhận hiện trạng (Cảng vụ & Doanh nghiệp cảng - Phụ lục II) trước khi lập kế hoạch nhu cầu.
#### Mục tiêu
- Duy trì thời hạn sử dụng, an toàn khai thác/an ninh/an toàn hàng không/người/tài sản.
- Phòng chống cháy nổ, bảo vệ môi trường.
### Quy trình bảo trì (Điều 4)
#### Lập & Phê duyệt (CT hạ tầng do NN đầu tư)
- CT chưa có quy trình: DN cảng tổ chức lập, phê duyệt; kiểm định chất lượng nếu cần. Phải xác định thời gian sử dụng còn lại.
- Nâng cấp, mở rộng, cải tạo: Chủ đầu tư tổ chức lập, phê duyệt.
- Điều chỉnh: DN cảng thực hiện theo khoản 6 Điều 34 NĐ 207/2026/NĐ-CP.
### Kế hoạch bảo trì (Điều 5 - CT hạ tầng do NN đầu tư)
#### 1. Kế hoạch nhu cầu
##### Cơ sở lập
- Tình trạng kỹ thuật (sổ theo dõi/CSDL).
- Biên bản xác nhận hiện trạng.
- Quy trình bảo trì, định mức, quy chuẩn.
- Mức độ ưu tiên.
##### Mức độ ưu tiên
- Mức 1: Bảo dưỡng thường xuyên; chuyển tiếp năm trước; hư hỏng phải sửa ngay để ngăn chặn phát sinh; vật tư dự phòng.
- Mức 2: Dấu hiệu hư hỏng cần hạn chế phát sinh.
- Mức 3: Định kỳ theo tiêu chuẩn/tài liệu NSX.
- Mức 4: Nâng cao năng lực khai thác.
##### Thành phần hồ sơ
- Tờ trình (Phụ lục III).
- Kế hoạch nhu cầu (Phụ lục IV).
- Biên bản xác nhận hiện trạng (Phụ lục II).
##### Tiến độ trình & duyệt Kế hoạch nhu cầu
- DN cảng -> Cục HKVN: Trước 15/05 năm trước KH.
- Cục HKVN (thẩm định) -> Bộ Xây dựng: Trước 15/06 năm trước KH.
- Bộ Xây dựng -> Bộ Tài chính (Dự toán NSNN): Trước 20/07 năm trước KH.
##### Lập dự án/dự toán (sau khi có KH nhu cầu)
- DN cảng lập -> Cục HKVN (thẩm định/phê duyệt): Trước 20/11 năm trước KH.
#### 2. Kế hoạch quản lý, bảo trì
##### Tiến độ trình & duyệt
- DN cảng (căn cứ ngân sách/dự án) -> Cục HKVN (thẩm định): Trước 01/12 năm trước KH.
- Cục HKVN -> Bộ Xây dựng: Trước 10/12 năm trước KH.
- Bộ Xây dựng phê duyệt: Trước 25/12 năm trước KH.
#### 3. Điều chỉnh Kế hoạch
- Lý do: Phù hợp tình trạng thực tế.
- DN cảng -> Cục HKVN: Trước 01/10 năm KH.
- Cục HKVN -> Bộ Xây dựng: Trước 15/10 năm KH.
- Bộ Xây dựng phê duyệt điều chỉnh: Trước 31/10 năm KH.
### Thực hiện bảo trì (Điều 6 - CT hạ tầng do NN đầu tư)
#### Bảo dưỡng thường xuyên
- Nếu DN cảng tự làm: Lập biên bản nghiệm thu (Phụ lục V).
#### Sửa chữa đột xuất
- Thực hiện theo NĐ 287/2025/NĐ-CP.
- DN cảng + Cảng vụ xác nhận hiện trạng. DN cảng quyết định biện pháp và tổ chức sửa chữa.
#### Xử lý vật tư thu hồi
- Theo Điều 20 NĐ 287/2025/NĐ-CP.
### Quan trắc (Điều 7)
#### Danh mục bắt buộc (phục vụ bảo trì)
- Đường cất hạ cánh.
- Nhà ga hành khách, nhà ga hàng hóa.
- Khu kỹ thuật máy bay (hangar).
- Kho hàng hóa cấp I trở lên.
- CT kết cấu nhịp lớn dạng khung cấp đặc biệt.
- Đài kiểm soát không lưu cấp I trở lên.
#### Trách nhiệm
- Chủ quản lý, sử dụng & DN cảng tổ chức thực hiện.
### Quản lý chất lượng & Chi phí (Điều 8, Điều 9)
#### Tài liệu phục vụ
- Tài liệu khai thác công trình/sân bay.
- Sổ theo dõi kỹ thuật/CSDL.
- Quyết định/hồ sơ bàn giao tài sản.
#### Xác định chi phí
- Theo Thông tư 40/2026/TT-BXD.
### Báo cáo (Điều 10 - CT hạ tầng do NN đầu tư)
#### Cấp DN cảng báo cáo Cục HKVN
- Mẫu: Phụ lục VI.
- Hình thức: Điện tử.
- Thời hạn: Trước 15/02 năm sau KH.
- Tần suất: 1 lần/năm.
- Chốt số liệu: 01/01 - 31/12 năm KH.
#### Cấp Cục HKVN báo cáo Bộ Xây dựng
- Mẫu: Phụ lục VII.
- Hình thức: Điện tử.
- Thời hạn: Trước 25/02 năm sau KH.
- Tần suất: Hàng năm hoặc đột xuất.
## ĐÁNH GIÁ AN TOÀN (Chương III)
### Nội dung đánh giá (Điều 11)
- Đường cất hạ cánh: Chỉ số phân cấp mặt đường, hệ số ma sát.

## XỬ LÝ CÔNG TRÌNH NGUY HIỂM / HẾT HẠN (Chương IV)
### Dấu hiệu nguy hiểm, mất an toàn (Điều 13)

- Nếu phải dừng khai thác: Báo cáo Cảng vụ, Cục HKVN để đảm bảo an toàn hàng không.
### Hết thời hạn sử dụng (Điều 14)
- Không rõ thời hạn/Không có HS thiết kế: Tổ chức kiểm định đánh giá lại.
- Nhu cầu dùng tiếp (CT do NN đầu tư): DN cảng báo cáo -> Cục HKVN -> Bộ Xây dựng -> CQ Nhà nước có thẩm quyền xem xét kéo dài.
## TRÁCH NHIỆM CÁC BÊN (Điều 15)
### Cục Hàng không Việt Nam
- Kiểm tra KH bảo trì (CT do NN đầu tư): Định kỳ tối thiểu 1 lần/2 năm; hoặc đột xuất.
- Kiểm tra KH bảo trì (CT khác): Định kỳ tối thiểu 1 lần/3 năm; hoặc đột xuất.
- Cơ quan chuyên môn về xây dựng đối với CT do NN đầu tư.
- Giám sát an ninh, an toàn.
### Doanh nghiệp kinh doanh, khai thác cảng
- Kiểm tra, theo dõi định kỳ, sửa chữa hư hỏng CT do NN đầu tư.
- Chịu trách nhiệm nếu xảy ra sự cố/xuống cấp do không bảo trì.
- Nhập dữ liệu hệ thống.
### Chủ quản lý, sử dụng CTHK
- Quản lý, khai thác, bảo trì CTHK khác.
- Chịu trách nhiệm sự cố. Nhập dữ liệu hệ thống.
## CHUYỂN TIẾP (Điều 16)
- Kế hoạch bảo trì 2026 (CT do NN đầu tư) & KH đã duyệt (CTHK khác): Tiếp tục áp dụng theo quy định cũ.

- Phát sinh/Điều chỉnh mới từ 08/10/2026: Áp dụng Thông tư 66/2026/TT-BXD.

    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_TT66_2026.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
