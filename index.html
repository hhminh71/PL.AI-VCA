<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz & Ôn Tập Hàng Không</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.2;
            -webkit-tap-highlight-color: transparent;
            background-color: #f3f4f6;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Utility classes */
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
        .hidden-tab { display: none; }
        .sticky-top-controls { position: sticky; top: 96px; z-index: 40; } /* header(56) + tabs(40) */
        
        /* Highlight mark styling */
        mark { background-color: #fde047; color: #000; padding: 0 2px; border-radius: 2px; }
        
        /* Radio button sizing */
        input[type="radio"] { width: 1.1rem; height: 1.1rem; accent-color: #2563eb; margin-top: 1px;}
    </style>
</head>
<body class="text-gray-800 text-sm md:text-base">

    <!-- Header (Sticky) -->
    <header class="bg-blue-600 text-white p-2 sticky top-0 z-50 shadow-md h-[56px] flex flex-col justify-center">
        <div class="text-xs italic text-blue-100 mb-0.5">Huấn luyện Đào tạo Cảng HKQT Cần Thơ</div>
        <h1 class="font-bold text-base md:text-lg leading-tight uppercase truncate">Bảo Trì Công Trình Xây Dựng</h1>
    </header>

    <!-- Tabs (Sticky) -->
    <nav class="flex bg-white shadow-sm border-b sticky top-[56px] z-40 h-[40px]">
        <button id="tab-quiz" class="flex-1 py-2 text-center text-sm tab-active transition-colors" onclick="switchTab('quiz')">
            Thi Thử (40)
        </button>
        <button id="tab-review" class="flex-1 py-2 text-center text-sm text-gray-500 border-b-3 border-transparent transition-colors" onclick="switchTab('review')">
            Ôn Tập (Full)
        </button>
    </nav>

    <!-- TAB 1: THI THỬ -->
    <section id="section-quiz" class="pb-16 max-w-3xl mx-auto">
        <!-- Sticky Controls Top -->
        <div class="sticky-top-controls bg-white shadow p-2 flex justify-between items-center text-sm">
            <div class="flex flex-col">
                <div class="font-bold text-red-600 flex items-center gap-1">
                    ⏱ <span id="timerDisplay">00:00</span>
                </div>
                <div class="text-xs text-gray-500 font-medium" id="highScoreDisplay">Điểm cao: 0/40</div>
            </div>
            <div class="flex gap-2">
                <button id="btnRetryTop" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded font-medium transition" onclick="resetQuiz()">Làm Lại</button>
                <button id="btnSubmitTop" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium shadow transition" onclick="submitQuiz()">Nộp Bài</button>
                <button id="btnShareTop" class="hidden px-3 py-1.5 bg-green-500 hover:bg-green-600 text-white rounded font-medium shadow transition" onclick="shareResult()">Chia Sẻ</button>
            </div>
        </div>

        <!-- Quiz Container -->
        <div id="quizContainer" class="p-2 space-y-3 mt-2">
            <!-- Rendered via JS -->
        </div>

        <!-- Sticky Controls Bottom -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-center gap-4 z-40 md:static md:bg-transparent md:border-0 md:mt-4 md:mb-8">
            <button id="btnRetryBot" class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded font-bold transition flex-1 max-w-[200px]" onclick="resetQuiz()">Làm Lại</button>
            <button id="btnSubmitBot" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold shadow transition flex-1 max-w-[200px]" onclick="submitQuiz()">Nộp Bài</button>
        </div>
    </section>

    <!-- TAB 2: ÔN TẬP -->
    <section id="section-review" class="hidden-tab pb-10 max-w-3xl mx-auto">
        <!-- Sticky Search Bar -->
        <div class="sticky-top-controls bg-white shadow p-2">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Tìm kiếm câu hỏi hoặc đáp án..." class="w-full pl-8 pr-3 py-2 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm">
                <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- Review Container -->
        <div id="reviewContainer" class="p-2 space-y-3 mt-2">
            <!-- Rendered via JS -->
        </div>
    </section>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded shadow-lg text-sm transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        Đã copy kết quả!
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // --- 1. DỮ LIỆU RAW TEXT ---
        const rawDataString = `
Câu 1: Bảo trì công trình xây dựng là gì?
A. Xây dựng mới công trình
B. Sửa chữa khi hư hỏng nặng
C. Tập hợp các công việc duy trì hoạt động bình thường, an toàn
D. Chỉ kiểm tra công trình
Đáp án: C

Câu 2: Mục tiêu chính của công tác bảo trì là gì?
A. Duy trì an toàn khai thác bay, đảm bảo kết cấu hạ tầng luôn ở trạng thái kỹ thuật tốt nhất.
B. Kéo dài tuổi thọ công trình, hạn chế xuống cấp.
C. Tiết kiệm chi phí, tối ưu hóa nguồn lực bằng cách phát hiện sớm hư hỏng nhỏ để tránh sự cố lớn.
D. Cả 3 ý trên đều đúng.
Đáp án: D

Câu 3: Bảo trì công trình hàng không phải thực hiện theo gì?
A. Kinh nghiệm cá nhân, không cần quy trình
B. Theo nội dung, quy trình bảo trì, các tiêu chuẩn, quy trình chuẩn kỹ thuật, định mức kinh tế - kỹ thuật có liên quan đến bảo trì công trình hàng không.
C. Cả ý B và D
D. Theo kế hoạch bảo trì được lập trên cơ sở quy trình bảo trì được phê duyệt và hiện trạng công trình.
Đáp án: C

Câu 4: Đơn vị nào chịu trách nhiệm tổ chức và triển khai kế hoạch bảo trì?
A. Bộ Xây dựng
B. Nhà khai thác Cảng
C. Nhà thầu
D. Cục Hàng không Việt Nam
Đáp án: B

Câu 5: Nội dung đầu tiên khi xử lý hư hỏng công trình là gì?
A. Sửa chữa ngay
B. Xác định nguyên nhân
C. Báo cáo 
D. Đóng cửa sân bay
Đáp án: B

Câu 6: Công tác bảo trì ưu tiên theo thứ tự nào?
A. Bảo dưỡng thường xuyên → sửa chữa vừa/ lớn
B. Sửa chữa vừa/ lớn → bảo dưỡng thường xuyên
C. Sửa chữa càng nhanh càng tốt để bảo đảm việc khai thác máy bay
D. Không có thứ tự
Đáp án: A

Câu 7: Công tác duy tu, bảo dưỡng thường xuyên có đặc điểm gì?
A. Thực hiện hàng năm
B. Thực hiện khi có sự cố
C. Thực hiện hàng ngày
D. Do đơn vị ngoài thực hiện
Đáp án: C

Câu 8: Công tác bảo dưỡng “đột xuất” được thực hiện khi nào?
A. Theo kế hoạch
B. Khi có hư hỏng bất thường
C. Theo quý
D. Theo năm
Đáp án: B

Câu 9: Mục đích của chương trình bảo dưỡng là gì?
A. Phát hiện sớm hư hỏng.
B. Dự trù ngân sách, vật tư, nhân lực.
C. Giảm thiểu gián đoạn khai thác.
D. Cả 3 ý trên
Đáp án: D

Câu 10: Vết nứt BTXM nhỏ hơn 5 mm xử lý bằng cách nào?
A. Đập bỏ tấm
B. Rót nhựa hoặc vật liệu chèn khe
C. Không xử lý
D. Đổ bê tông mới
Đáp án: B

Câu 11: Khi sửa chữa vết nứt lớn xuyên tấm bê tông cần làm gì?
A. Chỉ trám bề mặt
B. Sơn phủ
C. Xẻ rãnh, làm sạch và chèn khe đúng kỹ thuật
D. Rót nhựa hoặc vật liệu chèn khe
Đáp án: C

Câu 12: sửa chữa bê tông nhựa bị võng mặt trong trường hợp nền bị lún cần xử lý thế nào?
A. Cắt khu vực BTN hư hỏng, vá lại bằng BTN mới, lu lèn chặt
B. Bao gồm cả nội dung A và C
C. Đào bỏ kết cấu phần hư hỏng đến phần nền, lu lèn chặt nền, hoàn trả bằng kết cấu tương tự đến lớp BTN
D. Đổ nhựa xuống khu vực lún trũng để đưa nó về độ cao ban đầu sau khi đầm
Đáp án: C

Câu 13: Trong công tác sơn tín hiệu, yêu cầu trước khi sơn là gì?
A. Sơn ngay
B. Làm sạch bề mặt và loại bỏ tạp chất
C. Tưới nước
D. Không cần chuẩn bị
Đáp án: B

Câu 14: Chỉ số PCI (Pavement Condition Index) là gì?
A. Chỉ số đo tải trọng mặt đường
B. Chỉ số đo độ nhám trực tiếp
C. Chỉ số đánh giá trạng thái bề mặt mặt đường
D. Chỉ số đo cường độ bê tông
Đáp án: C

Câu 15: Chỉ số PCI được biểu diễn theo thang điểm nào?
A. 0 – 10
B. 0 – 50
C. 0 – 100
D. 0 – 1000
Đáp án: C

Câu 16: Chỉ số PCI có thể phản ánh trực tiếp yếu tố nào sau đây?
A. Tình trạng hư hỏng bề mặt
B. Độ nhám mặt đường
C. Khả năng chống trơn trượt
D. Cường độ nền đất
Đáp án: A

Câu 17: Mục đích chính của việc đánh giá PCI là gì?
A. Đo tải trọng khai thác
B. Xác định nhu cầu và ưu tiên bảo trì
C. Xác định chiều dày kết cấu
D. Đo độ bằng phẳng
Đáp án: B

Câu 18: Chỉ số PCI trong khoảng 85 – 100 thể hiện tình trạng mặt đường như thế nào?
A. Rất kém
B. Trung bình
C. Tốt
D. Rất tốt
Đáp án: D

Câu 19: Theo phương pháp đánh giá PCI, bước đầu tiên là gì?
A. Tính toán PCI
B. Khảo sát hư hỏng
C. Chuẩn bị và phân chia ô mẫu
D. Lập báo cáo
Đáp án: C

Câu 20: Giá trị PCI được tính theo công thức nào?
A. PCI = CDVmax – 100
B. PCI = 100 – CDVmax
C. PCI = DV – CDV
D. PCI = DV × 100
Đáp án: B

Câu 21: Kết quả PCI được sử dụng để làm gì?
A. Xác định giá vật liệu
B. Lập kế hoạch bảo trì và sửa chữa
C. Tính toán kết cấu áo đường
D. Đo tải trọng máy bay
Đáp án: B

Câu 22: Bê tông nhựa (BTN) là gì?
A. Hỗn hợp xi măng và cát
B. Hợp chất asphalt trộn với vật liệu hạt
C. Hỗn hợp đá và nước
D. Hỗn hợp xi măng và phụ gia
Đáp án: B

Câu 23: Bê tông nhựa nóng có đặc điểm gì?
A. Trộn thủ công và để nguội
B. Không cần đầm nén
C. Chỉ dùng tạm thời
D. Trộn tại trạm, rải và đầm khi còn nóng
Đáp án: D

Câu 24: Lớp dính bám có tác dụng chính là gì?
A. Tăng tải trọng
B. Tạo liên kết giữa các lớp mặt đường
C. Làm phẳng mặt đường
D. Giảm chi phí
Đáp án: B

Câu 25: Vật liệu silicon được sử dụng trong trường hợp nào?
A. Đổ bê tông mới
B. Hàn gắn vết nứt và khe nối BTN
C. Làm lớp móng
D. Sơn tín hiệu
Đáp án: B

Câu 26: Vật liệu DOM1-17 có đặc điểm gì nổi bật?
A. Giá rẻ
B. Thi công lâu
C. Đạt cường độ khai thác nhanh (~2 giờ)
D. Chỉ dùng cho nền đất
Đáp án: C

Câu 27: Thiết bị nào dùng để cắt mặt đường tạo mép thẳng đứng?
A. Máy lu
B. Máy mài
C. Máy nén khí
D. Cưa máy lưỡi tròn
Đáp án: D

Câu 28: Thiết bị nào dùng để làm sạch khe nứt trước khi trám?
A. Xe lu
B. Máy làm sạch khe hoặc máy nén khí
C. Máy rải
D. Máy đầm
Đáp án: B

Câu 29: Thiết bị nào thuộc nhóm đầm nén?
A. Đầm cóc, xe lu
B. Máy cắt nguội
C. Máy phun sơn
D. Máy mài
Đáp án: A

Câu 30: CFME là gì?
A. Thiết bị đo độ cứng
B. Thiết bị đo ma sát liên tục
C. Thiết bị đo nhiệt
D. Thiết bị đo tải trọng
Đáp án: B

Câu 31: DOL là mức:
A. Ma sát tối thiểu
B. Ma sát mục tiêu thiết kế
C. Ma sát bảo trì
D. Ma sát nguy hiểm
Đáp án: B

Câu 32: MPL là mức:
A. Phải đóng đường CHC
B. Cảnh báo nguy hiểm
C. Cần lập kế hoạch bảo trì
D. Không cần xử lý
Đáp án: C

Câu 33: MFL là mức:
A. Ma sát tốt
B. Ma sát trung bình
C. Ma sát tối thiểu cho phép
D. Ma sát cao nhất
Đáp án: C

Câu 34: Nếu hệ số ma sát đường CHC dưới MFL thì:
A. Đóng sân bay
B. Phát hành NOTAM “ có thể trơn khi ướt” và thực hiện bảo trì ngay để khôi phục ma sát về mức chấp nhận được.
C. Phát hành NOTAM “ có thể trơn khi ướt”
D. Thực hiện bảo trì ngay để khôi phục ma sát về mức chấp nhận được.
Đáp án: B

Câu 35: Nếu số lần cất hạ cánh/một ngày ít hơn 300 thì chu kỳ đo tối đa được khuyến nghị giữa các lần đánh giá ma sát bề mặt đường CHC
A. 5 tháng
B. 8 tháng
C. 11 tháng
D. 12 tháng
Đáp án: C

Câu 36: Nếu số lần cất hạ cánh/một ngày lớn hơn 500 thì chu kỳ đo tối đa được khuyến nghị giữa các lần đánh giá ma sát bề mặt đường CHC
A. 5 tháng
B. 8 tháng
C. 11 tháng
D. 12 tháng
Đáp án: A

Câu 37: Điều kiện nào sau đây không triển khai đo ma sát liên tục trên đường CHC:
A. Trời nắng
B. Không mưa
C. Có nước đọng chiếm trên 25% diện tích khu vực được đánh giá
D. Trời khô
Đáp án: C

Câu 38: Đường cất hạ cánh có chiều rộng 45m, số lần chạy đánh giá ma sát bề mặt đường CHC dựa trên chiều rộng danh định của đường CHC
A. 8 lần (bao gồm 2 lần chạy thử + 6 lần chạy tiêu chuẩn)
B. 10 lần (bao gồm 2 lần chạy thử + 8 lần chạy tiêu chuẩn)
C. 12 lần (bao gồm 2 lần chạy thử + 10 lần chạy tiêu chuẩn)
D. 14 lần (bao gồm 2 lần chạy thử + 12 lần chạy tiêu chuẩn)
Đáp án: C

Câu 39: Bánh xe đo hệ số ma sát không được chạy dọc theo
A. Tim đường
B. Vạch sơn
C. Các mối nối mặt đường hoặc các vết nứt dọc
D. Mép đường
Đáp án: C

Câu 40: Hệ thống đèn tín hiệu hàng không có tác dụng cung cấp các thông tin nào cho phi công?
A. Để tiếp cận chính xác
B. Có tầm nhìn tốt để CHC
C. Để dễ dàng di chuyển trên các đường lăn, đường CHC.
D. Cả 03 ý trên đều đúng.
Đáp án: D

Câu 41: Phụ ước nào sau đây nói về các hệ thống đèn tín hiệu hàng không?
A. ICAO ANNEX 9
B. ICAO ANNEX 10
C. ICAO ANNEX 14
D. ICAO ANNEX 6
Đáp án: C

Câu 42: Trong trường hợp nào sau đây người lái đã điều chỉnh máy bay hạ cánh đúng góc quy định của hệ thống đèn PAPI gồm 4 bộ đèn?
A. Người lái nhìn thấy bốn đèn màu đỏ.
B. Người lái nhìn thấy ba đèn màu trắng, một đèn màu đỏ.
C. Người lái nhìn thấy một đèn màu trắng, ba đèn màu đỏ.
D. Người lái nhìn thấy hai đèn màu trắng, hai đèn màu đỏ.
Đáp án: D

Câu 43: Hệ thống đèn tiếp cận có màu gì?
A. Màu vàng
B. Màu trắng
C. Màu xanh
D. Màu đỏ
Đáp án: B

Câu 44: Hệ thống đèn tiếp cận trước thềm (Side row barrette) có màu gì?
A. Màu vàng
B. Màu đỏ
C. Màu xanh
D. Màu trắng
Đáp án: B

Câu 45: Đèn thềm đường CHC màu gì, lắp đặt như thế nào?
A. Màu xanh lá lắp quay về hướng tiếp cận.
B. Màu đỏ lắp quay về hướng tiếp cận
C. Màu xanh lắp quay về hướng đường CHC.
D. Màu vàng lắp quay về hướng tiếp cận
Đáp án: A

Câu 46: Đèn thềm có tác dụng gì?
A. Nhận biết khu vực đường lăn
B. Nhận biết đầu đường CHC
C. Nhận biết cuối đường CHC
D. Nhận biết đầu dải tiếp cận.

Câu 47: Đèn lề đường CHC có nửa bên màu trắng và nửa bên màu vàng được lắp ở vị trí nào?

`;

        // --- 2. LOGIC PARSE DỮ LIỆU ---
        let allQuestions = [];
        
        function parseData() {
            // Tách các câu hỏi bằng regex (tìm chữ Câu X:)
            const blocks = rawDataString.split(/(?=Câu \d+:)/).map(b => b.trim()).filter(b => b);
            
            allQuestions = blocks.map((block, index) => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                
                // Lấy nội dung câu hỏi
                const questionText = lines[0]; 
                
                // Tìm dòng đáp án
                const answerLine = lines.find(l => l.toLowerCase().startsWith('đáp án:'));
                const correctLetterMatch = answerLine ? answerLine.match(/Đáp án:\s*([A-D])/i) : null;
                const correctLetter = correctLetterMatch ? correctLetterMatch[1].toUpperCase() : 'A'; // Fallback an toàn
                
                // Lấy các option
                const optionLines = lines.filter(l => /^[A-D]\.\s/i.test(l));
                const options = optionLines.map(opt => {
                    const letter = opt.charAt(0).toUpperCase();
                    const text = opt.substring(2).trim(); // Bỏ "A. "
                    return {
                        text: text,
                        isCorrect: letter === correctLetter
                    };
                });
                
                return {
                    id: index + 1,
                    originalQ: questionText, // Gồm cả chữ Câu X:
                    options: options
                };
            });
        }

        // --- 3. BIẾN GLOBAL & TIỆN ÍCH ---
        let quizQuestions = [];
        let isReviewRendered = false; // CỜ HIỆU QUAN TRỌNG ĐỂ FIX BUG TAB TRẮNG
        let timerInterval;
        let secondsElapsed = 0;
        let isSubmitted = false;
        let currentScore = 0;
        let currentSubmitTime = "";
        
        const MAX_QUESTIONS = 40;

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function removeDiacritics(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
        }

        // --- 4. LOGIC TAB & HIỂN THỊ ---
        function switchTab(tabName) {
            const tQuiz = document.getElementById('tab-quiz');
            const tReview = document.getElementById('tab-review');
            const sQuiz = document.getElementById('section-quiz');
            const sReview = document.getElementById('section-review');

            if (tabName === 'quiz') {
                tQuiz.classList.add('tab-active'); tQuiz.classList.remove('text-gray-500', 'border-transparent');
                tReview.classList.remove('tab-active'); tReview.classList.add('text-gray-500', 'border-transparent');
                sQuiz.classList.remove('hidden-tab');
                sReview.classList.add('hidden-tab');
            } else {
                tReview.classList.add('tab-active'); tReview.classList.remove('text-gray-500', 'border-transparent');
                tQuiz.classList.remove('tab-active'); tQuiz.classList.add('text-gray-500', 'border-transparent');
                sReview.classList.remove('hidden-tab');
                sQuiz.classList.add('hidden-tab');
                
                // RENDER TRỰC TIẾP DỰA VÀO CỜ HIỆU (FIX BUG)
                if (!isReviewRendered) {
                    renderReview();
                    isReviewRendered = true;
                }
            }
        }

        // --- 5. LOGIC THI THỬ (QUIZ) ---
        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timerDisplay').innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timerDisplay').innerText = formatTime(secondsElapsed);
            }, 1000);
        }

        function loadHighScore() {
            const high = localStorage.getItem('quizScoreHK') || 0;
            document.getElementById('highScoreDisplay').innerText = `Điểm cao: ${high}/40`;
        }

        function saveHighScore(score) {
            const high = parseInt(localStorage.getItem('quizScoreHK') || '0');
            if (score > high) {
                localStorage.setItem('quizScoreHK', score);
                loadHighScore();
            }
        }

        function initQuiz() {
            isSubmitted = false;
            // Ẩn nút share
            document.getElementById('btnShareTop').classList.add('hidden');
            // Hiện lại nút nộp bài
            document.getElementById('btnSubmitTop').classList.remove('hidden');
            document.getElementById('btnSubmitBot').classList.remove('hidden');
            
            // Xáo trộn và chọn 40 câu
            let shuffledPool = shuffleArray([...allQuestions]);
            let selectedPool = shuffledPool.slice(0, MAX_QUESTIONS);
            
            // Deep copy và xáo trộn đáp án
            quizQuestions = selectedPool.map(q => {
                let optionsCopy = [...q.options];
                return {
                    ...q,
                    options: shuffleArray(optionsCopy)
                };
            });

            renderQuiz();
            startTimer();
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            let html = '';
            
            quizQuestions.forEach((q, qIndex) => {
                // Xóa chữ "Câu X:" cũ để đánh số lại 1->40 cho đẹp
                const cleanQuestionText = q.originalQ.replace(/^Câu\s+\d+:\s*/i, '');
                
                html += `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100" id="q-card-${qIndex}">
                    <h3 class="font-bold text-gray-800 mb-2 leading-snug"><span class="text-blue-600">Câu ${qIndex + 1}:</span> ${cleanQuestionText}</h3>
                    <div class="space-y-1">
                `;
                
                const labels = ['A', 'B', 'C', 'D'];
                q.options.forEach((opt, optIndex) => {
                    html += `
                        <label class="flex items-start gap-2 p-1.5 rounded-lg border border-transparent hover:bg-gray-50 cursor-pointer transition w-full" id="lbl-${qIndex}-${optIndex}">
                            <input type="radio" name="q${qIndex}" value="${optIndex}" class="mt-0.5 flex-shrink-0 cursor-pointer">
                            <span class="flex-1 text-gray-700 leading-snug"><span class="font-semibold text-gray-500 mr-1">${labels[optIndex]}.</span>${opt.text}</span>
                        </label>
                    `;
                });
                
                html += `</div></div>`;
            });
            
            container.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function submitQuiz() {
            if (isSubmitted) return;
            clearInterval(timerInterval);
            isSubmitted = true;
            currentScore = 0;
            currentSubmitTime = formatTime(secondsElapsed);

            quizQuestions.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`q${qIndex}`);
                let selectedVal = null;
                
                radios.forEach(r => {
                    r.disabled = true; // Khóa input
                    if (r.checked) selectedVal = parseInt(r.value);
                });

                q.options.forEach((opt, optIndex) => {
                    const lbl = document.getElementById(`lbl-${qIndex}-${optIndex}`);
                    
                    if (opt.isCorrect) {
                        // Đáp án đúng luôn tô xanh lá
                        lbl.classList.add('bg-green-100', 'border-green-300');
                        lbl.querySelector('span.flex-1').innerHTML += ` <span class="text-green-600 font-bold">✔️</span>`;
                        if (selectedVal === optIndex) currentScore++;
                    } else if (selectedVal === optIndex) {
                        // Chọn sai thì tô đỏ
                        lbl.classList.add('bg-red-100', 'border-red-300');
                        lbl.querySelector('span.flex-1').innerHTML += ` <span class="text-red-600 font-bold">✖️</span>`;
                    }
                });
            });

            // UI Updates
            saveHighScore(currentScore);
            alert(`NỘP BÀI THÀNH CÔNG!\nĐiểm của bạn: ${currentScore}/${MAX_QUESTIONS}\nThời gian: ${currentSubmitTime}`);
            
            document.getElementById('btnSubmitTop').classList.add('hidden');
            document.getElementById('btnSubmitBot').classList.add('hidden');
            document.getElementById('btnShareTop').classList.remove('hidden');
        }

        function resetQuiz() {
            if (confirm("Bạn có chắc muốn làm bài mới? Kết quả hiện tại sẽ không được lưu nếu chưa nộp.")) {
                initQuiz();
            }
        }

        function shareResult() {
            const text = `🎯 Điểm số: ${currentScore}/${MAX_QUESTIONS}\n⏱ Thời gian: ${currentSubmitTime}\n📚 Đào tạo Cảng HKQT Cần Thơ`;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0');
                setTimeout(() => { toast.classList.add('opacity-0'); }, 2000);
            });
        }

        // --- 6. LOGIC ÔN TẬP (REVIEW) ---
        function highlightText(text, keyword) {
            if (!keyword) return text;
            const textNoTone = removeDiacritics(text).toLowerCase();
            const keywordNoTone = removeDiacritics(keyword).toLowerCase();
            
            if (keywordNoTone === '') return text;

            let result = '';
            let startIndex = 0;
            let index = textNoTone.indexOf(keywordNoTone, startIndex);

            if (index === -1) return text;

            while (index !== -1) {
                result += text.substring(startIndex, index);
                result += `<mark>` + text.substring(index, index + keyword.length) + `</mark>`;
                startIndex = index + keyword.length;
                index = textNoTone.indexOf(keywordNoTone, startIndex);
            }
            result += text.substring(startIndex);
            return result;
        }

        function renderReview(filterText = "") {
            const container = document.getElementById('reviewContainer');
            const searchRaw = removeDiacritics(filterText).toLowerCase().trim();
            let html = '';
            let count = 0;

            allQuestions.forEach(q => {
                // Kiểm tra match (Câu hỏi hoặc đáp án)
                const qTextNoTone = removeDiacritics(q.originalQ).toLowerCase();
                const optsNoTone = q.options.map(o => removeDiacritics(o.text).toLowerCase()).join(" ");
                
                if (searchRaw === "" || qTextNoTone.includes(searchRaw) || optsNoTone.includes(searchRaw)) {
                    count++;
                    const highlightedQ = highlightText(q.originalQ, filterText);
                    
                    html += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                        <h3 class="font-bold text-gray-800 mb-2 leading-snug">${highlightedQ}</h3>
                        <div class="space-y-1">
                    `;
                    
                    const labels = ['A', 'B', 'C', 'D'];
                    q.options.forEach((opt, optIndex) => {
                        const highlightedOpt = highlightText(opt.text, filterText);
                        
                        if (opt.isCorrect) {
                            html += `
                            <div class="flex items-start gap-2 p-1.5 rounded-lg bg-green-50 border border-green-200 w-full">
                                <span class="font-bold text-green-700 w-4">${labels[optIndex]}.</span>
                                <span class="flex-1 text-green-800 font-medium leading-snug">${highlightedOpt} <span class="ml-1">✔️</span></span>
                            </div>`;
                        } else {
                            html += `
                            <div class="flex items-start gap-2 p-1.5 rounded-lg w-full">
                                <span class="font-semibold text-gray-400 w-4">${labels[optIndex]}.</span>
                                <span class="flex-1 text-gray-500 leading-snug">${highlightedOpt}</span>
                            </div>`;
                        }
                    });
                    
                    html += `</div></div>`;
                }
            });

            if (count === 0) {
                html = `<div class="text-center text-gray-500 py-10">Không tìm thấy câu hỏi nào phù hợp.</div>`;
            }
            
            container.innerHTML = html;
        }

        // Gắn sự kiện Search realtime
        document.getElementById('searchInput').addEventListener('input', function(e) {
            renderReview(e.target.value);
        });

        // --- 7. KHỞI TẠO APP ---
        window.onload = () => {
            parseData();
            loadHighScore();
            initQuiz();
        };
    </script>
