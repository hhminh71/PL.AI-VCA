    let quizSet = [];

    // Hàm tạo số ngẫu nhiên có hạt giống (Seeded PRNG) giúp sinh ra đề thi cố định theo Mã đề
    function seededRandom() {
        var x = Math.sin(currentSeed++) * 10000;
        return x - Math.floor(x);
    }

    // Trộn mảng dựa trên Seed
    function shuffleArray(array) {
        let arr = array.slice();
        let m = arr.length, t, i;
        while (m) {
            i = Math.floor(seededRandom() * m--);
            t = arr[m];
            arr[m] = arr[i];
            arr[i] = t;
        }
        return arr;
    }

    // Sinh chuỗi hash từ Mã đề dạng chữ/số
    function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            let char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return Math.abs(hash) + 1;
    }

            codeInput = Math.floor(Math.random() * 900 + 100).toString(); // Mã ngẫu nhiên 3 số
        }
        
        document.getElementById('setup-container').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('exam-code-display').innerText = `Mã đề: ${codeInput}`;

        // Đặt Seed dựa vào Mã đề
        currentSeed = hashCode(codeInput);
        
        // Trộn và chọn 40 câu hỏi dựa trên Seed
        // (Trong demo này mảng nguồn có khoảng 40 câu, nhưng thuật toán vẫn xáo trộn vị trí)
        quizSet = shuffleArray(sourceData).slice(0, 40);
        
        currentIdx = 0;
        score = 0;
        updateScore();
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        
        const qData = quizSet[currentIdx];
        document.getElementById('question-count').innerText = `Câu: ${currentIdx + 1}/40`;
        document.getElementById('question-text').innerText = qData.q;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        container.classList.remove('disabled');

        // Trộn các lựa chọn A, B, C, D (cũng dựa trên Seed của mã đề đó)
        const shuffledOpts = shuffleArray(qData.opts);

        shuffledOpts.forEach(opt => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.innerHTML = `
                <input type="radio" name="answerChoice" value="${opt}">
                <span>${opt}</span>
            `;
            container.appendChild(label);
        });
    }

    function submitAnswer() {
        const selectedRadio = document.querySelector('input[name="answerChoice"]:checked');
        if (!selectedRadio) {
            alert("⚠️ Bạn chưa chọn đáp án nào. Hãy chọn một đáp án trước khi Nộp bài!");
            return;
        }

        const qData = quizSet[currentIdx];
        const selectedValue = selectedRadio.value;
        const container = document.getElementById('options-container');
        
        container.classList.add('disabled');
        document.getElementById('submit-btn').style.display = 'none';

        const labels = container.querySelectorAll('.option-label');

        if (selectedValue === qData.ans) {
            score += 0.25;
            document.getElementById('audio-correct').currentTime = 0;
            document.getElementById('audio-correct').play();
            
            selectedRadio.parentElement.classList.add('correct-ans');
            selectedRadio.parentElement.innerHTML += '<span class="result-icon">🎉 ✅</span>';
        } else {
            document.getElementById('audio-wrong').currentTime = 0;
            document.getElementById('audio-wrong').play();
            
            selectedRadio.parentElement.classList.add('wrong-ans');
            selectedRadio.parentElement.innerHTML += '<span class="result-icon">❌</span>';
            
            labels.forEach(label => {
                const radio = label.querySelector('input');
                if (radio && radio.value === qData.ans) {
                    label.classList.add('correct-ans');
                    label.innerHTML += '<span class="result-icon">✅ (Đáp án đúng)</span>';
                }
            });
        }

        updateScore();
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function updateScore() {
        document.getElementById('score-display').innerText = `Điểm: ${score.toFixed(2)}`;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizSet.length) {
            loadQuestion();
        } else {
            document.getElementById('question-text').innerText = `🎓 Bạn đã hoàn thành bài thi!\nTổng điểm của bạn là: ${score.toFixed(2)} / 10 điểm.`;
            document.getElementById('options-container').innerHTML = '';
            document.getElementById('submit-btn').style.display = 'none';
            
            const btnNext = document.getElementById('next-btn');
            btnNext.innerText = 'Chơi lại đề mới';
            btnNext.style.display = 'inline-block';
            
            // Lệnh tự động tải lại trang
            btnNext.onclick = function() {
                location.reload(); 
            };
        }
    }
</script>
</body>
</html>
