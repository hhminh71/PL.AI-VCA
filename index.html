# NGHỊ ĐỊNH 212/2026/NĐ-CP
## I. THÔNG TIN CHUNG VÀ CẤU TRÚC
### 1. Thông tin ban hành và Hiệu lực
#### Ký ban hành
- Cơ quan: Bộ Xây dựng (Cục Kinh tế - Quản lý ĐTXD)
- Ngày ban hành: 17/06/2026
#### Hiệu lực thi hành
- Ngày có hiệu lực: 01/07/2026
- Bãi bỏ: NĐ 111/2024/NĐ-CP hết hiệu lực
### 2. Cấu trúc (6 Chương - 58 Điều)
#### Chương I: Quy định chung (Điều 1-8)
#### Chương II: CSDL quốc gia về HĐXD (Điều 9-21)
- Mục 1: Quy hoạch ĐT & NT (Điều 9-12)
- Mục 2: Dự án ĐTXD, công trình XD (Điều 13-15)
- Mục 3: Định mức, giá XD, chỉ số giá (Điều 16-17)
- Mục 4: Năng lực HĐXD (Điều 18-21)
#### Chương III: Khai thác, sử dụng, kết nối dữ liệu (Điều 22-26)
#### Chương IV: Năng lực hoạt động xây dựng (Điều 27-49)
#### Chương V: Trách nhiệm của cơ quan, tổ chức (Điều 50-54)
#### Chương VI: Điều khoản thi hành (Điều 55-58)
### 3. Phạm vi và Đối tượng
#### Phạm vi điều chỉnh
- Xây dựng, quản lý, khai thác HTTT, CSDL quốc gia về HĐXD
- Điều kiện năng lực tổ chức, cá nhân; Giấy phép nhà thầu nước ngoài
- Công khai năng lực tổ chức
#### Đối tượng áp dụng & Không áp dụng
- Áp dụng: Cơ quan QLNN, Tổ chức/cá nhân trong nước & nước ngoài tại VN
- KHÔNG áp dụng: Quy hoạch/Dự án/Công trình Quốc phòng, An ninh, Cơ yếu, Bí mật nhà nước

## II. HỆ THỐNG THÔNG TIN & CSDL QUỐC GIA
### 1. Tổ chức Hệ thống
#### Cơ quan chủ quản và Nền tảng
- Chủ quản: Bộ Xây dựng (Xây dựng tập trung, thống nhất toàn quốc)
- Hạ tầng: Lưu trữ, xử lý, kết nối trên nền tảng điện toán đám mây
#### Phân chia hệ thống
- Hệ thống chính (csdlhdxd.gov.vn): CSDL HĐXD, Năng lực, Dự án
- Hệ thống độc lập (cemia.gov.vn): Định mức xây dựng, Giá XD, Chỉ số giá
#### Giá trị pháp lý & Yêu cầu
- Dữ liệu có giá trị khai thác, sử dụng hợp pháp khi được tạo lập, xác thực đúng thẩm quyền
- Yêu cầu: Hoạt động liên tục, chính xác; phục vụ thủ tục toàn trình; phân tích AI/cảnh báo sớm
### 2. Nguyên tắc tạo lập và cập nhật
#### Nhóm CSDL Quốc gia
- Quy hoạch: Thu thập qua Thẩm định, phê duyệt nhiệm vụ & QH
- Dự án & Công trình: Thu thập qua Thẩm định BCNCKT, Cấp GPXD, Khởi công, Xử phạt, Kiểm tra NT
- Năng lực tổ chức/cá nhân: Thu thập qua Cấp CCHN, GPXD, Kiểm tra NT
- Khác: Đồng bộ từ CSDL Tiêu chuẩn đo lường, Số hóa hồ sơ Nhà nước
#### Nhóm CSDL Chuyên ngành
- Do tổ chức, cá nhân thực hiện và cập nhật
- Bắt buộc khai báo kết quả các thủ tục trước đó khi làm thủ tục tiếp theo
### 3. Quy định về Mã Định Danh (ID)
#### Nguyên tắc
- Duy nhất trọn vòng đời cho: Quy hoạch, Dự án, Công trình, Năng lực cá nhân/tổ chức, Định mức/Giá
- Mọi kết quả thủ tục bước sau phải gắn liền với Mã định danh đã khởi tạo
### 4. Chi tiết các CSDL thành phần
#### CSDL Quy hoạch Đô thị & Nông thôn
- Trình thẩm định: Khởi tạo mã định danh
- Cập nhật hồ sơ: Trong 15 ngày kể từ ngày được phê duyệt
#### CSDL Dự án ĐTXD & Công trình
- Khởi tạo mã khi tiếp nhận thủ tục đầu tiên
- Cơ quan thụ lý kiểm tra, chuẩn hóa dữ liệu trước khi đưa lên CSDL Quốc gia
#### CSDL Định mức, Giá, Chỉ số giá
- Thời hạn cập nhật: Trong 05 ngày làm việc kể từ ngày ban hành (Riêng định mức kinh tế - kỹ thuật là 10 ngày)
#### CSDL Năng lực HĐXD
- Cá nhân: Mã ID là Số CCCD/Định danh cá nhân (hoặc Hộ chiếu với người nước ngoài)
- Tổ chức: Mã ID là Mã số doanh nghiệp
- Chứng chỉ điện tử: Có giá trị pháp lý tương đương bản giấy
### 5. Khai thác, Kết nối và Điều chỉnh
#### Quy định khai thác
- Cơ quan NN: KHÔNG được yêu cầu tổ chức/cá nhân nộp giấy tờ đã có trên CSDL
- Cung cấp dữ liệu (không mở): Xử lý trả lời trong 03 ngày làm việc
#### Điều chỉnh dữ liệu
- Cơ quan tạo lập có trách nhiệm rà soát, chuẩn hóa, điều chỉnh ngay khi phát hiện dữ liệu sai lệch hồ sơ gốc
- Bắt buộc kết nối với CSDL Đất đai phục vụ quản lý

## III. QUẢN LÝ NĂNG LỰC HĐXD
### 1. Chứng chỉ hành nghề (CCHN) Cá nhân
#### Các lĩnh vực Yêu cầu & Miễn trừ
- Bắt buộc có CCHN: Khảo sát, Lập quy hoạch, Thiết kế, Giám sát
- Chỉ yêu cầu Điều kiện/Kinh nghiệm (Không cần CCHN): Giám đốc QLDA, Chỉ huy trưởng công trường
- Không yêu cầu CCHN: Thiết kế sơ bộ, hệ thống viễn thông, hoàn thiện phi kết cấu, cây xanh, chiếu sáng...
#### Điều kiện chung & Thời hạn
- Thời hạn CCHN mới: 10 năm. Người nước ngoài tối đa 10 năm theo Giấy phép lao động.
- Hạng I: Đại học + Kinh nghiệm ≥ 07 năm
- Hạng II: Đại học + Kinh nghiệm ≥ 04 năm
- Hạng III: Đại học ≥ 02 năm HOẶC Cao đẳng ≥ 03 năm
- Ngoại lệ: Kinh nghiệm > 10 năm được xin cấp hạng thấp hơn 1 bậc.
#### Quy trình cấp & Thu hồi (MỚI)
- BÃI BỎ hoàn toàn quy định THI SÁT HẠCH CCHN.
- Thời gian cấp: Cấp mới (06 ngày làm việc); Cấp lại (05 ngày); Chuyển đổi (11 ngày).
- Thông báo hồ sơ lỗi: 1 lần duy nhất trong 05 ngày làm việc.
- Thẩm quyền cấp: UBND Cấp tỉnh (Loại bỏ quyền của các tổ chức xã hội nghề nghiệp).
### 2. Quản lý Tổ chức & Nhà thầu nước ngoài
#### Công khai năng lực Tổ chức
- Tự công khai thông tin (MST, người đại diện, năng lực) trên hệ thống csdlhdxd.gov.vn
- Thay thế hoàn toàn cho thủ tục cấp Chứng chỉ năng lực tổ chức. Mọi thay đổi lưu vết trên nhật ký.
#### Giấy phép HĐXD của Nhà thầu nước ngoài
- Điều kiện cốt lõi: Phải có quyết định trúng thầu/chọn thầu.
- Bắt buộc liên danh hoặc sử dụng nhà thầu phụ Việt Nam (trừ khi VN không có khả năng thực hiện).
- Thời gian cấp phép: 06 ngày làm việc (UBND Cấp tỉnh cấp).

## IV. TRÁCH NHIỆM & ĐIỂM NHẤN CHUYỂN TIẾP
### 1. Phân công Trách nhiệm
#### Bộ Xây dựng
- Quản lý toàn hệ thống, hướng dẫn mã định danh, giám sát cấp CCHN/GPXD.
#### Bộ, Ngành, Địa phương
- Chịu trách nhiệm trực tiếp về pháp lý và độ chính xác của dữ liệu cập nhật.
- Kết quả báo cáo tự động trên hệ thống là căn cứ đánh giá thi đua, khen thưởng, kỷ luật.
### 2. Quy định Chuyển tiếp & 5 Điểm Cốt lõi
#### Chuyển tiếp
- Kết quả từ 01/01/2026 - 30/06/2026: Phải được hồi tố, cập nhật đầy đủ lên hệ thống.
- Hồ sơ CCHN nộp trước 01/07: Xét theo NĐ 175/2024. Nếu đủ điều kiện thi -> Cấp thẳng không cần thi sát hạch.
#### 5 Điểm mới Đột phá
- 1. Chuyển đổi số: Mã định danh duy nhất quản lý trọn đời dự án/cá nhân, CSDL là nền tảng cốt lõi.
- 2. Đơn giản hóa: Bỏ thi sát hạch CCHN cá nhân; Chuyển CCHN QLDA thành "điều kiện hành nghề".
- 3. Trách nhiệm Cơ quan NN: Không được hành dân (đòi giấy tờ đã có trên mạng); Bắt buộc tự sửa sai nếu nhập liệu nhầm.
- 4. Cải cách cấp phép: UBND Tỉnh độc quyền cấp CCHN; Chứng chỉ điện tử 100%.
- 5. Quản lý Doanh nghiệp: Chuyển từ "Cấp chứng chỉ năng lực" sang "Doanh nghiệp tự công khai và chịu trách nhiệm".

    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
