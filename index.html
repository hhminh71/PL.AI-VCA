# 🗂️ TỔNG HỢP VĂN BẢN QUY PHẠM PHÁP LUẬT THÁNG 04 - 05/2026
*(Nội dung bóc tách chi tiết phục vụ hoạt động ACV & Cảng HKQT Cần Thơ)*

## 💰 I. LĨNH VỰC TÀI CHÍNH - KẾ TOÁN - THUẾ - TÀI SẢN
### 1. NĐ 114/2026/NĐ-CP (Hiệu lực: 20/05/2026) - Xử phạt VPHC quản lý giá
#### Sửa đổi thuật ngữ
- Đơn giản hóa: Đổi từ "thanh tra chuyên ngành về giá..." thành **"thanh tra, kiểm tra về giá, thẩm định giá"**.
#### Xử lý vi phạm điện tử
- Cho phép xử phạt VPHC trên môi trường điện tử (yêu cầu hạ tầng kỹ thuật đảm bảo).
#### Thẩm quyền mức phạt
- Đối tượng: Thanh tra viên các bộ/ngành.
- Khung phạt tối đa: Lên đến **150.000.000 VNĐ**.

### 2. NĐ 132/2026/NĐ-CP (Hiệu lực: 21/05/2026) - Xử phạt VPHC Kế toán, Kiểm toán
#### Đối tượng & Phạm vi
- Vi phạm kế toán, kiểm toán độc lập, bao gồm cả phòng chống rửa tiền/tài trợ khủng bố.
#### Nguyên tắc phạt
- **Mức phạt Tổ chức = 2 lần mức phạt Cá nhân**.
- Cho phép xử lý vi phạm hành chính trên môi trường điện tử.
#### Thời hiệu xử phạt
- Tính từ thời điểm chấm dứt vi phạm (đối với hành vi đã kết thúc).
- Tính từ lúc phát hiện (đối với hành vi đang diễn ra).

### 3. NĐ 144/2026/NĐ-CP (Hiệu lực: 20/06/2026) - Luật Thuế GTGT (sửa đổi)
#### Bổ sung dịch vụ KHÔNG chịu thuế
- Bảo hiểm nhân thọ, bảo hiểm sức khỏe.
- Doanh thu từ đại lý bán hàng/dịch vụ, hoa hồng môi giới bảo hiểm.
#### Quy định khấu trừ thuế đầu vào (Hàng trả chậm)
- Áp dụng cho: Hàng hóa/dịch vụ mua trả chậm, trả góp giá trị **từ 5.000.000 VNĐ trở lên**.
- Đặc quyền: Cho phép khấu trừ ngay cả khi **chưa có chứng từ thanh toán không dùng tiền mặt**.
- Chế tài: Nếu đến hạn thanh toán mà không có chứng từ, doanh nghiệp phải **điều chỉnh giảm số thuế GTGT đầu vào** đã khấu trừ.

### 4. TT 43/2026/TT-BTC (Hiệu lực: 20/04/2026) - Báo cáo tài chính hợp nhất
#### Thời hạn nộp & Công khai
- Thời hạn nộp: Chậm nhất **90 ngày** kể từ ngày kết thúc kỳ kế toán năm.
#### Các chỉ tiêu bổ sung mới
- Báo cáo tình hình TC: Bổ sung *"Lợi thế thương mại"*, *"Lợi ích cổ đông không kiểm soát"*.
- Báo cáo KQ HĐKD: Bổ sung *"Lãi/lỗ trong cty liên doanh liên kết"*, *"Lợi nhuận sau thuế của công ty mẹ"*.
#### Quy tắc hợp nhất Công ty con
- Hợp nhất từ ngày công ty mẹ nắm quyền kiểm soát, dừng khi mất quyền.
- Tỷ giá chuyển đổi (nếu khác đồng tiền): Theo tỷ giá thực tế cuối kỳ hoặc tỷ giá mua bán chuyển khoản trung bình của ngân hàng giao dịch thường xuyên.
#### Đổi thuật ngữ kế toán
- "Bảng cân đối kế toán" -> **"Báo cáo tình hình tài chính"**.
- "Thặng dư vốn cổ phần" -> **"Thặng dư vốn"**.

### 5. TT 45/2026/TT-BTC (Hiệu lực: 15/06/2026) - Xử phạt VPHC Quản lý Tài sản công
#### Quy tắc xác định giá trị tài sản
- Mặc định: Dựa trên giá trị còn lại theo sổ kế toán.
- Trường hợp Giá trị sổ = 0: Tính bằng **20% nguyên giá**.
- Chưa ghi sổ: Xác định qua nguồn gốc, hồ sơ liên quan.
- Phương án cuối cùng: Thành lập **Hội đồng định giá**.
#### Hội đồng định giá
- Cơ chế: Hoạt động tập thể, khảo sát giá thực tế.
- Quyết định: Dựa theo ý kiến đa số thành viên.

## ✈️ II. LĨNH VỰC KHAI THÁC & DỊCH VỤ HÀNG KHÔNG
### 1. TT 40/2026/TT-BTC (Hiệu lực: 07/04/2026) - Phí/Lệ phí Hàng không
#### Đối tượng áp dụng
- Miễn một số khoản phí, lệ phí theo TT 193/2016 nhằm hỗ trợ HĐKD Giao thông Vận tải.
#### Ngoại lệ KHÔNG MIỄN PHÍ
- Vẫn thu **Phí thẩm định cấp giấy phép ra vào khu vực hạn chế tại Cảng hàng không, sân bay**.

### 2. TT 23/2026/TT-BXD (Hiệu lực: 01/07/2026) - Giá dịch vụ HKDD
#### Quy định Đồng tiền thanh toán
- Chuyến bay nội địa: Thanh toán bằng **VNĐ**.
- Chuyến bay quốc tế: Thanh toán bằng **USD** (tuân thủ luật ngoại hối).
#### Chính sách Ưu đãi & Giảm giá (Lên đến 50%)
- Giảm phí cất/hạ cánh, điều hành bay cho: Chuyến bay đào tạo phi công, hãng HK mới vào thị trường, Cảng HK chưa có hãng khai thác thường lệ trong 12 tháng.
#### Miễn phí dịch vụ cất/hạ cánh/điều hành
- Áp dụng: Chuyên cơ, công vụ, tìm kiếm cứu nạn, chuyến bay quay lại do bất khả kháng.
#### Thẩm quyền định giá
- Cục HKVN thẩm định -> Bộ Xây dựng ra quyết định (Giá cụ thể/Khung giá/Giá tối đa).

### 3. TT 18/2026/TT-BXD (Hiệu lực: 01/07/2026) - Chương trình An toàn HKDD
#### Mục tiêu An toàn (SMS)
- Bảo đảm an toàn là số 1, duy trì **không có tai nạn chết người**.
- Yêu cầu xây dựng SMS: Đào tạo, bảo dưỡng, dịch vụ bay.
#### Cơ chế báo cáo
- 3 loại: Báo cáo sự cố bắt buộc, Báo cáo tự nguyện, Báo cáo định kỳ.
#### Bảo vệ dữ liệu an toàn
- Dữ liệu rủi ro chỉ để cải thiện, **Tuyệt đối không dùng để xử lý kỷ luật, hành chính hay hình sự**.

### 4. NĐ 165/2026/NĐ-CP (Hiệu lực: 01/07/2026) - Kiểm dịch Y tế tại CHK
#### Phạm vi & Biện pháp
- Đối tượng: Người, phương tiện hàng không, hàng hóa.
- Biện pháp nghiệp vụ: Thu thập thông tin, khai báo y tế, quan sát, kiểm tra, xử lý y tế.

## 📊 III. LĨNH VỰC ĐẦU TƯ - ĐẤU THẦU
### 1. NĐ 119/2026/NĐ-CP (Hiệu lực: 01/01/2026) - Quản lý vốn ODA
#### Lĩnh vực ưu tiên sử dụng
- Y tế, giáo dục, môi trường, KHCN, hạ tầng kinh tế - xã hội **không có khả năng thu hồi vốn trực tiếp**.
#### Cơ chế tài chính DNNN
- DNNN và công ty con: Áp dụng cơ chế **cho vay lại toàn bộ** vốn vay ODA.
- Cơ quan chủ quản dự án HTKT: Được xác định là DNNN hoặc công ty con.

### 2. NĐ 147/2026/NĐ-CP (Hiệu lực: 07/05/2026) - Tháo gỡ dự án tồn đọng
#### Cơ chế cho dự án sai phạm
- Các dự án vi phạm khâu chọn nhà đầu tư/quản lý đất: Sở Tài chính rà soát, UBND Tỉnh quyết định cho phép tiếp tục sử dụng/thuê đất.
- Xử lý tài chính: Xác định lại giá đất, bù trừ nếu nhà đầu tư đã ứng trước tiền bồi thường.

### 3. TT 44/2026/TT-BTC (Hiệu lực: 22/04/2026) - Báo cáo giám sát đầu tư
#### Chế độ báo cáo Trực tuyến (Hệ thống thông tin nghiệp vụ)
- Khởi tạo: Cập nhật thông tin trong **07 ngày làm việc** từ lúc có Quyết định đầu tư.
- Định kỳ: Báo cáo giám sát 6 tháng/cả năm.
- Khi có phát sinh/điều chỉnh: Phải cập nhật trong vòng **07 ngày làm việc**.
#### Công cụ xác thực
- Báo cáo phải được xác thực bằng **Chữ ký số** thông qua tài khoản do Bộ Tài chính cấp.

### 4. TT 07/2026/TT-BNV (Hiệu lực: 01/07/2026) - Mức lương chuyên gia tư vấn (Giá gói thầu)
#### Khung lương theo tháng
- **Mức 1 (Tối đa 70 triệu VNĐ):** ĐH (15 năm KN) / Thạc sĩ (8 năm KN) / Chức danh Trưởng nhóm.
- **Mức 2 (Tối đa 55 triệu VNĐ):** ĐH (10-15 năm KN) / Thạc sĩ (5-8 năm KN).
- **Mức 3 (Tối đa 40 triệu VNĐ):** ĐH (5-10 năm KN) / Thạc sĩ (3-5 năm KN).
- **Mức 4 (Tối đa 30 triệu VNĐ):** ĐH (<5 năm KN) / Thạc sĩ (<3 năm KN).
#### Quy tắc điều chỉnh
- Dự án quy mô lớn/phức tạp: Có thể duyệt cao hơn nhưng **tối đa không quá 1,5 lần** mức chuẩn.

### 5. TT 55/2026/TT-BTC (Hiệu lực: 15/05/2026) - Mẫu văn bản đầu tư
#### Cập nhật biểu mẫu mới
- Phụ lục I: Mẫu hoạt động đầu tư tại VN. Phụ lục II: Mẫu xúc tiến đầu tư.
- Thay thế hoàn toàn TT 03/2021, 25/2023, 06/2025 BKHĐT.

## 👥 IV. LAO ĐỘNG - NHÂN SỰ & THU NHẬP
### 1. NĐ 164/2026/NĐ-CP (Hiệu lực: 01/07/2026) - Kiểm soát tài sản thu nhập
#### Đối tượng phải kê khai (Trong DN Nhà nước)
- Trưởng phòng trở lên phụ trách: Tổ chức cán bộ, quản lý TC, tài sản công, đầu tư công.
- Người đại diện phần vốn nhà nước.
#### Phạm vi tài sản kê khai (Bản thân, Vợ/Chồng, Con chưa thành niên)
- Đất đai, nhà ở, công trình xây dựng.
- Vàng, kim cương, tiền, cổ phiếu.
- Tài sản số, tài khoản ở nước ngoài.
#### Quy trình công khai & Xử lý
- Công khai: Niêm yết tại trụ sở **15 ngày** hoặc tại cuộc họp cơ quan.
- Xác minh: Theo kế hoạch hàng năm.
- Kỷ luật nếu vi phạm: Khiển trách -> Cảnh cáo -> Cách chức.

### 2. NĐ 181/2026/NĐ-CP (Hiệu lực: 21/05/2026) - Quản lý chức danh tại DNNN
#### Quy định chức danh
- Người quản lý, kiểm soát viên, đại diện vốn **KHÔNG** là cán bộ, công chức, viên chức.
#### Cơ chế kiêm nhiệm đại diện vốn NN
- Chuyên trách: Chỉ làm việc tại **01** doanh nghiệp.
- Không chuyên trách: Tối đa **03** doanh nghiệp (Số lượng không vượt quá **30%** thành viên HĐTV/HĐQT).
- Nhiệm kỳ tối đa: **05 năm**.
#### Đánh giá & Kỷ luật
- Xếp loại: Xuất sắc, Tốt, Hoàn thành, Không hoàn thành.
- Kỷ luật: Khiển trách, Cảnh cáo, Cách chức (Người quản lý), Bãi nhiệm (Đại diện vốn).

### 3. TT 08/2026/TT-BNV (Hiệu lực: 01/07/2026) - Hợp đồng lao động điện tử (eContract)
#### Định danh Hợp đồng (ID)
- Cấu trúc: 1 chữ cái (A,B,C) + 12 ký tự số.
- Đặc tính: **Duy nhất và không thay đổi** dù hợp đồng bị sửa/hoãn/chấm dứt.
- Thời gian cấp mã: Tự động trong **24 giờ** qua Nền tảng HĐLĐ điện tử.
#### Quy định lưu trữ
- Yêu cầu người dùng Đăng nhập bằng Tài khoản định danh điện tử quốc gia.
- Lưu trữ dữ liệu: **10 năm** kể từ ngày chấm dứt HĐLĐ.

### 4. TT 14/2026/TT-BNV (Hiệu lực: 01/07/2026) - Điều chỉnh BHXH, Lương hưu
#### Tỷ lệ điều chỉnh tăng
- Tăng **8%** so với mức hưởng của tháng 06/2026 (Áp dụng từ 01/07/2026).
- Trợ cấp tuất hằng tháng: Tính theo mức lương cơ sở mới.

## ⚖️ V. THANH TRA - KHIẾU NẠI - TỐ CÁO
### 1. NĐ 155/2026/NĐ-CP (Hiệu lực: 01/07/2026) - Thi hành Luật Khiếu nại
#### Quy định xử lý vụ việc
- Vụ việc phức tạp (Nhiều người/địa điểm/yếu tố nước ngoài): Phải xác định bằng văn bản.
- Ủy quyền: Phải công chứng/chứng thực, **Tuyệt đối không ủy quyền 1 nội dung cho nhiều người**.
- Rút đơn nhóm: Ai rút thì đình chỉ người đó, ai không rút vẫn tiếp tục giải quyết. Toàn bộ rút -> Đình chỉ vụ án.
- Kỷ luật cán bộ sai phạm: Khiển trách -> Buộc thôi việc / Truy cứu Hình sự.

### 2. NĐ 156/2026/NĐ-CP (Hiệu lực: 01/07/2026) - Thi hành Luật Tố cáo
#### Quản lý rút đơn & Giám định
- Rút tố cáo: Vẫn bị tiếp tục điều tra nếu có dấu hiệu tội phạm hoặc nghi ngờ bị ép buộc rút.
- Giám định kỹ thuật: Được quyền trưng cầu bằng văn bản có ấn định thời hạn.
- Số hóa: Bắt buộc cập nhật CSDL quốc gia về tố cáo.
- Kỷ luật nhân sự xử lý sai: Khiển trách -> Bãi nhiệm/Buộc thôi việc.

### 3. NĐ 184/2026/NĐ-CP (Hiệu lực: 01/07/2026) - Phòng chống tham nhũng
#### Trách nhiệm giải trình
- Hình thức: Trực tiếp hoặc Văn bản. Phải chính xác, đầy đủ, kịp thời.
- Hành vi vi phạm: Không giải trình, kéo dài thời gian, cung cấp sai lệch.

## 🔌 VI. AN NINH - CÔNG NGHỆ & CƠ SỞ HẠ TẦNG
### 1. NĐ 116/2026/NĐ-CP (Hiệu lực: 08/04/2026) - Dịch vụ Internet
- Yêu cầu thu thập thông tin khi đăng ký tên miền.
- Tổ chức quản lý tên miền phải đạt chuẩn kỹ thuật/an ninh thông tin.

### 2. NĐ 117/2026/NĐ-CP (Hiệu lực: 03/04/2026) - Quản lý Ô tô
- Các loại xe: QPAN, xe lắp ráp từ sát xi, xe không dùng chung giao thông CC.
- Cấp giấy chứng nhận: Trực tuyến Dịch vụ công QG (5 ngày xử lý hồ sơ, kiểm tra thực tế không quá 15 ngày).

### 3. NĐ 133/2026/NĐ-CP (Hiệu lực: 25/05/2026) - Xử phạt điện lực
- Truyền tải (Đ9): Phạt không báo cáo độ sẵn sàng, đấu nối sai, thiết bị kém.

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.4"></script>
    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
