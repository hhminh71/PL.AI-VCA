                    </div>
                </div>

                <div id="quiz-container" class="p-2 space-y-3"></div>

                <div class="sticky bottom-0 bg-white border-t border-gray-200 p-3 flex justify-between items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40 mt-4">

                    <div class="flex gap-2 ml-auto">
                        <button id="btn-retry-bottom" onclick="startQuiz()" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-bold rounded shadow active:scale-95 transition-transform">Làm Lại</button>

// --- HÀM TIỆN ÍCH ---
// 1. Parse Dữ Liệu bằng Code
function parseQuestions(rawText) {
    const questions = [];
    const blocks = rawText.trim().split(/\n\s*\n/);
    blocks.forEach((block, index) => {
        const lines = block.split('\n').map(l => l.trim()).filter(l => l);
        let qText = '';
        let options = [];
        
        lines.forEach(line => {
            if (line.startsWith('Q:')) {
                qText = line.substring(2).trim();
            } else if (/^[\*]?[A-D]\./i.test(line)) {
                const isCorrect = line.startsWith('*');
                const text = line.replace(/^[\*]?[A-D]\.\s*/i, '').trim();
                options.push({ text, isCorrect });
            } else if (qText !== '' && options.length === 0) {
                qText += ' ' + line;
            }
        });
        
        if (qText && options.length > 0) {
            questions.push({ id: index, question: qText, options });
        }
    });
    return questions;
}

const ALL_QUESTIONS = parseQuestions(rawData);

// 2. Thuật toán Fisher-Yates Shuffle
function shuffleArray(array) {
    let curId = array.length;
    while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = array[curId];
        array[curId] = array[randId];
        array[randId] = tmp;
    }
    return array;
}

// 3. Tiện ích xử lý chuỗi và Tiếng Việt cho Tìm kiếm
function removeAccents(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
}

function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag]));
}

// Logic Highlight Realtime (Tô vàng từ khóa tìm kiếm)
function highlightText(text, keyword) {
    if (!keyword) return escapeHTML(text);
    
    const cleanText = removeAccents(text).toLowerCase();
    const cleanKeyword = removeAccents(keyword).toLowerCase();
    
    if (!cleanKeyword) return escapeHTML(text);

    let result = '';
    let startIndex = 0;
    let matchIndex = cleanText.indexOf(cleanKeyword, startIndex);

    if (matchIndex === -1) return escapeHTML(text);

    while (matchIndex !== -1) {
        result += escapeHTML(text.substring(startIndex, matchIndex));
        result += `<mark>` + escapeHTML(text.substring(matchIndex, matchIndex + keyword.length)) + `</mark>`;
        startIndex = matchIndex + keyword.length;
        matchIndex = cleanText.indexOf(cleanKeyword, startIndex);
    }
    result += escapeHTML(text.substring(startIndex));
    return result;
}

// --- LOGIC GIAO DIỆN & TABS ---
let isReviewRendered = false; // FLAG FIX LỖI MÀN HÌNH TRẮNG

function switchTab(tab) {
    const btnQuiz = document.getElementById('tabBtn-quiz');
    const btnReview = document.getElementById('tabBtn-review');
    const tabQuiz = document.getElementById('tab-quiz');
    const tabReview = document.getElementById('tab-review');

    if (tab === 'quiz') {
        btnQuiz.className = "flex-1 py-2 text-sm font-bold border-b-4 border-white transition-all text-white";
        btnReview.className = "flex-1 py-2 text-sm font-medium border-b-4 border-transparent text-blue-200 transition-all hover:text-white";
        tabQuiz.classList.remove('hidden');
        tabReview.classList.add('hidden');
    } else {
        btnReview.className = "flex-1 py-2 text-sm font-bold border-b-4 border-white transition-all text-white";
        btnQuiz.className = "flex-1 py-2 text-sm font-medium border-b-4 border-transparent text-blue-200 transition-all hover:text-white";
        tabReview.classList.remove('hidden');
        tabQuiz.classList.add('hidden');
        
        // YÊU CẦU: Render ngay lập tức khi click lần đầu tiên để tránh blank screen
        if (!isReviewRendered) {
            renderReview();
            isReviewRendered = true;
        }
    }
}

// --- LOGIC TAB 1: THI THỬ ---
let currentQuizData = [];
let timerInterval;
let secondsElapsed = 0;
let isSubmitted = false;
let currentScore = 0;

function loadHighScore() {
    const score = localStorage.getItem('quiz_cantho_highscore') || 0;
    document.getElementById('high-score').textContent = `Điểm cao: ${score}/40`;
    return parseInt(score);
}

function saveHighScore(score) {
    const currentHigh = loadHighScore();
    if (score > currentHigh) {
        localStorage.setItem('quiz_cantho_highscore', score);
        loadHighScore();
    }
}

function formatTime(secs) {
    const m = Math.floor(secs / 60).toString().padStart(2, '0');
    const s = (secs % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

function startTimer() {
    clearInterval(timerInterval);
    secondsElapsed = 0;
    document.getElementById('timer').textContent = "00:00";
    timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById('timer').textContent = formatTime(secondsElapsed);
    }, 1000);
}

function startQuiz() {
    isSubmitted = false;
    currentScore = 0;
    
    // UI Reset
    document.getElementById('btn-submit-top').classList.remove('hidden');
    document.getElementById('btn-submit-bottom').classList.remove('hidden');
    document.getElementById('btn-share-top').classList.add('hidden');
    document.getElementById('result-text').classList.add('hidden');
    
    // Thuật toán: Random 40 câu & Random đáp án
    const shuffledQuestions = shuffleArray([...ALL_QUESTIONS]).slice(0, 40);
    
    currentQuizData = shuffledQuestions.map((q, idx) => {
        return {
            ...q,
            quizId: idx + 1,
            options: shuffleArray([...q.options]) // Xáo trộn cả đáp án
        };
    });

    const container = document.getElementById('quiz-container');
    container.innerHTML = currentQuizData.map((q, qIndex) => `
        <div class="bg-white p-3 rounded shadow-sm border border-gray-200" id="qblock-${q.id}">
            <div class="font-bold text-sm mb-2 text-gray-800 compact-text">
                <span class="text-blue-600">Câu ${q.quizId}:</span> ${escapeHTML(q.question)}
            </div>
            <div class="flex flex-col gap-1.5">
                ${q.options.map((opt, oIndex) => `
                    <label class="flex items-start gap-2 p-2 rounded border border-gray-200 cursor-pointer transition-colors hover:bg-gray-50 ui-option">
                        <input type="radio" name="q_${q.id}" value="${oIndex}" class="mt-0.5 w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                        <span class="text-sm text-gray-700 compact-text flex-1">${escapeHTML(opt.text)}</span>
                        <span class="icon-result hidden mt-0.5 text-base leading-none"></span>
                    </label>
                `).join('')}
            </div>
        </div>
    `).join('');

    loadHighScore();
    startTimer();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
    if (isSubmitted) return;
    clearInterval(timerInterval);
    isSubmitted = true;
    currentScore = 0;

    currentQuizData.forEach((q) => {
        const block = document.getElementById(`qblock-${q.id}`);
        const inputs = block.querySelectorAll(`input[name="q_${q.id}"]`);
        
        let answeredCorrectly = false;
        
        inputs.forEach((input, index) => {
            input.disabled = true; // Khóa input
            const label = input.closest('label');
            const icon = label.querySelector('.icon-result');
            const isOptCorrect = q.options[index].isCorrect;
            
            if (isOptCorrect) {
                // Tô xanh đáp án đúng
                label.classList.add('bg-green-50', 'border-green-400');
                label.classList.remove('border-gray-200', 'hover:bg-gray-50');
                icon.innerHTML = '✔️';
                icon.classList.remove('hidden');
                
                if (input.checked) {
                    answeredCorrectly = true;
                }
            } else if (input.checked) {
                // Tô đỏ đáp án chọn sai
                label.classList.add('bg-red-50', 'border-red-400');
                label.classList.remove('border-gray-200', 'hover:bg-gray-50');
                icon.innerHTML = '✖️';
                icon.classList.remove('hidden');
            }
        });

        if (answeredCorrectly) currentScore++;
    });

    // Update UI Results
    document.getElementById('btn-submit-top').classList.add('hidden');
    document.getElementById('btn-submit-bottom').classList.add('hidden');
    document.getElementById('btn-share-top').classList.remove('hidden');
    
    const resultText = document.getElementById('result-text');
    resultText.textContent = `Kết quả: ${currentScore}/40`;
    resultText.classList.remove('hidden');
    
    saveHighScore(currentScore);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareResult() {
    const time = formatTime(secondsElapsed);
    const text = `🎯 Ôn tập Cảng HKQT Cần Thơ\n✅ Điểm: ${currentScore}/40\n⏱ Thời gian: ${time}\nThực hành ngay!`;
    
    // Copy to clipboard
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);

    // Show Toast
    const toast = document.getElementById('toast');
    toast.classList.remove('opacity-0');
    setTimeout(() => {
        toast.classList.add('opacity-0');
    }, 2500);
}


// --- LOGIC TAB 2: ÔN TẬP ---
function renderReview(keyword = '') {
    const container = document.getElementById('review-container');
    const cleanKeyword = removeAccents(keyword.trim()).toLowerCase();
    
    const filtered = ALL_QUESTIONS.filter(q => {
        if (!cleanKeyword) return true;
        const qText = removeAccents(q.question).toLowerCase();
        const hasOptMatch = q.options.some(opt => removeAccents(opt.text).toLowerCase().includes(cleanKeyword));
        return qText.includes(cleanKeyword) || hasOptMatch;
    });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-10 text-sm">Không tìm thấy kết quả phù hợp.</div>`;
        return;
    }

    container.innerHTML = filtered.map((q, index) => `
        <div class="bg-white p-3 rounded shadow-sm border border-gray-200">
            <div class="font-bold text-sm mb-2 text-gray-800 compact-text">
                <span class="text-blue-600">Câu ${q.id + 1}:</span> ${highlightText(q.question, keyword)}
            </div>
            <div class="flex flex-col gap-1.5 mt-2">
                ${q.options.map(opt => `
                    <div class="flex items-start gap-2 p-2 rounded border compact-text text-sm
                        ${opt.isCorrect 
                            ? 'bg-green-100 border-green-400 text-green-900 font-medium' 
                            : 'bg-gray-50 border-gray-100 text-gray-500'}">
                        ${opt.isCorrect ? '<span class="text-green-600 text-sm leading-none mt-0.5">✔️</span>' : '<span class="w-3"></span>'}
                        <span class="flex-1">${highlightText(opt.text, keyword)}</span>
                    </div>
                `).join('')}
            </div>
        </div>
    `).join('');
}

// Xử lý Search Realtime
document.getElementById('search-input').addEventListener('input', (e) => {
    // Tối ưu render ngay khi gõ
    renderReview(e.target.value);
});


// Khởi chạy App
window.onload = () => {
    startQuiz(); // Default tab
};

</script>
