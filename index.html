# Cập nhật VBPL tháng 07/2026 (liên quan đến hoạt động ACV)
## Thông báo số 210/PCKTNB (Ngày 10/08/2026) - Phần 1
### 1. Nghị định 267/2026/NĐ-CP (Kỷ luật & bồi thường do lãng phí)
#### Ban hành & Áp dụng
- **Ngày ban hành:** 01/07/2026
- **Ngày áp dụng:** 01/07/2026
#### Nội dung chính
- Cụ thể hóa Luật Tiết kiệm, chống lãng phí.
- Nâng cao hiệu quả quản lý, sử dụng tài sản công.
- Tăng cường trách nhiệm cá nhân, tổ chức.
#### Nguyên tắc & Thẩm quyền
- Xử lý kỷ luật: rõ ràng, minh bạch, công bằng.
- Thẩm quyền: Thuộc cơ quan có thẩm quyền theo quy định pháp luật.
#### Hình thức xử lý
- Loại trừ kỷ luật.
- Miễn kỷ luật.
- Giảm nhẹ mức kỷ luật.
- Bồi thường thiệt hại (đảm bảo trách nhiệm & khắc phục hậu quả).
### 2. Nghị định 273/2026/NĐ-CP (Kinh doanh hàng miễn thuế)
#### Ban hành & Áp dụng
- **Thay thế:** Nghị định 100/2020/NĐ-CP
- **Ngày ban hành:** 07/07/2026
- **Ngày áp dụng:** 21/08/2026
#### Nguyên tắc quản lý
- Tuân thủ quy định về thuế & quản lý chuyên ngành.
- Hàng hóa: Tạm nhập từ nước ngoài hoặc từ nội địa.
- Ngoại lệ: Không thuộc danh mục cấm nhập khẩu/xuất khẩu.
- Yêu cầu tem: Thuốc lá, xì gà, rượu, bia phải dán tem "VIET NAM DUTY NOT PAID".
#### Đồng tiền giao dịch
- Đồng Việt Nam (VND).
- Đô la Mỹ (USD).
- Euro (EUR).
- Đồng tiền quốc gia có chung biên giới với Việt Nam.
- Đồng tiền quốc gia nơi các chuyến bay quốc tế đến.
#### Đối tượng & Điều kiện mua
- Người xuất cảnh, quá cảnh, nhập cảnh.
- Hành khách trên chuyến bay quốc tế.
- Thuyền viên trên tàu biển quốc tế.
- Đối tượng được hưởng quyền ưu đãi, miễn trừ tại Việt Nam.
#### Thủ tục hải quan & Giám sát
- Doanh nghiệp phải thực hiện thủ tục hải quan, kiểm tra, giám sát.
- Hàng từ nội địa/tạm nhập khẩu: Quản lý, giám sát chặt chẽ bởi cơ quan hải quan.
#### Báo cáo quyết toán
- Nộp báo cáo tình hình bán hàng miễn thuế hàng năm cho cơ quan hải quan.
- Báo cáo phải phù hợp chứng từ kế toán.
- Được kiểm tra bởi cơ quan hải quan.
### 3. Nghị định 274/2026/NĐ-CP (Chi tiết Luật Đấu thầu về lựa chọn NĐT)
#### Ban hành & Áp dụng
- **Thay thế:** Nghị định 23/2024/NĐ-CP, Nghị định 115/2024/NĐ-CP, Nghị định 225/2025/NĐ-CP
- **Ngày ban hành:** 07/07/2026
- **Ngày áp dụng:** 21/08/2026
#### Phạm vi điều chỉnh
- Bảo đảm cạnh tranh.
- Ưu đãi.
- Chi phí.
- Chỉ định nhà đầu tư.
- Quy trình, thủ tục lựa chọn nhà đầu tư.
- Các biện pháp thi hành Luật Đấu thầu.
#### Bảo đảm cạnh tranh & Ưu đãi
- NĐT phải độc lập pháp lý & tài chính với các bên liên quan.
- Đối tượng ưu đãi: NĐT có giải pháp công nghệ tiên tiến; Cam kết chuyển giao công nghệ; Doanh nghiệp khoa học và công nghệ.
#### Quy trình lựa chọn NĐT
- Công bố dự án.
- Chuẩn bị đấu thầu.
- Tổ chức đấu thầu.
- Đánh giá hồ sơ dự thầu.
- Đàm phán, ký kết hợp đồng.
- Dự án đặc thù: Quy trình có thể điều chỉnh phù hợp yêu cầu.
#### Chi phí & Nguồn thu
- Chi phí lập hồ sơ, thẩm định, đánh giá hồ sơ: Quy định cụ thể.
- Nguồn thu từ bán HSMT: Nộp vào ngân sách nhà nước.
#### Giải quyết kiến nghị
- NĐT có quyền kiến nghị về kết quả.
- Quy trình: Gửi đơn kiến nghị -> Giải quyết bởi bên mời thầu -> Có thể đưa lên Hội đồng giải quyết kiến nghị (nếu cần).
#### Lộ trình áp dụng qua mạng
- **Từ 01/01/2027:** Nộp hồ sơ đề xuất dự án & mời quan tâm qua mạng.
- **Từ 01/04/2027:** Áp dụng cho các dự án đấu thầu rộng rãi và hạn chế.
### 4. Nghị định 292/2026/NĐ-CP (Quản lý ngoại thương)
#### Ban hành & Áp dụng
- **Thay thế:** Nghị định 69/2018/NĐ-CP
- **Ngày ban hành:** 22/07/2026
- **Ngày áp dụng:** 05/09/2026
#### Quản lý XNK hàng hóa
- Phải có giấy phép hoặc đáp ứng điều kiện pháp luật.
- Danh mục cấm XNK: Chi tiết tại Phụ lục I của Nghị định.
#### Cấp Giấy phép XNK
- Áp dụng biện pháp tạm ngừng: Quy trình cấp phép rõ ràng.
- Các bước: Nộp hồ sơ -> Thẩm định -> Cấp phép.
#### Danh mục hàng hóa cấm XNK (Phụ lục I)
- Vũ khí, đạn dược.
- Hóa chất nguy hiểm.
- Sản phẩm văn hóa cấm phổ biến.
### 5. Nghị định 296/2026/NĐ-CP (Sửa đổi NĐ 168/2025/NĐ-CP về ĐKDN)
#### Ban hành & Áp dụng
- **Ngày ban hành:** 23/07/2026
- **Ngày áp dụng:** 23/07/2026
#### Trách nhiệm kê khai & sử dụng thông tin
- Người thành lập/Doanh nghiệp: Tự kê khai hồ sơ, chịu trách nhiệm về tính hợp pháp, trung thực.
- Cơ quan ĐKKD cấp tỉnh: Sử dụng thông tin từ CSDL Quốc gia.

#### Quy định về chủ sở hữu hưởng lợi
- Cá nhân sở hữu/kiểm soát từ **25% vốn điều lệ** hoặc **cổ phần có quyền biểu quyết**.
- Doanh nghiệp phải xác định & thông báo cho cơ quan ĐKKD.
#### Thủ tục đăng ký qua mạng
- Hồ sơ mạng có giá trị pháp lý tương đương hồ sơ giấy.
- Yêu cầu: Xác thực điện tử.
- Có thể dừng thủ tục qua mạng nếu cần.
### 6. Thông tư 50/2026/TT-BXD (Định mức kinh tế - kỹ thuật thuê chuyên cơ)
#### Ban hành & Áp dụng
- **Phạm vi:** Thuê chuyên cơ chính thức (có tính đến yếu tố tàu bay dự bị) sử dụng ngân sách Nhà nước.
- **Ngày ban hành:** 30/06/2026
- **Ngày áp dụng:** 16/08/2026
#### Nguyên tắc áp dụng định mức
- Bao gồm: Định mức vật liệu trực tiếp & Định mức lao động trực tiếp.
- Cơ sở xác định: Công tác phục vụ, loại tàu bay (Airbus A321, A350, Boeing 787), thời gian bay.
- Tính toán: Cho **một chặng bay một chiều** (tương ứng 1 lần cất cánh + 1 lần hạ cánh).
#### Các công tác phục vụ chuyên bay chuyên cơ
- Chuẩn bị tại cảng hàng không.
- Dự bị.
- Vận hành hệ thống động cơ phụ.
- Di chuyển từ vị trí rút chèn đến khi cất cánh.
- Di chuyển từ cảng hàng không khởi hành tới cảng hàng không đến.
- Di chuyển từ vị trí hạ cánh đến vị trí chèn bánh tại cảng hàng không đến.
#### Xác định định mức cho một chặng bay
- Mức tiêu hao vật liệu & lao động dựa trên thời gian thực hiện.
- Tổng định mức chặng bay = Tổng định mức các công tác thực hiện.
#### Danh mục định mức kinh tế - kỹ thuật
- Phân loại theo loại tàu bay: A321, A350, B787.
- Phân loại theo thời gian thực hiện: Từ dưới 1 giờ đến trên 12 giờ.
- Các mức hao phí cụ thể.

#### Ban hành & Áp dụng
- **Thay thế:** Thông tư 200/2015/TT-BTC, Thông tư 77/2021/TT-BTC
- **Ngày ban hành:** 17/07/2026
- **Ngày áp dụng:** 17/07/2026
#### Giám sát & kiểm tra
- Thực hiện: Nguyên tắc, phạm vi, thẩm quyền, trình tự, thủ tục, mục tiêu.
- Cơ quan đại diện chủ sở hữu: Báo cáo, phân tích, đánh giá, giải trình về hiệu quả kinh tế - xã hội & nhiệm vụ chính trị, quốc phòng, an ninh.
#### Đánh giá & xếp loại doanh nghiệp
- Chỉ tiêu: Tổng doanh thu, hiệu quả sử dụng vốn, thực hiện nhiệm vụ giao.
- Lưu ý: Loại trừ các yếu tố tác động không thuộc kiểm soát của doanh nghiệp.

- Quản lý: Hệ thống thông tin do Bộ Tài chính xây dựng & vận hành.
- Đảm bảo: Cung cấp thông tin đầy đủ, chính xác, kịp thời.
#### Trách nhiệm các bên liên quan
- Đối tượng: Cơ quan đại diện chủ sở hữu, Doanh nghiệp Nhà nước, Người đại diện chủ sở hữu trực tiếp, Người đại diện phần vốn Nhà nước, Kiểm soát viên.
- Yêu cầu: Cung cấp thông tin đầy đủ, chính xác, kịp thời; Khai thác dữ liệu đúng mục đích.
## Thông báo số 218/PCKTNB (Ngày 11/08/2026) - Phần 2
### 1. Nghị định 265/2026/NĐ-CP (Xử phạt HC lĩnh vực tiết kiệm, chống lãng phí)
#### Ban hành & Áp dụng
- **Ngày ban hành:** 01/07/2026
- **Ngày áp dụng:** 01/07/2026
#### Đối tượng áp dụng
- Cơ quan nhà nước, đơn vị lực lượng vũ trang.
- Đơn vị sự nghiệp công lập, doanh nghiệp nhà nước.
- Các tổ chức khác theo quy định.
#### Hình thức & Mức xử phạt
- Hình thức chính: Cảnh cáo, Phạt tiền.
- Mức phạt tổ chức = 2 lần mức phạt cá nhân.
- Biện pháp khắc phục: Buộc ban hành chương trình, báo cáo kết quả, cải chính thông tin, cập nhật dữ liệu CSDL quốc gia, công khai thông tin.
#### Các vi phạm cụ thể
- **Chương trình thực hành tiết kiệm, chống lãng phí:**
  - Chậm ban hành, không đầy đủ nội dung, không ban hành.
  - Phạt: Cảnh cáo hoặc **1.000.000 - 10.000.000 VNĐ**.
- **Thực hiện nhiệm vụ:**
  - Không thực hiện/thực hiện không đầy đủ nhiệm vụ, chỉ tiêu, yêu cầu, biện pháp.
  - Phạt: Cảnh cáo hoặc **3.000.000 - 10.000.000 VNĐ**.
- **Báo cáo & công khai thông tin:**
  - Vi phạm thời hạn, nội dung báo cáo: Cảnh cáo hoặc **3.000.000 - 15.000.000 VNĐ**.
  - Vi phạm công khai thông tin: Cảnh cáo hoặc **1.000.000 - 10.000.000 VNĐ**.
#### Thẩm quyền xử phạt
- Chủ tịch UBND cấp tỉnh.
- Thanh tra viên các bộ, cơ quan ngang bộ.
- Các chức danh khác có thẩm quyền.
- Mức phạt tiền: Đến **15.000.000 VNĐ** (kèm biện pháp khắc phục).
### 2. Nghị định 266/2026/NĐ-CP (Chi tiết Luật Thực hành tiết kiệm, chống lãng phí)
#### Ban hành & Áp dụng
- **Thay thế:** Nghị định 84/2014/NĐ-CP
- **Ngày ban hành:** 07/07/2026
- **Ngày áp dụng:** 01/07/2026
#### Đối tượng áp dụng
- Tổ chức chính trị, cơ quan nhà nước, MTTQ Việt Nam, lực lượng vũ trang.
- Đơn vị sự nghiệp công lập, doanh nghiệp nhà nước.
- Cán bộ, công chức, viên chức, người lao động (khu vực nhà nước).
- Doanh nghiệp, tổ chức, hộ gia đình, cá nhân liên quan.
#### Hành vi gây lãng phí & vi phạm
- Lĩnh vực: Tổ chức bộ máy, quản lý sử dụng lao động, đầu tư xây dựng, quản lý tài sản công, khai thác tài nguyên.
- Ví dụ: Thành lập cơ quan sai quy định, tuyển dụng không đúng thẩm quyền, quản lý tài sản không hiệu quả.
- Hậu quả: Thất thoát ngân sách, tài sản công, tăng chi ngân sách.
#### Ngày toàn dân tiết kiệm, chống lãng phí
- **Ngày thực hiện:** 31 tháng 5 hàng năm.
- Hoạt động: Tuyên truyền, phổ biến pháp luật, phát động phong trào, khen thưởng (cá nhân, tập thể).
#### Cơ sở dữ liệu quốc gia về TK, CLP
- Chủ quản: Bộ Tài chính.
- Chức năng: Tích hợp thông tin từ các bộ, ngành, địa phương để theo dõi, giám sát toàn quốc.
#### Kiểm tra & Báo cáo
- Thực hiện kiểm tra chấp hành pháp luật về TK, CLP.
- Lập kế hoạch kiểm tra hàng năm.
- Báo cáo kết quả: Đầy đủ, trung thực tình hình triển khai.
### 3. Nghị định 281/2026/NĐ-CP (Xử phạt HC lĩnh vực đất đai)
#### Ban hành & Áp dụng
- **Sửa đổi, bổ sung:** Nghị định 123/2024/NĐ-CP
- **Ngày ban hành:** 13/07/2026
- **Ngày áp dụng:** 31/08/2026
#### Nguyên tắc xác định vi phạm (Điều 3a)
- Đơn vị hành chính đặc khu: Mức phạt tương ứng phường/xã.
- Vợ chồng chung quyền sử dụng đất: Xử phạt như một cá nhân.
#### Biện pháp khắc phục hậu quả
- Buộc khôi phục tình trạng ban đầu của đất, mốc địa giới.
- Thực hiện lại thủ tục hành chính.
- Nộp lại giấy tờ bị tẩy xóa, sửa chữa.
#### Xử lý số lợi bất hợp pháp
- Nộp vào ngân sách nhà nước.
- Nhiều cá nhân/tổ chức cùng vi phạm: Chia đều số lợi.
- Đã nộp tiền vào ngân sách: Được khấu trừ.
#### Mức phạt tiền

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.4"></script>
    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
