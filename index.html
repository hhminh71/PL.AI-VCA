# BÁO CÁO PHÂN TÍCH CHUYÊN SÂU
## So sánh QĐ 1171/2026 với QĐ 1211/2025 & QĐ 3177/2025

### 1. Sự chuyển dịch về Nền tảng Pháp lý
- **Giai đoạn 2025 (QĐ 1211 & QĐ 3177)**
  - Căn cứ trọng tâm: **Thông tư 31/2025/TT-BCA**.
  - Tính chất: Tập trung quản lý hình thức, tiêu chuẩn của Thẻ, Giấy phép và Chứng nhận năng định cá nhân.
- **Giai đoạn 2026 (QĐ 1171) - BƯỚC NGOẶT**
  - Căn cứ trọng tâm: **Thông tư 14/2026/TT-BCA**.
  - Tính chất: Nâng cấp quản lý lên tầm vĩ mô, tập trung vào **Chương trình ANHK và Kiểm soát chất lượng**.

### 2. Biến động về Phạm vi Thủ tục (Danh mục TTHC)
- **QĐ 1211/2025 (Khởi tạo)**
  - Công bố **13 TTHC mới** phủ rộng: Thẻ, Giấy phép, Năng định, Chương trình an ninh, Cơ sở đào tạo.
- **QĐ 3177/2025 (Sửa đổi lần 1)**
  - Sửa đổi **07 TTHC** (Chỉ tập trung vào 3 Thẻ, 3 Giấy phép và 1 Năng định nhân viên).
- **QĐ 1171/2026 (Sửa đổi lần 2 - Hiện tại)**
  - Sửa đổi **08 TTHC**.
  - **Giữ nguyên**: 06 thủ tục về Thẻ và Giấy phép (nhưng thay đổi biểu mẫu/công nghệ).
  - **Lược bỏ**: Không còn sửa đổi thủ tục Năng định nhân viên trong đợt này.
  - **Bổ sung mới vào diện sửa đổi**: 02 TTHC cốt lõi về **Phê duyệt/Chấp thuận** và **Sửa đổi/Bổ sung Chương trình ANHK**.

### 3. Nâng cấp Kỹ thuật & Công nghệ (Điểm nhấn QĐ 1171)
- **Cải tiến Biểu mẫu (Phụ lục IA - TT 14/2026)**
  - Thay thế toàn bộ form cũ: Mẫu 1A (Công văn), Mẫu 2A/4A/5A (Danh sách trích ngang), Mẫu 3A (Tờ khai cá nhân).
  - *Lưu ý:* Tờ khai yêu cầu chi tiết hơn về khu vực hoạt động (chia nhỏ 17 khu vực) và đánh dấu cụ thể Cảng HK đăng ký.
- **Đột phá Công nghệ Kiểm soát (Phôi thẻ/Giấy phép mới)**
  - **Thẻ cá nhân (Dài/Ngắn hạn)**: Mặt trước bắt buộc tích hợp **Mã BE Code chứa khuôn mặt đã mã hóa**. 
    - *Mục đích:* So khớp nhận diện sinh trắc học tự động bằng thiết bị.
  - **Giấy phép phương tiện**: Mặt trước tích hợp **Mã BE Code chứa thông tin kèm chữ ký số**.
    - *Mục đích:* Chống làm giả, kiểm tra nhanh qua thiết bị quét mã.

### 4. Chuẩn hóa Đề cương Chương trình ANHK (Chỉ có tại QĐ 1171)
- **Đóng gói quy chuẩn chi tiết cho từng nhóm đối tượng:**
  - **Nhóm 1**: Người khai thác Cảng HK, Sân bay (Gồm 5 Chương chi tiết về Hạ tầng, Biện pháp phòng ngừa, Đối phó can thiệp...).
  - **Nhóm 2**: Hãng hàng không / Người khai thác tàu bay VN.
  - **Nhóm 3**: Quy trình ANHK bổ sung cho Hãng HK Nước ngoài tại VN.
  - **Nhóm 4**: Doanh nghiệp cung cấp dịch vụ Không lưu.
  - **Nhóm 5**: Doanh nghiệp Dịch vụ Khác (Xử lý hàng hóa, Sửa chữa bảo dưỡng, Suất ăn, Xăng dầu, Phục vụ mặt đất).
  - **Nhóm 6**: Đơn vị kiểm soát ANHK chuyên trách.

### 5. KẾ HOẠCH HÀNH ĐỘNG CHO PHÒNG TC-KH (CẢNG HKQT CẦN THƠ)
- **Công tác Kế hoạch - Dự toán (Quan trọng):**
  - **Lệ phí TTHC**: Không thay đổi (Thẻ dài hạn 150k, Giấy phép dài hạn 100k, Ngắn hạn 20k). Tiếp tục áp dụng TT 193/2016/TT-BTC -> *Dòng tiền ngân sách TTHC ổn định*.
  - **Dự toán thiết bị MỚI**: Cần tham mưu lập dự toán mua sắm/nâng cấp **Hệ thống máy quét (Scanner) có khả năng đọc mã BE Code sinh trắc học và chữ ký số** tại các điểm kiểm tra an ninh (Cổng/Cửa) để tương thích với phôi thẻ mới của Bộ Công an.
- **Công tác Triển khai Hành chính:**
  - Lập tức ban hành thông báo nội bộ: **Đình chỉ sử dụng các biểu mẫu xin cấp thẻ cũ**. Áp dụng bộ Mẫu 1A, 2A, 3A, 4A, 5A theo QĐ 1171.
- **Công tác Phối hợp Chuyên môn:**
  - Tham mưu Ban Giám đốc Cảng chỉ đạo Đội An ninh Hàng không rà soát lại **"Chương trình ANHK Cảng HKQT Cần Thơ"**.
  - Bắt buộc phải viết lại/điều chỉnh theo đúng **khung đề cương mới tại mục 7.12.2** của QĐ 1171 để trình Cục Quản lý Xuất nhập cảnh (Bộ Công an) phê duyệt lại (nếu có yêu cầu chuyển tiếp).
