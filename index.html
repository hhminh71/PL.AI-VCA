# QUY ĐỊNH MỚI TRONG QUẢN LÝ CHI PHÍ ĐẦU TƯ XÂY DỰNG (BỘ XÂY DỰNG - 2026)

## 1. CƠ SỞ XÂY DỰNG QUY ĐỊNH
### 1.1 Cơ sở chính trị
#### Các văn bản định hướng
- Văn kiện Đại hội XIV
- Các Nghị quyết của Bộ Chính trị: 66-NQ/TW, 68-NQ/TW, 57-NQ/TW, 59-NQ/TW, 79-NQ/TW
- Kết luận số 119-KL/TW của Bộ Chính trị
- Kết luận số 18-KL/TW ngày 02/4/2026
- Nghị quyết số 244/2025/QH15 ngày 13/11/2025
- Quy định số 178-QĐ/TW ngày 27/6/2024
- Nghị quyết số 126/NQ-CP ngày 14/8/2023
#### Đổi mới tư duy lập pháp
- Phân cấp, phân quyền; chuyển từ "tiền kiểm" sang "hậu kiểm"
- Vận hành theo cơ chế thị trường; Đẩy mạnh chuyển đổi số
- Hoàn thiện cơ chế chính sách để triển khai: dự án trọng điểm quốc gia, hạ tầng chiến lược, quy mô lớn, kỹ thuật phức tạp, công nghệ cao
#### Đổi mới cơ chế quản lý chi phí
- Từ quản lý chi tiết sang quản lý theo mục tiêu, hiệu quả đầu tư và kiểm soát TMĐT
- Tăng cường quyền chủ động, tự chịu trách nhiệm của chủ đầu tư
- Mở rộng sử dụng các công cụ về giá, dữ liệu chi phí trong nước và nước ngoài

### 1.2 Cơ sở pháp lý
- Luật Xây dựng; Luật Đầu tư công; Luật Đầu tư theo phương thức đối tác công tư (PPP)
- Nhiệm vụ Quốc hội, Chính phủ giao
- Chức năng, nhiệm vụ của Bộ Xây dựng

### 1.3 Cơ sở thực tiễn (Sự cần thiết)
- Cơ chế quản lý chi phí theo hình thức đầu tư (dự án trọng điểm, công nghệ mới, dự án phân chia dự án thành phần)
- Hướng dẫn quản lý chi phí sử dụng thiết kế FEED, thiết kế kỹ thuật trong bước lập dự án
- Xây dựng hệ thống CSDL lớn về giá, chi phí để từng bước thay thế định mức Nhà nước
- Yêu cầu chuyển đổi số: Ứng dụng mô hình thông tin công trình (BIM) trong quản lý chi phí

## 2. HỆ THỐNG VĂN BẢN QUY PHẠM PHÁP LUẬT
### 2.1 Văn bản hiện hành (Bị thay thế/Sửa đổi)
- Luật Xây dựng số 50/2014/QH13; Luật số 62/2020/QH14
- Nghị định số 10/2021/NĐ-CP (09/02/2021)
- Thông tư số 11/2021/TT-BXD (sửa đổi bởi TT 14/2023, 01/2025)
- Thông tư số 12/2021/TT-BXD (sửa đổi bởi TT 09/2024, 08/2025, 60/2025)
- Thông tư số 13/2021/TT-BXD (sửa đổi bởi TT 01/2025)
- Thông tư số 14/2021/TT-BXD

### 2.2 Các văn bản quy phạm mới ban hành (2025-2026)
- Luật Xây dựng số 135/2025/QH15
- Nghị định số 206/2026/NĐ-CP (15/06/2026)
- Thông tư số 36/2026/TT-BXD: Xác định và quản lý chi phí ĐTXD
- Thông tư số 38/2026/TT-BXD: Ban hành định mức xây dựng
- Thông tư số 37/2026/TT-BXD: Phương pháp xác định định mức và chỉ tiêu KTKT
- Thông tư số 40/2026/TT-BXD (1): Hệ thống thông tin, CSDLQG về HĐXD
- Thông tư số 40/2026/TT-BXD (2): Xác định chi phí bảo trì CTXD
- Quyết định số 1041/QĐ-BXD: Hướng dẫn đo bóc khối lượng công trình

## 3. NGUYÊN TẮC VÀ NỘI DUNG QUẢN LÝ CHI PHÍ
### 3.1 Sáu (06) nguyên tắc quản lý
- 1. Bảo đảm mục tiêu, hiệu quả dự án
- 2. Phù hợp trình tự, hình thức đầu tư (Đầu tư công, PPP, chi thường xuyên, vốn NN khác)
- 3. Phù hợp với dự án thành phần, dự án thành phần độc lập
- 4. Đồng bộ với thiết kế, tiêu chuẩn, công nghệ; chi phí xác định cho dự án, công trình, gói thầu
- 5. Hình thành hệ thống CSDL lớn về chi phí, giá, định mức, chỉ số giá
- 6. Tăng cường phân cấp, phân quyền, trách nhiệm CĐT và Tư vấn; kiểm tra quản lý của CĐT

### 3.2 Nội dung kế thừa
- Nguyên tắc chung; Cơ cấu 07 khoản mục chi phí
- Phương pháp cơ bản xác định các khoản mục (Xây dựng, Thiết bị, QLDA, TVXD)
- Quản lý, ban hành hệ thống công cụ (định mức, giá, chỉ số) của Bộ/Địa phương
- Quyền, nghĩa vụ, trách nhiệm cơ bản của người QĐĐT, CĐT, Nhà thầu

### 3.3 Nội dung lược bỏ
- Bỏ thủ tục thẩm định dự toán xây dựng tại cơ quan chuyên môn về XD (đối với bước thiết kế sau TKCS)
- Bỏ quy định các loại dự toán gói thầu xây dựng
- Bỏ nội dung quy đổi vốn đầu tư

### 3.4 Nội dung sửa đổi, bổ sung mới
- Quản lý theo hình thức: dự án thành phần, khẩn cấp, đặc biệt, sử dụng thiết kế FEED/TKKT
- Đổi mới nhân công: Từ phân bậc thợ sang phân nhóm công tác
- Mở rộng dùng công cụ giá, dữ liệu trong/ngoài nước
- Nội dung thẩm định/điều chỉnh TMĐT, DTXD
- Quản lý và công bố giá (VL, NC, MTC), xây dựng CSDL Quốc gia
- Trách nhiệm của các bên trong thẩm tra/xác định chi phí tư vấn

## 4. QUY ĐỊNH MỚI TRONG XÁC ĐỊNH CHI PHÍ (NĐ 206, TT 36)
### 4.1 Phương pháp và Cơ cấu khoản mục
- Cơ cấu giữ nguyên 07 khoản mục: (1) Bồi thường/GPMB, (2) Xây dựng, (3) Thiết bị, (4) QLDA, (5) TVXD, (6) Khác, (7) Dự phòng
- Khối lượng: Bổ sung xác định từ mô hình BIM, phần mềm/công cụ số
#### Sử dụng công cụ giá
- Công cụ: Suất vốn ĐT, Suất chi phí, Giá bộ phận/kết cấu, Giá nhóm
- Nguồn dữ liệu: CSDL Quốc gia, giá địa phương, báo giá nhà cung cấp, công trình tương tự
- Được dùng dữ liệu dự án nước ngoài (giá, định mức nước ngoài)
- Được vận dụng, tính toán, điều chỉnh định mức phù hợp thực tế thi công

### 4.2 Sơ bộ Tổng mức đầu tư (TMĐT)
- Phương pháp: Xác định trên cơ sở suất vốn đầu tư cho cả dự án (Phụ lục I TT36)
- Phương pháp KL & ĐG: Khối lượng ước tính. Đơn giá dùng suất chi phí hệ thống, giá bộ phận, giá nhóm
- Dự phòng: Không quá 15% cho khối lượng phát sinh
- Dự án phân chia: Xác định riêng sơ bộ TMĐT cho từng dự án thành phần

### 4.3 Tổng mức đầu tư (TMĐT)
- Bỏ quy định 04 phương pháp xác định chung, tính theo từng khoản mục chi phí
- Tính theo từng công trình/hạng mục; phù hợp loại thiết kế (TKCS, FEED, TKKT, BVTC)
- Chi phí thiết bị: Tách rõ Thiết bị công trình và Thiết bị công nghệ
- Trang thiết bị rời (Bàn, ghế, tủ, thiết bị VP...): Không có tính liên kết với công trình
- Chi phí QLDA: Hướng dẫn xác định bằng dự toán
- Dự phòng trượt giá: Bổ sung quy định cho dự án < 1 năm và việc mua sắm nước ngoài

### 4.4 Dự toán xây dựng
- Phân loại: DT công trình; DT gói thầu; DT công việc
- Dự toán gói thầu: Sửa đổi thống nhất với Luật Đấu thầu
- Hướng dẫn phương pháp xác định DT công việc (Mục 3 Phụ lục 2 TT36)
#### Cơ cấu Chi phí xây dựng (4 mục)
- CPXD của công trình
- CPXD công trình/hạng mục tạm, phụ trợ
- Chi phí nhà tạm để ở và điều hành (Tách riêng, không thuộc CP gián tiếp)
- Chi phí phá dỡ (nếu có)
#### Chi phí chung
- Lập TMĐT: Theo tỷ lệ (%) loại công trình
- Lập DTXD: Theo tỷ lệ (%) loại và quy mô công trình
#### Báo giá trọn gói
- Được dùng báo giá trọn gói cho công việc, hạng mục chỉ có 1 hoặc một số ít đơn vị đủ năng lực (từ sản xuất, cung cấp đến thi công)

### 4.5 Xử lý đối với các dự án đặc thù
#### Dự án phân tách thành phần / GPMB độc lập
- Quy định rõ nội dung xác định Sơ bộ TMĐT, TMĐT
- Quy định điều chỉnh sơ bộ TMĐT, TMĐT riêng cho dự án thành phần
#### Dự án sử dụng thiết kế FEED / TKKT
- Bổ sung quy định xác định TMĐT và Thẩm định TMĐT (Khoản 3, 4 Điều 7 NĐ 206)
#### Dự án lớn, phức tạp, công nghệ mới
- Được sử dụng dữ liệu nước ngoài để lập sơ bộ TMĐT, TMĐT
- Được xây dựng/quản lý định mức dự toán riêng
- Thành lập "Ban đơn giá xây dựng công trình" để xác định chi phí
#### Dự án khẩn cấp, cấp bách, đặc biệt
- Trình tự thẩm định/phê duyệt riêng (Điều 9 TT36)
- Được triển khai song song; ưu tiên dùng báo giá, dữ liệu công trình tương tự, vận dụng định mức

## 5. QUY ĐỊNH MỚI VỀ QUẢN LÝ CHI PHÍ, THẨM ĐỊNH & KIỂM TRA
### 5.1 Điều chỉnh chi phí
- Điều chỉnh TMĐT: Quy định rõ trường hợp chưa triển khai, đã triển khai, và dự án chia thành phần
- Điều chỉnh DTXD: Quy định rõ trường hợp trước mở thầu và đã ký hợp đồng

### 5.2 Thẩm định, Thẩm tra
#### Thẩm định TMĐT
- Phân định rõ chức năng thẩm định của CQ chuyên môn về XD và CQ của Người quyết định ĐT
- Bổ sung nội dung thẩm định cho dự án dùng thiết kế FEED/TKKT (Người QĐĐT giao CĐT thẩm định)
- Trách nhiệm CĐT: Phải kiểm tra, rà soát, thẩm định nội bộ trước khi trình CQCM; giải trình và hoàn thiện sau thẩm định
#### Thẩm định Dự toán
- Chủ đầu tư tự thẩm định (Phù hợp Luật XD 2025)
- CQ chuyên môn về XD: Chỉ thẩm định dự toán hạng mục dùng vốn đầu tư công của dự án PPP
#### Thẩm tra TMĐT
- Rõ nội dung thẩm tra của Tư vấn
- Tư vấn chịu trách nhiệm về: chất lượng, tiến độ, phương pháp tính, kết quả tính toán, tính chính xác số liệu và đánh giá hiệu quả đầu tư

### 5.3 Kiểm tra việc quản lý chi phí
- Người QĐĐT: Trách nhiệm kiểm tra việc quản lý chi phí của CĐT (Điều 15 TT36)
- Chủ đầu tư: Theo dõi, đánh giá, tổng hợp và báo cáo Người QĐĐT khi có yêu cầu

## 6. QUY ĐỊNH MỚI VỀ ĐỊNH MỨC, GIÁ & CHỈ SỐ
### 6.1 Đổi mới định mức nhân công (TT 37/2026/TT-BXD)
#### Chuyển đổi từ cấp bậc thợ sang Nhóm
- Quy định cũ: 7 bậc thợ (chia thành các nhóm quy về bậc bình quân 3.5/7 hoặc 2/4)
- Quy định mới: 4 Nhóm theo kỹ năng và tính chất
- Nhóm I: Nhân công phổ thông (Phá dỡ, bốc xếp, đào đắp, đóng gói)
- Nhóm II: Nhân công có tay nghề
- Nhóm III: Nhân công trình độ kỹ thuật (Lắp đặt, sửa chữa máy/thiết bị)
- Nhóm IV: Nhân công trình độ kỹ thuật cao (Vận hành máy, lái xe)
#### Lộ trình áp dụng
- Trước 01/7/2026: Địa phương quy đổi giá từ bậc thợ hiện hành sang Nhóm mới
- Trước 01/9/2026: Bộ/Tỉnh phải chuyển đổi các tập định mức cũ sang Nhóm nhân công mới
- Từ 01/01/2027: Sở XD khảo sát và công bố giá theo phương pháp mới hoàn toàn

### 6.2 Quản lý Định mức xây dựng
- Phân cấp: Bộ quản lý ĐM chuyên ngành; UBND tỉnh quản lý ĐM địa phương
- Trách nhiệm CĐT: Khảo sát, thu thập số liệu xác định định mức cho công tác chưa có hoặc chưa phù hợp; hoặc công tác dùng công nghệ/vật liệu mới
- Dự án đặc thù: CĐT được thu thập, biên dịch định mức nước ngoài để dùng. Khi thi công phải khảo sát, kiểm chứng để cập nhật hệ thống

### 6.3 Quản lý Giá xây dựng (VL, NC, MTC)
- Thẩm quyền: Bộ XD, Bộ chuyên ngành, UBND tỉnh công bố suất vốn ĐT, giá bộ phận, chỉ số giá
- Công bố giá VL: Là giá bình quân trong tháng theo thương hiệu/NSX (dựa trên dữ liệu từ đơn vị cung cấp)
- Nghĩa vụ cung cấp dữ liệu: DN sản xuất/cung ứng, CĐT, Nhà thầu tại dự án công/PPP có trách nhiệm cung cấp thông tin giá cho Sở XD
- Chuyển đổi số: Tiếp nhận thông tin qua Website/App để liên thông CSDL Quốc gia
- Cơ chế đặc thù: Lập Ban đơn giá (cho dự án quốc gia) để định giá vật liệu chuyên biệt, thiết bị công nghệ mới
- CĐT tự định giá: Nếu Nhà nước chưa công bố hoặc chưa phù hợp với công trình (theo TT37)

## 7. QUẢN LÝ BẢO TRÌ & TRÁCH NHIỆM CÁC BÊN
### 7.1 Quyền và Trách nhiệm (NĐ 206)
#### Đơn vị Tư vấn
- Chịu trách nhiệm toàn diện: Nội dung, chất lượng, tiến độ
- Phương pháp tính toán, khối lượng, tính chính xác/cơ sở của báo giá
- Đánh giá hiệu quả đầu tư
- Cung cấp CSDL quản lý chi phí khi có yêu cầu
#### Chủ đầu tư (CĐT)
- Quyền tự điều chỉnh: Được điều chỉnh cơ cấu chi phí (kể cả dự phòng) để đảm bảo tiến độ/mục tiêu mà KHÔNG cần thủ tục điều chỉnh TMĐT (Điều kiện: không vượt TMĐT, không đổi mục tiêu, không đổi cơ cấu nguồn vốn)

### 7.2 Quản lý chi phí bảo trì (NĐ 207 & TT 40)
#### Phạm vi bảo trì (NĐ 207)
- Gồm: Kiểm tra, quan trắc, kiểm định, đánh giá an toàn, bảo dưỡng, sửa chữa
- Gồm: Điều chỉnh/thay thế thiết bị (Lưu ý: Không làm thay đổi công năng, quy mô)
- Phân cấp định mức bảo trì: Bộ XD, Bộ chuyên ngành, UBND tỉnh (đối với phần chưa có)
#### Thành phần chi phí Kế hoạch hằng năm (Điều 39 NĐ 207)
- 1. Chi phí bảo dưỡng
- 2. Chi phí sửa chữa: Định kỳ hằng năm và Đột xuất
- 3. Chi phí khác: Kiểm định, lập kế hoạch, lập/thẩm tra quy trình bảo trì, chi phí quản lý
#### Phương pháp lập dự toán bảo trì (TT 40)
- Chi phí bảo dưỡng = CP thực hiện bảo dưỡng + CP khác + Dự phòng
- Chi phí sửa chữa = CP thực hiện sửa chữa + CP khác + Dự phòng
- Chi phí khác = Xác định theo Điều 39 NĐ 207

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.4"></script>
    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
