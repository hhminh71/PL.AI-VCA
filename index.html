# NGHỊ ĐỊNH 217/2026/NĐ-CP (BỘ XÂY DỰNG)
## I. Bối cảnh ban hành & Thông tin chung
### 1. Cơ sở Chính trị & Pháp lý
- Căn cứ Nghị quyết TW: Số 66/NQ-TW, 68-NQ/TW, 79-NQ/TW, 57-NQ/TW, 59-NQ/TW, Kết luận 18-KL/TW, 09-KL/TW...
- Căn cứ Pháp lý: Luật Xây dựng số 135/2025/QH15 (Được Quốc Hội khóa XV thông qua ngày 10/12/2025)
### 2. Mục tiêu trọng tâm
- Đổi mới phương thức quản lý, phù hợp với mô hình chính quyền địa phương 02 cấp
- Đơn giản hóa các thủ tục hành chính
- Đảm bảo tính đồng bộ của hệ thống pháp luật
### 3. Thời điểm áp dụng
- Hiệu lực thi hành: Chính thức từ ngày 01/07/2026
### 4. Bố cục Nghị định
- Tổng quan: 05 Chương, 76 Điều, 04 Phụ lục
- Chương I: Quy định chung (09 Điều)
- Chương II: Quản lý dự án đầu tư xây dựng (05 Mục, 39 Điều)
- Chương III: Giấy phép xây dựng & quản lý trật tự xây dựng (19 Điều)
- Chương IV: Xây dựng công trình đặc thù (05 Điều)
- Chương V: Điều khoản thi hành (04 Điều)

## II. CHƯƠNG I. QUY ĐỊNH CHUNG
### 1. Bổ sung giải thích từ ngữ
- Cơ quan trung ương
- Cơ quan chuẩn bị dự án
- Thời gian thực hiện dự án
### 2. Trình tự xây dựng (Điều 4)
#### Cấu trúc 03 Giai đoạn
- Giai đoạn 1: Chuẩn bị dự án
- Giai đoạn 2: Thực hiện dự án (Điểm mới: Bàn giao công trình đưa vào sử dụng chuyển từ giai đoạn kết thúc sang giai đoạn này, thay vì như NĐ 175/2024/NĐ-CP)
- Giai đoạn 3: Kết thúc xây dựng
#### Bổ sung trình tự đầu tư đặc thù
- Dự án, công trình khẩn cấp, cấp bách
- Công trình tạm
- Dự án đầu tư công đặc biệt
#### Thẩm quyền người quyết định đầu tư
- Tùy điều kiện thực tế/yêu cầu kỹ thuật: Được quyết định thực hiện tuần tự hoặc đồng thời các công việc, phù hợp với quyết định phê duyệt
### 3. Phân loại dự án đầu tư xây dựng (Điều 5)
#### Phân loại theo Luật Xây dựng 2025
- a) Dự án đầu tư công
- b) Dự án PPP
- c) Dự án sử dụng chi thường xuyên từ NSNN, vốn NSNN khác không thuộc phạm vi PL Đầu tư công (áp dụng quy định như dự án đầu tư công)
- d) Dự án đầu tư kinh doanh (dự án thuộc PL Đầu tư/các dự án khác không thuộc a, b, c)
#### Nguyên tắc quản lý vốn ODA, vay ưu đãi (Khoản 4 Điều 5)
- Thuộc nhiệm vụ chi NS TW/địa phương: Dự án Đầu tư công
- Thuộc nhiệm vụ chi NS địa phương làm vốn nhà nước tham gia DA PPP: Dự án PPP
- Thuộc doanh nghiệp sử dụng vốn ODA/vay ưu đãi: Dự án Đầu tư kinh doanh
### 4. Giao Chủ đầu tư Dự án Đầu tư công (Điều 6)
#### Thẩm quyền & Thời điểm
- Người quyết định đầu tư thực hiện giao
- Thời điểm: Trước hoặc khi quyết định đầu tư
#### Tiêu chí lựa chọn
- Ưu tiên 1: Giao Ban QLDA đầu tư xây dựng trực thuộc
- Thay thế (khi không có/không đủ năng lực): Giao cơ quan, tổ chức khác
#### Điều kiện đối với cơ quan, tổ chức khác
- Có cá nhân chuyên môn quản lý, sử dụng vốn đầu tư công
- Có cá nhân chuyên môn phù hợp: thiết kế/giám sát/quản lý dự án/thi công (theo quy định ĐK năng lực HĐXD)
- HOẶC: Đã từng làm chủ đầu tư dự án đầu tư công
### 5. Nguyên tắc thực hiện thủ tục hành chính (Điều 7)
#### Dữ liệu & Hệ thống
- Hồ sơ điện tử: Phải dùng định dạng dữ liệu có cấu trúc, đáp ứng yêu cầu không gian/hệ tọa độ (phục vụ đọc, khai thác, liên thông)
- Cập nhật bắt buộc: Cơ quan giải quyết/Cơ quan chuẩn bị DA phải cập nhật lên Hệ thống CSDL quốc gia ngay sau khi kết thúc thủ tục
#### Chống lãng phí TTHC
- Cơ quan thực hiện: KHÔNG ĐƯỢC YÊU CẦU cung cấp giấy tờ đã có trên CSDL quốc gia (HĐXD, Đất đai...) khi đã liên thông
### 6. Ứng dụng mô hình BIM (Điều 8)
#### Quy định áp dụng
- Bắt buộc: Công trình xây mới từ cấp II trở lên (từ giai đoạn Báo cáo NCKT hoặc BC KT-KT)
- Miễn áp dụng (Người QĐĐT quyết định): Công trình theo tuyến, khu vực đặc thù, yêu cầu bí mật nhà nước
#### Yêu cầu kỹ thuật & Vận hành
- Định dạng dữ liệu: Chuẩn mở IFC hoặc định dạng mở khác
- Môi trường dữ liệu chung (CDE): Bắt buộc Chủ đầu tư thiết lập/vận hành đối với công trình từ Cấp I trở lên (Khuyến khích các công trình khác)
#### Lộ trình & Lưu trữ
- Trách nhiệm: Bộ QLXD chuyên ngành, UBND tỉnh xây dựng lộ trình chuyển đổi
- Lưu trữ hoàn công: Chủ đầu tư cập nhật mô hình BIM hoàn công vào CSDL quốc gia; bàn giao cho đơn vị quản lý vận hành
### 7. Áp dụng tiêu chuẩn (Điều 9)
#### Quy trình áp dụng
- Chủ đầu tư: Lập hoặc thuê lập danh mục tiêu chuẩn
- Người QĐĐT: Chấp thuận trước/khi phê duyệt dự án (Bằng văn bản riêng hoặc tại QĐ đầu tư)
- Chủ đầu tư được cập nhật/bổ sung; Phải báo cáo nếu không tương thích/thay thế tiêu chuẩn đã được chấp thuận
#### Sử dụng tiêu chuẩn Quốc tế/Khu vực/Nước ngoài
- Ưu tiên: Tiêu chuẩn đã được áp dụng rộng rãi
- Yêu cầu: Phù hợp công nghệ dự án; Thuyết minh tuân thủ pháp luật, phù hợp tính chất/điều kiện thực tế

## III. CHƯƠNG II. QUẢN LÝ DỰ ÁN ĐẦU TƯ XÂY DỰNG
### Mục 1. Khảo sát Xây dựng (Điều 10 - Điều 15)
- Thực hiện: Chủ đầu tư/Cơ quan chuẩn bị DA tự thực hiện hoặc thuê lập nhiệm vụ
- Phê duyệt: Chủ đầu tư/Cơ quan chuẩn bị DA phê duyệt bằng văn bản/trực tiếp tại nhiệm vụ khảo sát
- Nội dung kết quả (yêu cầu chi tiết): Mục 3 (Tiêu chuẩn, quy trình, phương pháp); Mục 5 (Phân tích, đánh giá, đề xuất giải pháp thiết kế/thi công, lưu ý)
### Mục 2. Thiết kế xây dựng (Điều 16 - Điều 25)
#### Các bước thiết kế
- Các loại: Sơ bộ, Cơ sở, FEED, Kỹ thuật, Bản vẽ thi công
- Tùy chọn: Người QĐĐT được quyền chọn dùng thiết kế FEED/Kỹ thuật tại Báo cáo NCKT
#### Thẩm quyền điều chỉnh (Chủ đầu tư)
- Được tự quyết thay đổi (ngoại trừ các trường hợp cấm)
- Các trường hợp KHÔNG ĐƯỢC TỰ QUYẾT (Phải báo cáo):
  - Công trình tuyến: Đổi quy mô, đổi giải pháp kết cấu chính (trừ cục bộ)
  - Công trình khác: Đổi quy mô, kiến trúc phân khu chính, kết cấu chính, sơ đồ nguyên lý hệ thống hạ tầng
#### Cơ chế báo cáo Người QĐĐT (Khoản 7 Điều 16)
- Nội dung: Thay đổi thông số chưa đến mức điều chỉnh DA; Thay đổi vật liệu không ảnh hưởng an toàn
- Thời hạn giải quyết: Người QĐĐT có ý kiến trong 05 ngày (Quá thời hạn, Chủ đầu tư có quyền phê duyệt)
#### Quy hoạch làm căn cứ lập Dự án
- Cơ sở pháp lý: Cập nhật theo Luật Quy hoạch 2025 & Luật QH đô thị/nông thôn
- Quy hoạch ngành (Hạ tầng): Nếu cấp phê duyệt QH chi tiết ĐỒNG THỜI là cấp QĐĐT -> Dùng luôn QH ngành làm căn cứ
- Khu vực không phải lập QH phân khu/chi tiết: Căn cứ phương án tuyến, vị trí, mặt bằng tổng thể được chấp thuận
- Miễn yêu cầu quy hoạch: DA sửa chữa, tu bổ, cải tạo, thay thế giữ nguyên mục tiêu/địa điểm/quy mô
### Mục 3. Lập, thẩm định dự án & QĐ đầu tư (Điều 26 - Điều 40)
#### 1. Lập Báo cáo KT-KT
- Hạn mức: Tổng mức đầu tư <= 40 tỷ đồng (Không tính bồi thường, GPMB, tiền sử dụng đất)
- DA mua sắm/lắp đặt thiết bị: Chi phí xây dựng < 10% TMĐT VÀ <= 20 tỷ đồng (Trừ DA quan trọng QG, nhóm A, PPP)
#### 2. Lập Báo cáo NCKT
- Người QĐĐT được quyết định lập theo yêu cầu quản lý/công nghệ
- Không phải lập dự án nếu: Công tác bảo trì theo thiết kế hiện hữu hoặc không cần thiết kế
- Cho phép: Thay đổi cập nhật công trình tuyến so với quy hoạch, chủ trương ĐT (Khoản 5 Điều 27)
#### 3. Tách dự án & Phân kỳ đầu tư (Điều 28)
- Tách dự án: Được tách DA thành phần, bồi thường, GPMB độc lập
- Thẩm quyền: Người QĐĐT quyết định tách ngay tại giai đoạn lập NCKT/KT-KT
- Yêu cầu DA độc lập: Khai thác/vận hành độc lập; Quy mô không thuộc diện chỉ lập KT-KT; Khu đô thị/nhà ở phải có 01 DA hạ tầng dùng chung
- Phân kỳ: Phải thể hiện rõ trong BC NCKT, phù hợp thời gian/nội dung QĐ chủ trương (Khoản 4)
#### 4. Thẩm tra thiết kế (BC NCKT, KT-KT)
- Đối tượng (Khoản 5 Điều 26 LXD): Công trình ảnh hưởng lớn an toàn/cộng đồng; quy mô lớn/phức tạp; công trình phải thẩm định PCCC
- Nội dung: An toàn, tuân thủ quy chuẩn/tiêu chuẩn, PCCC
#### 5. Thẩm định của Người quyết định đầu tư
- DA quan trọng Quốc gia: Thành lập Hội đồng thẩm định (gồm thẩm định của Người QĐĐT và CQCM)
- DA Doanh nghiệp NN: Phải bổ sung xác định TMĐT đảm bảo hiệu quả vốn
- Thẩm định đặc thù: Giao CĐT thẩm định thiết kế FEED/Kỹ thuật, xác định TMĐT (ĐTC); Lấy ý kiến Bộ QP/Bộ CA (DA trọng yếu)
#### 6. Thẩm quyền của Cơ quan chuyên môn (CQCM) về xây dựng
- CQCM cấp Bộ/Bộ QLXD chuyên ngành: DA quan trọng QG (Bộ/TW chủ quản); DA Quốc hội/Thủ tướng giao; DA >= 2 tỉnh; Công trình cấp Đặc biệt
- BQL KCN, KCX, KCNC, KKT: Dự án trên địa bàn
- CQCM cấp xã: DA do cấp xã QĐĐT
- Sở XD chuyên ngành: DA còn lại (UBND tỉnh được phân cấp lại)
- Đặc thù Hà Nội, TP.HCM: Thẩm định tất cả (Trừ công trình cấp Đặc biệt do TW quyết định và DA thuộc CQCM cấp Bộ)
#### 7. Hội đồng thẩm định
- Thời hạn thành lập: Trong 07 ngày làm việc kể từ khi nhận hồ sơ
- Thành phần: Lãnh đạo Bộ/UBND cấp tỉnh (Chủ tịch); Các cơ quan chuyên môn; Chuyên gia (nếu cần)
- Thường trực Hội đồng: CQCM về Xây dựng (Tổng hợp, đóng dấu xác nhận)
#### 8. Thời gian thẩm định (Đã gộp PCCC)
- DA quan trọng Quốc gia: 60 ngày
- DA Nhóm A: 25 ngày làm việc (công trình >= cấp I); 20 ngày làm việc (còn lại)
- DA Nhóm B: 20 ngày làm việc (công trình >= cấp I); 16 ngày làm việc (còn lại)
- DA Nhóm C: 15 ngày làm việc (công trình >= cấp I); 12 ngày làm việc (còn lại)
- Gia hạn: Chỉ được 1 lần (phải thông báo bằng văn bản)
#### 9. Phê duyệt & Điều chỉnh DA
- Hồ sơ: Theo Mẫu 09 Phụ lục I (Điều 39)
- Phê duyệt giai đoạn/thành phần, tổng hợp phê duyệt toàn bộ khi kết thúc
- Thiết kế FEED/Kỹ thuật: Người QĐĐT giao CĐT phê duyệt
- BC KT-KT: Người QĐĐT giao CĐT đóng dấu phê duyệt
- Điều chỉnh dự án: Áp dụng Điều 28 LXD (Lưu ý ĐTC, PPP); Thẩm định lại tại CQCM theo Điều 40
### Mục 4. Quản lý thiết kế sau phê duyệt (Điều 41 - 43)
- Quy trình: Chủ đầu tư thẩm định, phê duyệt thiết kế ngay trước khi chọn nhà thầu (Thi công, EPC, EC, EP)
- Quyền của CĐT: Được quyền kiểm soát các bước thiết kế còn lại
- Thẩm tra thiết kế: CĐT dùng để thẩm định hoặc kiểm soát thiết kế (Khoản 5 Điều 26 LXD)
- Dự án PPP (BT): Nội dung thẩm định thiết kế, dự toán theo Pháp luật Xây dựng
- Điều chỉnh khi chưa thi công: CĐT báo cáo Người QĐĐT chấp thuận trước khi làm
### Mục 5. Tổ chức quản lý dự án ĐTXD (Điều 44 - 48)
#### Các hình thức quản lý (Người QĐĐT quyết định)
- Ban QLDA ĐTXD (Đơn vị sự nghiệp công lập tự đảm bảo chi thường xuyên)
- Chủ đầu tư trực tiếp tổ chức quản lý
#### Lựa chọn hình thức của Chủ đầu tư
- Thuê Tư vấn quản lý dự án
- Thành lập Ban QLDA trực thuộc
- Tự thực hiện quản lý
#### Thẩm quyền mới
- UBND cấp xã: Được phép thành lập Ban QLDA đầu tư xây dựng

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.4"></script>
    <script>
        // Thuật toán chụp toàn bộ Mindmap độ phân giải cao
        function downloadFullMindmap() {
            const svg = document.querySelector('.markmap svg');
            if (!svg) return alert("Sơ đồ chưa tải xong, vui lòng đợi giây lát!");

            const g = svg.querySelector('g');
            if (!g) return;

            // 1. Lấy kích thước thật của sơ đồ (không bị ảnh hưởng bởi Zoom/Pan)
            const bbox = g.getBBox();
            const padding = 60; // Viền an toàn

            // 2. Clone SVG để tạo file ảnh ngầm
            const clone = svg.cloneNode(true);
            const cloneG = clone.querySelector('g');
            
            // Xóa transform để sơ đồ tự canh giữa khung hình mới
            cloneG.setAttribute('transform', '');

            const width = bbox.width + padding * 2;
            const height = bbox.height + padding * 2;
            
            clone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${width} ${height}`);
            
            // Scale x3 để đạt chất lượng Full HD / 4K
            const scale = 3; 
            clone.setAttribute('width', width * scale);
            clone.setAttribute('height', height * scale);

            // 3. Thêm nền xanh nhạt VCA
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', bbox.x - padding);
            bg.setAttribute('y', bbox.y - padding);
            bg.setAttribute('width', width);
            bg.setAttribute('height', height);
            bg.setAttribute('fill', '#f5f7fa');
            clone.insertBefore(bg, clone.firstChild);

            // Thêm style định dạng chữ
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = ".markmap-node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333; } path { fill: none; }";
            clone.insertBefore(style, clone.firstChild);

            // 4. Render ra Canvas và tải xuống
            const svgData = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const a = document.createElement('a');
                a.download = 'VCA_Mindmap_ChiTiet.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
