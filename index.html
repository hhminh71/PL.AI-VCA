# TIÊU CHUẨN ANNEX 14<br>(THIẾT KẾ & KHAI THÁC SÂN BAY)

## 1. TỔNG QUAN & CƠ SỞ PHÁP LÝ
### Mục tiêu huấn luyện
- Nắm rõ Phụ lục 14 ICAO (Volume I)
- Yêu cầu thông số kỹ thuật thiết kế & vận hành
- Thực hiện tiêu chuẩn & khuyến cáo (SARPS)
### Căn cứ pháp lý
- Công ước Chicago (Điều 28, 37)
- Luật HKDD Việt Nam & Nghị định CP
- QCVN 79:2014/BGTVT (Sơn tín hiệu)
- Phân loại ICAO: Mã số 1-4 (Chiều dài CHC), Mã chữ A-F (Sải cánh/OMGWS)
### Hệ quy chiếu
- Ngang: WGS-84
- Đứng: MSL / Geoid
- Thời gian: Lịch Gregorian / UTC

## 2. DỮ LIỆU SÂN BAY
### Cự ly công bố đường CHC
- **TORA**: Cự ly chạy đà cất cánh
- **TODA**: Cự ly có thể cất cánh (TORA + Khoảng trống/CWY)
- **ASDA**: Cự ly dừng khẩn cấp (TORA + Đoạn dừng/SWY)
- **LDA**: Cự ly có thể hạ cánh (Trừ lùi nếu có ngưỡng dịch chuyển)
### Sức chịu tải mặt đường
- Áp dụng hệ thống ACR-PCR (từ 28/11/2024 thay cho ACN-PCN)
- Báo cáo theo mã: Loại mặt đường (R/F), Cấp nền (A/B/C/D), Áp suất bánh (W/X/Y/Z), Đánh giá (T/U)
### Tình trạng bề mặt & Giám sát
- Đánh giá qua mã RWYCC (Khô, Ướt, Băng, Tuyết...)
- Tần suất kiểm tra: Ít nhất 2 lần/ngày (Sân bay mã 3, 4)

## 3. KẾT CẤU HẠ TẦNG (Khu Bay)
### Đường cất hạ cánh (Runway)
- **Độ dốc dọc:** ≤ 1% (Mã 3,4); ≤ 2% (Mã 1,2)
- **Độ dốc ngang:** 1.5% (Mã C-F); 2% (Mã A-B)
- **Dải bay (Strip):** Rộng tối thiểu 150m (mỗi bên) cho tiếp cận chính xác
- **RESA (Khu an toàn cuối CHC):** Tối thiểu 90m (Khuyến cáo 240m)
- **Sân quay đầu (Turn pad):** Cho tàu bay quay 180 độ, góc giao ≤ 30 độ
### Đường lăn (Taxiway)
- Chiều rộng: Từ 7.5m đến 23m (Dựa vào OMGWS)
- Đường lăn thoát nhanh (RET): Bán kính rẽ 550m (Mã 3,4) tốc độ thoát 93 km/h
- Dải lăn & Lề đường lăn: Chống xói mòn do luồng phụt
### Sân đỗ tàu bay (Apron)
- Độ dốc tối đa ≤ 1% để thoát nước
- Có vị trí đỗ cách ly (Khẩn nguy, An ninh) cách >100m

## 4. QUẢN LÝ CHƯỚNG NGẠI VẬT (OLS)
### Các bề mặt giới hạn (OLS)
- Bề mặt nằm ngang trong / ngang ngoài
- Bề mặt hình nón
- Bề mặt tiếp cận / Tiếp cận trong
- Bề mặt chuyển tiếp / Chuyển tiếp trong
- Bề mặt lấy độ cao cất cánh & Hủy bỏ hạ cánh
### Cảnh báo chướng ngại vật
- **Di động:** Xe cộ (Sơn màu, cắm cờ ô vuông, đèn nháy Vàng/Xanh)
- **Cố định:** Sơn kẻ caro/ dải màu (Cam-Trắng/Đỏ-Trắng)
- **Đèn cảnh báo:** Cường độ Thấp (<45m), Trung bình (45m-150m), Cao (>150m)

## 5. THIẾT BỊ DẪN ĐƯỜNG BẰNG MẮT
### Sơn tín hiệu (Markings - Màu Trắng/Vàng)
- **Đường CHC (Trắng):** Số hiệu, Tim, Ngưỡng, Điểm ngắm, Vùng chạm bánh, Cạnh
- **Đường lăn (Vàng):** Tim, Lề, Vị trí chờ (Hold short), Sân quay đầu
- **Sân đỗ:** Vị trí đỗ, Vạch an toàn (Apron safety lines)
### Đèn hàng không (Lighting)
- **Đèn PAPI/APAPI:** Chỉ báo góc dốc hạ cánh (Đỏ/Trắng)
- **Đèn CHC:** Lề (Trắng/Vàng/Đỏ), Ngưỡng (Xanh lục), Cuối (Đỏ), Tim (Trắng/Đỏ), Vùng chạm bánh (Trắng)
- **Đèn Đường lăn:** Tim (Xanh lục/Vàng xen kẽ), Lề (Xanh lam)
- **Đèn Vạch dừng (Stop bar):** Đỏ cắt ngang đường lăn
- **Đèn bảo vệ CHC (RGL):** Vàng nhấp nháy luân phiên
### Biển báo (Signs)
- **Bắt buộc:** Chữ trắng, nền đỏ (Vị trí chờ CHC, No Entry)
- **Thông tin:** Chữ đen nền vàng / Chữ vàng nền đen (Vị trí, Hướng)

## 6. HỆ THỐNG ĐIỆN & ĐIỀU KHIỂN
### Nguồn dự phòng & Thời gian chuyển đổi
- **1 giây:** Đèn tiếp cận CAT II/III, Đèn tim CHC, Đèn vùng chạm bánh, Đèn Vạch dừng
- **15 giây:** Đèn lề/ngưỡng CHC, Đường lăn chính, Cảnh báo CNV
### Thiết kế mạch điện
- Sử dụng Mạch nối tiếp (Series Circuit) cho đèn sân bay
- Bộ điều dòng (CCR): 3 nấc hoặc 5 nấc sáng
- Yêu cầu giám sát tự động, báo lỗi trong 2s (Vạch dừng) - 5s (Thiết bị khác)

## 7. DỊCH VỤ KHAI THÁC & TRANG THIẾT BỊ
### Khẩn nguy & Cứu hỏa (RFFS)
- Phân loại cấp cứu hỏa (1-10) theo kích thước tàu bay
- Thời gian phản ứng: ≤ 3 phút (Khuyến cáo ≤ 2 phút) đến mọi điểm
- Chất chữa cháy: Foam (A/B/C) + Bột hóa học khô (Dự trữ 200%)
### Kế hoạch khẩn nguy (AEP)
- Tổng diễn tập toàn sân bay 2 năm/lần
- Lập sở chỉ huy lưu động & Trung tâm điều hành
### Quản lý vận hành mặt đất
- Di dời tàu bay hỏng (DAR): Giải phóng đường CHC nhanh nhất
- A-SMGCS: Ngăn ngừa xâm nhập đường CHC
- An ninh: Hàng rào, Đèn chiếu sáng vành đai

## 8. BẢO TRÌ SÂN BAY
### Duy trì mặt đường
- Xóa vệt cao su, tẩy tuyết/nước đọng, vệ sinh FOD
- Đo hệ số ma sát định kỳ (Thiết bị có tính năng tự làm ướt)
### Duy trì thiết bị bằng mắt
- Đèn coi là hỏng khi cường độ < 50%
- Mục tiêu khả dụng CAT II/III: 95% (Tim, Lề, Ngưỡng CHC), không có 2 đèn hỏng liền kề nhau.
